  '<div><label class="field-label" for="feedback-subject">Matière concernée</label><select id="feedback-subject" name="subject" required><option value="" disabled selected>Choisis une matière</option><option value="general">🌐 Site en général</option>'+subjects+'</select></div>'+ 
  '<div><label class="field-label" for="feedback-name">Prénom (facultatif)</label><input type="text" id="feedback-name" name="name" maxlength="80" placeholder="Anonyme" autocomplete="given-name"></div>'+ 
  '<div><label class="field-label" for="feedback-message">Ton message</label><textarea id="feedback-message" name="message" rows="5" maxlength="2000" required placeholder="Décris ton idée ou le problème rencontré..."></textarea><p class="meta feedback-counter" id="feedback-count">0 / 2000</p></div>'+ 
  '<div hidden aria-hidden="true"><input type="text" name="website" tabindex="-1" autocomplete="off"></div><button class="feedback-submit" type="submit">Envoyer mon retour →</button><p class="feedback-note">🔒 Aucun message n’est publié. Le prénom est facultatif.</p><p class="feedback-note" id="feedback-status" role="status" aria-live="polite"></p></form></div>';
}
app.addEventListener("input",function(e){if(e.target.id==="feedback-message"){document.getElementById("feedback-count").textContent=e.target.value.length+" / 2000";}});
app.addEventListener("submit", async function(e) {
  if(e.target.id !== "feedback-form") return;
  e.preventDefault();
  var form = e.target, btn = form.querySelector('button[type="submit"]'), status = form.querySelector('#feedback-status');
  if(btn.disabled) return;
  var data = new FormData(form), selected = form.querySelector('input[name="type"]:checked'), subject = form.querySelector('select[name="subject"]');
  var payload = {type: selected.parentElement.querySelector('span').textContent, matiere: subject.options[subject.selectedIndex].textContent, prenom: String(data.get('name') || '').trim(), message: String(data.get('message') || '').trim(), website: String(data.get('website') || '')};
  if(!payload.message){status.textContent = 'Écris un message avant de l’envoyer.'; return;}
  btn.disabled = true; btn.textContent = 'Envoi en cours…'; status.textContent = '';
  try {
    var response = await fetch('https://script.google.com/macros/s/AKfycbzKL7WmYE6aM7WAs5cwqW9H_uFUFBc3AcN-32zDeOBIUlMFjlTj2gYX5K5WGQNqt0Nt/exec', {method:'POST', headers:{'Content-Type':'text/plain;charset=UTF-8'}, body:JSON.stringify(payload), redirect:'follow', credentials:'omit'});
    if(!response.ok) throw new Error('HTTP '+response.status);
    var result = await response.json();
    if(result.success === true){form.reset(); form.querySelector('#feedback-count').textContent = '0 / 2000'; status.textContent = '✓ Merci ! Ton retour a bien été envoyé.';}
    else {status.textContent = 'Envoi refusé : '+(result.message || 'Réessaie plus tard.');}
  } catch(err) {
    status.textContent = 'Impossible de confirmer l’envoi. Ton message est conservé ici. Vérifie ta connexion avant de réessayer (un envoi a peut-être déjà eu lieu).';
  } finally {btn.disabled = false; btn.textContent = 'Envoyer mon retour →';}
});

var VIEWS = { home: homeView, feedback: feedbackView, mode: modeView, courses: coursesView, course: courseView, methodology: methodologyView, method: methodView, subject: subjectView, decks: decksView, quiz: quizView, result: resultView, card: cardView, cardresult: cardResultView };

/* ---------- Rendu et actions ---------- */
function render(focusId) {
  swipe = null;
  app.innerHTML = VIEWS[S.view]();
  var el = document.getElementById(focusId || "focus");
  if (el) { try { el.focus({ preventScroll: !!focusId }); } catch (e) {} }
  if (!focusId) window.scrollTo(0, 0);
}

function start(qcmId, onlyIds) {
  var s = findSubject(S.subject), q = findQcm(s, qcmId);
  var ids = q.questions.map(function (_, k) { return k; });
  if (onlyIds) ids = ids.filter(function (k) { return onlyIds.indexOf(k) !== -1; });
  if (S.shuffleQ) ids = shuffleArr(ids);
  S.qcm = q; S.partial = !!onlyIds;
  S.items = ids.map(function (qi) {
    var n = q.questions[qi][1].length, order = [];
    for (var k = 0; k < n; k++) order.push(k);
    return { qi: qi, map: S.shuffleA ? shuffleArr(order) : order };
  });
  S.i = 0; S.picks = []; S.view = "quiz";
  render();
}

function finish() {
  var q = S.qcm, score = 0, wrongIds = [];
  S.items.forEach(function (it, pos) {
    if (S.picks[pos] === correctPos(it)) score++; else wrongIds.push(it.qi);
  });
  S.last = { wrongIds: wrongIds };
  if (!S.partial) {
    var stats = loadStats(), prev = stats[q.id];
    stats[q.id] = { last: score, best: prev ? Math.max(prev.best, score) : score };
    saveStats(stats);
  }
  S.view = "result";
  render();
}

function advance() {
  if (S.i === S.items.length - 1) finish(); else { S.i++; render(); }
}

app.addEventListener("click", function (e) {
  var t = e.target.closest("[data-act]");
  if (!t) return;
  var act = t.getAttribute("data-act");
  if (act === "flip" && t.id === "flip-card" && Date.now() < blockClickUntil) return;
  if (swipeBusy && (act === "flip" || act === "know" || act === "redo")) return;
  if (act === "home") { S.view = "home"; render(); }
  else if (act === "feedback") { S.view = "feedback"; render(); }
  else if (act === "subject") { S.subject = t.getAttribute("data-id"); S.view = "mode"; render(); }
  else if (act === "modes") { S.view = "mode"; render(); }
  else if (act === "mode-cours") { S.view = "courses"; render(); }
  else if (act === "methodologie") { S.view = "methodology"; render(); }
  else if (act === "method-open") { S.methodIndex = Number(t.getAttribute("data-i")); S.view = "method"; render(); }
  else if (act === "course-open") { S.courseIndex = Number(t.getAttribute("data-i")); S.view = "course"; render(); }
  else if (act === "mode-qcm") { S.view = "subject"; render(); }
  else if (act === "mode-cards" || act === "decks") { S.view = "decks"; render(); }
  else if (act === "deck-start") { startDeck(t.getAttribute("data-id"), null); }
  else if (act === "flip") { flipCard(); }
  else if (act === "know") { rate(true); }
  else if (act === "redo") { rate(false); }
  else if (act === "deck-retry") { startDeck(S.deck.id, null); }
  else if (act === "deck-retry-missed") { startDeck(S.deck.id, S.missed); }
  else if (act === "toggle") { var key = t.getAttribute("data-k"); S[key] = !S[key]; render(t.id); }
  else if (act === "start") { start(t.getAttribute("data-id"), null); }
  else if (act === "quit") { S.view = "subject"; render(); }
  else if (act === "pick") {
    if (S.picks[S.i] !== undefined && S.picks[S.i] !== null) return;
    S.picks[S.i] = parseInt(t.getAttribute("data-i"), 10);
    render("next");
  }
  else if (act === "next") { advance(); }
  else if (act === "retry") { start(S.qcm.id, null); }
  else if (act === "retry-wrong") { start(S.qcm.id, S.last.wrongIds); }
});

document.addEventListener("keydown", function (e) {
  if (S.view === "card" && S.flipped && !e.ctrlKey && !e.metaKey && !e.altKey) {
    if (e.key === "ArrowLeft" || e.key === "1") { e.preventDefault(); rate(false); }
    else if (e.key === "ArrowRight" || e.key === "2") { e.preventDefault(); rate(true); }
    return;
  }
  if (S.view !== "quiz" || e.ctrlKey || e.metaKey || e.altKey) return;
  var locked = S.picks[S.i] !== undefined && S.picks[S.i] !== null;
  var k = e.key.toLowerCase(), idx = k.length === 1 ? "abcd".indexOf(k) : -1;
  if (idx === -1 && k.length === 1 && "1234".indexOf(k) !== -1) idx = parseInt(k, 10) - 1;
  if (idx !== -1 && !locked) {
    if (idx < S.items[S.i].map.length) { S.picks[S.i] = idx; render("next"); }
  } else if (locked && (e.key === "ArrowRight" || e.key === "Enter") && document.activeElement && document.activeElement.id !== "next") {
    e.preventDefault();
    advance();
  }
});

render();
</script>

</body></html>
