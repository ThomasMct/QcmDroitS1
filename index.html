<p>*Dans un arrêt de <strong>la deuxième Chambre civile du 28 janvier 1954<\/strong>, la Cour de Cassation a privilégié la thèse de la réalité. *<\/p>\n<\/li>\n<li><p>*Ces organismes avaient été créés par une ordonnance en 1945 qui portait sur les comités d’entreprises. Les comités d’entreprises étaient constitués au sein d’entreprises qui avaient des établissements distincts. Les législateurs ne reconnaissent pas expressément la personnalité juridique au comité d’établissement. *<\/p>\n<\/li>\n<li><p>*La Cour de Cassation affirme que <strong>«<\/strong> <strong>la personnalité civile (juridique) n’est pas une création de la loi, elle appartient en principe à tout groupement pourvu d’une possibilité d’expressions collectives pour la défense d’ intérêt licites dignes par suite d’être juridiquement reconnu et protégé<\/strong>.** Si le législateur a le pouvoir dans un but de haute police, de priver de la personnalité civile telle catégorie déterminée de groupement, il en reconnaît au contraire implicitement mais nécessairement, l’existence en faveur d’organismes créée par la loi elle même avec mission de gérer certains intérêts collectifs présentant ainsi le caractère de droits susceptible d’être déduit en justice** <strong>»<\/strong>. *<\/p>\n<\/li>\n<li><p>*Le 23 janvier 1990, la Chambre sociale de Cassation s’est prononcé sur les comités de groupes. “<strong>Les comités de groupe institués par les articles L. 439-1 et suivants du Code du travail sont dotés d'une possibilité d'expression collective pour la défense des intérêts dont ils ont la charge et possèdent donc la personnalité civile qui leur permet d'ester en justice<\/strong>”. *<\/p>\n<\/li>\n<li><p>*Le 17 avril 1991, dans cet arrêt, la Chambre sociale de Cassation s’est prononcée sur l’entité des comités d’hygiène et de sécurité. Elle a estimé que ces comités avaient la personnalité morale. La Cour de Cassation va poser deux conditions nécessaires pour que le groupement puisse exister : *<\/p>\n<\/li>\n<\/ul>\n<ul>\n<li><ul>\n<li>les comités de groupe sont dotés d’une possibilité d’expression collective,*<\/li>\n<\/ul>\n<\/li>\n<li><ul>\n<li>la défense des intérêts dont ils ont la charge.*<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<ul>\n<li>*On retrouve la même règle de droit posée en 1954 → que dit la décision ? La solution est reprise par la Chambre sociale et on retrouve les 2 conditions de la théorie de la réalité. Ils ont donc la personnalité juridique. *<\/li>\n<\/ul>\n<ul>\n<li>*On constate un déclin de la théorie de la réalité, mais il y a des limites qui sont soulevés : *<\/li>\n<\/ul>\n<ul>\n<li><p>*La famille répond aux 2 conditions de la théorie de la réalité, mais n’est pourtant pas une personne morale. *<\/p>\n<\/li>\n<li><p>*Des personnes morales n’ont pas d'intérêts collectifs (<strong>EURL, SASU<\/strong>) et n'ont qu'un seul associé, donc il n'y a pas d'intérêts collectifs alors qu’elles ont la personnalité juridique bien qu’il manque une condition. *<\/p>\n<\/li>\n<li><p><em>Une personne peut avoir 2 patrimoines sans créer une personne morale.<\/em><\/p>\n<\/li>\n<li><p>*Il y a un déclin car le législateur intervient, de plus en plus ces dernières années, pour octroyer la personnalité juridique à certains groupements. Il a pu refuser d’octroyer la PJ a d’autres groupements, c’est lui qui décide s’il attribue ou refuse la PJ a un groupement. Cette théorie fonctionnait lorsque le législateur ne disait rien, or s’il intervient, elle devient inutile ce qui mène au retour à la théorie de la fiction. *<\/p>\n<\/li>\n<\/ul>\n<h3>§2 : La diversité des personnes morales<\/h3>\n<p>***Première distinction : ***<\/p>\n<ul>\n<li>*les personnes morales de droit public *<\/li>\n<li>*les personnes morales de droit privé. *<\/li>\n<\/ul>\n<p>***Exemple de personnes morales de droit public** = État, collectivités territoriales (les régions, les départements, les communes), les établissements publics qui ont une mission d'intérêt public. *<\/p>\n<p>***Exemple de personnes morales de droit privés** = groupement de biens et de personnes de droits privés. *<\/p>\n<p>***Autre distinction : ***<\/p>\n<ul>\n<li><p>*groupement de biens *<\/p>\n<\/li>\n<li><p>*groupement de personnes *<\/p>\n<\/li>\n<li><p>Pour les groupements de biens on retrouve :<\/p>\n<\/li>\n<\/ul>\n<ul>\n<li><em><strong>les fondations<\/strong><\/em> → plusieurs personnes affectent de manière irrévocable des biens pour réaliser une œuvre d'intérêt général. C’est à but non lucratif (<em>ex : mécénat<\/em>).<\/li>\n<\/ul>\n<ul>\n<li>Les groupements de personnes sont ceux qui poursuivent un but lucratif et d’autres un but non lucratif :<\/li>\n<\/ul>\n<p>*ex → Les sociétés sont un groupement de personnes à but lucratif = “affectio societatis” ; ce sont des personnes morales constituées entre plusieurs personnes ayant l’intention d'être associées. Elles vont mettre en commun leur travail ou leurs biens, ce sont des organisations qui ont pour but de réaliser des bénéfices entre associés (<strong>dividendes<\/strong>) . Elles peuvent distribuer ces bénéfices entre les associés ou les réinvestir pour se développer. *<\/p>\n<ul>\n<li><em><strong>Article 1832 du Code civil<\/strong><\/em> : “<em>La société est instituée par deux ou plusieurs personnes qui conviennent par un contrat d'affecter à une entreprise commune des biens ou leur industrie en vue de partager le bénéfice ou de profiter de l'économie qui pourra en résulter. Elle peut être instituée, dans les cas prévus par la loi, par l'acte de volonté d'une seule personne. Les associés s'engagent à contribuer aux pertes.”<\/em><\/li>\n<\/ul>\n<p>*ex → Les associations sont un groupement de personnes à but non lucratif. C’est une personne morale qui est régi par une loi du 1er juillet 1901 qui va donner une définition des associations avec <strong>l’article 1er du Code civil<\/strong> : “L'association est la convention par laquelle deux ou plusieurs personnes mettent en commun, d'une façon permanente, leurs connaissances ou leur activité dans un but autre que de partager des bénéfices. Elle est régie, quant à sa validité, par les principes généraux du droit applicables aux contrats et obligations”. *<\/p>\n<p>*→ Parmi les associations, il y a les <strong>syndicats professionnels<\/strong>, c’est une catégorie spéciale dans les associations = personnes qui exercent la même profession et qui se regroupent pour défendre les intérêts de la profession. *<\/p>\n<ul>\n<li>*Il existe une dernière catégorie appelée les Groupements d’Intérêt Économique (GIE). La doctrine estime que c’est une catégorie qui se situe entre les groupements à but lucratif et à but non lucratif. *<\/li>\n<li><em>Ils ont été créés le 23 septembre 1967 par une ordonnance et ce sont des groupements qui permettent une collaboration entre les entreprises pour valoriser l’activité économique de chacun de ses membres.<\/em><\/li>\n<\/ul>\n<h3>Section 2. Le début et la fin de l’existence de la personne morale<\/h3>\n<h3>§1 : La création de la personne morale<\/h3>\n<ul>\n<li><p>*La personne morale est créée par une constitution (dans le sens de constituer). Pour la création d’une personne morale de droit privé, elle est en principe conditionnée à la volonté d'une ou plusieurs personnes. *<\/p>\n<\/li>\n<li><p>*La volonté se manifeste par un contrat entre 2 ou plusieurs personnes, même s’il y a des cas où la volonté peut être individuelle (SASU). *<\/p>\n<\/li>\n<li><p>*La volonté est nécessaire mais pas suffisante car, en plus, il faut que l'État intervienne pour que cette personne morale puisse avoir la personnalité morale. *<\/p>\n<\/li>\n<li><p>*Il va exiger que soit accomplies des formalités de publicités pour informer les tiers. *<\/p>\n<\/li>\n<\/ul>\n<p>***Exemple **→ pour les sociétés, il faut qu’elles soient immatriculées sur un registre spécial appelé “le Registre des Commerces et des Sociétés”. Le Code civil l’explique par **l’article 1842 **: “les sociétés jouissent de la personnalité morale à compter de leur immatriculation.”*<\/p>\n<p>***Exemple **→ pour les syndicats, la Personnalité Juridique commence au dépôt des statuts des syndicats auprès de la mairie. *<\/p>\n<p>***Exemple **→ pour les associations, la loi du 1er juillet 1901 dans son article 5 explique les formalités : “Toute association qui voudra obtenir la capacité juridique prévue par l'article 6 devra être rendue publique par les soins de ses fondateurs.” *<\/p>\n<p>*Il faut faire une déclaration à la préfecture en joignant les statuts de la préfecture. Dans un délai de 5 jours, il y a un recipissé (un reçu) qui est distribué et l’association deviendra public avec sa publication au JO. *<\/p>\n<ul>\n<li>*Ces associations déclarées n’ont qu’une capacité juridique limitée, elle n’est pas pleine et entière car si elles veulent accéder cette capacité juridique il y a une dernière formalité complémentaire : elles doivent être reconnu d’utilité publique par un décret après avis du Conseil d’État. *<\/li>\n<\/ul>\n<h3>§2 : La dissolution de la personne morale<\/h3>\n<ul>\n<li>*Il peut y avoir des <strong>causes volontaires<\/strong> de la dissolution de la personne morale : *<\/li>\n<\/ul>\n<ul>\n<li>*la décision des représentants de dissoudre la personne morale. *<\/li>\n<\/ul>\n<ul>\n<li><p>*il arrive qu’une personne morale soit constituée avec un terme (50 ans). *<\/p>\n<\/li>\n<li><p>*Il y aussi des <strong>causes involontaires<\/strong> : *<\/p>\n<\/li>\n<\/ul>\n<ul>\n<li>*la loi peut imposer la dissolution de la personne morale, *<\/li>\n<li><em>et à titre de sanction, le juge peut dissoudre la personne morale, ou lorsque le fonctionnement de la personne morale devient impossible<\/em><\/li>\n<\/ul>\n<ul>\n<li><em>Une fois que la dissolution est faite, la PJ ne s'éteint pas tout de suite. Cela veut qu’il y a une petite période dans laquelle cette PJ reste pour avoir le temps de liquider le patrimoine de la personne morale. <strong>C’est une fois que la liquidation est faite que la PJ s'éteint<\/strong>.<\/em><\/li>\n<\/ul>\n<h2>CHAPITRE 2 : Les effets liés à la personne morale<\/h2>\n<h3>Section 1 : L’autonomie de son patrimoine<\/h3>\n<ul>\n<li>*La personne morale a acquit la PJ et si elle l'acquiert, elle est apte à être soumis à des obligations et est assujettie de droit. *<\/li>\n<\/ul>\n<h3>§1 : Des patrimoines séparés<\/h3>\n<ul>\n<li><p>*Le patrimoine social sont les actifs sociaux du patrimoine de la personne qui ne peuvent servir qu'à payer les créanciers de la personne morale. *<\/p>\n<\/li>\n<li><p>*A contrario, un associé ne peut pas payer pour la personne morale puisqu’il a son patrimoine d’un côté, et inversement. *<\/p>\n<\/li>\n<li><p>*Il y a des groupements de personnes dans lesquels c’est plus compliqué. Pour les <strong>groupements à but non lucratif<\/strong>, le principe de séparation stricte des patrimoines entre les personnes morales et les membres est appliqué (les créanciers de la société ne peuvent pas se servir dans le patrimoine des membres) . *<\/p>\n<\/li>\n<li><p>*En revanche, pour <strong>les groupements à but lucratif<\/strong>, il faut distinguer en fonction de la nature de la société. Il y a 2 types : *<\/p>\n<\/li>\n<\/ul>\n<ul>\n<li>***Dans les sociétés de personne** : la considération des personnes des associés est essentielle et les associés sont personnellement responsables des dettes de la société. La société ne peut pas payer les <strong>créances (les dettes<\/strong>). Les créanciers ne peuvent pas s’adresser directement à la société, ils vont s’adresser aux associés de la société et vont pouvoir saisir des biens sur le patrimoine personnel de la société. <strong>Ce type de société repose sur un lien de confiance<\/strong>.*<\/li>\n<li>***Dans les sociétés de capitaux** : ici, il y a une vraie séparation du patrimoine. La personnalité des actionnaires n’est pas importante, ainsi les actionnaires ou associés ne sont pas tenus personnellement des dettes de la société. *<\/li>\n<\/ul>\n<ul>\n<li>***Il y a une 3ème catégorie de sociétés qui se retrouvent entre les 2 autres catégories : ***<\/li>\n<\/ul>\n<ul>\n<li>*Les sociétés familiales appelées <strong>SARL<\/strong> (<strong>S<\/strong>ociété <strong>à<\/strong> <strong>R<\/strong>esponsabilité <strong>L<\/strong>imitée). Dans ces sociétés, l'engagement des associés ne se limite qu'à leurs apports pour la société. Elles empruntent à la société de capitaux le fait que la considération des associés est importante. *<\/li>\n<\/ul>\n<h3>§2 : Patrimoine social et associés<\/h3>\n<ul>\n<li><em><strong>Quelle est la nature du droit des associés sur le patrimoine social ?<\/strong><\/em><\/li>\n<\/ul>\n<p>*→ Pour les associations : les patrimoines sont séparés et les associés n’ont pas de droit sur les patrimoines du groupement. *<\/p>\n<p>*→ Pour les sociétés, les associés ont un droit sur le patrimoine de la société. *<\/p>\n<ul>\n<li><em>Ce droit est personnel, c’est-à-dire que <strong>chaque actionnaire a un droit comme par exemple de recevoir régulièrement une partie des bénéfices de la société<\/strong>. Chaque associé est créancier de la société : si jamais la société est dissoute et qu’il reste de l’argent, la société a le choix de réinvestir les bénéfices ou de les partager entre les actionnaires (<strong>sous forme de dividende<\/strong>).<\/em><\/li>\n<\/ul>\n<h3>Section 2. La capacité d’action<\/h3>\n<ul>\n<li><em>La personne morale va agir au travers des personnes physiques au moyen d’organes qui vont la représenter auprès des tiers, ce sont des <strong>organes exécutoires<\/strong>.<\/em><\/li>\n<\/ul>\n<h3>§1 : Capacité de contracter<\/h3>\n<ul>\n<li>*Pour les personnes morales, il exerce un principe appelé le “<strong>principe de spécialité des personnes morales<\/strong>”. Ce qui veut dire que, pour les personnes morales, sa capacité juridique est limitée par ce principe. Autrement dit, la personne ne peut agir que dans un but déterminé, la raison pour laquelle elle a été créée. *<\/li>\n<li>*Elle ne peut accomplir que les actes qui entrent dans son objet social , et cet objet est défini soit par la loi, soit par les statuts de la personne morale. *<\/li>\n<\/ul>\n<p><em><strong>L’article 1145 du Code civil<\/strong><\/em> : “<em>Toute personne physique peut contracter sauf en cas d'incapacité prévue par la loi. La capacité des personnes morales est limitée aux actes utiles à la réalisation de leur objet tel que défini par leurs statuts et aux actes qui leur sont accessoires, dans le respect des règles applicables à chacune d'entre elles.”<\/em><\/p>\n<ul>\n<li>*Il y a une intervention de loi qui vient préciser des **incapacités spéciales d’actions pour certaines personnes morales. ***<\/li>\n<\/ul>\n<p>***Exemple **→ pour les associations déclarées, la loi leur interdit de recueillir des libéralités, d'acquérir des immeubles non strictement nécessaires à l'accomplissement de son objectif / objet social. *<\/p>\n<h3>§2 : Capacité d’agir en justice<\/h3>\n<ul>\n<li><p>*Les personnes morales ayant la PJ ont la <strong>capacité d'agir en justice pour défendre leurs intérêts personnels.<\/strong> Cela peut être une action en justice pour défendre un <strong>intérêt patrimonial<\/strong> de la personne morale mais aussi un <strong>intérêt extrapatrimonial<\/strong>. *<\/p>\n<\/li>\n<li><p>*Une question s’est posée : <strong>Est-ce qu’une personne morale peut défendre un intérêt collectif / une grande cause nationale<\/strong> ? *<\/p>\n<\/li>\n<li><p>*En principe : “Nul ne plaide par procureur” → une personne ne peut pas intenter une action en justice pour faire valoir les intérêts d’autrui en son propre nom. *<\/p>\n<\/li>\n<\/ul>\n<ul>\n<li>***exception → **la jurisprudence et la loi ont reconnu aux syndicats professionnels une qualité pour faire défendre en justice l’intérêt collectif de la profession qu’ils représentent. *<\/li>\n<\/ul>\n<ul>\n<li>*En revanche, pour les associations déclarées à la préfecture → en principe, les associations simplement habilitées ne peuvent pas défendre les intérêts collectifs de leurs membres sauf s’il y a une habilitation de la loi. La loi peut dire que les intérêts collectifs entrent dans le champ d’activité et donc à ce moment-là, il y a la possibilité d'agir. *<\/li>\n<li><em>La question de la « class action » (mécanisme introduit récemment en droit français) : l’action de groupe à été introduite dans la loi du 17 mars 2014<\/em><\/li>\n<\/ul>\n<p>*L’action de groupe est une action en justice exercée par une association, pour le compte d’un ensemble de personnes victimes de dommages de même nature causé par un même auteur en raison d’un manquement de ce dernier à ses obligations légales ou contractuelles. *<\/p>\n<ul>\n<li>*Cette action se retrouve aussi dans plusieurs domaines (ex : la santé, la consommation, l'environnement, etc). *<\/li>\n<li>*Les associations régulièrement déclarées depuis au moins 5 ans, dont leur objet social comporte la défense de l'intérêt qui a été violé, peuvent agir en justice au nom de plusieurs victimes. Elles vont agir en leur nom, et s'il y a des dommages et intérêts, elles vont **reverser les dommages et intérêts à chacune des victimes.  ***<\/li>\n<\/ul>\n", "nested": true, "civilLesson": true, "partStart": false}]);

COURSES.civil = COURSES.civil.concat([{"title": "Préambule partie 2", "text": "**Principes d’indisponibilité et d’imprescriptibilité de l’état des personnes**\n\n*Comment le droit, dans la société, identifie les personnes ?*\n\n**Il faut reconnaître une personne grâce à plusieurs signes qui la distinguent au sein d’un groupe.**\n\n- Par le biais du registre de l'État civil, la France reconnaît et identifie les personnes physiques. L’État civil va recenser les éléments d'identification de la personne physique et va lui attacher des conséquences juridiques.\n- L’État civil est un **instrument de police civile permettant à la société française d'identifier de manière publique ses citoyens.**\n- L'État civil concerne les personnes physiques. La société va identifier cet État civil retenu par des **agents publics** (officier d’État civil) qui vont dresser des actes relatifs à l'État civil où l’on retrouvera des **éléments d’identification de la personne** (prénom, nom de famille, domicile…) et les **événements de la vie d’une personne civique** qui se produisent (naissance, mariage, décès…).\n- **Article 57 du Code civil** : “L'acte de naissance énoncera le jour, l'heure et le lieu de la naissance, le sexe de l'enfant, les prénoms qui lui seront donnés, le nom de famille, suivi le cas échéant de la mention de la déclaration conjointe de ses parents quant au choix effectué, ainsi que les prénoms, noms, âges, professions et domiciles des père et mère et, s'il y a lieu, ceux du déclarant. Si les père et mère de l'enfant ou l'un d'eux ne sont pas désignés à l'officier de l'état civil, il ne sera fait sur les registres aucune mention à ce sujet.”\n- Les actes marginaux (comme le changement de sexe ou de nom, si il y a cas d’adoption, un mariage…) sont portés en marge de l’acte de naissance. L’acte de naissance est mis à disposition du public.\n\n**Les personnes morales ont un nom, un domicile, une nationalité.**\n\n**Pour les personnes physiques**, c’est la loi qui va attacher des effets à des événements.\n\n**Exemple** → mariage = accord de volonté entre 2 personnes différentes se manifestant devant l’officier d’état civil.\n\nIl y a 2 principes :\n\n**1- Principe d'indisponibilité de l'état des personnes** :\n\n- Il est interdit pour une personne d’abandonner ou de céder tout élément de faits qui traduit les qualités de la personne, prise en compte par l'état civil, pour l’identifier. C’est **l’interdiction de changer les éléments d’identifications.**\n- Mais on peut quand même changer ces personnalités : on peut changer de domicile, de statut (celibataire à marier). Il faut mettre l’état civil en conformité avec la réalité.\n- Il arrive qu’il faille changer des mentions pour faire correspondre à la réalité. Ainsi si la réalité change, il faut que les informations de l'état civil changent :\n- Les rectifications et annulations des actes de l’état civil : ces modifications sont censées réparer des erreurs initiales (si faute d'orthographe, pas de nom, ni de lieu de naissance, etc…). Les conséquences sont que ces modifications seront rétroactives **(article 99 du Code civil).**\n- Modifications des actes de l'état civil par changement dans la vie de la personne : ces modifications n’ont pas de caractère rétroactif et arrivent à la date de l'événement.\n\n**2- Principe d’imprescriptibilité** :\n\n- L’écoulement du temps ne changera pas l’état de la personne physique. En principe, on ne peut pas acquérir ou perdre un nom de famille en fonction de la durée dans le temps.\n", "html": "<h2>Principes d’indisponibilité et d’imprescriptibilité de l’état des personnes</h2>\n<p><em>Comment le droit, dans la société, identifie les personnes ?</em></p>\n<p><strong>Il faut reconnaître une personne grâce à plusieurs signes qui la distinguent au sein d’un groupe.</strong></p>\n<ul>\n<li>Par le biais du registre de l'État civil, la France reconnaît et identifie les personnes physiques. L’État civil va recenser les éléments d'identification de la personne physique et va lui attacher des conséquences juridiques.</li>\n<li>L’État civil est un <strong>instrument de police civile permettant à la société française d'identifier de manière publique ses citoyens.</strong></li>\n<li>L'État civil concerne les personnes physiques. La société va identifier cet État civil retenu par des <strong>agents publics</strong> (officier d’État civil) qui vont dresser des actes relatifs à l'État civil où l’on retrouvera des <strong>éléments d’identification de la personne</strong> (prénom, nom de famille, domicile…) et les <strong>événements de la vie d’une personne civique</strong> qui se produisent (naissance, mariage, décès…).</li>\n<li><strong>Article 57 du Code civil</strong> : “L'acte de naissance énoncera le jour, l'heure et le lieu de la naissance, le sexe de l'enfant, les prénoms qui lui seront donnés, le nom de famille, suivi le cas échéant de la mention de la déclaration conjointe de ses parents quant au choix effectué, ainsi que les prénoms, noms, âges, professions et domiciles des père et mère et, s'il y a lieu, ceux du déclarant. Si les père et mère de l'enfant ou l'un d'eux ne sont pas désignés à l'officier de l'état civil, il ne sera fait sur les registres aucune mention à ce sujet.”</li>\n<li>Les actes marginaux (comme le changement de sexe ou de nom, si il y a cas d’adoption, un mariage…) sont portés en marge de l’acte de naissance. L’acte de naissance est mis à disposition du public.</li>\n</ul>\n<p><strong>Les personnes morales ont un nom, un domicile, une nationalité.</strong></p>\n<p><strong>Pour les personnes physiques</strong>, c’est la loi qui va attacher des effets à des événements.</p>\n<p class=\"lesson-note\"><strong>Exemple</strong> → mariage = accord de volonté entre 2 personnes différentes se manifestant devant l’officier d’état civil.</p>\n<p>Il y a 2 principes :</p>\n<h2>1- Principe d'indisponibilité de l'état des personnes :</h2>\n<ul>\n<li>Il est interdit pour une personne d’abandonner ou de céder tout élément de faits qui traduit les qualités de la personne, prise en compte par l'état civil, pour l’identifier. C’est <strong>l’interdiction de changer les éléments d’identifications.</strong></li>\n<li>Mais on peut quand même changer ces personnalités : on peut changer de domicile, de statut (celibataire à marier). Il faut mettre l’état civil en conformité avec la réalité.</li>\n<li>Il arrive qu’il faille changer des mentions pour faire correspondre à la réalité. Ainsi si la réalité change, il faut que les informations de l'état civil changent :</li>\n<li>Les rectifications et annulations des actes de l’état civil : ces modifications sont censées réparer des erreurs initiales (si faute d'orthographe, pas de nom, ni de lieu de naissance, etc…). Les conséquences sont que ces modifications seront rétroactives <strong>(article 99 du Code civil).</strong></li>\n<li>Modifications des actes de l'état civil par changement dans la vie de la personne : ces modifications n’ont pas de caractère rétroactif et arrivent à la date de l'événement.</li>\n</ul>\n<h2>2- Principe d’imprescriptibilité :</h2>\n<ul>\n<li>L’écoulement du temps ne changera pas l’état de la personne physique. En principe, on ne peut pas acquérir ou perdre un nom de famille en fonction de la durée dans le temps.</li>\n</ul>\n", "nested": true, "civilLesson": true, "partStart": "Partie II – Les éléments identifiants des personnes"}, {"title": "Titre 1 : Le nom, élément d’identification des personnes", "text": "**TITRE 1 : Le nom, élément d’identification des personnes&#xA0;**\n\n*(SÉANCE de TD numéro 4)&#xA0;*\n\n\n\n**CHAPITRE 1 : Le nom de famille&#xA0;**\n\n- *Le nom de famille comme l’état civil est **un signe distinctif des personnes**. Le nom de famille possède une **double nature** :&#xA0;*\n\n* *Le nom de famille est considéré comme une **institution de police** civile car chacun d’entre nous doit assumer l’obligation de porter un nom de famille (c’est une sorte de matricule que la société française impose à ses citoyens pour les identifier).&#xA0;*\n* *Le nom de famille **fait l’objet d’un droit subjectif**, c'est-à-dire que celui qui porte le nom de famille doit le défendre face aux usurpations, face aux usurpateurs et peut interdire à des tiers non autorisés de l’utiliser.&#xA0;*\n\n- *Cette double nature va se révéler dans ses fonctions, cela veut dire que le nom a aussi une double fonction :&#xA0;*\n\n* ***Fonction sociale**&#xA0;*\n* ***Fonction privée**. &#xA0;*\n\n\n\n**Section 1 : L’attribution du no&#x6D;*&#xA0;***\n\n**§1 : La transmission du nom&#xA0;**\n\n- Jusqu'à une **loi du 4 mars 2002**, c'était le nom de famille du père qui était transmis aux enfants. La règle n'était pas inscrite dans le Code civil, mais paraissait évidente. Cette loi est entrée en vigueur le **14 janvier 2005** et est intervenue pour venir attribuer les règles d'attribution du nom de famille. \n- La **loi du 23 décembre 1985** sur l'égalité entre époux et entre pères et mères, le législateur a autorisé, à titre d’usage, d’ajouter le nom de famille de l’autre parent\n- ***Il y a plusieurs possibilités :&#xA0;***\n\n* soit que le nom du père \n* soit que le nom de la mère \n* soit les deux nom dans l’ordre qu’ils souhaitent \n\n\n\n**Lorsqu’on attribue un nom de famille a un enfant et que d’autres sont conçues après, le reste des enfants héritent du même choix du nom du premier enfant conçu !!!**\n\n\n\n- _**L’Article 311-21 du Code civil** « Lorsque la filiation d'un enfant est établie à l'égard de ses deux parents au plus tard le jour de la déclaration de sa naissance ou par la suite mais simultanément, ces derniers choisissent le nom de famille qui lui est dévolu : soit le nom du père, soit le nom de la mère, soit leurs deux noms accolés dans l'ordre choisi par eux dans la limite d'un nom de famille pour chacun d'eux. En l'absence de déclaration conjointe à l'officier de l'état civil mentionnant le choix du nom de l'enfant, celui-ci prend le nom de celui de ses parents à l'égard duquel sa filiation est établie en premier lieu et le nom de son père si sa filiation est établie simultanément à l'égard de l'un et de l'autre. En cas de désaccord entre les parents, signalé par l'un d'eux à l'officier de l'état civil, au plus tard au jour de la déclaration de naissance ou après la naissance, lors de l'établissement simultané de la filiation, l'enfant prend leurs deux noms, dans la limite du premier nom de famille pour chacun d'eux, accolés selon l'ordre alphabétique._**»**\n\n\n\n- ***En cas de désaccord entre les parents***, l’enfant reçoit leurs deux noms accolés par ordre alphabétique. ***En l’absence de déclaration conjointe*** de choix de nom lors de la déclaration de naissance, c’est le nom du père qui est transmis par défaut (lorsque la filiation est établie simultanément).\n\n\n\n**§2 : La modification du nom&#xA0;**\n\n**A) La modification du nom liée à un changement de filiation&#xA0;**\n\n- *Dans le Code civil, **l’article 61-3** dispose que : “Tout changement de nom de l'enfant de plus de treize ans nécessite son consentement personnel lorsque ce changement ne résulte pas de l'établissement ou d'une modification d'un lien de filiation.”*\n- *Cela veut dire que, en principe, le changement de filiation d’une personne physique emporte la modification du nom de famille de l’enfant / la personne qui change de famille par adoption.&#xA0;*\n- ***Attention** : pour le changement de nom, **l’article 61-3 alinéa 2** : “L'établissement ou la modification du lien de filiation n'emporte cependant le changement du nom de famille des enfants majeurs que sous réserve de leur consentement.”*\n- *Cela veut dire que automatiquement, lors de l’adoption ou du changement de filiation, il y a la modification du nom en famille lorsque l’enfant est mineur. En revanche, s'il est majeur, il faut son consentement.&#xA0;*\n\n\n\n- *On va distinguer 2 types d’adoptions en droit français :&#xA0;*\n\n* ***Adoption plénière** → Adoption pleine et entière. La personne adoptée quitte sa famille d’origine et se voit établir un nouveau lien de filiation avec sa famille adoptive. On change de nom de famille directement (on prend le nom de famille de la famille adoptive)*\n* ***Adoption simple** → Il n'y a pas de rupture totale de l’adopté avec sa famille d’origine. Il y a l’ajout de nouveaux liens de filiation avec la famille adoptive.*\n\n\n\n- *Dans le cas de l’adoption simple, **l’article 363 du Code civil alinéa 1**: “L'adoption simple confère le nom de l'adoptant à l'adopté en l'ajoutant au nom de ce dernier.”*\n- *Le législateur dit que l'adopté de manière simple va avoir un nom composé.&#xA0;*\n- ***Conséquences** : Si l’adopté de manière simple à des enfants, quel nom de famille est transmis ? C’est ce nom composé (famille d’origine et famille adoptive) qui sera transmis aux enfants de la personne adoptée simplement.&#xA0;*\n\n***Deuxième phrase de l’alinéa 1 de l’article 363 du Code civil** : “Toutefois, si l'adopté est âgé de plus de treize ans, il doit consentir à cette adjonction”*\n\n\n\n**B) Les autres cas de modification du nom&#xA0;**\n\n- *Une autre **loi du 11 germinal An 11 (1er avril 1803)** avait admis que les personnes puissent changer de nom de famille pour des raisons graves avec l’autorisation du Conseil d’État.&#xA0;*\n- *Une **loi du 8 janvier 1993** a institué une procédure de changement de nom dans le Code civil : **article 61 et suivants du Code civil**.&#xA0;*\n- ***Article 61 du Code civil** **alinéa 1** : “Toute personne qui justifie d'un intérêt légitime peut demander à changer de nom.” Le législateur a prévu à cet article, que le changement de nom peut se faire par justification d’un intérêt légitime. &#xA0;*\n- ***Alinéa 2** : “La demande de changement de nom peut avoir pour objet d'éviter l'extinction du nom porté par un ascendant ou un collatéral du demandeur jusqu'au quatrième degré.” → **éviter l'extinction du nom de famille**.&#xA0;*\n- ***Alinéa 3** : “Le changement de nom est autorisé par décret.”&#xA0;*\n\n\n\n- *Le Conseil d’État avait rendu une **décision le 28 juillet 2000** qui va constituer un intérêt légitime qui est de “**perdre un nom à consonance ridicule ou injurieux**\".&#xA0;*\n\n\n\n- ***L’article 61-1 du Code civil** : “Tout intéressé peut faire opposition devant le Conseil d'Etat au décret portant changement de nom dans un délai de deux mois à compter de sa publication au Journal officiel.*\n- *Un décret portant changement de nom prend effet, s'il n'y a pas eu d'opposition, à l'expiration du délai pendant lequel l'opposition est recevable ou, dans le cas contraire, après le rejet de l'opposition.” (→ des personnes peuvent s'opposer à cette décision.)*\n- ***L’article 61-3-1 du Code civil** : “Toute personne majeure dont l'acte de naissance est détenu par un officier de l'état civil français peut demander à l'officier de l'état civil de son lieu de résidence ou dépositaire de son acte de naissance son changement de nom en vue de porter l'un des noms prévus aux premier et dernier alinéas de l'article[ 311-21](https://www.legifrance.gouv.fr/affichCodeArticle.do?cidTexte=LEGITEXT000006070721\\&idArticle=LEGIARTI000006424849\\&dateTexte=\\&categorieLien=cid). Sans préjudice de l'article 61, ce choix ne peut être fait qu'une seule fois.”*\n\n***→ une fois dans notre vie, on peut, à notre majorité et depuis 2022, demander à changer notre nom de famille en prenant le nom de famille de l’autre parent. &#xA0;***\n\n\n\n***Les effets du changement de nom :&#xA0;***\n\n- *Si la personne qui a obtenu ce changement de nom à des enfants, ce changement de nom s'étend à tous les membres de la famille dont ses enfants.&#xA0;*\n- ***L’article 61-2 du Code civil** : “Le changement de nom s'étend de plein droit aux enfants du bénéficiaire lorsqu'ils ont moins de treize ans.” Au delà de l'âge de 13 ans, les enfants de la personne qui a changé de nom de famille doivent donner leur consentement.&#xA0;*\n\n* *Il y a une autre procédure qui est “**la francisation du nom de famille**”, c’est une procédure qui peut être demandée par une personne étrangère qui obtient la nationalité française par naturalisation. L’étranger devenu français peut demander la modification de ce nom de famille. C’est une procédure qui se fait par décret.&#xA0;*\n\n\n\n\n\n\n\n\n\n\n\n**Section 2 : L’usage du nom&#xA0;**\n\n- *En principe, les citoyens français ont l’obligation de porter un nom de famille. Le nom de famille à un usage de police civil et est un attribut de la personne physique.&#xA0;*\n\n\n\n**§1 : Un usage social&#xA0;**\n\n- *Le nom de famille permet d'identifier une personne au sein de sa famille et de la société.&#xA0;*\n- *Le nom de famille va devoir être utilisé par la personne physique, et cette personne physique a l'obligation d’utiliser son nom de famille car les autorités publiques l'imposent.&#xA0;*\n\n* ***La loi du 6 fructidor an II** : chaque citoyen français a l’obligation de porter ses nom et prénom qu’on retrouve sur son acte de naissance.&#xA0;*\n\n***Attention** : c’est une obligation vis à vis de l’État. Cette obligation est pénalement sanctionné dans le Code pénal par **l'article 433-19** : “Est puni de six mois d'emprisonnement et de 7 500 euros d'amende le fait, dans un acte public ou authentique ou dans un document administratif destiné à l'autorité publique et hors les cas où la réglementation en vigueur autorise à souscrire ces actes ou documents sous un état civil d'emprunt :&#xA0;*\n\n*1° De prendre un nom ou un accessoire du nom autre que celui assigné par l'état civil ;*\n\n*2° De changer, altérer ou modifier le nom ou l'accessoire du nom assigné par l'état civil.”*\n\n\n\n- ***L’article 4 de la loi du 6 fructidor an II** : “Il est expressément défendu à tous fonctionnaires publics de désigner les citoyens dans les actes autrement que par le nom de famille; les prénoms portés en l'acte de naissance, ou les surnoms maintenus par l'article II, ni d'en exprimer d'autres dans les expéditions et extraits qu'ils délivreront à l'avenir.”&#xA0;*\n\n* ***Il y a une question qui s’est posée à l'égard des femmes mariées.&#xA0;***\n* *Elle a son nom de naissance marqué sur son acte naissance mais il est arrivé que des fonctionnaires publics envoient des courriers officiels aux femmes mariées en les désignant sous le nom de leur mari. **Est-ce que les actes adressés aux femmes mariées sont valables ou sont nuls ?&#xA0;***\n* *La jurisprudence n'était pas claire, mais la Cour de cassation en **2001** a été très stricte et a dit qu’il doit y avoir une annulation des actes adressés et que cela doit être son nom de famille de natalité et non celui de son mari.&#xA0;*\n* *Depuis le **6 mars 2007**, la Cour de cassation a assoupli sa décision : l’utilisation exclusive par les agents publics du nom marital d’une femme mariée dans un acte n’entraîne plus la nullité automatique de celui-ci, dès lors que son identité ne fait aucun doute.&#xA0;*\n* *Dans les rapports privés, il y a une liberté d'utiliser un autre nom de famille que celui de l’État civil.&#xA0;*\n\n***Exemple&#x20;**→ exercer une activité d'écrivain : l’auteur peut adopter un pseudonyme. La jurisprudence admet la possibilité d’avoir un nom de fantaisie (=pseudonyme) par rapport aux auteurs, écrivains, artistes… L'objectif est de masquer au public sa véritable personnalité dans l'exercice d’une activité spéciale. Il faut que les tiers sachent qu’il s’agit d’un pseudonyme et il ne faut pas tromper les tiers. **Attention** : un autre écrivain ne peut pas prendre le même pseudonyme.&#xA0;*\n\n- ***Interdiction** : il est interdit d’utiliser un pseudonyme dans certaines professions (ex : médecins, sages-femmes, etc).&#xA0;*\n- *Il y a une limite sur l’utilisation d’un nom de famille qui est : **l'usurpation de nom de famille est interdite**. L'usurpation veut dire qu’une personne va porter le nom de famille d’autrui sans autorisation de manière déloyale en se l'approprient et utilise ce nom dans les actes de la vie civile.&#xA0;*\n- *Les membres de la famille peuvent agir en justice contre des tiers qui utilisent leur nom de famille, et ils vont demander une interdiction à l’usurpateur d'utiliser le nom&#xA0;*\n- *usurpé = **l'action en usurpation du nom de famille ouverte à tous les membres de la famille.&#xA0;***\n- *C’est le juge qui va trancher si la personne assignée en justice est un usurpateur ou s’il avait des raisons d’usurper le nom de famille.&#xA0;*\n\n\n\n***Le nom d’usage est le nom que l’on utilise dans les rapports privés :&#xA0;***\n\n- *On a une première situation → cela concerne les enfants d’un couple. Jusqu'à la loi de 2002, la coutume prévoyait que seul le nom du père était transmis aux enfants du couple mais l’option a 4 branches est mise en place depuis 2002. Le législateur a prévu par des dispositions que toute personne majeure puisse ajouter à son nom de naissance, qui était le nom de famille du père, le nom de famille de l’autre parent (avant 2002).&#xA0;*\n- ***La loi du 2 mars 2022** a créé un article dans le Code civil = **l’article 311-24-2** **alinéa 1:** “Toute personne majeure peut porter, à titre d'usage, l'un des noms prévus aux premier et dernier alinéas de l'article[ 311-21](https://www.legifrance.gouv.fr/affichCodeArticle.do?cidTexte=LEGITEXT000006070721\\&idArticle=LEGIARTI000006424849\\&dateTexte=\\&categorieLien=cid).”*\n- ***Alinéa 2** : “A l'égard des enfants mineurs, cette faculté est mise en œuvre par les deux parents exerçant l'autorité parentale ou par le parent exerçant seul l'autorité parentale.” En cas de désaccord des parents, c’est le juge aux affaires familiales (JAF) qui décide si l’enfant porte tel ou tel nom d’usage.&#xA0;*\n- ***Alinéa 3** : “En outre, le parent qui n'a pas transmis son nom de famille peut adjoindre celui-ci, à titre d'usage, au nom de l'enfant mineur. Cette adjonction se fait dans la limite du premier nom de famille de chacun des parents. Il en informe préalablement et en temps utile l'autre parent exerçant l'autorité parentale. Ce dernier peut, en cas de désaccord, saisir le juge aux affaires familiales, qui statue selon ce qu'exige l'intérêt de l'enfant.”*\n- ***Alinéa 4** : “Dans tous les cas, si l'enfant est âgé de plus de treize ans, son consentement personnel est requis.”*\n\n\n\n- *Le nom d'usage s'éteint au décès de la personne physique, puisqu'il ne s'applique que de son vivant. Cela veut dire que le nom d’usage ne se transmet pas aux héritiers de la personne.&#xA0;*\n\n\n\n***Le cas du mariage :&#xA0;***\n\n- *Les 2 époux ont le droit, à titre d’usage, d'utiliser le nom de l’autre.&#xA0;*\n- ***L’article 264 du Code civil alinéa 1** : “A la suite du divorce, chacun des époux perd l'usage du nom de son conjoint.”*\n- *Sauf exception → **alinéa 2** : “L'un des époux peut néanmoins conserver l'usage du nom de l'autre, soit avec l'accord de celui-ci, soit avec l'autorisation du juge, s'il justifie d'un intérêt particulier pour lui ou pour les enfants.” **⇒ cela concerne les rapports privés.**&#xA0;*\n\n\n\n- ***L’article 225-1 du Code civil** : “Chacun des époux peut porter, à titre d'usage, le nom de l'autre époux, par substitution ou adjonction à son propre nom dans l'ordre qu'il choisit, dans la limite d'un nom de famille pour chacun d'eux.” →**&#x20;il peut remplacer son nom de famille par celui de son conjoint ou adjoindre son nom de famille a celui de son conjoint dans le sens qu’il souhaite (seulement pour les rapports privés !!!!!).**&#xA0;*\n\n\n\n- *&#xA0;Le nom d’usage pouvait être mentionné sur certains actes administratifs comme notamment sur la carte nationale d'identité ou le passeport.&#xA0;*\n\n\n\n**§2 : Un usage littéraire/commercial&#xA0;**\n\n*→ L’usage non autorisé du nom par le titulaire.&#xA0;*\n\n\n\n***Pour les usages littéraires :&#xA0;***\n\n- *Imaginons qu’un nom de famille existant soit utilisé par un écrivain dans son œuvre en donnant ce nom à un personnage. La famille peut agir en justice à l'encontre de l'écrivain sur le terrain d’un article du Code civil = **Article 1240** : “Tout fait quelconque de l'homme, qui cause à autrui un dommage, oblige celui par la faute duquel il est arrivé à le réparer.”*\n\n***Deux conditions doivent être remplis pour entamer une action juridique :&#xA0;***\n\n- *Les juges exigent l'existence d'un risque de confusion entre un titulaire véritable du nom de famille et le personnage fictif d’une œuvre littéraire.&#xA0;*\n- *Il faut qu'un préjudice soit causé aux membres véritables dans la vraie vie de la famille.&#xA0;*\n\n*exemples de jurisprudences → la Cour d’appel de Paris dans les années de 1970.&#xA0;*\n\n- ***La Cour d’appel de Paris du 24 mai 1975** a jugé qu’il n'y avait pas de risque de confusion : d’un côté on a les personnes véritables, Comte et Comtesse de Béru, et de l’autre, le personnage fictif appelé le commissaire Bérurier avec comme surnom Béru.&#xA0;*\n- ***La Cour d’appel de Paris du 16 mars 1974** → en l'espèce, on avait comme personne réelle Henri Chemin qui était directeur des compétitions chez Simca. Le réalisateur Claude Lellouche a créé un personnage, dans son film “Le voyou”, peut recommandable et se nommait “Henri Chemin” qui était directeur des relations publiques chez Simca. Dans cette affaire le véritable Henri Chemin a agit en justice car il y avait un véritable risque de confusion entre lui et celui du film.&#xA0;*\n\n***(Article 1240 cciv actuel = ancien article 1382 Cciv)&#xA0;***\n\n- ***La première Chambre civile de la Cour de cassation avec l'arrêt du 8 octobre 2009** → dans cette décision, il y avait un risque de confusion possible entre le personnage fictif et la famille réelle, cela pouvait ainsi leur porter préjudice.&#xA0;*\n\n\n\n***Pour les usages à des fins commerciales :&#xA0;***\n\n- ***La première Chambre civile de la Cour de cassation du 19 décembre 1967 (doc 6 du TD 4 de droit civil)&#x20;**→ La Cour de cassation rappelle que les membres d’une famille ont le droit de s’opposer à ce qu'un tiers s'approprie leur nom patronymique sans droit ni titre, particulièrement à des fins commerciales. Cependant, la Haute juridiction précise que lorsque le nom de famille en question est un nom courant ou à consonance géographique, l'interdiction de l'utiliser ne peut être prononcée que s'il existe **un risque réel de confusion dans l'esprit du public**, susceptible de porter atteinte aux demandeurs ou au prestige de leur nom. En l'absence de confusion prouvée, l'usage commercial par le tiers est toléré.*\n- ***La Chambre commerciale de la Cour de cassation le 12 mars 1985 “Arrêt Bordas” (doc 8 du TD 4 de droit civil)** → il y a une personne physique qui a décidé de transmettre son nom de famille à une société.&#xA0;*\n- *La Cour de cassation a jugé que lorsqu'une personne physique accepte d'insérer son nom de famille (son patronyme) dans les statuts d'une société lors de sa création, ce nom **se détache de la personne physique**. Il devient un objet de **propriété incorporelle** appartenant à la personne morale (l'entreprise).*\n- *L'associé fondateur qui a donné son accord (même de façon tacite en signant les statuts) **ne peut plus exiger le retrait de son nom** par la suite, même s'il quitte l'entreprise ou devient minoritaire. La Cour précise que le principe civil **d'inaliénabilité du nom de famille (le fait qu'on ne puisse pas vendre son propre nom à une autre personne physique)** ne fait pas obstacle à ce que ce nom devienne une dénomination sociale ou une marque commerciale.&#xA0;*\n\n\n\n**CHAPITRE 2 : Le prénom&#xA0;**\n\n*Révisions : Cours magistral et TD qui correspondent aux séance 1 à la séance 3 incluse*\n\n**On n'aborde pas le chapitre 2 sur le prénom.**\n\n- Pour le prénom, il existe des règles dans le Code civil pour attribuer le prénom. Le prénom est attribué par le choix des parents. \n- ***Article 57 du Code civil*** : *“L'acte de naissance énoncera le jour, l'heure et le lieu de la naissance, le sexe de l'enfant, les prénoms qui lui seront donnés, le nom de famille, suivi le cas échéant de la mention de la déclaration conjointe de ses parents quant au choix effectué, ainsi que les prénoms, noms, âges, professions et domiciles des père et mère et, s'il y a lieu, ceux du déclarant. Si les père et mère de l'enfant ou l'un d'eux ne sont pas désignés à l'officier de l'état civil, il ne sera fait sur les registres aucune mention à ce sujet.”*\n- ***Article 60 du Code civil*** : “*Toute personne dont l'acte de naissance est détenu par un officier de l'état civil français peut demander à l'officier de l'état civil à changer de prénom. La demande est remise à l'officier de l'état civil du lieu de résidence ou du lieu où l'acte de naissance a été dressé. S'il s'agit d'un mineur, la demande est remise par son représentant légal. L'adjonction, la suppression ou la modification de l'ordre des prénoms peut également être demandée.*\n- *Si l'enfant est âgé de plus de treize ans, son consentement personnel est requis.*\n- *La décision de changement de prénom est inscrite sur le registre de l'état civil.*\n- *S'il estime que la demande ne revêt pas un intérêt légitime, en particulier lorsqu'elle est contraire à l'intérêt de l'enfant ou aux droits des tiers à voir protéger leur nom de famille, l'officier de l'état civil saisit sans délai le procureur de la République. Il en informe le demandeur. Si le procureur de la République s'oppose à ce changement, le demandeur, ou son représentant légal, peut alors saisir le juge aux affaires familiales.”*\n- **De plus, la francisation est acceptée si le nom ou le prénom a une consonance étrangère qui peut gêner l'intégration dans la communauté française.**\n\n\n\n**Section 1 : L’attribution du prénom&#xA0;**\n\n**Section 2 : La modification du prénom**\n", "html": "<h2>TITRE 1 : Le nom, élément d’identification des personnes</h2>\n<p>(SÉANCE de TD numéro 4) </p>\n<h2>CHAPITRE 1 : Le nom de famille</h2>\n<ul>\n<li>Le nom de famille comme l’état civil est <strong>un signe distinctif des personnes</strong>. Le nom de famille possède une <strong>double nature</strong> : </li>\n</ul>\n<ul>\n<li>Le nom de famille est considéré comme une <strong>institution de police</strong> civile car chacun d’entre nous doit assumer l’obligation de porter un nom de famille (c’est une sorte de matricule que la société française impose à ses citoyens pour les identifier). </li>\n<li>Le nom de famille <strong>fait l’objet d’un droit subjectif</strong>, c'est-à-dire que celui qui porte le nom de famille doit le défendre face aux usurpations, face aux usurpateurs et peut interdire à des tiers non autorisés de l’utiliser. </li>\n</ul>\n<ul>\n<li>Cette double nature va se révéler dans ses fonctions, cela veut dire que le nom a aussi une double fonction : </li>\n</ul>\n<ul>\n<li>Fonction sociale </li>\n<li>Fonction privée.  </li>\n</ul>\n<h3>Section 1 : L’attribution du nom</h3>\n<h4>§1 : La transmission du nom</h4>\n<ul>\n<li>Jusqu'à une <strong>loi du 4 mars 2002</strong>, c'était le nom de famille du père qui était transmis aux enfants. La règle n'était pas inscrite dans le Code civil, mais paraissait évidente. Cette loi est entrée en vigueur le <strong>14 janvier 2005</strong> et est intervenue pour venir attribuer les règles d'attribution du nom de famille.</li>\n<li>La <strong>loi du 23 décembre 1985</strong> sur l'égalité entre époux et entre pères et mères, le législateur a autorisé, à titre d’usage, d’ajouter le nom de famille de l’autre parent</li>\n<li>Il y a plusieurs possibilités : </li>\n</ul>\n<ul>\n<li>soit que le nom du père</li>\n<li>soit que le nom de la mère</li>\n<li>soit les deux nom dans l’ordre qu’ils souhaitent</li>\n</ul>\n<p><strong>Lorsqu’on attribue un nom de famille a un enfant et que d’autres sont conçues après, le reste des enfants héritent du même choix du nom du premier enfant conçu !!!</strong></p>\n<ul>\n<li><p><em><strong>L’Article 311-21 du Code civil</strong> « Lorsque la filiation d'un enfant est établie à l'égard de ses deux parents au plus tard le jour de la déclaration de sa naissance ou par la suite mais simultanément, ces derniers choisissent le nom de famille qui lui est dévolu : soit le nom du père, soit le nom de la mère, soit leurs deux noms accolés dans l'ordre choisi par eux dans la limite d'un nom de famille pour chacun d'eux. En l'absence de déclaration conjointe à l'officier de l'état civil mentionnant le choix du nom de l'enfant, celui-ci prend le nom de celui de ses parents à l'égard duquel sa filiation est établie en premier lieu et le nom de son père si sa filiation est établie simultanément à l'égard de l'un et de l'autre. En cas de désaccord entre les parents, signalé par l'un d'eux à l'officier de l'état civil, au plus tard au jour de la déclaration de naissance ou après la naissance, lors de l'établissement simultané de la filiation, l'enfant prend leurs deux noms, dans la limite du premier nom de famille pour chacun d'eux, accolés selon l'ordre alphabétique.</em><strong>»</strong></p>\n</li>\n<li><p><em><strong>En cas de désaccord entre les parents</strong></em>, l’enfant reçoit leurs deux noms accolés par ordre alphabétique. <em><strong>En l’absence de déclaration conjointe</strong></em> de choix de nom lors de la déclaration de naissance, c’est le nom du père qui est transmis par défaut (lorsque la filiation est établie simultanément).</p>\n</li>\n</ul>\n<h4>§2 : La modification du nom</h4>\n<h5>A) La modification du nom liée à un changement de filiation</h5>\n<ul>\n<li><p><em>Dans le Code civil, <strong>l’article 61-3</strong> dispose que : “Tout changement de nom de l'enfant de plus de treize ans nécessite son consentement personnel lorsque ce changement ne résulte pas de l'établissement ou d'une modification d'un lien de filiation.”</em></p>\n</li>\n<li><p>Cela veut dire que, en principe, le changement de filiation d’une personne physique emporte la modification du nom de famille de l’enfant / la personne qui change de famille par adoption. </p>\n</li>\n<li><p>Attention : pour le changement de nom, <strong>l’article 61-3 alinéa 2</strong> : “L'établissement ou la modification du lien de filiation n'emporte cependant le changement du nom de famille des enfants majeurs que sous réserve de leur consentement.”</p>\n</li>\n<li><p>Cela veut dire que automatiquement, lors de l’adoption ou du changement de filiation, il y a la modification du nom en famille lorsque l’enfant est mineur. En revanche, s'il est majeur, il faut son consentement. </p>\n</li>\n<li><p>On va distinguer 2 types d’adoptions en droit français : </p>\n</li>\n</ul>\n<ul>\n<li>Adoption plénière → Adoption pleine et entière. La personne adoptée quitte sa famille d’origine et se voit établir un nouveau lien de filiation avec sa famille adoptive. On change de nom de famille directement (on prend le nom de famille de la famille adoptive)</li>\n<li>Adoption simple → Il n'y a pas de rupture totale de l’adopté avec sa famille d’origine. Il y a l’ajout de nouveaux liens de filiation avec la famille adoptive.</li>\n</ul>\n<ul>\n<li><em>Dans le cas de l’adoption simple, <strong>l’article 363 du Code civil alinéa 1</strong>: “L'adoption simple confère le nom de l'adoptant à l'adopté en l'ajoutant au nom de ce dernier.”</em></li>\n<li>Le législateur dit que l'adopté de manière simple va avoir un nom composé. </li>\n<li>Conséquences : Si l’adopté de manière simple à des enfants, quel nom de famille est transmis ? C’est ce nom composé (famille d’origine et famille adoptive) qui sera transmis aux enfants de la personne adoptée simplement. </li>\n</ul>\n<p>Deuxième phrase de l’alinéa 1 de l’article 363 du Code civil : “Toutefois, si l'adopté est âgé de plus de treize ans, il doit consentir à cette adjonction”</p>\n<h5>B) Les autres cas de modification du nom</h5>\n<ul>\n<li><p>Une autre <strong>loi du 11 germinal An 11 (1er avril 1803)</strong> avait admis que les personnes puissent changer de nom de famille pour des raisons graves avec l’autorisation du Conseil d’État. </p>\n</li>\n<li><p>Une <strong>loi du 8 janvier 1993</strong> a institué une procédure de changement de nom dans le Code civil : <strong>article 61 et suivants du Code civil</strong>. </p>\n</li>\n<li><p>Article 61 du Code civil <strong>alinéa 1</strong> : “Toute personne qui justifie d'un intérêt légitime peut demander à changer de nom.” Le législateur a prévu à cet article, que le changement de nom peut se faire par justification d’un intérêt légitime.  </p>\n</li>\n<li><p>Alinéa 2 : “La demande de changement de nom peut avoir pour objet d'éviter l'extinction du nom porté par un ascendant ou un collatéral du demandeur jusqu'au quatrième degré.” → <strong>éviter l'extinction du nom de famille</strong>. </p>\n</li>\n<li><p>Alinéa 3 : “Le changement de nom est autorisé par décret.” </p>\n</li>\n<li><p>Le Conseil d’État avait rendu une <strong>décision le 28 juillet 2000</strong> qui va constituer un intérêt légitime qui est de “<strong>perdre un nom à consonance ridicule ou injurieux</strong>\". </p>\n</li>\n<li><p>L’article 61-1 du Code civil : “Tout intéressé peut faire opposition devant le Conseil d'Etat au décret portant changement de nom dans un délai de deux mois à compter de sa publication au Journal officiel.</p>\n</li>\n<li><p><em>Un décret portant changement de nom prend effet, s'il n'y a pas eu d'opposition, à l'expiration du délai pendant lequel l'opposition est recevable ou, dans le cas contraire, après le rejet de l'opposition.” (→ des personnes peuvent s'opposer à cette décision.)</em></p>\n</li>\n<li><p>L’article 61-3-1 du Code civil : “Toute personne majeure dont l'acte de naissance est détenu par un officier de l'état civil français peut demander à l'officier de l'état civil de son lieu de résidence ou dépositaire de son acte de naissance son changement de nom en vue de porter l'un des noms prévus aux premier et dernier alinéas de l'article<a href=\"https://www.legifrance.gouv.fr/affichCodeArticle.do?cidTexte=LEGITEXT000006070721&amp;idArticle=LEGIARTI000006424849&amp;dateTexte=&amp;categorieLien=cid\"> 311-21</a>. Sans préjudice de l'article 61, ce choix ne peut être fait qu'une seule fois.”</p>\n</li>\n</ul>\n<p>→ une fois dans notre vie, on peut, à notre majorité et depuis 2022, demander à changer notre nom de famille en prenant le nom de famille de l’autre parent.  </p>\n<p>Les effets du changement de nom : </p>\n<ul>\n<li>Si la personne qui a obtenu ce changement de nom à des enfants, ce changement de nom s'étend à tous les membres de la famille dont ses enfants. </li>\n<li>L’article 61-2 du Code civil : “Le changement de nom s'étend de plein droit aux enfants du bénéficiaire lorsqu'ils ont moins de treize ans.” Au delà de l'âge de 13 ans, les enfants de la personne qui a changé de nom de famille doivent donner leur consentement. </li>\n</ul>\n<ul>\n<li>Il y a une autre procédure qui est “<strong>la francisation du nom de famille</strong>”, c’est une procédure qui peut être demandée par une personne étrangère qui obtient la nationalité française par naturalisation. L’étranger devenu français peut demander la modification de ce nom de famille. C’est une procédure qui se fait par décret. </li>\n</ul>\n<h3>Section 2 : L’usage du nom</h3>\n<ul>\n<li>En principe, les citoyens français ont l’obligation de porter un nom de famille. Le nom de famille à un usage de police civil et est un attribut de la personne physique. </li>\n</ul>\n<h4>§1 : Un usage social</h4>\n<ul>\n<li>Le nom de famille permet d'identifier une personne au sein de sa famille et de la société. </li>\n<li>Le nom de famille va devoir être utilisé par la personne physique, et cette personne physique a l'obligation d’utiliser son nom de famille car les autorités publiques l'imposent. </li>\n</ul>\n<ul>\n<li>La loi du 6 fructidor an II : chaque citoyen français a l’obligation de porter ses nom et prénom qu’on retrouve sur son acte de naissance. </li>\n</ul>\n<p class=\"lesson-note\">Attention : c’est une obligation vis à vis de l’État. Cette obligation est pénalement sanctionné dans le Code pénal par <strong>l'article 433-19</strong> : “Est puni de six mois d'emprisonnement et de 7 500 euros d'amende le fait, dans un acte public ou authentique ou dans un document administratif destiné à l'autorité publique et hors les cas où la réglementation en vigueur autorise à souscrire ces actes ou documents sous un état civil d'emprunt : </p>\n<p><em>1° De prendre un nom ou un accessoire du nom autre que celui assigné par l'état civil ;</em></p>\n<p><em>2° De changer, altérer ou modifier le nom ou l'accessoire du nom assigné par l'état civil.”</em></p>\n<ul>\n<li>L’article 4 de la loi du 6 fructidor an II : “Il est expressément défendu à tous fonctionnaires publics de désigner les citoyens dans les actes autrement que par le nom de famille; les prénoms portés en l'acte de naissance, ou les surnoms maintenus par l'article II, ni d'en exprimer d'autres dans les expéditions et extraits qu'ils délivreront à l'avenir.” </li>\n</ul>\n<ul>\n<li>Il y a une question qui s’est posée à l'égard des femmes mariées. </li>\n<li>Elle a son nom de naissance marqué sur son acte naissance mais il est arrivé que des fonctionnaires publics envoient des courriers officiels aux femmes mariées en les désignant sous le nom de leur mari. Est-ce que les actes adressés aux femmes mariées sont valables ou sont nuls ? </li>\n<li>La jurisprudence n'était pas claire, mais la Cour de cassation en <strong>2001</strong> a été très stricte et a dit qu’il doit y avoir une annulation des actes adressés et que cela doit être son nom de famille de natalité et non celui de son mari. </li>\n<li>Depuis le <strong>6 mars 2007</strong>, la Cour de cassation a assoupli sa décision : l’utilisation exclusive par les agents publics du nom marital d’une femme mariée dans un acte n’entraîne plus la nullité automatique de celui-ci, dès lors que son identité ne fait aucun doute. </li>\n<li>Dans les rapports privés, il y a une liberté d'utiliser un autre nom de famille que celui de l’État civil. </li>\n</ul>\n<p class=\"lesson-note\">Exemple <strong>→ exercer une activité d'écrivain : l’auteur peut adopter un pseudonyme. La jurisprudence admet la possibilité d’avoir un nom de fantaisie (=pseudonyme) par rapport aux auteurs, écrivains, artistes… L'objectif est de masquer au public sa véritable personnalité dans l'exercice d’une activité spéciale. Il faut que les tiers sachent qu’il s’agit d’un pseudonyme et il ne faut pas tromper les tiers. Attention</strong> : un autre écrivain ne peut pas prendre le même pseudonyme. </p>\n<ul>\n<li>Interdiction : il est interdit d’utiliser un pseudonyme dans certaines professions (ex : médecins, sages-femmes, etc). </li>\n<li>Il y a une limite sur l’utilisation d’un nom de famille qui est : <strong>l'usurpation de nom de famille est interdite</strong>. L'usurpation veut dire qu’une personne va porter le nom de famille d’autrui sans autorisation de manière déloyale en se l'approprient et utilise ce nom dans les actes de la vie civile. </li>\n<li>Les membres de la famille peuvent agir en justice contre des tiers qui utilisent leur nom de famille, et ils vont demander une interdiction à l’usurpateur d'utiliser le nom </li>\n<li>usurpé = l'action en usurpation du nom de famille ouverte à tous les membres de la famille. </li>\n<li>C’est le juge qui va trancher si la personne assignée en justice est un usurpateur ou s’il avait des raisons d’usurper le nom de famille. </li>\n</ul>\n<p>Le nom d’usage est le nom que l’on utilise dans les rapports privés : </p>\n<ul>\n<li><p>On a une première situation → cela concerne les enfants d’un couple. Jusqu'à la loi de 2002, la coutume prévoyait que seul le nom du père était transmis aux enfants du couple mais l’option a 4 branches est mise en place depuis 2002. Le législateur a prévu par des dispositions que toute personne majeure puisse ajouter à son nom de naissance, qui était le nom de famille du père, le nom de famille de l’autre parent (avant 2002). </p>\n</li>\n<li><p>La loi du 2 mars 2022 a créé un article dans le Code civil = <strong>l’article 311-24-2</strong> <strong>alinéa 1:</strong> “Toute personne majeure peut porter, à titre d'usage, l'un des noms prévus aux premier et dernier alinéas de l'article<a href=\"https://www.legifrance.gouv.fr/affichCodeArticle.do?cidTexte=LEGITEXT000006070721&amp;idArticle=LEGIARTI000006424849&amp;dateTexte=&amp;categorieLien=cid\"> 311-21</a>.”</p>\n</li>\n<li><p>Alinéa 2 : “A l'égard des enfants mineurs, cette faculté est mise en œuvre par les deux parents exerçant l'autorité parentale ou par le parent exerçant seul l'autorité parentale.” En cas de désaccord des parents, c’est le juge aux affaires familiales (JAF) qui décide si l’enfant porte tel ou tel nom d’usage. </p>\n</li>\n<li><p>Alinéa 3 : “En outre, le parent qui n'a pas transmis son nom de famille peut adjoindre celui-ci, à titre d'usage, au nom de l'enfant mineur. Cette adjonction se fait dans la limite du premier nom de famille de chacun des parents. Il en informe préalablement et en temps utile l'autre parent exerçant l'autorité parentale. Ce dernier peut, en cas de désaccord, saisir le juge aux affaires familiales, qui statue selon ce qu'exige l'intérêt de l'enfant.”</p>\n</li>\n<li><p>Alinéa 4 : “Dans tous les cas, si l'enfant est âgé de plus de treize ans, son consentement personnel est requis.”</p>\n</li>\n<li><p>Le nom d'usage s'éteint au décès de la personne physique, puisqu'il ne s'applique que de son vivant. Cela veut dire que le nom d’usage ne se transmet pas aux héritiers de la personne. </p>\n</li>\n</ul>\n<p>Le cas du mariage : </p>\n<ul>\n<li><p>Les 2 époux ont le droit, à titre d’usage, d'utiliser le nom de l’autre. </p>\n</li>\n<li><p>L’article 264 du Code civil alinéa 1 : “A la suite du divorce, chacun des époux perd l'usage du nom de son conjoint.”</p>\n</li>\n<li><p>Sauf exception → <strong>alinéa 2</strong> : “L'un des époux peut néanmoins conserver l'usage du nom de l'autre, soit avec l'accord de celui-ci, soit avec l'autorisation du juge, s'il justifie d'un intérêt particulier pour lui ou pour les enfants.” <strong>⇒ cela concerne les rapports privés.</strong> </p>\n</li>\n<li><p>L’article 225-1 du Code civil : “Chacun des époux peut porter, à titre d'usage, le nom de l'autre époux, par substitution ou adjonction à son propre nom dans l'ordre qu'il choisit, dans la limite d'un nom de famille pour chacun d'eux.” → il peut remplacer son nom de famille par celui de son conjoint ou adjoindre son nom de famille a celui de son conjoint dans le sens qu’il souhaite (seulement pour les rapports privés !!!!!). </p>\n</li>\n<li><ul>\n<li>Le nom d’usage pouvait être mentionné sur certains actes administratifs comme notamment sur la carte nationale d'identité ou le passeport. </li>\n</ul>\n</li>\n</ul>\n<h4>§2 : Un usage littéraire/commercial</h4>\n<p>→ L’usage non autorisé du nom par le titulaire. </p>\n<p>Pour les usages littéraires : </p>\n<ul>\n<li><em>Imaginons qu’un nom de famille existant soit utilisé par un écrivain dans son œuvre en donnant ce nom à un personnage. La famille peut agir en justice à l'encontre de l'écrivain sur le terrain d’un article du Code civil = <strong>Article 1240</strong> : “Tout fait quelconque de l'homme, qui cause à autrui un dommage, oblige celui par la faute duquel il est arrivé à le réparer.”</em></li>\n</ul>\n<p>Deux conditions doivent être remplis pour entamer une action juridique : </p>\n<ul>\n<li>Les juges exigent l'existence d'un risque de confusion entre un titulaire véritable du nom de famille et le personnage fictif d’une œuvre littéraire. </li>\n<li>Il faut qu'un préjudice soit causé aux membres véritables dans la vraie vie de la famille. </li>\n</ul>\n<p>exemples de jurisprudences → la Cour d’appel de Paris dans les années de 1970. </p>\n<ul>\n<li>La Cour d’appel de Paris du 24 mai 1975 a jugé qu’il n'y avait pas de risque de confusion : d’un côté on a les personnes véritables, Comte et Comtesse de Béru, et de l’autre, le personnage fictif appelé le commissaire Bérurier avec comme surnom Béru. </li>\n<li>La Cour d’appel de Paris du 16 mars 1974 → en l'espèce, on avait comme personne réelle Henri Chemin qui était directeur des compétitions chez Simca. Le réalisateur Claude Lellouche a créé un personnage, dans son film “Le voyou”, peut recommandable et se nommait “Henri Chemin” qui était directeur des relations publiques chez Simca. Dans cette affaire le véritable Henri Chemin a agit en justice car il y avait un véritable risque de confusion entre lui et celui du film. </li>\n</ul>\n<p>(Article 1240 cciv actuel = ancien article 1382 Cciv) </p>\n<ul>\n<li>La première Chambre civile de la Cour de cassation avec l'arrêt du 8 octobre 2009 → dans cette décision, il y avait un risque de confusion possible entre le personnage fictif et la famille réelle, cela pouvait ainsi leur porter préjudice. </li>\n</ul>\n<p>Pour les usages à des fins commerciales : </p>\n<ul>\n<li>La première Chambre civile de la Cour de cassation du 19 décembre 1967 (doc 6 du TD 4 de droit civil) <strong>→ La Cour de cassation rappelle que les membres d’une famille ont le droit de s’opposer à ce qu'un tiers s'approprie leur nom patronymique sans droit ni titre, particulièrement à des fins commerciales. Cependant, la Haute juridiction précise que lorsque le nom de famille en question est un nom courant ou à consonance géographique, l'interdiction de l'utiliser ne peut être prononcée que s'il existe un risque réel de confusion dans l'esprit du public</strong>, susceptible de porter atteinte aux demandeurs ou au prestige de leur nom. En l'absence de confusion prouvée, l'usage commercial par le tiers est toléré.</li>\n<li>La Chambre commerciale de la Cour de cassation le 12 mars 1985 “Arrêt Bordas” (doc 8 du TD 4 de droit civil) → il y a une personne physique qui a décidé de transmettre son nom de famille à une société. </li>\n<li><em>La Cour de cassation a jugé que lorsqu'une personne physique accepte d'insérer son nom de famille (son patronyme) dans les statuts d'une société lors de sa création, ce nom <strong>se détache de la personne physique</strong>. Il devient un objet de <strong>propriété incorporelle</strong> appartenant à la personne morale (l'entreprise).</em></li>\n<li>L'associé fondateur qui a donné son accord (même de façon tacite en signant les statuts) <strong>ne peut plus exiger le retrait de son nom</strong> par la suite, même s'il quitte l'entreprise ou devient minoritaire. La Cour précise que le principe civil <strong>d'inaliénabilité du nom de famille (le fait qu'on ne puisse pas vendre son propre nom à une autre personne physique)</strong> ne fait pas obstacle à ce que ce nom devienne une dénomination sociale ou une marque commerciale. </li>\n</ul>\n<h2>CHAPITRE 2 : Le prénom</h2>\n<p><em>Révisions : Cours magistral et TD qui correspondent aux séance 1 à la séance 3 incluse</em></p>\n<p><strong>On n'aborde pas le chapitre 2 sur le prénom.</strong></p>\n<ul>\n<li>Pour le prénom, il existe des règles dans le Code civil pour attribuer le prénom. Le prénom est attribué par le choix des parents.</li>\n<li><em><strong>Article 57 du Code civil</strong></em> : <em>“L'acte de naissance énoncera le jour, l'heure et le lieu de la naissance, le sexe de l'enfant, les prénoms qui lui seront donnés, le nom de famille, suivi le cas échéant de la mention de la déclaration conjointe de ses parents quant au choix effectué, ainsi que les prénoms, noms, âges, professions et domiciles des père et mère et, s'il y a lieu, ceux du déclarant. Si les père et mère de l'enfant ou l'un d'eux ne sont pas désignés à l'officier de l'état civil, il ne sera fait sur les registres aucune mention à ce sujet.”</em></li>\n<li><em><strong>Article 60 du Code civil</strong></em> : “<em>Toute personne dont l'acte de naissance est détenu par un officier de l'état civil français peut demander à l'officier de l'état civil à changer de prénom. La demande est remise à l'officier de l'état civil du lieu de résidence ou du lieu où l'acte de naissance a été dressé. S'il s'agit d'un mineur, la demande est remise par son représentant légal. L'adjonction, la suppression ou la modification de l'ordre des prénoms peut également être demandée.</em></li>\n<li><em>Si l'enfant est âgé de plus de treize ans, son consentement personnel est requis.</em></li>\n<li><em>La décision de changement de prénom est inscrite sur le registre de l'état civil.</em></li>\n<li><em>S'il estime que la demande ne revêt pas un intérêt légitime, en particulier lorsqu'elle est contraire à l'intérêt de l'enfant ou aux droits des tiers à voir protéger leur nom de famille, l'officier de l'état civil saisit sans délai le procureur de la République. Il en informe le demandeur. Si le procureur de la République s'oppose à ce changement, le demandeur, ou son représentant légal, peut alors saisir le juge aux affaires familiales.”</em></li>\n<li><strong>De plus, la francisation est acceptée si le nom ou le prénom a une consonance étrangère qui peut gêner l'intégration dans la communauté française.</strong></li>\n</ul>\n<h3>Section 1 : L’attribution du prénom</h3>\n<h3>Section 2 : La modification du prénom</h3>\n", "nested": true, "civilLesson": true, "partStart": false}, {"title": "Titre 2 : Le sexe, élément d’identification des personnes physiques", "text": "**TITRE 2 : Le sexe, élément d’identification des personnes physiques&#xA0;**\n\n**(SÉANCE de TD numéro 5)&#xA0;**\n\n\n\n- *Le système juridique français reconnaît la différence des sexes, mais aussi leur égalité. La personne morale n’a pas de sexe et le sexe permet d’identifier l’individu dans la société.&#xA0;*\n- ***L’article 34 de la Constitution** fixe les règles compétentes du législateur pour l’attribution et les changements par rapport aux éléments d’identifications des personnes physiques.*\n- ***Article 57 du Code civil** : “L'acte de naissance énoncera le jour, l'heure et le lieu de la naissance, le sexe de l'enfant, les prénoms qui lui seront donnés, le nom de famille, suivi le cas échéant de la mention de la déclaration conjointe de ses parents quant au choix effectué, ainsi que les prénoms, noms, âges, professions et domiciles des père et mère et, s'il y a lieu, ceux du déclarant. Si les père et mère de l'enfant ou l'un d'eux ne sont pas désignés à l'officier de l'état civil, il ne sera fait sur les registres aucune mention à ce sujet.”*\n\n*Le corps médical observe les organes génitaux pour identifier le sexe de l’enfant à la naissance.*\n\n- *La doctrine a tendance à expliquer qu’il existe deux principales composantes du sexe :&#xA0;*\n\n* ***sexe physique (anatomique, gonadique et chromosomique)** → évaluation médicale.*\n* ***sexe psychique (psychologique et psychosocial)** → le sentiment d’appartenir au sexe masculin ou féminin. Le sexe psychosocial est le comportement que la personne adopte dans la société par rapport à son sexe. On peut associé le genre au sexe psychique.&#xA0;*\n\n\n\n- *Dans la majorité des cas, il y a une concordance entre le sexe physique et le sexe psychique, c’est-à-dire que le sexe inscrit sur l’état civil de la personne correspond à son identité de genre.*\n\n\n\n**CHAPITRE 1 : Le transsexualisme (ou transgendérisme)**\n\n\n\n- *Discordance entre les composantes physiques et psychiques du sexe&#xA0;*\n- _C’est un phénomène qui a été identifié en 1953 par 2 personnes ; un professeur de science&#x20;_**Küss&#x20;**_qui avait fait une déclaration en 1982 devant l'académie nationale de médecine_ → “*c’est le sentiment profond et inébranlable d’appartenir au sexe opposé à celui qui est génétiquement, anatomiquement et juridiquement le sien, accompagné du besoin intense et constant de changer de sexe et d’état civil*”. \n\n\n\n- *La personne transgenre est convaincue depuis longtemps qu’elle appartient au sexe opposé. Il est arrivé que certaines personnes transgenres demandent aux médecins de modifier leur sexe anatomique pour la faire correspondre au sexe psychique.*\n- *L’objectif est de faire une ablation des organes génitaux de la personne et le corps médical va créer des organes de l’autre sexe. Cette opération est une opération de conversion sexuelle et est remboursée par la sécurité sociale.*\n- *Sur le plan juridique, la personne transgenre peut obtenir la modification de son mention de sexe à l’état civil, qu’elle ait ou non subi une opération chirurgicale ou des traitements médicaux.*\n\n\n\n**Section 1 : L’encadrement juridique du changement de sexe à l’état civil&#xA0;**\n\n**§1 : La position de la jurisprudence avant la loi du 18 novembre 2016&#xA0;**\n\n**A) Le refus initial du changement de sexe avant 1992&#xA0;**\n\n- *Avant 1992 et pendant longtemps, la Cour de cassation avait ignoré pendant longtemps la dimension psychique du sexe et s’est opposée fermement à la modification. Le motif était que la Cour estimait que le principe d’indisponibilité de l’état des personnes s’opposait à la modification du sexe à l’état civil, elle a donc refusé.*\n- *La jurisprudence a également estimée que la transformation physique de la personne transgenre résultait d’un choix délibéré.&#xA0;*\n- *Le 21 mai 1990, la Cour de cassation maintient son refus mais a changé son motif, elle a admis que la personne transgenre pouvait changer de prénom mais pas de sexe à l’état civil. De plus, la Cour dit « mais attendue que le transsexualisme, même lorsqu’il est médicalement reconnu, ne peut s’analyser comme un véritable changement de sexe ».*\n\n\n\n**B) L’admission du changement de sexe depuis 1992&#xA0;**\n\n- *Il y a une impulsion donnée par la Cour Européenne des Droits de l’Homme (CEDH) rendu le 25 mars 1992 ; dans cette affaire, la CEDH se soucie peu des droits de l'Homme, elle va en revanche se soucier de l'individu.*\n- *La Cour de cassation de la France va être condamnée par le droit européen.*\n- ***La France va devoir revoir ses lois et il y a 2 solutions :&#xA0;***\n\n* ***Adopter la voie minimale&#xA0;**: ne modifie pas l’état civil de ces personnes mais décide d’exclure la mention du sexe dans les papiers d’identité et on autorise le changement de prénom.*\n* ***Adopter la voie maximale&#xA0;**: autoriser la modification de la mention du sexe à l’état civil.*\n\n*⇒ La Cour de cassation rend sa decision le 11 décembre 1992, elle a décidé d’adopter la voie maximale sous conditions ; elle admet la modification du sexe à l’état civil.*\n\n- ***Dans l’arrêt de 1992, elle a posé 4 conditions :&#xA0;***\n\n* *Le syndrome du transsexualisme&#xA0;*\n* *Un traitement médico-chirurgical à but thérapeutique&#xA0;*\n* *La perte des caractères de son sexe d’origine&#xA0;*\n* *Une apparence physique et un comportement social correspondant à l’autre sexe*\n\n\n\n- *En 2013, il faut que la réalité du syndrome soit prouvée scientifiquement, le changement de sexe est irréversible.*\n- *Depuis 1992, de nombreuses personnes ont fait des changements de sexe.&#xA0;*\n- *Le souci est qu’il a été constaté que dans certaines opérations, il y avait des complications post-opératoires pour les patients. C’est une opération à risque, donc beaucoup de personnes étaient réticentes.*\n\n* *Le 7 juin 2012, la Cour de cassation admet le changement de sexe à l’état civil mais il faut que la personne transgenre établisse : « au regard de ce qui est communément admis dans la communauté scientifique la réalité du syndrome transsexuel dont elle est atteinte ainsi que le caractère irréversible de la transformation de son apparence ».*\n\n- *La CEDH, le 6 avril 2017 a condamné la France car elle obligeait les personnes transgenres à faire une opération stérilisante pour obtenir le changement à l’état civil. Elle estime que cela constitue une violation de leur droit au respect de la vie privée et remet en cause la condition d’irréversibilité.*\n\n* *En 2021, la CEDH a affirmer que l’opération de conversion sexuelle ne peut plus être une condition préalable à la modification du sexe à l’état civil.&#xA0;*\n\n\n\n**§2 : La loi du 18 novembre 2016 assouplissant les conditions du changement de sexe&#xA0;**\n\n- *Le législateur est intervenu pour supprimer les conditions médicales qui avaient été posées par la Cour de cassation. Depuis cette loi, la modification de sexe à l’état civil n’est plus subordonnée à des cas médicaux.&#xA0;*\n- ***Article 61-5 du Code civil&#xA0;**: “Toute personne majeure ou mineure émancipée qui démontre par une réunion suffisante de faits que la mention relative à son sexe dans les actes de l'état civil ne correspond pas à celui dans lequel elle se présente et dans lequel elle est connue peut en obtenir la modification.*\n- *Les principaux de ces faits, dont la preuve peut être rapportée par tous moyens, peuvent être :*\n\n*1° Qu'elle se présente publiquement comme appartenant au sexe revendiqué ;*\n\n*2° Qu'elle est connue sous le sexe revendiqué de son entourage familial, amical ou professionnel ;*\n\n*3° Qu'elle a obtenu le changement de son prénom afin qu'il corresponde au sexe revendiqué.” → **Il existe toujours des conditions mais elles ont été assouplies, les preuves peuvent être apportées par différents moyens (autre que médicaux).***\n\n- ***Liste de faits indicatifs mais pas exhaustifs dans l’article :***\n\n* *Qu'elle se présente publiquement comme appartenant au sexe revendiqué&#xA0;*\n* *Qu'elle est connue sous le sexe revendiqué de son entourage familial, amical ou professionnel&#xA0;*\n* *Qu'elle a obtenu le changement de son prénom afin qu'il corresponde au sexe revendiqué*\n\n\n\n- ***Article 61-6 du Code civil** : “La demande est présentée devant le tribunal judiciaire. Le demandeur fait état de son consentement libre et éclairé à la modification de la mention relative à son sexe dans les actes de l'état civil et produit tous éléments de preuve au soutien de sa demande.Le fait de ne pas avoir subi des traitements  médicaux, une opération chirurgicale ou une stérilisation ne peut motiver le refus de faire droit à la demande.” &#xA0;*\n- *La modification ne joue que pour l’avenir et doit être faite
