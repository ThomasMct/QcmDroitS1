d'arrêts pour les décisions rendues par les Cour d’appel, par les cour administratives d’appel, par la Cour de cassation et par le Conseil d’État. \nTroisièmement, on parle de décisions pour les décisions du Conseil d’État. \nL'article 4 du Code civil : “Le juge qui refusera de juger, sous prétexte du silence, de l'obscurité ou de l'insuffisance de la loi, pourra être poursuivi comme coupable de déni de justice.”\nLe juge est donc obligé de trancher les litiges qui lui sont soumis, cela suppose qu’il interprète la règle de droit pour l’appliquer à des cas qui n'étaient pas imaginés par le législateur (ex → agressions sexuelles dans le métaverse).  \nToute décision de justice se divisent généralement en 2 parties : \nLes motifs dans lesquelles le juge expose son raisonnement juridique et la façon dont il interprète la règle de droit applicable. C’est l'étude des motifs qui permet de découvrir la règle jurisprudentielle. \nLe dispositif qui contient la solution concrète donnée aux prétentions du demandeur et défendeur et commence toujours par “par ces motifs”. \n\nB) Des décisions judiciaires allant dans le même sens \n\nUne seule décision judiciaire ne fait pas jurisprudence. Il faudrait qu’il y ait le même problème juridique ou plusieurs décisions qui apportent la même réponse.\n\nC) Des décisions parmi lesquelles figurent des décisions des “ juridictions supérieures ”. \n\nIl est donc nécessaire que se trouvent, parmi les décisions convergentes, des arrêts de la Cour de cassation ou du Conseil d’État : en 2024, la Cour de cassation a rendu 11 471 arrêts. Le Conseil d’État a rendu environ 10 000 arrêts. \nPour les arrêts de la Cour de cassation, il y a 3 indices qui permettent de mesurer l’importance de la décision rendue : \n1er indice : Les arrêts qui émanent de l’assemblée plénière ont une force jurisprudentielle plus importante que les autres chambres.\n2e indice : La présence ou non d’un attendu de principe : il y a le premier attendu qui suit le visa et dans lequel la Cour rappelle en des termes généraux et impersonnels la règle énoncée dans le texte mentionné dans le visa. Pour les arrêts de rejets, il n’y a pas de visa. Le premier attendu reprend toujours les éléments de faits et de procédure. Puis il vient toujours un attendu rédigé : “mais attendu que”. Si la Cour de cassation énonce ensuite une règle générale, c’est un attendu de principe et donc un arrêt de principe. Depuis décembre 2019, la Cour de cassation a décidé de modifier le style rédactionnel de ses arrêts et d’abandonner la rédaction sous la forme attendue. Le but est de rendre le style plus intelligible pour les juristes et plus facilement traductible dans d’autres langues. Le premier avec ce nouveau style a été celui de l'arrêt du 4 décembre 2019. Désormais tout arrêt de la Cour de cassation contient 3 parties : 1/ Faits + Procédure ; 2/ Examen du moyen ; 3/ Dispositifs. Cela facilite une fiche d'arrêt, mais l'indice d'attendu de principe disparaît.\n3e indice : Lorsque la Cour de cassation rend une décision, elle lui attribue un numéro accompagné d’une ou plusieurs lettres, qui peuvent être depuis le 15 juin 2021 soit RBLC : \nR = l’arrêt va être publié et commenté dans le rapport annuel de la Cour de cassation (CC).\nB = l'arrêt est publié au bulletin annuel de la CC.\nL = publié dans la lettre d'information de la chambre qui l'a rendue.\nC = l’arrêt n’est pas publié et limité à un usage interne de la CC.\nLes arrêts qui contiennent seulement les lettres C et L ne font pas jurisprudence, ce sont des arrêts d'espèces. En revanche, si un arrêt reçoit cumulativement les 4 lettres (dont le R qui est le plus prestigieux) c’est un arrêt de jurisprudence. \n\nRemarque : La Cour de cassation a mis en place depuis le 1er octobre 2021 une base donnée accessible gratuitement pour porter à la connaissance du public les arrêts qu’elle rend : “judilibre”. Depuis le 21 avril 2022, tous les arrêts rendu par les Cour d’appel, dans les matières civiles, sociales et commerciales, sont également rendu visible.\n\n§2 – La coutume \n\nUne coutume est une règle de droit qui est issue d’un usage général et prolongé, et de la croyance en l’existence d’une sanction en cas de non respect de cet usage.\n\nA) La formation de la coutume \n\nPour qu’un simple usage devienne une coutume (règle de droit ayant une force obligatoire), il faut la réunion d’un élément matériel et psychologique.\n\n1 – L’élément matériel \n\nCet élément existe dès lors que l’usage est répété de manière constante par les individus. Pour que cet usage devienne une coutume (règle de droit), il doit présenter 3 caractères : \nIl doit être durable → doit s’appliquer de façon répétitive depuis plusieurs temps.\nL’usage doit être notoire → doit être connu par toutes les personnes auxquelles il est susceptible de s’appliquer.\nL’usage doit être général → doit être appliqué par toutes les personnes qu'ils visent (question QCM ?).\n\n2 – L’élément psychologique \n\nCet élément existe dès lors que l’usage durable, notoire et général est considéré comme ayant un caractère obligatoire. L'élément psychologique de la coutume consiste donc, dans le sentiment qu’en cas du non-respect de celui-ci, qu’il y a une sanction juridique qui s’applique.\n\nB) Le rôle de la coutume \n\nJusqu’au 15ème siècle, beaucoup de règles étaient coutumières. Une rupture fit opérer lors de l'ordonnance de Montil les Tours de 1454, dans laquelle Charles VII ordonne la rédaction écrite des coutumes.\nCette rédaction fut rendue effective par 2 lettres patentes (= lettres ouvertes) de 1497 et 1498, ainsi que par une ordonnance de Louis XII de 1506. Dès lors, les règles, qui étaient de simples coutumes, deviennent du droit écrit. La codification Napoléonienne a eu pour effet de réunir les règles.\n\nAujourd’hui, notre système juridique est fondé essentiellement sur des sources écrites du droit. Les coutumes continuent néanmoins d'être à l’origine de certaines règles juridiques. \nIl y a 3 catégories de coutumes : \n\n1 - Les coutumes secundum legem \n\nCe sont des coutumes auxquelles le législateur renvoie expressément dans un texte ; le juge doit les appliquer et la loi renvoie. De nombreuses dispositions légales renvoient à des règles coutumières ; tel est le cas de différents articles du Code civil comme les articles 645, 663, 671 et 674. Ces articles posent des règles relatives à la propriété immobilière, tout en affirmant que ces règles ne s’appliquent que si aucune coutume locale applicable, dans le secteur géographique où se trouve l’immeuble, ne prévoit autre chose.\nex → l’article 671 du Code civil affirme qu’il faut se référer aux usages locaux pour déterminer à quelle distance de la limite de propriété les plantations peuvent être faites. Le même article indique que, sauf usage local, aucune plantation ne peut être faite à moins de 50 cm de la limite de propriété ; entre 50 cm et 2 m, tous les arbustes doivent mesurer moins de 2 m de haut. La Cour de cassation a précisé que la distance se mesure entre la limite de propriété et l’axe médian de l’arbre.\n\n2 - Les coutumes praeter legem \n\nCe sont des coutumes qui existent dans des domaines dans lesquels il n’existe aucun texte de droit, elles viennent donc combler les lacunes de la loi. Le juge devra appliquer la règle coutumière ainsi dégagée.\nDu fait de l’inflation législative, il est très rare qu’il y ait des domaines dans lesquels le législateur n’ait rien prévu.\nex → le nom de famille : la loi du 17 mai 2013 a codifié cette règle coutumière à travers l’article 225-1 du Code civil ; au terme duquel chacun des époux peut porter à titre d’usage le nom de l’autre époux, par substitution ou adjonction à son propre nom dans l’ordre qu’il choisit.\n\n3 - Les coutumes contra legem \n\nCe sont des coutumes qui édictent des règles contraires à celles contenues dans la loi. En théorie, de telles règles coutumières doivent être écartées (car le texte de loi dit l’inverse). Cependant, quelques fois la jurisprudence reconnaît la validité de coutume pourtant contraire à la loi car le bon sens le justifie.\nex → le Code civil impose, sous peine de nullité, que toute donation soit faite devant un notaire. Malgré cet article 931, la jurisprudence admet la pratique des dons manuels (= donation par transfert de main à main).\n\n§3 - La doctrine \nLa doctrine est constituée par l’ensemble des opinions émises par des auteurs (comme par exemple des universitaires mais aussi certains praticiens du droit sur des questions de droits). Ces opinions se trouvent dans leurs écrits, ouvrages, chroniques ou notes de jurisprudence. De plus, le pouvoir politique cherche souvent des universitaires pour animer un groupe de travail, pour rendre des rapports sur des thèmes précis qui serviront au gouvernement pour élaborer un projet de loi. \nex → le rapport du professeur Terré sur la réforme des obligations qui a été remis au ministre de la justice a été repris dans l’ordonnance qui a réformé le droit des contrats du 10 février 2016. \n\nLa doctrine n’est pas vraiment une source du droit ; mais par les opinions émises, les auteurs vont influencer les décisions et la Cour de cassation a faire évoluer sa jurisprudence.\n\nChapitre 3 : L’interprétation de la règle de droit \n\nLa règle de droit est générale et impersonnelle ; or, sa finalité est de s’appliquer à des cas concrets. Pour ce faire, il va falloir souvent interpréter la règle. Ce travail d’interprétation va être fait par les magistrats à l’occasion des litiges qui leurs sont soumis, mais aussi par les praticiens du droit dans leur travail de conseil.\nLa doctrine s’associe également à ce travail d’interprétation afin de développer une argumentation favorable ou défavorable à telle ou telle solution jurisprudentielle. Que ce soit les magistrats, les universitaires ou les praticiens, tous s'appuient sur des techniques d’interprétation identiques.\nSection 1 : L'interprétation exégétique \n\nElle est mise en place par l’école de l’Exégèse qui fut un mouvement de pensée très fort dans la communauté juridique au début du XIXème siècle. Les partisans de l’Exégèse ont voué un véritable culte aux différents codes issus de l’Empire :\n\n⇨ Le Code civil (1804).\n⇨ Le Code de Procédure Civile (1807).\n⇨ Le Code du commerce (1808).\n ⇨Le Code pénal (1811).\n\nSelon l’école de l'Exégèse, la codification était une œuvre législative quasi parfaite, et il est nécessaire de maintenir l’interprétation de la loi dans le plus strict respect des articles et des dispositions figurant dans les codes.\nSe traduisant par une étude faite article par article, le professeur Demolombe écrit une œuvre célèbre illustrant parfaitement la méthode d’interprétation exégétique : “Cour de code Napoléon” dont les 31 tomes analysent le Code civil dans l’ordre de l’article 1er au dernier. \n\nL’analyse exégétique ne se limite pas à l’analyse littérale. En effet, pour surmonter les ambiguïtés ou les lacunes d’un texte, les partisans de l'exégèse utilisent deux techniques complémentaires : technique documentaire et rationnelle. (question QCM ?)\n\n§1 - La technique documentaire \n\nLorsqu’un texte pose un problème d’interprétation, la technique documentaire consiste à rechercher l’intention du législateur à travers les travaux préparatoires et les débats parlementaires qui ont précédé l’adoption du texte. \nAujourd’hui encore l’intégralité des débats parlementaires sont publiés au JO, ce qui facilite le recours à la technique documentaire. \n\n§2 - La technique rationnelle \n\nElle consiste à l’utilisation de raisonnements logiques, permettant de déduire d’un texte la règle de droit applicable à un cas qui n’est pas visé dans le texte. \nOn distingue 3 principaux types de raisonnement logique : \nPar analogie  \nA fortiori \nA contrario. \n\nPar analogie → qui conduit à étendre à une situation non prévue par la loi la solution admise pour une situation car dans les 2 hypothèses il y a les mêmes raisons d'adopter cette solution.\nex → l’article 2103 du Code civil accorde au vendeur un privilège qui lui permet d'être payer sur le montant du prix de la vente en priorité par rapport aux autres créanciers de l’acheteur.\nEn raisonnant par analogie, le juge a accordé le même privilège à l'échangisme pour le paiement de la soulte lorsque les deux biens échangés n’ont pas la même valeur.\n\nA fortiori → qui conduit à étendre à une situation non prévue par la loi. La solution admise pour une situation voisine car les raisons sur lesquelles le législateur s’est appuyé se retrouve de façon encore plus forte dans la situation non prévue par la loi.\nex → si la loi du Code civil interdit à un majeur qui est frappé d'incapacité de vendre ses biens pour le protéger. A fortiori, il est aussi interdit de donner ses biens car la donation est plus appauvrissent de vendre. \n\nA contrario → lorsque l’application d’une règle est subordonnée à des conditions précises, on peut en déduire que si ces conditions ne sont pas remplies, c’est la règle inverse qui s’applique. \nex → l’article 6 du code civil dispose que l’on ne peut pas déroger par convention aux lois qui sont d’ordre public. A contrario, cela signifie que si une loi n’est pas déclarée d’ordre public, on peut par convention en écarter l’application. \n\nRemarque : il est possible de raisonner à la fois de façon par analogie et a contrario. Dans le premier cas (par analogie), le juge va appliquer la même solution à la situation visée par la loi et à une situation voisine non visée par la loi. Dans le second cas (a contrario), il appliquera la solution prévue par la loi à la situation visée par la loi et une situation contraire à une situation voisine non visée par la loi. Le fait qu’il ait parfois un revirement de jurisprudence s’explique par le juge qui change de mode de raisonnement.\nSection 2 : L'interprétation par la libre recherche scientifique\n\nA partir du milieu du 19e siècle, la révolution industrielle engendra des bouleversements importants dans les domaines sociaux, économiques et politiques. Dès lors, le postulat de base de l'école de l'exégèse selon lequel la codification était une œuvre législative quasi parfaite vola en éclat. Le juge, les praticiens, les universitaires prirent conscience qu'ils avaient face à eux des textes vieillissants, et que le simple a la méthode exégétique ne permettait pas de les appliquer à des situations que le législateur ne pouvait imaginer à l'époque de la codification. \n\nLe besoin apparu d’admettre une technique d'interprétation plus souple et plus dynamique des textes, c’est ainsi que n’acquis l'école de la libre recherche scientifique. Le maître à pensée est François Gény qui publia en 1899 un ouvrage intitulé Méthode d'interprétation et source du droit positif”.\n\nAlors que l'école du l'exégèse visait à découvrir derrière des textes ce qu’avait voulu faire le législateur, l'école de la libre recherche scientifique cherche à deviner ce que le législateur aurait voulu faire si à son époque la situation nouvelle avait existé.\n\nL’un des premiers arrêts à la fin du 19e siècle à avoir utilisé la méthode de la libre recherche scientifique est l'arrêt Teffaine rendue par la Cour de cassation en 1896. En l'espèce, la chaudière d’un remorqueur avait explosé causant le décès et des blessures graves sur d’autres salariés. Dans cet arrêt, la Cour de cassation créait un régime de responsabilité générale du fait des choses fondé sur l’article 1384 alinéa 1 du Code civil selon lequel on est responsable de dommage causé par les choses que l’on a sous sa garde. \nIl ressort des travaux préparatoires du Code civil que cet alinéa était simplement une phrase de transition servant à passer des deux régimes de responsabilité du fait personnel au régime de responsabilité du fait des animaux prévue à l’article 1385 du Code civil. Pour ne pas laisser la veuve décédée et les salariés invalides, la Cour de cass a donné une valeur à l'article 1384 alinéa 1 pour donner un régime de responsabilité autonome. \n\nC'est également en se fondant sur la même méthode qu’en 1891 la Cour de cassation a déclaré illicite les conventions de mère porteuse en se fondant sur l'article 1128 du Code civil, au terme duquel il n’a que les choses qui sont dans le commerce qui peuvent faire l'objet d’une convention. L'idée d’une mère porteuse n’a jamais été imaginée en 1804. Le juge ne peut pas commettre un déni de justice, il doit trancher. \n\nCette interdiction a été maintenue dans la dernière révision des lois bioéthiques intervenue en 2021. La loi nouvelle contient pour l’essentiel les mesure suivantes : \nL’acces a la PMA est désormais possible pour les femmes célibataires et les couples de femmes homo alors que c’etait reserve aux vouples hetero.\nLes enfants nées d’une PMA pourront à leur majorité accèdaient anonymat a des données non identifiantes concernant le donneur de sperme ou d'ovocytes. Il leur sera même possible de connaître l'identité du donneur si celui-ci a exprimé un accord en ce sens au moment du don. \nToute personne peut désormais congeler ses gamètes en vue de différer sa paternité ou sa maternité même s’il n’y a aucune raison médicale à ça. Pour éviter toute pression sur les salariés notamment les femmes de la part de leur employeur pour différer leur maternite, les parlementaires et la loi interdisent aux employeurs de proposer la prise en charge des frais d'auto conservation des gamètes.\n\nAujourd’hui, le recours aux mères porteuses qui louent le temps d’une grossesse leur utérus, est autorisé notamment en Grande-Bretagne, aux USA, en Roumanie, aux Pays-Bas, en Grèce, etc.\nLes tarifs pour un enfant clé en main via une convention de mère porteuse publiaient par une agence spécialisée dans ce domaine étaient en 2014 de 20 000$ de frais d’agence, 33 749$ d'indemnités versées à la mère porteuse, 7 615$ de frais d’avocat et en tout 61 360$. \nEn Ukraine, il y a 3 packs : \n34 000€ de base \n37 000€\n48 000€ VIP\n\nLorsque un couple français utilise à l’étranger les services d’une mère porteuse, ils se posent ensuite la question de la transcription sur l'état civil du gain de filiation. Dans 2 arrêts rendus le 3 juillet 2015, la Cour de cassation a affirmé que la transcription doit être autorisée même si la pratique de mères porteuses est contraire à l'ordre public français. Dans 2 autres arrêts rendus le 18 décembre 2019, la Cour de cassation a consacré le principe d’une double filiation monosexuée, l’enfant ayant 2 papa à l'état civil.\n\nAujourd’hui, le juge, les praticiens et les universitaires utilisent les 2 techniques, s'inspirant de l'école de l'exégèse notamment pour les textes récents. Ils vont rechercher quelle était la volonté du législateur en utilisant à la fois la technique documentaire et la technique rationnelle. Lorsque cette recherche s'avère vaine, il va faire œuvre d'imagination pour déduire d’une règle législative d’une solution non envisagée à l'époque de la rédaction de la règle."}, {"title": "Partie 2 : Les droits subjectifs", "text": "**PARTIE 2 : Les droits subjectifs.&#xA0;**\n\n\n\nLes droits subjectifs sont les prérogatives individuelles qu’une personne physique ou morale tire d’une règle de droit objective. L’exercice de ces prérogatives est garantie par l'Etat. En ce sens que toutes personnes / sujets de droit dont le droit subjectif est bafoué, peut agir en justice pour le faire respecter.\n\n\n\n**Titre 1 : La classification des droits subjectifs.**\n\n\n\nIl y a différents droits subjectifs : \n\n- droits patrimoniaux \n- droits extrapatrimoniaux\n\nOn qualifie de droits patrimoniaux les droits subjectifs qui ont une valeur pécuniaire et qui entrent dans la composition du patrimoine d’une personne. Il s'agit par exemple du droit de propriété, de créance (permet au créancier d’exiger du débiteur qu’il le paye). Les droits patrimoniaux sont cessibles, transmissibles pour cause de mort et sont saisissables par les créanciers du titulaire du droit. \n\n\n\nOn qualifie de droits extrapatrimoniaux les droits subjectifs qui n’ont pas de valeur pécuniaire, cad pas évaluable en argent. Ils n’entrent pas dans la composition du patrimoine comme celui du droit de vote, au respect de la vie privée ou encore du droit à l’honneur, etc. Ils sont incessibles, intransmissibles pour cause de mort et sont insaisissables.\n\n\n\n***Chapitre 1 : Les droits patrimoniaux&#xA0;***\n\n\n\nIl faut analyser les principaux patrimoniaux et d’autre part, voir le patrimoine/ le contenu dans lequel il s'insère.\n\n\n\n***Section 1 : Les principaux droits patrimoniaux&#xA0;***\n\n\n\n**§1 – Les droits personnels&#xA0;**\n\n\n\nOn parle de droits personnels comme des droits de créance → il s’agit du droit qu’a une personne (le créancier) d’exiger d’une autre personne (le débiteur) l’accomplissement d’une prestation. Ce droit met en relation 2 personnes dont le créancier qui est le sujet actif du droit et ensuite le débiteur qui est le sujet passif du droit. \n\n\n\nLa prestation à laquelle s’engage le débiteur peut être de 3 types : \n\n- transférer la propriété d’une chose (propriété d’une somme d'argent, ou propriété d’un bien). \n- peut consister en l'obligation de faire quelque chose. Les contrats, qui font naître des obligations de faire, sont fréquents. \n\n*ex → dans le contrat d'entreprise, l'entrepreneur s’oblige à faire qqchose et le maître de l’ouvrage s’oblige à transférer le prix de la prestation.&#xA0;*\n\n- La prestation peut consister en l’obligation de ne pas faire quelque chose. LEs contrats dans lesquelles apparaissent une obligation ne pas faire quelque chose sont très rares. Dans ce cas, le débiteur s’engage à s’abstenir de certains actes. \n\n*ex → dans le contrat du travail, il y a souvent stipuler une clause dite de non concurrence par laquelle le salarié s'oblige, après la rupture du contrat de travail, à ne pas aller travailler dans une entreprise concurrente.* La jurisprudence admet la validité des clauses de non concurrence à condition que cela soit limité dans l’espace, dans le temps et qu’il y ait une contrepartie financière versée au salarié lors de la rupture du contrat de travail.   \n\n\n\n**§2 – Les droits réels&#xA0;**\n\n\n\nLes droits réels sont les droits d’une personne qui peut exercer sur une chose. On distingue 2 catégories de droits réels : \n\n- les droits réels principaux qui permettent à leur titulaire d’agir sur la chose. Le plus important des droits réels principaux est le droit de propriété. Il comprend le droit d’utiliser la chose (usus) et comprend d'en tirer des fruits et des revenus (fructus), le droit d'en disposer de la chose (abusus). Le droit de propriété est le droit le plus complet qu’une personne puisse avoir sur une chose, ce droit peut faire objet de démembrement en ce sens que certaines des proeogartibes vont etre attribuer a une personne de maniere isoler. Les droit réels qui correspondent à un démembrement du droit de propriété sont également des droits réels principaux   \n\n*ex → c’est le cas de l’usufruit qui donne à l'usufruitier l’usus et le fructus, l’abusus restant entre les mains d’une personne appelé le nu-propriétaire.&#xA0;*\n\n*ex → les servitudes permettent à un partenaire d’un fonds d’user de certaines prérogatives attachées au droit de propriété sur le fonds voisin. Ce sont des droits réels démembrés.&#xA0;*\n\n- les droit réels accessoires n’ont pas d’existence propre mais qui se conçoivent seulement comme l’accessoire d’un droit personnel. En général, le droit personnel garantie et consiste dans le,paiement d’une somme d’argent et les droits réels accessoires consistent en hypothèque, gage ou nantissement. Lorsque le titulaire d’un droit de créance détient en plus un droit réel accessoire pour garantir sa créance, il est dans une situation privilégiée si le débiteur ne paie pas. En effet, il peut procéder à la saisie du bien qui vient garantir sa créance, le faire vendre aux enchères et être payé en priorité sur le prix de vente par rapport aux autres créanciers appelés les créanciers chirographaires. \n\n\n\n**§3 – Les droits intellectuels&#xA0;**\n\n\n\nIl y a 2 catégories de droits intellectuels : \n\n- les droits intellectuels liés à une œuvre de l’esprit. \n\n*ex → le création d'une œuvre littéraire ou artistique confère à son auteur des droits d’auteurs, selon l'article **L123-1 du Code de la propriété intellectuelle (CPI)**, il a le droit de retirer des revenus de l'exploitation de son œuvre durant toute sa vie. Ce droit est transmissible aux héritiers de l'auteur de l'œuvre artistique ou littéraire, qui pourront, pendant 70 ans à compter du décès, continuer a exploiter / tirer des revenus de l'œuvre du défunt. Le point de départ de ces délais est le 1er janvier qui suit l'année civile du décès. Toutes les œuvres écrites par des auteurs, décédés au cours de l'année 1955, tombent donc dans le domaine public à compter du 1er janvier 2026.&#xA0;*\n\n\n\nIl existe d’autres droits intellectuels rattachés aux œuvres de l’esprit dans le domaine de la science, de l’industrie et du commerce. Ces droits sont constatés et protégés par des brevets, par des certificats d'utilité, par des dessins et modèles ou encore par des marques déposés à **l'INPI** (**I**nstitut **N**ational de la **P**ropriété **I**ndustrielle). \n\n\n\n- les droits intellectuels liés à une activité professionnelle. Tel est le cas de la clientèle commerciale et de la clientèle civile qui peut être cédée moyennant finance.\n\n*ex → un kiné ou un médecin peut céder sa clientèle. Lorsqu'un kiné vend sa clientèle, il vend sa présentation (il cède sa clientèle à un tiers).&#xA0;*\n\n\n\n**Remarque** : les droits intellectuels sont par certains aspects des droits mixtes, en ce sens ils ont une dimension patrimoniale mais ils ont aussi une dimension extrapatrimoniale car l’auteur d’une œuvre a un droit moral sur celle-ci qui lui permet de s’opposer à ce que l’oeuvre soit utilisé dans un contexte qui lui deplait. \n\n\n\n***L’article L121-1 du Code de la propriété intellectuelle*** affirme que ce droit moral est perpétuel, inaliénable et imprescriptible. \n\n*ex → dans un arrêt du 28 janvier 2003, la Cour de cassation a estimé que ce droit moral permettait à Gilbert Montagné de s’opposer à la reprise de l'air de sa chanson par les restaurants Flunch dans une chanson avec comme air “on va fluncher”.&#xA0;*\n\n\n\n**Le droit moral est également transmissible aux héritiers de l’auteur décédé.**\n\n*ex → dans un arrêt du 31 mars 2004, la Cour d’appel de Paris a permis à Pierre Hugo (descendant de Victor Hugo) d’invoquer le droit moral de VH sur son oeuvre “Les Misérables” pour s’opposer à la publication, par les éditions Plomb, d’un roman présenté comme étant la suite “Des Misérables”.*\n\n\n\n**Remarque** : Aujourd’hui, sur Internet, il y a chaque jours des milliers, voire des centaines de milliers, de téléchargements et de fichiers qui sont protégés par les droits d’auteur qui sont quand même téléchargés illégalement. Juridiquement, le fait de télécharger de manière illégale un fichier constitue le délit de contrefaçon qui est punissable de 3 ans d'emprisonnement et de 300 000€ d’amendes par ***l’article L335-2 du Code de la propriété intellectuelle (CPI).&#xA0;***\n\n*ex → c’est ainsi que le tribunal correctionnel de Saintes a condamné le 4 octobre 2012 à 176 000€ de dommages et intérêts et à 6 mois de prison avec sursis un étudiant en informatique, qui avait à 24 ans, créé une plateforme proposant 2 000 films en streaming.*\n\n*ex → dans un arrêt du 12 avril 2023, un hébergeur qui exploité un site permettant à des internautes de déposer et de partager des liens de téléchargements vers des jeux vidéos a été condamné à verser 400 000€ de dommages et intérêts à Nintendo.*\n\n\n\nLe **12 juin 2009 et le 28 octobre 2009** ont été adoptées les lois dites HADOPI, avec un nouvel arsenal répressif contre les internautes indélicats. Ces deux lois ont mis en place une autorité qui est chargée de traquer les internautes indélicats, autorité qui est la **H**aute **A**utorité pour la **D**iffusion des **O**euvres et la **P**rotection des **D**roits sur **I**nternet. L’HADOPI a fonctionné en France jusqu'au 1er janvier 2022. Depuis cette date, L’HADOPI est le conseil supérieur de l'audiovisuel, qui avait été créé en 1989, ont fusionné pour donner naissance à **l’ARCOM** (**A**utorité de **R**égulation de la **C**ommunication **A**udiovisuel et **N**umérique). Les agents assermentaient de l’HADOPI ont intégrés l’ARCOM, la mission de ces agents est de traquer les adresses IP mettant à la disposition des internautes des fichiers ou même les simples utilisateurs qui téléchargent des fichiers.\n\nLe principe est, pour l’ARCOM (comme c'était le cas de l’HADOPI), est de la réponse graduée avec 3 étapes : \n\n- ***Face à un internaute qui télécharge illégalement un fichier***, l’ARCOM commence par dresser un courriel nominatif mettant en garde l'internaute (sachant que depuis le 1er juillet 2005 il y a aussi une lettre envoyée par la poste). Entre le 1er octobre 2010 et le 31 décembre 2021, l'HADOPI a envoyé 14 millions de courriels de ce type.\n- ***L’ARCOM classe alors l’adresse IP de l'internaute indélicat sous surveillance***. Si l’ARCOM constate un second téléchargement illégal pratiqué dans les 6 mois, il envoie un second courriel doublé d’une lettre recommandée sachant qu’entre le 1er octobre 2010 et le 31 décembre 2021, l’HADOPI a envoyé environ 1 millions de lettres recommandées avec accusé de réception. \n- ***L'adresse IP de l'internaute indélicat est alors placée sous surveillance pendant 1 an***. Si l’ARCOM constate un nouveau téléchargement illégal pendant cette année, l’ARCOM se réunit en commission et décide de transmettre ou non le dossier au procureur de la République. Entre le 1er octobre 2010 et le 31 décembre 2021, il y a eu environ 4 000 dossiers qui ont été transmis au procureur de la République pour poursuites pénales. Le juge statue selon la procédure simplifiée de l'ordonnance pénale sans qu’il y ait de débat contradictoire avec l'internaute indélicat. L'internaute recevra chez lui l'ordonnance l'informant de la peine prononcée contre lui et a un délai d’1 mois pour faire opposition s’il le veut et ce qui lui permettra de comparaître devant un tribunal pour être entendu dans ses explications. L’ARCOM détient d’autres pouvoirs qui n’ont rien à voir avec la protection des droits intellectuels, elle est chargé de : \n  - lutter contre la diffusion de fausses informations en ligne en particulier sur les réseaux sociaux et les plateformes numériques.\n  - superviser l’observatoire de la haine en ligne pour analyser et lutter contre les discours de haine sur Internet, et saisir le procureur de la République en cas de besoin.\n  - veiller à ce que les médias audiovisuels et numériques respectent la pluralité des opinions. Et lors des périodes électorales, elle veille à ce que le temps de parole des différents candidats soit égal. \n\n\n\n***L’ARCOM attribue les 15 fréquences disponibles pour la diffusion gratuite sur la TNT.&#xA0;***\n\n\n\nSi les téléchargements de fichiers dont on n’a pas acquis régulièrement les droits d'auteur sont interdits, en revanche les ***articles L122-5 et L213-1 de la CPI*** mettent en place au profit de la personne qui détient régulièrement des droits d’auteurs, ce qu’on appelle ***l’exception de copie privée***. L’exception de copié privée permet à cette personne de reproduire le fichier et de le diffuser en toute légalité au sein de son cercle familial ou d’amis. Aujourd’hui, la plupart des fichiers sont protégés par un DRM qui est un procédé technique interdisant à faire une copie. \n\n*ex → le problème s’est posé, de savoir si en interdisant un DRM, le producteur portait atteinte à l’exception de chipie privé et devait ou non indemniser la personne qui avait acheter le DVD. Plusieurs décisions des juges du fond ont été dans ce sens. Cependant, la Cour de cassation a affirmé dans un arrêt du 28 février 2006, que l'utilisation d’un DRM empêchant la copie d’un DVD, ne permettait pas d’obtenir réparation / indemnisation pour atteinte due à sa vie privée.*\n\n\n\n***Section 2 : La notion juridique de patrimoine&#xA0;***\n\n\n\nLe patrimoine est un contenant qui regroupe l'ensemble des droits et des obligations appartenant à une personne et ayant une valeur pécuniaire.\n\nTout patrimoine comporte un actif et un passif. A l'actif du patrimoine, on y trouve des droits réels dont la personne est titulaire par ses droits personnels, dans lesquels la personne apparaît côté créanciers et droits intellectuels.\n\nLe passif du patrimoine est constitué par l'ensemble des dettes de l'intéressé, c’est-à-dire par l'ensemble des droits personnels dans lesquels elle apparaît côté débiteur.\n\n\n\nLa théorie du patrimoine reposait jusqu'à récemment sur trois règles :\n\n- Toute personne physique ou morale a un patrimoine. Car le patrimoine est un simple\n\ncontenant qui peut être vide (*ex → le nouveau-né à la naissance*), ou avoir dans certains cas plus de passifs que d'actifs. Cette règle est toujours valable aujourd'hui.\n\n- Toutes personnes physiques ou morales n'a en principe qu'un seul patrimoine, il résulte de ***l'article 2284 du Code civil*** que tout l'actif du patrimoine répond du passif. Ce qui signifie que les créanciers impayés peuvent saisir l'un quelconque des biens qui se trouvent à l'actif du patrimoine. Cette règle a été abandonnée par une **loi du 14 février 2022**, relative à l'activité professionnelle des indépendants. La mesure phare de cette loi a été de doter les entrepreneurs individuels à compter du 14 mai 2022 sans qu'ils aient la moindre démarches à effectuer de deux patrimoines.\n\n***Premier patrimoine*** : un patrimoine professionnel comprenant les biens droits et obligations utile à son activité professionnel destiné en cas d'impayé à désintéresser les créanciers dont la créance est née à l'occasion de l'activité professionnelle.\n\n***Deuxième patrimoine*** : un patrimoine personnel comprenant les autres biens de droits et d’obligations destinées à satisfaire les créanciers dont la créance est née à l'occasion de leur activité professionnelle.\n\n- Tout patrimoine appartient à une personne, il n' y a pas de patrimoine sans titulaires. Cette règle est encore valable aujourd'hui. Au décès d'une personne, le patrimoine était le sien et disparaît en tant que contenant et les éléments tant actifs que passifs qui étaient dedans se trouvent transmis aux différents héritiers dès l'instant du décès au patrimoine des différents héritiers.\n\n\n\n***Chapitre 2 : Les droits extrapatrimoniaux&#xA0;***\n\n\n\nLes droits extrapatrimoniaux sont des droits qui ne peuvent pas être évalués en argent, et ne sont pas susceptibles d'une évaluation pécuniaire. Et qui par conséquent n'entre pas dans la composition du patrimoine. Ses droits présentes trois caractères: incessibles (ne peuvent pas être cédé du vivant de l'individu), intransmissible pour cause de mort et insaisissable.\n\n***Trois catégories de droit extrapatrimoniaux*** : \n\n- Les droits dit politique parmi lesquels figure le droit de vote et le droit de se présenter au suffrage universel ou autre suffrage.\n- Les droits dit familiaux parmi lesquels on trouve le droit pour les parents d'exercer sur les enfants les prérogatives liées à l'autorité parentale.\n\n*ex → le droit pour les grands-parents d'entretenir des relations personnelles avec leurs petits-enfants = **article 371-4 du Code civil**.*\n\n- Les droits dit de la personnalité qui ont pour but de protéger la personne à la fois dans son aspect physique et moral.\n\n\n\nAujourd'hui, l'âge de raison dépend de si l'enfant à la capacité de discernement et une quelconque maturité (avant c'était 13 ans).\n\n\n\n***Section 1 : Les droits de la personnalité protégeant l'aspect physique de la personne.&#xA0;***\n\n\n\nToutes personnes à le droit au respect de son intégrité corporel, cette règle se trouve garantie par plusieurs dispositions du code pénal qui sanctionnent les différentes atteintes qui peuvent être porté à l'intégrité corporel d'un individu (blessure volontaire, homicide volontaire, meurtre, agression sexuelle..). Depuis **deux lois bioéthiques du 29 juillet 1994** révisé déjà, à trois reprises, révisé successivement le **6 août 2004**, le **7 juillet 2011** et le **2 août 2021,** ces lois seront prochainement révisées. Ce principe est affirmé dans le Code civil, ces lois ont créé deux nouveaux chapitres dans le Code civil dont un intitulé: du respect du corps humain.\n\n\n\nCes deux chapitres contiennent les ***articles 16 à 16-13 du Code civil***, \n\n***l'article 16*** affirme que la loi assure la primauté de la personne, interdit toutes atteintes à la dignité de celle-ci, et garantie le respect de l'être humain dès le commencement de sa vie. Ce texte ne définit pas le point de départ de la vie de l'être humain; ce qui ne permet pas d'affirmer qu'il donne un droit subjectif à l'embryon en le considérant comme une personne juridique.\n\n***L'article 16-1 du Code civil*** précise que chacun a le droit au respect de son corps et déclare le corps humain inviolable.\n\n***L'article 16-1-1 du Code civil*** affirme que le respect dû au corps humain ne cesse pas avec la mort. C'est en se fondant sur cet article que la cour de cassation a interdit dans un arrêt du 16 septembre 2010 l'exposition intitulé \"à corps ouvert\" qui présentait des cadavres, organes humains et tissus humains soit disant pour une finalité pédagogique et scientifique.\n\nLa cour affirme dans cet arrêt que \" l'exposition de cadavres, de tissus humains à des fins\n\ncommerciales contrevient aux dispositions de ***l'article 16-1-1 du Code civil*** selon lequel les restes d'une personne décédée doivent être traités avec respect, dignité et décence.\n\n\n\nDans un arrêt rendu le 29 juin 2017, la Cour d'appel de Douai a rappelé que tous les éléments du corps humain sont dignes de protection et à condamner une entreprise de pompe funèbre qui avait suite au suicide d'une personne par arme à feu récupéré le cadavre tout en laissant sur les lieux du cadavre plusieurs bouts de chair qui s'étaient désolidarisés du fait de l'explosion.\n\n***L'article 16-3*** indique qu'il ne peut être porté atteinte à l'intégrité du corps humain qu'en cas de nécessité médicale. Et que même dans ce cas, le consentement préalable de l'intéressé est en principe nécessaire.\n\n\n\n***(DANS LE QCM)&#x20;***&#x44;ans un arrêt du 16 août 2002 le conseil d'état a admis qu'un médecin puisse passer outre le refus d'un témoin de Jéhovah puisse recevoir à l'occasion d'une opération à deux conditions:\n\n- La transfusion sanguine doit être indispensable à la survie de l'individu.\n- Le médecin doit avoir tout mis en œuvre pour convaincre le patient d'accepter les soins indispensables.\n\nLe droit au respect de l'intégrité corporel de l'individu étant extrapatrimonial la loi du 1994 affirme à plusieurs reprises le caractère hors commerce du corps humain.\n\n\n\n***L'article 16-1 du Code civil dernier alinéa (in fine)*** qui affirme le corps humain, ses éléments et produits ne peuvent pas faire l'objet d'un droit patrimonial. \n\nC'est notamment en se fixant sur cette disposition que le Tribunal de Grande Instance de Rennes a le 15 octobre 2009 refusé la demande de restitution du sperme de son mari décédé faite par une veuve. Elle voulait continuer seule le projet d'un enfant.\n\nLe sperme est un produit du corps humain sur lequel la veuve n'est titulaire d'aucun droit\n\npatrimonial, le TGI motive sa décision en affirmant que l'AMP (assistance médicale à la procréation) est destiné à répondre à la demande d'un couple, que l'homme et la femme formant le couple peuvent être vivant et que fait obstacle à l'insémination et même le transfert d'un embryon le décès d'un d'entre eux.\n\nLa **loi du 7 juillet 2011** qui réduisent les lois bioéthiques maintient l'interdiction de la procréation post mortem. La **loi du 2 août 2021** portant fait de même (reste sur cette lignée).\n\n\n\nLe Conseil d'état a cependant ordonné dans un arrêt du 31 mai 2016 l'exportation de gamètes d'un homme décédé (détenu par un sekos français) vers l'Espagne à la demande de la veuve qui voulait poursuivre le projet parental en Espagne où ils acceptent.\n\nS'est affirmé également à ***l'article 16-5*** au terme duquel les conventions ayant pour effet de conférer une valeur patrimoniale au corps humain à ses éléments ou produits sont nuls.\n\nEn ce qui concerne la prostitution, pendant longtemps elle était autorisé en France sachant que seule la prostituée encourt une peine en cas de racolage actif c’est-à-dire si par une attitude incitative elle suscitait le client pour avoir une relation sexuelle avec lui.\n\n\n\nUne **loi du 13 avril 2016** a changé la donne car elle sanctionne le client qui en rémunérant un acte sexuel est punissable d'une amende pouvant aller jusqu'à 1500 euros. La récidive constitue un délit punissable d'une amende allant jusqu'à 3750 euros. Un stage de sensibilisation à la lutte contre l'achat d'actes sexuels peut être pris en compte par le juge. Il y a actuellement 37 000 personnes qui se livrent à la prostitution (85% Femmes et 15% Hommes pour un chiffre d'affaire annuel à 3,2 M d'euros en 2018). Actuellement il y a 1300 condamnations par an en France. Plusieurs associations (le planning familial, médecin du monde) ont saisi le Conseil constitutionnel le 13 novembre 2018 d'une QPC pour que le Conseil constitutionnel déclare la pénalisation du client contraire à la Constitution. Ces associations prétendaient que pénaliser le client en cas d'acte sexuel entre adulte consentant se déroulant dans un lieu privé était une atteinte au respect de la vie privée des\n\nprostituées et une atteinte à la liberté d'entreprendre. Dans une décision rendue le **1er février 2019**, le Conseil constitutionnel a estimé que la pénalisation du client est conforme à la Constitution.\n\n\n\nSelon ***l’article 16-7 du Code civil*** prévoit que toute convention portant sur la procréation ou la gestation pour le compte d’autrui est nulle. Cet article interdit donc les conventions de mères porteuses. Dans la mesure où de telles conventions sont légales comme par ex aux USA, cela pose le problème de la filiation d’un enfant issu d’une convention de mères porteuses conclus entre un couple français et une femme américaine.\n\n\n\nDans 3 arrêts rendus le 6 avril 2011, la Cour de cassation a refusé d'établir ce lien de filiation. La CEDH a condamné la France par 2 arrêts rendus le 26 juin 2014 en considérant que cette jurispurednec cree une discrimination engre les enfants. D'où le revirement opéré par la Cour de cassation dans 2 arrêts du 3 juillet 2015. Désormais un enfant né a l’etranger issu des conventions de mères porteuses pourra voir le lien de filiation établie avec ses parents français. \n\n\n\nOn ne peut pas déduire que ces 3 textes sur les conventions portant sur le corps humain sont toutes interdites. De telles conventions sont parfois autorisés selon 2 conditions : \n\n- Elles doivent avoir un **caractère gratuit**, cela se déduit par ***l’article 16-6 du Code Civil*** au terme duquel : “*aucune rémunération ne peut être alloué à celui qui se prête à une expérimentation sur sa personne, aux prélèvements d'éléments de son corps ou à la collecte de produits de celui-ci*”. Le don de sang / de gamètes est par exemple possible à titre gratuit. **Si le principe de la gratuité est affirmé pour les recherches biomédicales, les textes admettent néanmoins le versement d’une indemnisation en raison des contraintes subies aux personnes qui se prêtent aux recherches.** **Le montant total des indemnités perçue en 12 mois ne peut pas dépasser 4 500€, le but est d'éviter des cobayes professionnels (attention question QCM possible).&#xA0;**\n- Les conventions doivent garantir l’anonymat entre les parties à la convention. En effet ***l’article 16-8 du Code civil*** dispose qu'aucune information permettant d’identifier à la fois celui qui a fait don d’un élément (organes) ou d’un produit (spermatozoïdes, lait maternel, cheveux...) et celui qui l’a recu ne peut être divulgué. Depuis la réforme de 2021 des lois bioéthiques, en cas de dons de gamètes, l’enfant issu de la PMA a le droit de connaître l'identité du donneur à sa majorité et plus aucun don du gamète n’est possible sans que le donneur le consent à ce que ses données d’identité soient communiquées à l’enfant issu du don une fois majeur .\n\n\n\n***Section 2 : Les droits de la personnalité protégeant l'aspect moral de la personne.&#xA0;***\n\n\n\nDe nombreux droits extrapatrimoniaux sont affirmés dans de textes internationaux présentés comme garantissant les droits de l’homme. \n\nex → le cas de la Convention de sauvegarde des droits de l’homme et des libertés fondamentales signée à Rome le 4 novembre 1950.\n\nex → c’est aussi le cas de la convention de New York du 1er mars 1980 sur l'élimination de toute forme de discriminations à l'égard des femmes. \n\n\n\nLes droits de l'être humain sont le droit à la liberté de conscience et d’opinion, à l'honneur, à présomption d'innocence, à la nationalité, à la protection de la vie privée, à l’absence de discriminations fondees sur le sexe, la couleur de peau, la religion. Ces différents droits de la personnalité visent à protéger l'être humain dans sa dimension morale. Leur nature extrapatrimonial n’est pas incompatible avec l’octroi de dommages intérêts lorsqu’ils sont violés.\n\n\n\nDans un jugement du 26 octobre 2018, le TGI de Paris a condamné Anthony Delon a versé 8 000€ a la femme de Hallyday pour avoir publié sur son compte Instagram une photo prise dans la rue où on voit Laetitia se promenant au bras du manageur de Johnny avec comme commentaire : “cela fait déjà 3 ans”. \n\n\n\nLe droit au respect de la vie privée peut même être monnayé, ce qui le rend évaluable en argent. Néanmoins, le droit au respect de la vie privée reste de nature extrapatrimonial comme le montre un arrêt du 14 décembre 1999 écrit par le Docteur Gubler qui révélait que Mitterrand souffrait d’un cancer dès son premier septennat. Après la sortie du livre de Gubler, sa veuve entend obtenir réparation du préjudice résultant d’une atteinte au respect dû à la vie privée de Mitterrand. La Cour de cassation déboute la veuve de Mitterrand de sa demande en se fondant sur le caractère extrapatrimonial du droit au respect de la vie privée, faisant que en tant que héritière, Danielle Mitterrand n’avait acquis que les droits patrimoniaux de son défunt mari (**le droit au respect de la vie privée cesse au moment de la mort de l'intéressé, les héritiers ne peuvent pas agit au nom du definut car c’et un droi qui n’est pas transmis**).\n\n\n\n**Titre 2 : La source des droits subjectifs&#xA0;**\n\n\n\nLes droits objectifs trouvent leur fondement dans l'existence d’une règle de droit objective. Cependant, pour qu’un droit subjectif découle de cette règle, il faut un fait déclencheur qui peut consister soit en un acte juridique ou en un fait juridique. \n\n\n\n***Acte juridique*** : une manifestation de volonté destinée à produire des effets juridiques / de droit.  \n\n*ex → contrat, convention collective, testament.*\n\n\n\n***Fait juridique*** : tout événement susceptible de produire des effets de droits \n\n*ex → la naissance, la majorité, la retraite, le décès.&#xA0;*\n\n\n\n\n\n***Chapitre 1 : Les actes juridiques&#xA0;***\n\n***Section 1 : La classification des actes juridiques&#xA0;***\n\n**§1 –Les actes multilatéraux et les actes unilatéraux&#xA0;**\n\n\n\nL’acte juridique est dit multilatéral lorsqu’il résulte de la volonté de plusieurs personnes. A contrario, s’il résulte de la volonté d'une seule personne c'est dire unilateral.\n\n\n\n**A) Les actes multilatéraux&#xA0;**\n\n\n\nLes actes multilatéraux portent le nom de conventions. **On distingue 4 types de&#xA0;**\n\n**conventions :&#xA0;**\n\n- ***les conventions constitutives*** dont l’objet est de créer des droits réels ou personnels (*ex → convention par lequel une personne accorde une servitude de passage à un voisin sur son terrain*).\n- ***les conventions translatives*** dont l’objet est d'opérer le transfert de la propriété d’une chose entre 2 personnes. (*ex → contrat de vente*).\n- ***les conventions extinctives*** dont l’objet est d'entraîner l'extinction d’un droit personnel (*ex → une remise de dettes*).\n- ***les conventions déclaratives*** dont l’objet est de constater l'existence d’un droit préexistant (*ex → convention de partage signé entre les héritiers qui met fin à l’indivision successorale*)\n\n\n\n**B) Les actes unilatéraux&#xA0;**\n\n\n\nLes actes unilatéraux sont les manifestations de volonté destinées à produire des effets de droit qui ont pour origine la volonté d’une seule personne. Ils sont plus rares que les actes multilatéraux. \n\n*ex → le testament est l’acte juridique par lequel une personne désigne ceux qui hériteront de ses dettes.&#xA0;*\n\n*ex → la reconnaissance d’enfant qui crée des droits et des obligations entre l’auteur de la reconnaissance et l’enfant.&#xA0;*\n\n*ex → l’abandon est l’acte juridique par lequel une personne renonce à son droit de propriété sur une chose (**attention question QCM possible !!!!).***\n\n\n\n***Remarque*** : il ne faut pas confondre l’acte juridique unilatéral, où une seule volonté s’exprime, avec le contrat unilatéral qui comme tout contrat suppose l’accord de 2 ou plusieurs volontés. Le contrat unilatéral s’oppose aux contrats synallagmatiques. \n\n\n\n***Un contrat unilatéral*** : contrat dans lequel une seule des 2 parties souscrit un engagement vis-à-vis de l’autre. Tel est le cas du cautionnement par lequel une personne s’engage vis-à-vis d’un créancier à payer les dettes d’un débiteur principal si ce dernier ne les payes pas lui-même. \n\n\n\n***Un contrat synallagmatique*** : contrat qui crée des obligations réciproques entre les parties (*ex → contrat de vente, de travail*). \n\n\n\n**§2 – Les actes conservatoires, les actes d’administration et les actes de disposition&#xA0;**\n\n\n\nLes actes juridiques peuvent avoir des conséquences plus ou moins graves sur la composition du patrimoine de celui qui les accomplit.\n\n\n\n**A) Les actes conservatoires&#xA0;**\n\n\n\nLes actes conservatoires consistent en l’accomplissement d’une formalité indispensable pour éviter la perte d’un droit. La finalité de l’acte juridique est donc de conserver la valeur du patrimoine de celui qui les accomplit. \n\nex → suite à un accident, le fait de faire une déclaration de sinistre à son assureur est un acte juridique conservatoire. \n\n\n\n**B) Les actes d’administration&#xA0;**\n\n\n\nLes actes d'administration sont ceux qui sont nécessaires à la gestion courante des biens du patrimoine ainsi que ceux qui permettent de le faire fructifier sans en compromettre la valeur. \n\n*ex → vendre des récoltes, encaisser des loyers, faire des travaux d’entretien sur un bien…*\n\n\n\n**Remarque (attention question QCM possible !!!)** : traditionnellement, le fait de consentir un bail sur un immeuble était considéré comme un simple acte d’administration. Aujourd’hui, la législation donne au locataire de nombreux droits si bien que le bailleur ne peut plus reprendre la jouissance de son bien que dans des conditions très strictes et onéreuses. C’est pourquoi le fait de consentir certains baux constitue un acte de disposition. \n\n*ex → le fait de consentir un bail commercial, le fait de consentir un bail emphytéotique (bail d’une durée comprise entre 18 ans et 99 ans), le fait de consentir un bail meublé…*\n\n\n\n**C) Les actes de disposition**\n\n\n\nLes actes de disposition sont ceux qui portent atteinte ou risquent de porter atteinte à la valeur du patrimoine. \n\n*ex → toute vente d’un bien, de consentir à une hypothèque, d’emprunter une somme d’argent, d’apporter un bien à une société…*\n\n\n\n**§3 – Les actes à titre gratuit et les actes à titre onéreux&#xA0;**\n\n\n\nUn acte est dit à titre onéreux lorsque chacune des parties reçoit quelque chose en contrepartie de ce qu’elle fournit elle-même. Cette contrepartie peut être un bien (comme dans la vente) ou un service (comme dans le contrat de travail). Dans ces deux contrats (de vente et de travail), l’acheteur et l’employeur vont, en l'échange de ce qu'ils reçoivent, verser aux vendeurs ou salariés une somme d’argent.\n\n\n\nUn acte est dit à titre gratuit lorsqu’une seule des parties procure à l’autre un avantage sans rien recevoir en échange (*ex → la donation, le prêt d’argent sans intérêt*). \n\n\n\n***Section 2 : La validité des actes juridiques&#xA0;***\n\n\n\nUn acte juridique ne va créer des droits supplétifs qu'à condition d'être valable. L’article 1128 du Code civil énumère les différentes conditions de validité. \n\n\n\n**§1 - Les conditions de validité&#xA0;**\n\n\n\n***L’article 1128 du Code civil*** énumère 3 conditions qui doivent être remplis pour qu’un acte juridique soit valable : \n\n- ***1ère condition*** : les parties à l’acte juridique doivent y avoir consenti et leur consentement ne doit pas être vicié sachant qu’il y a 3 vices du consentement qui sont ***la violence, l’erreur et le dol***. Il y a ***violence*** lorsque l’une des parties a été contrainte par l’autre à passer contrat. Il y a ***erreur*** lorsque l’une des parties se trompe sur l’un des éléments importants du contrat. Il y a ***dol*** lorsque l’une des parties est trompée par l’autre sur un élément important du contrat. **(question de QCM possible !!!)**\n- ***2ème condition*** : les parties à l’acte ne doivent pas être frappées d’une incapacité d’exercice. Cela pose probleme pour les actes juridiques accomplis soit par des mineurs, soit par la femme mariée (avant 1938), soit par des majeurs incapables. Dans ces hypothèses, les actes juridiques devront être passés au nom de l’incpable par son représentant légal. \n- ***3ème condition*** : l’objet de l’acte juridique doit être licite et certain. Dans les contrats unilatéraux, ***l’objet est unique***. \n\n*ex → le donateur s’oblige à transférer la propriété de la chose donnée.&#xA0;*\n\nDans les contrats synallagmatiques, ***l’objet est double***. Pour qu'un acte juridique soit valable, ***l’objet doit présenter 3 caractères*** : \n\n- Il doit être déterminé ou déterminable au moment de l’engagement / échange des consentements. Les parties doivent savoir à quoi ils sont tenus. \n- ***L’article 1163 du Code civil*** exige que l’objet du contrat soit possible. A l’impossible, nul n’est tenu. \n- L’objet doit être licite. Les obligations que crée le contrat ne peuvent pas être contraires à l’ordre public ou aux bonnes moeurs. \n\n\n\n**§2 - La nullité en cas d'inobservation de ces conditions&#xA0;**\n\n\n\nL’acte juridique qui serait passé sans respecter les 3 conditions du supra (les conditions qu’on vient de voir) est frappé de nullité. La nullité va entraîner un effacement rétroactif des effets de l’acte juridique. Le but est de retourner au statu quo ante, avec un effacement rétroactif de tous les effets que l’acte juridique a pu poser. \n\n\n\nOn oppose les nullités absolues aux nullités relatives. \n\n***La nullité est dite absolue*** lorsqu’elle sanctionne la violence d’une règle éditée pour protéger l'intérêt général. La condition tenant un objet licite est posée pour protéger l'intérêt général donc la nullité en cas d’objet licite est une nullité absolue.\n\n***La nullité est dite relative*** lorsqu’elle est éditée suite à la violation d’une règle qui protège l'intérêt particulier de l’une des parties au contrat.\n\n*ex → nullité pour vice du consentement, nullité pour incapacité.&#xA0;*\n\n**Qu'elle soit absolue ou relative, les effets de la nullité sont les mêmes. La nullité entraîne un effacement rétroactif des effets de l’acte juridique (un retour à la situation statu quo ante).** \n\n\n\n**Il y a 2 différences de régimes entre la nullité relative et absolue :&#xA0;**\n\n- ***Premiere différence*** : en cas de nullité relative, seule la personne que la loi a voulu protéger peut demander la nullité (majeur incabale, mineur incapable). En cas de nullité absolue, toute personne qui a un intérêt, y compris le procureur de la République, peut demander la nullité. \n- ***Deuxième différence*** : seule la nullité relative est susceptible de confirmation. La confirmation et la manifestation de volonté par laquelle la personne peut demander la nullité relative d’un acte juridique renonce à exercer une action en nullité. La confirmation peut être tacite et se déduire d’un comportement. \n\n\n\n***Chapitre 2 : Les faits juridiques (Ce chapitre sera traité si nous avons le temps)&#xA0;***\n\n\n\n***Section 1 : Les faits de la nature&#xA0;***\n\n\n\n***Section 2 : Les faits de l’homme &#xA0;***\n\n\n\n**§1 – Les faits générateurs de droits&#xA0;**\n\n\n\n**§2 – Les faits générateurs d’obligations**", "html": "\u003ch1>PARTIE 2 : Les droits subjectifs.\u003c/h1>\n\u003cp>Les droits subjectifs sont les prérogatives individuelles qu’une personne physique ou morale tire d’une règle de droit objective. L’exercice de ces prérogatives est garantie par l'Etat. En ce sens que toutes personnes / sujets de droit dont le droit subjectif est bafoué, peut agir en justice pour le faire respecter.\u003c/p>\n\u003ch2 class=\"course-chapter\">Titre 1 : La classification des droits subjectifs.\u003c/h2>\n\u003cp>Il y a différents droits subjectifs :\u003c/p>\n\u003cul>\n\u003cli>droits patrimoniaux\u003c/li>\n\u003cli>droits extrapatrimoniaux\u003c/li>\n\u003c/ul>\n\u003cp>On qualifie de droits patrimoniaux les droits subjectifs qui ont une valeur pécuniaire et qui entrent dans la composition du patrimoine d’une personne. Il s'agit par exemple du droit de propriété, de créance (permet au créancier d’exiger du débiteur qu’il le paye). Les droits patrimoniaux sont cessibles, transmissibles pour cause de mort et sont saisissables par les créanciers du titulaire du droit.\u003c/p>\n\u003cp>On qualifie de droits extrapatrimoniaux les droits subjectifs qui n’ont pas de valeur pécuniaire, cad pas évaluable en argent. Ils n’entrent pas dans la composition du patrimoine comme celui du droit de vote, au respect de la vie privée ou encore du droit à l’honneur, etc. Ils sont incessibles, intransmissibles pour cause de mort et sont insaisissables.\u003c/p>\n\u003ch3 class=\"course-chapter\">Chapitre 1 : Les droits patrimoniaux\u003c/h3>\n\u003cp>Il faut analyser les principaux patrimoniaux et d’autre part, voir le patrimoine/ le contenu dans lequel il s'insère.\u003c/p>\n\u003ch4 class=\"course-section\">Section 1 : Les principaux droits patrimoniaux\u003c/h4>\n\u003ch5 class=\"course-sub\">§1 – Les droits personnels\u003c/h5>\n\u003cp>On parle de droits personnels comme des droits de créance → il s’agit du droit qu’a une personne (le créancier) d’exiger d’une autre personne (le débiteur) l’accomplissement d’une prestation. Ce droit met en relation 2 personnes dont le créancier qui est le sujet actif du droit et ensuite le débiteur qui est le sujet passif du droit.\u003c/p>\n\u003cp>La prestation à laquelle s’engage le débiteur peut être de 3 types :\u003c/p>\n\u003cul>\n\u003cli>transférer la propriété d’une chose (propriété d’une somme d'argent, ou propriété d’un bien).\u003c/li>\n\u003cli>peut consister en l'obligation de faire quelque chose. Les contrats, qui font naître des obligations de faire, sont fréquents.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cem>ex → dans le contrat d'entreprise, l'entrepreneur s’oblige à faire qqchose et le maître de l’ouvrage s’oblige à transférer le prix de la prestation. \u003c/em>\u003c/p>\n\u003cul>\n\u003cli>La prestation peut consister en l’obligation de ne pas faire quelque chose. LEs contrats dans lesquelles apparaissent une obligation ne pas faire quelque chose sont très rares. Dans ce cas, le débiteur s’engage à s’abstenir de certains actes.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cem>ex → dans le contrat du travail, il y a souvent stipuler une clause dite de non concurrence par laquelle le salarié s'oblige, après la rupture du contrat de travail, à ne pas aller travailler dans une entreprise concurrente.\u003c/em> La jurisprudence admet la validité des clauses de non concurrence à condition que cela soit limité dans l’espace, dans le temps et qu’il y ait une contrepartie financière versée au salarié lors de la rupture du contrat de travail.\u003c/p>\n\u003ch5 class=\"course-sub\">§2 – Les droits réels\u003c/h5>\n\u003cp>Les droits réels sont les droits d’une personne qui peut exercer sur une chose. On distingue 2 catégories de droits réels :\u003c/p>\n\u003cul>\n\u003cli>les droits réels principaux qui permettent à leur titulaire d’agir sur la chose. Le plus important des droits réels principaux est le droit de propriété. Il comprend le droit d’utiliser la chose (usus) et comprend d'en tirer des fruits et des revenus (fructus), le droit d'en disposer de la chose (abusus). Le droit de propriété est le droit le plus complet qu’une personne puisse avoir sur une chose, ce droit peut faire objet de démembrement en ce sens que certaines des proeogartibes vont etre attribuer a une personne de maniere isoler. Les droit réels qui correspondent à un démembrement du droit de propriété sont également des droits réels principaux\u003c/li>\n\u003c/ul>\n\u003cp>\u003cem>ex → c’est le cas de l’usufruit qui donne à l'usufruitier l’usus et le fructus, l’abusus restant entre les mains d’une personne appelé le nu-propriétaire. \u003c/em>\u003c/p>\n\u003cp>\u003cem>ex → les servitudes permettent à un partenaire d’un fonds d’user de certaines prérogatives attachées au droit de propriété sur le fonds voisin. Ce sont des droits réels démembrés. \u003c/em>\u003c/p>\n\u003cul>\n\u003cli>les droit réels accessoires n’ont pas d’existence propre mais qui se conçoivent seulement comme l’accessoire d’un droit personnel. En général, le droit personnel garantie et consiste dans le,paiement d’une somme d’argent et les droits réels accessoires consistent en hypothèque, gage ou nantissement. Lorsque le titulaire d’un droit de créance détient en plus un droit réel accessoire pour garantir sa créance, il est dans une situation privilégiée si le débiteur ne paie pas. En effet, il peut procéder à la saisie du bien qui vient garantir sa créance, le faire vendre aux enchères et être payé en priorité sur le prix de vente par rapport aux autres créanciers appelés les créanciers chirographaires.\u003c/li>\n\u003c/ul>\n\u003ch5 class=\"course-sub\">§3 – Les droits intellectuels\u003c/h5>\n\u003cp>Il y a 2 catégories de droits intellectuels :\u003c/p>\n\u003cul>\n\u003cli>les droits intellectuels liés à une œuvre de l’esprit.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cem>ex → le création d'une œuvre littéraire ou artistique confère à son auteur des droits d’auteurs, selon l'article \u003cstrong>L123-1 du Code de la propriété intellectuelle (CPI)\u003c/strong>, il a le droit de retirer des revenus de l'exploitation de son œuvre durant toute sa vie. Ce droit est transmissible aux héritiers de l'auteur de l'œuvre artistique ou littéraire, qui pourront, pendant 70 ans à compter du décès, continuer a exploiter / tirer des revenus de l'œuvre du défunt. Le point de départ de ces délais est le 1er janvier qui suit l'année civile du décès. Toutes les œuvres écrites par des auteurs, décédés au cours de l'année 1955, tombent donc dans le domaine public à compter du 1er janvier 2026. \u003c/em>\u003c/p>\n\u003cp>Il existe d’autres droits intellectuels rattachés aux œuvres de l’esprit dans le domaine de la science, de l’industrie et du commerce. Ces droits sont constatés et protégés par des brevets, par des certificats d'utilité, par des dessins et modèles ou encore par des marques déposés à \u003cstrong>l'INPI\u003c/strong> (\u003cstrong>I\u003c/strong>nstitut \u003cstrong>N\u003c/strong>ational de la \u003cstrong>P\u003c/strong>ropriété \u003cstrong>I\u003c/strong>ndustrielle).\u003c/p>\n\u003cul>\n\u003cli>les droits intellectuels liés à une activité professionnelle. Tel est le cas de la clientèle commerciale et de la clientèle civile qui peut être cédée moyennant finance.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cem>ex → un kiné ou un médecin peut céder sa clientèle. Lorsqu'un kiné vend sa clientèle, il vend sa présentation (il cède sa clientèle à un tiers). \u003c/em>\u003c/p>\n\u003cp>\u003cstrong>Remarque\u003c/strong> : les droits intellectuels sont par certains aspects des droits mixtes, en ce sens ils ont une dimension patrimoniale mais ils ont aussi une dimension extrapatrimoniale car l’auteur d’une œuvre a un droit moral sur celle-ci qui lui permet de s’opposer à ce que l’oeuvre soit utilisé dans un contexte qui lui deplait.\u003c/p>\n\u003cp>\u003cem>\u003cstrong>L’article L121-1 du Code de la propriété intellectuelle\u003c/strong>\u003c/em> affirme que ce droit moral est perpétuel, inaliénable et imprescriptible.\u003c/p>\n\u003cp>\u003cem>ex → dans un arrêt du 28 janvier 2003, la Cour de cassation a estimé que ce droit moral permettait à Gilbert Montagné de s’opposer à la reprise de l'air de sa chanson par les restaurants Flunch dans une chanson avec comme air “on va fluncher”. \u003c/em>\u003c/p>\n\u003cp>\u003cstrong>Le droit moral est également transmissible aux héritiers de l’auteur décédé.\u003c/strong>\u003c/p>\n\u003cp>\u003cem>ex → dans un arrêt du 31 mars 2004, la Cour d’appel de Paris a permis à Pierre Hugo (descendant de Victor Hugo) d’invoquer le droit moral de VH sur son oeuvre “Les Misérables” pour s’opposer à la publication, par les éditions Plomb, d’un roman présenté comme étant la suite “Des Misérables”.\u003c/em>\u003c/p>\n\u003cp>\u003cstrong>Remarque\u003c/strong> : Aujourd’hui, sur Internet, il y a chaque jours des milliers, voire des centaines de milliers, de téléchargements et de fichiers qui sont protégés par les droits d’auteur qui sont quand même téléchargés illégalement. Juridiquement, le fait de télécharger de manière illégale un fichier constitue le délit de contrefaçon qui est punissable de 3 ans d'emprisonnement et de 300 000€ d’amendes par \u003cem>\u003cstrong>l’article L335-2 du Code de la propriété intellectuelle (CPI). \u003c/strong>\u003c/em>\u003c/p>\n\u003cp>\u003cem>ex → c’est ainsi que le tribunal correctionnel de Saintes a condamné le 4 octobre 2012 à 176 000€ de dommages et intérêts et à 6 mois de prison avec sursis un étudiant en informatique, qui avait à 24 ans, créé une plateforme proposant 2 000 films en streaming.\u003c/em>\u003c/p>\n\u003cp>\u003cem>ex → dans un arrêt du 12 avril 2023, un hébergeur qui exploité un site permettant à des internautes de déposer et de partager des liens de téléchargements vers des jeux vidéos a été condamné à verser 400 000€ de dommages et intérêts à Nintendo.\u003c/em>\u003c/p>\n\u003cp>Le \u003cstrong>12 juin 2009 et le 28 octobre 2009\u003c/strong> ont été adoptées les lois dites HADOPI, avec un nouvel arsenal répressif contre les internautes indélicats. Ces deux lois ont mis en place une autorité qui est chargée de traquer les internautes indélicats, autorité qui est la \u003cstrong>H\u003c/strong>aute \u003cstrong>A\u003c/strong>utorité pour la \u003cstrong>D\u003c/strong>iffusion des \u003cstrong>O\u003c/strong>euvres et la \u003cstrong>P\u003c/strong>rotection des \u003cstrong>D\u003c/strong>roits sur \u003cstrong>I\u003c/strong>nternet. L’HADOPI a fonctionné en France jusqu'au 1er janvier 2022. Depuis cette date, L’HADOPI est le conseil supérieur de l'audiovisuel, qui avait été créé en 1989, ont fusionné pour donner naissance à \u003cstrong>l’ARCOM\u003c/strong> (\u003cstrong>A\u003c/strong>utorité de \u003cstrong>R\u003c/strong>égulation de la \u003cstrong>C\u003c/strong>ommunication \u003cstrong>A\u003c/strong>udiovisuel et \u003cstrong>N\u003c/strong>umérique). Les agents assermentaient de l’HADOPI ont intégrés l’ARCOM, la mission de ces agents est de traquer les adresses IP mettant à la disposition des internautes des fichiers ou même les simples utilisateurs qui téléchargent des fichiers.\u003c/p>\n\u003cp>Le principe est, pour l’ARCOM (comme c'était le cas de l’HADOPI), est de la réponse graduée avec 3 étapes :\u003c/p>\n\u003cul>\n\u003cli>\u003cem>\u003cstrong>Face à un internaute qui télécharge illégalement un fichier\u003c/strong>\u003c/em>, l’ARCOM commence par dresser un courriel nominatif mettant en garde l'internaute (sachant que depuis le 1er juillet 2005 il y a aussi une lettre envoyée par la poste). Entre le 1er octobre 2010 et le 31 décembre 2021, l'HADOPI a envoyé 14 millions de courriels de ce type.\u003c/li>\n\u003cli>\u003cem>\u003cstrong>L’ARCOM classe alors l’adresse IP de l'internaute indélicat sous surveillance\u003c/strong>\u003c/em>. Si l’ARCOM constate un second téléchargement illégal pratiqué dans les 6 mois, il envoie un second courriel doublé d’une lettre recommandée sachant qu’entre le 1er octobre 2010 et le 31 décembre 2021, l’HADOPI a envoyé environ 1 millions de lettres recommandées avec accusé de réception.\u003c/li>\n\u003cli>\u003cem>\u003cstrong>L'adresse IP de l'internaute indélicat est alors placée sous surveillance pendant 1 an\u003c/strong>\u003c/em>. Si l’ARCOM constate un nouveau téléchargement illégal pendant cette année, l’ARCOM se réunit en commission et décide de transmettre ou non le dossier au procureur de la République. Entre le 1er octobre 2010 et le 31 décembre 2021, il y a eu environ 4 000 dossiers qui ont été transmis au procureur de la République pour poursuites pénales. Le juge statue selon la procédure simplifiée de l'ordonnance pénale sans qu’il y ait de débat contradictoire avec l'internaute indélicat. L'internaute recevra chez lui l'ordonnance l'informant de la peine prononcée contre lui et a un délai d’1 mois pour faire opposition s’il le veut et ce qui lui permettra de comparaître devant un tribunal pour être entendu dans ses explications. L’ARCOM détient d’autres pouvoirs qui n’ont rien à voir avec la protection des droits intellectuels, elle est chargé de :\n\u003cul>\n\u003cli>lutter contre la diffusion de fausses informations en ligne en particulier sur les réseaux sociaux et les plateformes numériques.\u003c/li>\n\u003cli>superviser l’observatoire de la haine en ligne pour analyser et lutter contre les discours de haine sur Internet, et saisir le procureur de la République en cas de besoin.\u003c/li>\n\u003cli>veiller à ce que les médias audiovisuels et numériques respectent la pluralité des opinions. Et lors des périodes électorales, elle veille à ce que le temps de parole des différents candidats soit égal.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003cp>\u003cem>\u003cstrong>L’ARCOM attribue les 15 fréquences disponibles pour la diffusion gratuite sur la TNT. \u003c/strong>\u003c/em>\u003c/p>\n\u003cp>Si les téléchargements de fichiers dont on n’a pas acquis régulièrement les droits d'auteur sont interdits, en revanche les \u003cem>\u003cstrong>articles L122-5 et L213-1 de la CPI\u003c/strong>\u003c/em> mettent en place au profit de la personne qui détient régulièrement des droits d’auteurs, ce qu’on appelle \u003cem>\u003cstrong>l’exception de copie privée\u003c/strong>\u003c/em>. L’exception de copié privée permet à cette personne de reproduire le fichier et de le diffuser en toute légalité au sein de son cercle familial ou d’amis. Aujourd’hui, la plupart des fichiers sont protégés par un DRM qui est un procédé technique interdisant à faire une copie.\u003c/p>\n\u003cp>\u003cem>ex → le problème s’est posé, de savoir si en interdisant un DRM, le producteur portait atteinte à l’exception de chipie privé et devait ou non indemniser la personne qui avait acheter le DVD. Plusieurs décisions des juges du fond ont été dans ce sens. Cependant, la Cour de cassation a affirmé dans un arrêt du 28 février 2006, que l'utilisation d’un DRM empêchant la copie d’un DVD, ne permettait pas d’obtenir réparation / indemnisation pour atteinte due à sa vie privée.\u003c/em>\u003c/p>\n\u003ch4 class=\"course-section\">Section 2 : La notion juridique de patrimoine\u003c/h4>\n\u003cp>Le patrimoine est un contenant qui regroupe l'ensemble des droits et des obligations appartenant à une personne et ayant une valeur pécuniaire.\u003c/p>\n\u003cp>Tout patrimoine comporte un actif et un passif. A l'actif du patrimoine, on y trouve des droits réels dont la personne est titulaire par ses droits personnels, dans lesquels la personne apparaît côté créanciers et droits intellectuels.\u003c/p>\n\u003cp>Le passif du patrimoine est constitué par l'ensemble des dettes de l'intéressé, c’est-à-dire par l'ensemble des droits personnels dans lesquels elle apparaît côté débiteur.\u003c/p>\n\u003cp>La théorie du patrimoine reposait jusqu'à récemment sur trois règles :\u003c/p>\n\u003cul>\n\u003cli>Toute personne physique ou morale a un patrimoine. Car le patrimoine est un simple\u003c/li>\n\u003c/ul>\n\u003cp>contenant qui peut être vide (\u003cem>ex → le nouveau-né à la naissance\u003c/em>), ou avoir dans certains cas plus de passifs que d'actifs. Cette règle est toujours valable aujourd'hui.\u003c/p>\n\u003cul>\n\u003cli>Toutes personnes physiques ou morales n'a en principe qu'un seul patrimoine, il résulte de \u003cem>\u003cstrong>l'article 2284 du Code civil\u003c/strong>\u003c/em> que tout l'actif du patrimoine répond du passif. Ce qui signifie que les créanciers impayés peuvent saisir l'un quelconque des biens qui se trouvent à l'actif du patrimoine. Cette règle a été abandonnée par une \u003cstrong>loi du 14 février 2022\u003c/strong>, relative à l'activité professionnelle des indépendants. La mesure phare de cette loi a été de doter les entrepreneurs individuels à compter du 14 mai 2022 sans qu'ils aient la moindre démarches à effectuer de deux patrimoines.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cem>\u003cstrong>Premier patrimoine\u003c/strong>\u003c/em> : un patrimoine professionnel comprenant les biens droits et obligations utile à son activité professionnel destiné en cas d'impayé à désintéresser les créanciers dont la créance est née à l'occasion de l'activité professionnelle.\u003c/p>\n\u003cp>\u003cem>\u003cstrong>Deuxième patrimoine\u003c/strong>\u003c/em> : un patrimoine personnel comprenant les autres biens de droits et d’obligations destinées à satisfaire les créanciers dont la créance est née à l'occasion de leur activité professionnelle.\u003c/p>\n\u003cul>\n\u003cli>Tout patrimoine appartient à une personne, il n' y a pas de patrimoine sans titulaires. Cette règle est encore valable aujourd'hui. Au décès d'une personne, le patrimoine était le sien et disparaît en tant que contenant et les éléments tant actifs que passifs qui étaient dedans se trouvent transmis aux différents héritiers dès l'instant du décès au patrimoine des différents héritiers.\u003c/li>\n\u003c/ul>\n\u003ch3 class=\"course-chapter\">Chapitre 2 : Les droits extrapatrimoniaux\u003c/h3>\n\u003cp>Les droits extrapatrimoniaux sont des droits qui ne peuvent pas être évalués en argent, et ne sont pas susceptibles d'une évaluation pécuniaire. Et qui par conséquent n'entre pas dans la composition du patrimoine. Ses droits présentes trois caractères: incessibles (ne peuvent pas être cédé du vivant de l'individu), intransmissible pour cause de mort et insaisissable.\u003c/p>\n\u003cp>\u003cem>\u003cstrong>Trois catégories de droit extrapatrimoniaux\u003c/strong>\u003c/em> :\u003c/p>\n\u003cul>\n\u003cli>Les droits dit politique parmi lesquels figure le droit de vote et le droit de se présenter au suffrage universel ou autre suffrage.\u003c/li>\n\u003cli>Les droits dit familiaux parmi lesquels on trouve le droit pour les parents d'exercer sur les enfants les prérogatives liées à l'autorité parentale.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cem>ex → le droit pour les grands-parents d'entretenir des relations personnelles avec leurs petits-enfants = \u003cstrong>article 371-4 du Code civil\u003c/strong>.\u003c/em>\u003c/p>\n\u003cul>\n\u003cli>Les droits dit de la personnalité qui ont pour but de protéger la personne à la fois dans son aspect physique et moral.\u003c/li>\n\u003c/ul>\n\u003cp>Aujourd'hui, l'âge de raison dépend de si l'enfant à la capacité de discernement et une quelconque maturité (avant c'était 13 ans).\u003c/p>\n\u003ch4 class=\"course-section\">Section 1 : Les droits de la personnalité protégeant l'aspect physique de la personne.\u003c/h4>\n\u003cp>Toutes personnes à le droit au respect de son intégrité corporel, cette règle se trouve garantie par plusieurs dispositions du code pénal qui sanctionnent les différentes atteintes qui peuvent être porté à l'intégrité corporel d'un individu (blessure volontaire, homicide volontaire, meurtre, agression sexuelle..). Depuis \u003cstrong>deux lois bioéthiques du 29 juillet 1994\u003c/strong> révisé déjà, à trois reprises, révisé successivement le \u003cstrong>6 août 2004\u003c/strong>, le \u003cstrong>7 juillet 2011\u003c/strong> et le \u003cstrong>2 août 2021,\u003c/strong> ces lois seront prochainement révisées. Ce principe est affirmé dans le Code civil, ces lois ont créé deux nouveaux chapitres dans le Code civil dont un intitulé: du respect du corps humain.\u003c/p>\n\u003cp>Ces deux chapitres contiennent les \u003cem>\u003cstrong>articles 16 à 16-13 du Code civil\u003c/strong>\u003c/em>,\u003c/p>\n\u003cp>\u003cem>\u003cstrong>l'article 16\u003c/strong>\u003c/em> affirme que la loi assure la primauté de la personne, interdit toutes atteintes à la dignité de celle-ci, et garantie le respect de l'être humain dès le commencement de sa vie. Ce texte ne définit pas le point de départ de la vie de l'être humain; ce qui ne permet pas d'affirmer qu'il donne un droit subjectif à l'embryon en le considérant comme une personne juridique.\u003c/p>\n\u003cp>\u003cem>\u003cstrong>L'article 16-1 du Code civil\u003c/strong>\u003c/em> précise que chacun a le droit au respect de son corps et déclare le corps humain inviolable.\u003c/p>\n\u003cp>\u003cem>\u003cstrong>L'article 16-1-1 du Code civil\u003c/strong>\u003c/em> affirme que le respect dû au corps humain ne cesse pas avec la mort. C'est en se fondant sur cet article que la cour de cassation a interdit dans un arrêt du 16 septembre 2010 l'exposition intitulé &quot;à corps ouvert&quot; qui présentait des cadavres, organes humains et tissus humains soit disant pour une finalité pédagogique et scientifique.\u003c/p>\n\u003cp>La cour affirme dans cet arrêt que &quot; l'exposition de cadavres, de tissus humains à des fins\u003c/p>\n\u003cp>commerciales contrevient aux dispositions de \u003cem>\u003cstrong>l'article 16-1-1 du Code civil\u003c/strong>\u003c/em> selon lequel les restes d'une personne décédée doivent être traités avec respect, dignité et décence.\u003c/p>\n\u003cp>Dans un arrêt rendu le 29 juin 2017, la Cour d'appel de Douai a rappelé que tous les éléments du corps humain sont dignes de protection et à condamner une entreprise de pompe funèbre qui avait suite au suicide d'une personne par arme à feu récupéré le cadavre tout en laissant sur les lieux du cadavre plusieurs bouts de chair qui s'étaient désolidarisés du fait de l'explosion.\u003c/p>\n\u003cp>\u003cem>\u003cstrong>L'article 16-3\u003c/strong>\u003c/em> indique qu'il ne peut être porté atteinte à l'intégrité du corps humain qu'en cas de nécessité médicale. Et que même dans ce cas, le consentement préalable de l'intéressé est en principe nécessaire.\u003c/p>\n\u003cp>\u003cem>\u003cstrong>(DANS LE QCM) \u003c/strong>\u003c/em>Dans un arrêt du 16 août 2002 le conseil d'état a admis qu'un médecin puisse passer outre le refus d'un témoin de Jéhovah puisse recevoir à l'occasion d'une opération à deux conditions:\u003c/p>\n\u003cul>\n\u003cli>La transfusion sanguine doit être indispensable à la survie de l'individu.\u003c/li>\n\u003cli>Le médecin doit avoir tout mis en œuvre pour convaincre le patient d'accepter les soins indispensables.\u003c/li>\n\u003c/ul>\n\u003cp>Le droit au respect de l'intégrité corporel de l'i
