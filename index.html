<style>
/* Mise en page : une colonne. Accueil = matières empilées, quiz = une question par écran, résultat = score + erreurs à revoir. */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --fg: #101828;
  --muted: #566176;
  --line: #d6dce7;
  --good: #137a4b;
  --good-bg: #e3f5eb;
  --bad: #b42318;
  --bad-bg: #fde8e6;
  --on-c: #ffffff;
  --c-const: #2447b8;
  --c-civil: #0f7b6c;
  --c-sp: #a12b4f;
  --c-hist: #a5630a;
  --display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1320;
    --surface: #161d2e;
    --fg: #e7ebf3;
    --muted: #98a2b8;
    --line: #27314a;
    --good: #4cc38a;
    --good-bg: #12291f;
    --bad: #ff8a7a;
    --bad-bg: #3a1a1a;
    --on-c: #0e1320;
    --c-const: #8fa8ff;
    --c-civil: #4fd1bd;
    --c-sp: #f08cab;
    --c-hist: #e8b15c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1320;
  --surface: #161d2e;
  --fg: #e7ebf3;
  --muted: #98a2b8;
  --line: #27314a;
  --good: #4cc38a;
  --good-bg: #12291f;
  --bad: #ff8a7a;
  --bad-bg: #3a1a1a;
  --on-c: #0e1320;
  --c-const: #8fa8ff;
  --c-civil: #4fd1bd;
  --c-sp: #f08cab;
  --c-hist: #e8b15c;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.55 var(--body);
  margin: 0;
  padding-block: 24px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; }
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; line-height: 1.2; }
h1 { font-size: clamp(1.7rem, 5vw, 2.3rem); font-weight: 700; }
h1:focus, h2:focus { outline: none; }
.brand { margin: 0 0 6px; font-size: .78rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lead { color: var(--muted); margin: 8px 0 24px; max-width: 60ch; }
.meta { color: var(--muted); font-size: .9rem; }

button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--c, var(--c-const)); outline-offset: 2px; }

/* Matières : l'une au-dessus de l'autre */
.stack { display: flex; flex-direction: column; gap: 12px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 16px 18px; display: flex; align-items: center; gap: 16px;
  text-align: left; cursor: pointer; width: 100%; min-width: 0;
}
.card:hover { border-color: var(--c); }
.card .emo {
  flex: none; min-width: 64px; height: 56px; padding: 0 10px; border-radius: 14px;
  background: color-mix(in srgb, var(--c) 13%, var(--surface));
  display: grid; place-items: center; font-size: 1.55rem; line-height: 1; letter-spacing: .08em;
}
.card .ct { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.card h2 { color: var(--c); font-size: 1.2rem; }
.card .state { font-size: .9rem; font-weight: 500; }
.card .state.off { color: var(--muted); font-weight: 400; }
.card .chev { flex: none; color: var(--c); font-size: 1.8rem; line-height: 1; }

.back {
  background: none; border: 0; padding: 6px 0; margin: 0 0 14px; cursor: pointer;
  color: var(--muted); font-size: .92rem; font-weight: 500;
}
.back:hover { color: var(--fg); }

.title-row { display: flex; align-items: center; gap: 14px; }
.title-row .emo {
  flex: none; min-width: 64px; height: 56px; padding: 0 10px; border-radius: 14px;
  background: color-mix(in srgb, var(--c) 13%, var(--surface));
  display: grid; place-items: center; font-size: 1.55rem; line-height: 1; letter-spacing: .08em;
}

/* Interrupteurs de mélange */
.switches { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 10px; margin: 0 0 16px; }
.sw {
  display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; min-width: 0;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px;
  padding: 12px 14px; cursor: pointer;
}
.sw:hover { border-color: var(--c); }
.sw .ico { flex: none; font-size: 1.4rem; line-height: 1; }
.sw .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.sw .txt strong { font-weight: 600; font-size: .98rem; }
.sw .txt span { color: var(--muted); font-size: .84rem; }
.sw .track { flex: none; position: relative; width: 46px; height: 26px; border-radius: 13px; background: var(--line); transition: background .15s ease; }
.sw .track::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--muted); transition: transform .15s ease, background .15s ease;
}
.sw[aria-checked="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 9%, var(--surface)); }
.sw[aria-checked="true"] .track { background: var(--c); }
.sw[aria-checked="true"] .track::after { transform: translateX(20px); background: var(--on-c); }

.list { display: flex; flex-direction: column; gap: 10px; }
.row {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 16px 18px; display: flex; gap: 14px; align-items: center; justify-content: space-between;
  text-align: left; width: 100%; cursor: pointer; min-width: 0;
}
.row:hover { border-color: var(--c); }
.row .rt { min-width: 0; }
.row .rt strong { display: block; font-family: var(--display); font-size: 1.05rem; font-weight: 600; }
.row .go { flex: none; font-weight: 600; color: var(--c); font-size: .92rem; }
.empty {
  background: var(--surface); border: 1px dashed var(--line); border-radius: 12px;
  padding: 22px; color: var(--muted);
}

.qhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; font-size: .92rem; color: var(--muted); }
.qhead strong { color: var(--fg); font-weight: 600; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 10px 0 0; }
.bar i { display: block; height: 100%; background: var(--c); transition: width .25s ease; }
.question { font-family: var(--display); font-weight: 600; font-size: clamp(1.25rem, 4vw, 1.6rem); line-height: 1.3; margin: 26px 0 18px; text-wrap: balance; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; gap: 12px; align-items: center; text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 13px 14px; cursor: pointer; min-width: 0;
}
.opt:hover { border-color: var(--c); }
.opt .l {
  flex: none; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
  font: 600 .9rem var(--display); background: var(--bg); border: 1px solid var(--line);
}
.opt .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt .tag { flex: none; font-size: .78rem; font-weight: 600; }
.locked .opt { cursor: default; }
.locked .opt:hover { border-color: var(--line); }
.opt.correct, .locked .opt.correct:hover { border-color: var(--good); background: var(--good-bg); }
.opt.correct .tag { color: var(--good); }
.opt.wrong, .locked .opt.wrong:hover { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .tag { color: var(--bad); }
.opt.correct .l { border-color: var(--good); color: var(--good); }
.opt.wrong .l { border-color: var(--bad); color: var(--bad); }

.fb { margin: 18px 0 0; padding: 12px 14px; border-radius: 10px; font-weight: 500; }
.fb.ok { background: var(--good-bg); color: var(--good); }
.fb.ko { background: var(--bad-bg); color: var(--bad); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 0; }
.btn {
  background: var(--c); color: var(--on-c); border: 1px solid var(--c); border-radius: 10px;
  padding: 11px 18px; font-weight: 600; cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--c); }

.score { margin: 18px 0 4px; font-family: var(--display); font-weight: 700; font-size: clamp(3rem, 14vw, 4.5rem); line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: .4em; color: var(--muted); font-weight: 500; }
.verdict { font-size: 1.05rem; margin: 4px 0 0; }
.review { margin: 30px 0 0; display: flex; flex-direction: column; gap: 10px; }
.review h2 { font-size: 1.1rem; margin-bottom: 4px; }
.rev { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.rev p { margin: 0 0 8px; font-weight: 500; }
.rev .a { font-size: .92rem; margin: 2px 0; overflow-wrap: anywhere; }
.rev .a b { font-weight: 600; }
.rev .no { color: var(--bad); }
.rev .yes { color: var(--good); }
@media (prefers-reduced-motion: reduce) { .bar i, .sw .track, .sw .track::after { transition: none; } }
</style>

var LETTERS = ["A", "B", "C", "D"];
var KEY = "qcm-revisions-v1";
var app = document.getElementById("app");
/* S.items : questions du QCM en cours, chacune avec l'ordre d'affichage de ses réponses (map) */
var S = { view: "home", subject: null, qcm: null, items: [], i: 0, picks: [], shuffleQ: false, shuffleA: false, partial: false, last: null };

function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function loadStats() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function saveStats(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }
function findSubject(id) { return SUBJECTS.filter(function (s) { return s.id === id; })[0]; }
function findQcm(s, id) { return s.qcms.filter(function (q) { return q.id === id; })[0]; }
function plural(n, one, many) { return n + " " + (n > 1 ? many : one); }
function shuffleArr(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function correctPos(it) { return it.map.indexOf(S.qcm.questions[it.qi][2]); }

/* ---------- Vues ---------- */
function homeView() {
  var stats = loadStats();
  var cards = SUBJECTS.map(function (s) {
    var nq = s.qcms.reduce(function (n, q) { return n + q.questions.length; }, 0);
    var done = s.qcms.filter(function (q) { return stats[q.id]; }).length;
    var state = s.qcms.length
      ? plural(s.qcms.length, "QCM", "QCM") + " · " + plural(nq, "question", "questions")
      : "Aucun QCM pour l'instant";
    var extra = s.qcms.length ? '<span class="meta">' + done + " sur " + s.qcms.length + " déjà fait" + (done > 1 ? "s" : "") + "</span>" : "";
    return '<button class="card" data-act="subject" data-id="' + s.id + '" style="--c:var(' + s.color + ')">' +
      '<span class="emo" aria-hidden="true">' + s.emoji + "</span>" +
      '<span class="ct"><h2>' + esc(s.name) + '</h2><span class="state' + (s.qcms.length ? "" : " off") + '">' + state + "</span>" + extra + "</span>" +
      '<span class="chev" aria-hidden="true">›</span></button>';
  }).join("");
  return '<p class="brand">Révisions</p><h1 tabindex="-1" id="focus">Choisis une matière</h1>' +
    '<p class="lead">Entraîne-toi QCM par QCM. La correction s\'affiche après chaque réponse et ton score est gardé sur cet appareil.</p>' +
    '<div class="stack">' + cards + "</div>";
}

function switchBtn(id, key, icon, title, onText, offText) {
  var on = S[key];
  return '<button class="sw" id="' + id + '" role="switch" aria-checked="' + on + '" data-act="toggle" data-k="' + key + '">' +
    '<span class="ico" aria-hidden="true">' + icon + "</span>" +
    '<span class="txt"><strong>' + title + "</strong><span>" + (on ? onText : offText) + "</span></span>" +
    '<span class="track" aria-hidden="true"></span></button>';
}

function subjectView() {
  var s = findSubject(S.subject), stats = loadStats();
  var body;
  if (!s.qcms.length) {
    body = '<div class="empty">Cette matière n\'a pas encore de QCM. Envoie tes questions à Claude et elles seront ajoutées ici.</div>';
  } else {
    body = '<div class="switches">' +
      switchBtn("sw-q", "shuffleQ", "🔀", "Mélanger les questions", "Ordre aléatoire", "Ordre du cours") +
      switchBtn("sw-a", "shuffleA", "🎲", "Mélanger les réponses", "Réponses dans un ordre aléatoire", "Ordre d'origine (A, B, C, D)") +
      '</div><div class="list">' + s.qcms.map(function (q) {
        var st = stats[q.id], n = q.questions.length;
        var info = st ? "Dernier score : " + st.last + "/" + n + " · Meilleur : " + st.best + "/" + n : "Pas encore fait";
        return '<button class="row" data-act="start" data-id="' + q.id + '"><span class="rt"><strong>' + esc(q.title) + '</strong><span class="meta">' +
          plural(n, "question", "questions") + " · " + info + '</span></span><span class="go">' + (st ? "Refaire" : "Commencer") + "</span></button>";
      }).join("") + "</div>";
  }
  return '<button class="back" data-act="home">← Toutes les matières</button>' +
    '<div style="--c:var(' + s.color + ')"><div class="title-row"><span class="emo" aria-hidden="true">' + s.emoji + '</span><h1 tabindex="-1" id="focus" style="color:var(--c)">' + esc(s.name) + "</h1></div></div>" +
    '<div style="--c:var(' + s.color + ');margin-top:20px">' + body + "</div>";
}

function quizView() {
  var s = findSubject(S.subject), q = S.qcm, total = S.items.length;
  var it = S.items[S.i], item = q.questions[it.qi], good = correctPos(it);
  var pick = S.picks[S.i], locked = pick !== undefined && pick !== null;
  var okSoFar = 0;
  for (var k = 0; k < S.picks.length; k++) { if (S.picks[k] === correctPos(S.items[k])) okSoFar++; }
  var answered = S.picks.filter(function (p) { return p !== undefined && p !== null; }).length;
  var opts = it.map.map(function (orig, idx) {
    var cls = "opt", tag = "";
    if (locked) {
      if (idx === good) { cls += " correct"; tag = '<span class="tag">Bonne réponse</span>'; }
      else if (idx === pick) { cls += " wrong"; tag = '<span class="tag">Ta réponse</span>'; }
    }
    return '<button class="' + cls + '" data-act="pick" data-i="' + idx + '"' + (locked ? ' aria-disabled="true"' : "") + ">" +
      '<span class="l">' + LETTERS[idx] + '</span><span class="t">' + esc(item[1][orig]) + "</span>" + tag + "</button>";
  }).join("");
  var fb = "";
  if (locked) {
    fb = pick === good
      ? '<div class="fb ok" role="status">Bonne réponse.</div>'
      : '<div class="fb ko" role="status">Mauvaise réponse. La bonne réponse est la ' + LETTERS[good] + ".</div>";
    fb += '<div class="actions"><button class="btn" id="next" data-act="next">' + (S.i === total - 1 ? "Voir le résultat" : "Question suivante") + "</button></div>";
  }
  return '<div style="--c:var(' + s.color + ')">' +
    '<button class="back" data-act="quit">← Quitter ce QCM</button>' +
    '<div class="qhead"><span><strong>Question ' + (S.i + 1) + "</strong> sur " + total + "</span><span>" + esc(q.title) + " · " + okSoFar + "/" + answered + ' juste' + (okSoFar > 1 ? "s" : "") + "</span></div>" +
    '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + total + '" aria-valuenow="' + (S.i + (locked ? 1 : 0)) + '"><i style="width:' + (((S.i + (locked ? 1 : 0)) / total) * 100) + '%"></i></div>' +
    '<h2 class="question" tabindex="-1" id="focus">' + esc(item[0]) + "</h2>" +
    '<div class="opts' + (locked ? " locked" : "") + '">' + opts + "</div>" + fb + "</div>";
}

function resultView() {
  var s = findSubject(S.subject), q = S.qcm, total = S.items.length;
  var score = 0, wrong = [];
  S.items.forEach(function (it, pos) {
    if (S.picks[pos] === correctPos(it)) score++; else wrong.push({ it: it, pick: S.picks[pos] });
  });
  var pct = Math.round((score / total) * 100);
  var verdict = pct >= 80 ? "Très bien, le cours est solide." : pct >= 60 ? "Correct, quelques points à revoir." : "À retravailler : relis le cours puis recommence.";
  var review = "";
  if (wrong.length) {
    review = '<div class="review"><h2>À revoir (' + wrong.length + ")</h2>" + wrong.map(function (w) {
      var item = q.questions[w.it.qi], gp = correctPos(w.it);
      return '<div class="rev"><p>' + esc(item[0]) + '</p><div class="a no"><b>Ta réponse :</b> ' + LETTERS[w.pick] + ". " + esc(item[1][w.it.map[w.pick]]) +
        '</div><div class="a yes"><b>Bonne réponse :</b> ' + LETTERS[gp] + ". " + esc(item[1][item[2]]) + "</div></div>";
    }).join("") + "</div>";
  }
  var again = '<button class="btn" data-act="retry">Refaire le QCM</button>' +
    (wrong.length ? '<button class="btn ghost" data-act="retry-wrong">Refaire mes erreurs</button>' : "") +
    '<button class="btn ghost" data-act="quit">Retour à la matière</button>';
  return '<div style="--c:var(' + s.color + ')"><p class="brand">' + esc(s.name) + " · " + (S.partial ? "Erreurs refaites" : "Résultat") + "</p>" +
    '<h1 tabindex="-1" id="focus">' + esc(q.title) + "</h1>" +
    '<div class="score">' + score + "<small>/" + total + "</small></div>" +
    '<p class="verdict">' + pct + " % de bonnes réponses. " + verdict + "</p>" +
    '<div class="actions">' + again + "</div>" + review + "</div>";
}

/* ---------- Rendu et actions ---------- */
function render(focusId) {
  app.innerHTML = S.view === "home" ? homeView() : S.view === "subject" ? subjectView() : S.view === "quiz" ? quizView() : resultView();
  var el = document.getElementById(focusId || "focus");
  if (el) { try { el.focus({ preventScroll: !!focusId }); } catch (e) {} }
  if (!focusId) window.scrollTo(0, 0);
}

function start(qcmId, onlyIds) {
  var s = findSubject(S.subject), q = findQcm(s, qcmId);
  var ids = q.questions.map(function (_, k) { return k; });
  if (onlyIds) ids = ids.filter(function (k) { return onlyIds.indexOf(k) !== -1; });
  if (S.shuffleQ) ids = shuffleArr(ids);
  S.qcm = q; S.partial = !!onlyIds;
  S.items = ids.map(function (qi) {
    var n = q.questions[qi][1].length, order = [];
    for (var k = 0; k < n; k++) order.push(k);
    return { qi: qi, map: S.shuffleA ? shuffleArr(order) : order };
  });
  S.i = 0; S.picks = []; S.view = "quiz";
  render();
}

function finish() {
  var q = S.qcm, score = 0, wrongIds = [];
  S.items.forEach(function (it, pos) {
    if (S.picks[pos] === correctPos(it)) score++; else wrongIds.push(it.qi);
  });
  S.last = { wrongIds: wrongIds };
  if (!S.partial) {
    var stats = loadStats(), prev = stats[q.id];
    stats[q.id] = { last: score, best: prev ? Math.max(prev.best, score) : score };
    saveStats(stats);
  }
  S.view = "result";
  render();
}

function advance() {
  if (S.i === S.items.length - 1) finish(); else { S.i++; render(); }
}

app.addEventListener("click", function (e) {
  var t = e.target.closest("[data-act]");
  if (!t) return;
  var act = t.getAttribute("data-act");
  if (act === "home") { S.view = "home"; render(); }
  else if (act === "subject") { S.subject = t.getAttribute("data-id"); S.view = "subject"; render(); }
  else if (act === "toggle") { var key = t.getAttribute("data-k"); S[key] = !S[key]; render(t.id); }
  else if (act === "start") { start(t.getAttribute("data-id"), null); }
  else if (act === "quit") { S.view = "subject"; render(); }
  else if (act === "pick") {
    if (S.picks[S.i] !== undefined && S.picks[S.i] !== null) return;
    S.picks[S.i] = parseInt(t.getAttribute("data-i"), 10);
    render("next");
  }
  else if (act === "next") { advance(); }
  else if (act === "retry") { start(S.qcm.id, null); }
  else if (act === "retry-wrong") { start(S.qcm.id, S.last.wrongIds); }
});

document.addEventListener("keydown", function (e) {
  if (S.view !== "quiz" || e.ctrlKey || e.metaKey || e.altKey) return;
  var locked = S.picks[S.i] !== undefined && S.picks[S.i] !== null;
  var k = e.key.toLowerCase(), idx = k.length === 1 ? "abcd".indexOf(k) : -1;
  if (idx === -1 && k.length === 1 && "1234".indexOf(k) !== -1) idx = parseInt(k, 10) - 1;
  if (idx !== -1 && !locked) {
    if (idx < S.items[S.i].map.length) { S.picks[S.i] = idx; render("next"); }
  } else if (locked && (e.key === "ArrowRight" || e.key === "Enter") && document.activeElement && document.activeElement.id !== "next") {
    e.preventDefault();
    advance();
  }
});

render();
</script>

</body></html>
