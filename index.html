c’est-à-dire si par une attitude incitative elle suscitait le client pour avoir une relation sexuelle avec lui.\u003c/p>\n\u003cp>Une \u003cstrong>loi du 13 avril 2016\u003c/strong> a changé la donne car elle sanctionne le client qui en rémunérant un acte sexuel est punissable d'une amende pouvant aller jusqu'à 1500 euros. La récidive constitue un délit punissable d'une amende allant jusqu'à 3750 euros. Un stage de sensibilisation à la lutte contre l'achat d'actes sexuels peut être pris en compte par le juge. Il y a actuellement 37 000 personnes qui se livrent à la prostitution (85% Femmes et 15% Hommes pour un chiffre d'affaire annuel à 3,2 M d'euros en 2018). Actuellement il y a 1300 condamnations par an en France. Plusieurs associations (le planning familial, médecin du monde) ont saisi le Conseil constitutionnel le 13 novembre 2018 d'une QPC pour que le Conseil constitutionnel déclare la pénalisation du client contraire à la Constitution. Ces associations prétendaient que pénaliser le client en cas d'acte sexuel entre adulte consentant se déroulant dans un lieu privé était une atteinte au respect de la vie privée des\u003c/p>\n\u003cp>prostituées et une atteinte à la liberté d'entreprendre. Dans une décision rendue le \u003cstrong>1er février 2019\u003c/strong>, le Conseil constitutionnel a estimé que la pénalisation du client est conforme à la Constitution.\u003c/p>\n\u003cp>Selon \u003cem>\u003cstrong>l’article 16-7 du Code civil\u003c/strong>\u003c/em> prévoit que toute convention portant sur la procréation ou la gestation pour le compte d’autrui est nulle. Cet article interdit donc les conventions de mères porteuses. Dans la mesure où de telles conventions sont légales comme par ex aux USA, cela pose le problème de la filiation d’un enfant issu d’une convention de mères porteuses conclus entre un couple français et une femme américaine.\u003c/p>\n\u003cp>Dans 3 arrêts rendus le 6 avril 2011, la Cour de cassation a refusé d'établir ce lien de filiation. La CEDH a condamné la France par 2 arrêts rendus le 26 juin 2014 en considérant que cette jurispurednec cree une discrimination engre les enfants. D'où le revirement opéré par la Cour de cassation dans 2 arrêts du 3 juillet 2015. Désormais un enfant né a l’etranger issu des conventions de mères porteuses pourra voir le lien de filiation établie avec ses parents français.\u003c/p>\n\u003cp>On ne peut pas déduire que ces 3 textes sur les conventions portant sur le corps humain sont toutes interdites. De telles conventions sont parfois autorisés selon 2 conditions :\u003c/p>\n\u003cul>\n\u003cli>Elles doivent avoir un \u003cstrong>caractère gratuit\u003c/strong>, cela se déduit par \u003cem>\u003cstrong>l’article 16-6 du Code Civil\u003c/strong>\u003c/em> au terme duquel : “\u003cem>aucune rémunération ne peut être alloué à celui qui se prête à une expérimentation sur sa personne, aux prélèvements d'éléments de son corps ou à la collecte de produits de celui-ci\u003c/em>”. Le don de sang / de gamètes est par exemple possible à titre gratuit. \u003cstrong>Si le principe de la gratuité est affirmé pour les recherches biomédicales, les textes admettent néanmoins le versement d’une indemnisation en raison des contraintes subies aux personnes qui se prêtent aux recherches.\u003c/strong> \u003cstrong>Le montant total des indemnités perçue en 12 mois ne peut pas dépasser 4 500€, le but est d'éviter des cobayes professionnels (attention question QCM possible). \u003c/strong>\u003c/li>\n\u003cli>Les conventions doivent garantir l’anonymat entre les parties à la convention. En effet \u003cem>\u003cstrong>l’article 16-8 du Code civil\u003c/strong>\u003c/em> dispose qu'aucune information permettant d’identifier à la fois celui qui a fait don d’un élément (organes) ou d’un produit (spermatozoïdes, lait maternel, cheveux...) et celui qui l’a recu ne peut être divulgué. Depuis la réforme de 2021 des lois bioéthiques, en cas de dons de gamètes, l’enfant issu de la PMA a le droit de connaître l'identité du donneur à sa majorité et plus aucun don du gamète n’est possible sans que le donneur le consent à ce que ses données d’identité soient communiquées à l’enfant issu du don une fois majeur .\u003c/li>\n\u003c/ul>\n\u003ch4 class=\"course-section\">Section 2 : Les droits de la personnalité protégeant l'aspect moral de la personne.\u003c/h4>\n\u003cp>De nombreux droits extrapatrimoniaux sont affirmés dans de textes internationaux présentés comme garantissant les droits de l’homme.\u003c/p>\n\u003cp>ex → le cas de la Convention de sauvegarde des droits de l’homme et des libertés fondamentales signée à Rome le 4 novembre 1950.\u003c/p>\n\u003cp>ex → c’est aussi le cas de la convention de New York du 1er mars 1980 sur l'élimination de toute forme de discriminations à l'égard des femmes.\u003c/p>\n\u003cp>Les droits de l'être humain sont le droit à la liberté de conscience et d’opinion, à l'honneur, à présomption d'innocence, à la nationalité, à la protection de la vie privée, à l’absence de discriminations fondees sur le sexe, la couleur de peau, la religion. Ces différents droits de la personnalité visent à protéger l'être humain dans sa dimension morale. Leur nature extrapatrimonial n’est pas incompatible avec l’octroi de dommages intérêts lorsqu’ils sont violés.\u003c/p>\n\u003cp>Dans un jugement du 26 octobre 2018, le TGI de Paris a condamné Anthony Delon a versé 8 000€ a la femme de Hallyday pour avoir publié sur son compte Instagram une photo prise dans la rue où on voit Laetitia se promenant au bras du manageur de Johnny avec comme commentaire : “cela fait déjà 3 ans”.\u003c/p>\n\u003cp>Le droit au respect de la vie privée peut même être monnayé, ce qui le rend évaluable en argent. Néanmoins, le droit au respect de la vie privée reste de nature extrapatrimonial comme le montre un arrêt du 14 décembre 1999 écrit par le Docteur Gubler qui révélait que Mitterrand souffrait d’un cancer dès son premier septennat. Après la sortie du livre de Gubler, sa veuve entend obtenir réparation du préjudice résultant d’une atteinte au respect dû à la vie privée de Mitterrand. La Cour de cassation déboute la veuve de Mitterrand de sa demande en se fondant sur le caractère extrapatrimonial du droit au respect de la vie privée, faisant que en tant que héritière, Danielle Mitterrand n’avait acquis que les droits patrimoniaux de son défunt mari (\u003cstrong>le droit au respect de la vie privée cesse au moment de la mort de l'intéressé, les héritiers ne peuvent pas agit au nom du definut car c’et un droi qui n’est pas transmis\u003c/strong>).\u003c/p>\n\u003ch2 class=\"course-chapter\">Titre 2 : La source des droits subjectifs\u003c/h2>\n\u003cp>Les droits objectifs trouvent leur fondement dans l'existence d’une règle de droit objective. Cependant, pour qu’un droit subjectif découle de cette règle, il faut un fait déclencheur qui peut consister soit en un acte juridique ou en un fait juridique.\u003c/p>\n\u003cp>\u003cem>\u003cstrong>Acte juridique\u003c/strong>\u003c/em> : une manifestation de volonté destinée à produire des effets juridiques / de droit.\u003c/p>\n\u003cp>\u003cem>ex → contrat, convention collective, testament.\u003c/em>\u003c/p>\n\u003cp>\u003cem>\u003cstrong>Fait juridique\u003c/strong>\u003c/em> : tout événement susceptible de produire des effets de droits\u003c/p>\n\u003cp>\u003cem>ex → la naissance, la majorité, la retraite, le décès. \u003c/em>\u003c/p>\n\u003ch3 class=\"course-chapter\">Chapitre 1 : Les actes juridiques\u003c/h3>\n\u003ch4 class=\"course-section\">Section 1 : La classification des actes juridiques\u003c/h4>\n\u003ch5 class=\"course-sub\">§1 –Les actes multilatéraux et les actes unilatéraux\u003c/h5>\n\u003cp>L’acte juridique est dit multilatéral lorsqu’il résulte de la volonté de plusieurs personnes. A contrario, s’il résulte de la volonté d'une seule personne c'est dire unilateral.\u003c/p>\n\u003ch6 class=\"course-sub\">A) Les actes multilatéraux\u003c/h6>\n\u003cp>Les actes multilatéraux portent le nom de conventions. \u003cstrong>On distingue 4 types de \u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>conventions : \u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cem>\u003cstrong>les conventions constitutives\u003c/strong>\u003c/em> dont l’objet est de créer des droits réels ou personnels (\u003cem>ex → convention par lequel une personne accorde une servitude de passage à un voisin sur son terrain\u003c/em>).\u003c/li>\n\u003cli>\u003cem>\u003cstrong>les conventions translatives\u003c/strong>\u003c/em> dont l’objet est d'opérer le transfert de la propriété d’une chose entre 2 personnes. (\u003cem>ex → contrat de vente\u003c/em>).\u003c/li>\n\u003cli>\u003cem>\u003cstrong>les conventions extinctives\u003c/strong>\u003c/em> dont l’objet est d'entraîner l'extinction d’un droit personnel (\u003cem>ex → une remise de dettes\u003c/em>).\u003c/li>\n\u003cli>\u003cem>\u003cstrong>les conventions déclaratives\u003c/strong>\u003c/em> dont l’objet est de constater l'existence d’un droit préexistant (\u003cem>ex → convention de partage signé entre les héritiers qui met fin à l’indivision successorale\u003c/em>)\u003c/li>\n\u003c/ul>\n\u003ch6 class=\"course-sub\">B) Les actes unilatéraux\u003c/h6>\n\u003cp>Les actes unilatéraux sont les manifestations de volonté destinées à produire des effets de droit qui ont pour origine la volonté d’une seule personne. Ils sont plus rares que les actes multilatéraux.\u003c/p>\n\u003cp>\u003cem>ex → le testament est l’acte juridique par lequel une personne désigne ceux qui hériteront de ses dettes. \u003c/em>\u003c/p>\n\u003cp>\u003cem>ex → la reconnaissance d’enfant qui crée des droits et des obligations entre l’auteur de la reconnaissance et l’enfant. \u003c/em>\u003c/p>\n\u003cp>\u003cem>ex → l’abandon est l’acte juridique par lequel une personne renonce à son droit de propriété sur une chose (\u003cstrong>attention question QCM possible !!!!).\u003c/strong>\u003c/em>\u003c/p>\n\u003cp>\u003cem>\u003cstrong>Remarque\u003c/strong>\u003c/em> : il ne faut pas confondre l’acte juridique unilatéral, où une seule volonté s’exprime, avec le contrat unilatéral qui comme tout contrat suppose l’accord de 2 ou plusieurs volontés. Le contrat unilatéral s’oppose aux contrats synallagmatiques.\u003c/p>\n\u003cp>\u003cem>\u003cstrong>Un contrat unilatéral\u003c/strong>\u003c/em> : contrat dans lequel une seule des 2 parties souscrit un engagement vis-à-vis de l’autre. Tel est le cas du cautionnement par lequel une personne s’engage vis-à-vis d’un créancier à payer les dettes d’un débiteur principal si ce dernier ne les payes pas lui-même.\u003c/p>\n\u003cp>\u003cem>\u003cstrong>Un contrat synallagmatique\u003c/strong>\u003c/em> : contrat qui crée des obligations réciproques entre les parties (\u003cem>ex → contrat de vente, de travail\u003c/em>).\u003c/p>\n\u003ch5 class=\"course-sub\">§2 – Les actes conservatoires, les actes d’administration et les actes de disposition\u003c/h5>\n\u003cp>Les actes juridiques peuvent avoir des conséquences plus ou moins graves sur la composition du patrimoine de celui qui les accomplit.\u003c/p>\n\u003ch6 class=\"course-sub\">A) Les actes conservatoires\u003c/h6>\n\u003cp>Les actes conservatoires consistent en l’accomplissement d’une formalité indispensable pour éviter la perte d’un droit. La finalité de l’acte juridique est donc de conserver la valeur du patrimoine de celui qui les accomplit.\u003c/p>\n\u003cp>ex → suite à un accident, le fait de faire une déclaration de sinistre à son assureur est un acte juridique conservatoire.\u003c/p>\n\u003ch6 class=\"course-sub\">B) Les actes d’administration\u003c/h6>\n\u003cp>Les actes d'administration sont ceux qui sont nécessaires à la gestion courante des biens du patrimoine ainsi que ceux qui permettent de le faire fructifier sans en compromettre la valeur.\u003c/p>\n\u003cp>\u003cem>ex → vendre des récoltes, encaisser des loyers, faire des travaux d’entretien sur un bien…\u003c/em>\u003c/p>\n\u003cp>\u003cstrong>Remarque (attention question QCM possible !!!)\u003c/strong> : traditionnellement, le fait de consentir un bail sur un immeuble était considéré comme un simple acte d’administration. Aujourd’hui, la législation donne au locataire de nombreux droits si bien que le bailleur ne peut plus reprendre la jouissance de son bien que dans des conditions très strictes et onéreuses. C’est pourquoi le fait de consentir certains baux constitue un acte de disposition.\u003c/p>\n\u003cp>\u003cem>ex → le fait de consentir un bail commercial, le fait de consentir un bail emphytéotique (bail d’une durée comprise entre 18 ans et 99 ans), le fait de consentir un bail meublé…\u003c/em>\u003c/p>\n\u003ch6 class=\"course-sub\">C) Les actes de disposition\u003c/h6>\n\u003cp>Les actes de disposition sont ceux qui portent atteinte ou risquent de porter atteinte à la valeur du patrimoine.\u003c/p>\n\u003cp>\u003cem>ex → toute vente d’un bien, de consentir à une hypothèque, d’emprunter une somme d’argent, d’apporter un bien à une société…\u003c/em>\u003c/p>\n\u003ch5 class=\"course-sub\">§3 – Les actes à titre gratuit et les actes à titre onéreux\u003c/h5>\n\u003cp>Un acte est dit à titre onéreux lorsque chacune des parties reçoit quelque chose en contrepartie de ce qu’elle fournit elle-même. Cette contrepartie peut être un bien (comme dans la vente) ou un service (comme dans le contrat de travail). Dans ces deux contrats (de vente et de travail), l’acheteur et l’employeur vont, en l'échange de ce qu'ils reçoivent, verser aux vendeurs ou salariés une somme d’argent.\u003c/p>\n\u003cp>Un acte est dit à titre gratuit lorsqu’une seule des parties procure à l’autre un avantage sans rien recevoir en échange (\u003cem>ex → la donation, le prêt d’argent sans intérêt\u003c/em>).\u003c/p>\n\u003ch4 class=\"course-section\">Section 2 : La validité des actes juridiques\u003c/h4>\n\u003cp>Un acte juridique ne va créer des droits supplétifs qu'à condition d'être valable. L’article 1128 du Code civil énumère les différentes conditions de validité.\u003c/p>\n\u003ch5 class=\"course-sub\">§1 - Les conditions de validité\u003c/h5>\n\u003cp>\u003cem>\u003cstrong>L’article 1128 du Code civil\u003c/strong>\u003c/em> énumère 3 conditions qui doivent être remplis pour qu’un acte juridique soit valable :\u003c/p>\n\u003cul>\n\u003cli>\u003cem>\u003cstrong>1ère condition\u003c/strong>\u003c/em> : les parties à l’acte juridique doivent y avoir consenti et leur consentement ne doit pas être vicié sachant qu’il y a 3 vices du consentement qui sont \u003cem>\u003cstrong>la violence, l’erreur et le dol\u003c/strong>\u003c/em>. Il y a \u003cem>\u003cstrong>violence\u003c/strong>\u003c/em> lorsque l’une des parties a été contrainte par l’autre à passer contrat. Il y a \u003cem>\u003cstrong>erreur\u003c/strong>\u003c/em> lorsque l’une des parties se trompe sur l’un des éléments importants du contrat. Il y a \u003cem>\u003cstrong>dol\u003c/strong>\u003c/em> lorsque l’une des parties est trompée par l’autre sur un élément important du contrat. \u003cstrong>(question de QCM possible !!!)\u003c/strong>\u003c/li>\n\u003cli>\u003cem>\u003cstrong>2ème condition\u003c/strong>\u003c/em> : les parties à l’acte ne doivent pas être frappées d’une incapacité d’exercice. Cela pose probleme pour les actes juridiques accomplis soit par des mineurs, soit par la femme mariée (avant 1938), soit par des majeurs incapables. Dans ces hypothèses, les actes juridiques devront être passés au nom de l’incpable par son représentant légal.\u003c/li>\n\u003cli>\u003cem>\u003cstrong>3ème condition\u003c/strong>\u003c/em> : l’objet de l’acte juridique doit être licite et certain. Dans les contrats unilatéraux, \u003cem>\u003cstrong>l’objet est unique\u003c/strong>\u003c/em>.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cem>ex → le donateur s’oblige à transférer la propriété de la chose donnée. \u003c/em>\u003c/p>\n\u003cp>Dans les contrats synallagmatiques, \u003cem>\u003cstrong>l’objet est double\u003c/strong>\u003c/em>. Pour qu'un acte juridique soit valable, \u003cem>\u003cstrong>l’objet doit présenter 3 caractères\u003c/strong>\u003c/em> :\u003c/p>\n\u003cul>\n\u003cli>Il doit être déterminé ou déterminable au moment de l’engagement / échange des consentements. Les parties doivent savoir à quoi ils sont tenus.\u003c/li>\n\u003cli>\u003cem>\u003cstrong>L’article 1163 du Code civil\u003c/strong>\u003c/em> exige que l’objet du contrat soit possible. A l’impossible, nul n’est tenu.\u003c/li>\n\u003cli>L’objet doit être licite. Les obligations que crée le contrat ne peuvent pas être contraires à l’ordre public ou aux bonnes moeurs.\u003c/li>\n\u003c/ul>\n\u003ch5 class=\"course-sub\">§2 - La nullité en cas d'inobservation de ces conditions\u003c/h5>\n\u003cp>L’acte juridique qui serait passé sans respecter les 3 conditions du supra (les conditions qu’on vient de voir) est frappé de nullité. La nullité va entraîner un effacement rétroactif des effets de l’acte juridique. Le but est de retourner au statu quo ante, avec un effacement rétroactif de tous les effets que l’acte juridique a pu poser.\u003c/p>\n\u003cp>On oppose les nullités absolues aux nullités relatives.\u003c/p>\n\u003cp>\u003cem>\u003cstrong>La nullité est dite absolue\u003c/strong>\u003c/em> lorsqu’elle sanctionne la violence d’une règle éditée pour protéger l'intérêt général. La condition tenant un objet licite est posée pour protéger l'intérêt général donc la nullité en cas d’objet licite est une nullité absolue.\u003c/p>\n\u003cp>\u003cem>\u003cstrong>La nullité est dite relative\u003c/strong>\u003c/em> lorsqu’elle est éditée suite à la violation d’une règle qui protège l'intérêt particulier de l’une des parties au contrat.\u003c/p>\n\u003cp>\u003cem>ex → nullité pour vice du consentement, nullité pour incapacité. \u003c/em>\u003c/p>\n\u003cp>\u003cstrong>Qu'elle soit absolue ou relative, les effets de la nullité sont les mêmes. La nullité entraîne un effacement rétroactif des effets de l’acte juridique (un retour à la situation statu quo ante).\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Il y a 2 différences de régimes entre la nullité relative et absolue : \u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cem>\u003cstrong>Premiere différence\u003c/strong>\u003c/em> : en cas de nullité relative, seule la personne que la loi a voulu protéger peut demander la nullité (majeur incabale, mineur incapable). En cas de nullité absolue, toute personne qui a un intérêt, y compris le procureur de la République, peut demander la nullité.\u003c/li>\n\u003cli>\u003cem>\u003cstrong>Deuxième différence\u003c/strong>\u003c/em> : seule la nullité relative est susceptible de confirmation. La confirmation et la manifestation de volonté par laquelle la personne peut demander la nullité relative d’un acte juridique renonce à exercer une action en nullité. La confirmation peut être tacite et se déduire d’un comportement.\u003c/li>\n\u003c/ul>\n\u003ch3 class=\"course-chapter\">Chapitre 2 : Les faits juridiques (Ce chapitre sera traité si nous avons le temps)\u003c/h3>\n\u003ch4 class=\"course-section\">Section 1 : Les faits de la nature\u003c/h4>\n\u003ch4 class=\"course-section\">Section 2 : Les faits de l’homme\u003c/h4>\n\u003ch5 class=\"course-sub\">§1 – Les faits générateurs de droits\u003c/h5>\n\u003ch5 class=\"course-sub\">§2 – Les faits générateurs d’obligations\u003c/h5>\n"}]};
COURSES["constitutionnel"] = [{"title": "Introduction", "text": "- Le 26 août 1789, le premier acte constitutionnel a été adopté par l’Assemblée Nationale (préambule DDHC).\n- Le droit constitutionnel a cette spécificité d'être un droit au temps LONG.\n- La loi, quant à elle, est dans le moyen terme (= moyen temps).\n- L’enjeu de la Constitution est de résister aux changements de majorités politiques. Cette Constitution a survécu sous 8 présidents de la République (avec leurs plusieurs mandats ou non).\n- Le droit positif est un droit qui existe / s’applique à un moment donné (**exemple** : la Constitution de 1958) par opposition à un droit projeté.\n- De plus, la Constitution doit durer même si elle est modifiée au fur des années (la Constitution de 1958 est différente de celle de 2026).", "html": "<ul>\n<li>Le 26 août 1789, le premier acte constitutionnel a été adopté par l’Assemblée Nationale (préambule DDHC).</li>\n<li>Le droit constitutionnel a cette spécificité d'être un droit au temps LONG.</li>\n<li>La loi, quant à elle, est dans le moyen terme (= moyen temps).</li>\n<li>L’enjeu de la Constitution est de résister aux changements de majorités politiques. Cette Constitution a survécu sous 8 présidents de la République (avec leurs plusieurs mandats ou non).</li>\n<li>Le droit positif est un droit qui existe / s’applique à un moment donné (<strong>exemple</strong> : la Constitution de 1958) par opposition à un droit projeté.</li>\n<li>De plus, la Constitution doit durer même si elle est modifiée au fur des années (la Constitution de 1958 est différente de celle de 2026).</li>\n</ul>\n"}, {"title": "Section 1 – Définitions du droit constitutionnel", "text": " Section 1 - Définitions du droit constitutionnel\n(Le droit se manifeste par du langage parlé ou écrit.) \n\n§1 - La Constitution comme texte \nLa Constitution est présentée comme un texte (écrite, numérotée…). \nLe texte de la Constitution est le support perceptible du droit, c’est un outil de communication pour savoir ce qu’il en est et d’en parler, mais il existe aussi en dehors du texte. \n Exemple : si demain la Constitution est brûlée, elle perdure toujours ! \n\nComment fixons-nous la liberté ? \nIl y a des principes et des limites à ceux-ci : on est libres OUI mais de tout faire NON. \nExemple  : chacun est libre de s’exprimer, or porter atteinte et avoir des propos racistes est interdit, donc la liberté est limitée au nom de celle des autres (article 4 de la Constitution). \nLa limite est fixée par la loi et bien d’autres autorités. \nLe droit ne se limite pas à un texte, il le dépasse. \nExemple : article 2 de la Constitution\n\nLe texte n’est qu’un indice, il reste un texte. \nOn doit l'interpréter et en déduire sa portée, c’est essentiellement ce à quoi sert le juge. Le texte a besoin d'être traduit essentiellement par des juges. \n\nEn France aujourd’hui, il y a le bloc de constitutionnalité car il permet de brasser plus de textes. On a quand même un texte de la Constitution du 4 octobre 1958, le texte principal auquel le reste va se connaître autour  : \nLa DDHC de 1789\nLe préambule de la Constitution de 1946 (qui proclame pleins de valeurs)\nLa charte de l’environnement \nadoptée en 2004 et constitutionnalisée en 2005 (10 articles qui proclament des droits environnementaux). \n\n§2 - La Constitution comme droit \nAu XVIIIe siècle, les Corses revendiquent l’invention de la Constitution en 1768 par un mouvement indépendantiste, par Pasquale Paoli.  \nEn 1789, en France, durant la Révolution française, instaure sa première Constitution parce que les français veulent mettre un terme à la monarchie, on veut changer la manière dont on veut diriger le pays. On veut séparer le pouvoir, on pense alors que la Constitution est le moyen pour changer les pouvoirs. \n→ On définit alors le droit constitutionnel comme un droit qui définit le droit politique. \n\nLe droit constitutionnel à raison de sa matière : c’est l'organisation du pouvoir politique. \nLe droit résulte d’une procédure particulière d’adoption. \nEn droit il y a des dichotomies, c’est-à-dire deux parties, bien souvent, qui s'opposent. \n\n(Constitution = droit constitutionnel). \n\nA. La définition matérielle du droit constitutionnel \n→ organiser le pouvoir politique de la même manière sur tout le territoire français. Le droit constitutionnel est pensé comme une norme fondamentale (= qui pose les fondements de la société politique qu’on établit), une norme suprême.\n1. L’organisation du pouvoir politique : une norme fondamentale \nDès 1789, il faut faire table rase du passé, on veut construire une société nouvelle. L’article 16 de la DDHC (toujours en vigueur aujourd’hui) : “Toute société, dans laquelle la garantie des droits n’est pas assurée, ni la séparation des pouvoirs déterminée n’a point de Constitution”. → toujours du droit positif, il organise le pouvoir politique et garantie les droits et libertés humains. \n\na. L’institutionnalisation du pouvoir politique \nLa DDHC évoque la séparation des pouvoirs politique. \nElle existe depuis 1789, qu’en vertu du droit constitutionnel, c’est la Constitution qui fait tout (ex : il y a un président, élu pour 5 ans, car c’est écrit dans la Constitution sinon rien de tout cela ne serait possible). La Constitution crée un Parlement, c’est celui-ci qui vote les lois. \n\nLa Constitution a vocation à organiser le pouvoir. \nPour toutes les institutions créées par la Constitution, on appelle ces pouvoirs des pouvoirs “constitués” (= qui subit l’action). Alors qu’il existe un auteur de la Constitution, pour le désigner, on parle de pouvoir “constituant” (= qui vient avant la Constitution, c’est autorité politique). \nEn 1958, De Gaulle ne rédige pas la Constitution, cela se fait par référendum (= vote du peuple à une question par oui ou non). \n\nb. La garantie des droits fondamentaux \nC’est le deuxième volet de la matière constitutionnelle, les Hommes sont obligés de faire société. Ils naissent libres et égaux, c’est la société qui limite leur liberté. \nDans la Constitution, on détermine des principes, des droits, des libertés, dont disposent les Hommes, où la loi ne peut pas porter atteinte → c’est une limite de la loi. \nQuand on pose les grands principes de la société, on prévoit que les lois politiques ne peuvent pas porter atteinte. \nCe n’est pas parce que le droit protège les libertés individuelles que ça a toujours été le cas, le droit constitutionnel n’est pas le seul à protéger ces droits. \n→ une règle de droit est faite pour être violée (marginalement) : si elle n’est pas transgressée, le droit n’a plus d'intérêt\n\n2. L’organisation de l’ordre juridique : une norme suprême \nLa Constitution est vue comme une norme suprême, au-dessus de tout ce qui est produit dans un État. \nSi on ne regarde que des normes juridiques, on remarque que tout ça est ordonné, il y a un système juridique. \nUne norme devient du droit à partir du moment où il est rattachable à du droit. \nExemple : quelqu'un nous demande 200€ avec la menace d’une sanction physique (arme, violence), ce n’est pas du droit et on est dans le comportement illégal conforme à la loi. Dans le cas où le fisc nous demande la même chose, c’est du droit car il y a une norme qui autorise l’agent du fisc à nous demander cette somme, c’est une norme juridique. \nDans les 2 cas, il est possible de ne pas obtempérer. \nDans un cas, on est dans le système juridique (fisc), dans l’autre, on n’est pas dans le système juridique (racket). \n\n→ Théorie de Hans Kelsen — Juriste. Il a révolutionné le droit, il a pensé la hiérarchie des normes, appelle “la pyramide de Kelsen”. \nC'est la meilleure manière de garantir l’unité au sein de la pluralité, qui attire sous son emprise des éléments divers pour en créer une nouvelle.\nToutes les normes qui composent le droit n’ont pas les mêmes valeurs, certaines sont supérieures et d’autres inférieures. \n\nLa loi se définit comme une norme de portée générale et impersonnelle. On estime que la loi doit être votée par un Parlement, élu par les citoyens. \nLa loi c’est le droit, le droit c’est la loi. \nLa prise des décrets, ou d'arrêtés sont des actes administratifs. \nLes contrats, sont des actes juridiques et sont des normes. \nC’est le résultat d’une réflexion, d’une façon de penser entres les normes. Il ne faut pas uniquement décrire le contenu des normes mais plutôt la définir, pour cela il faut la comprendre. \n\nLa Constitution est au sommet de la hiérarchie des normes, elle est suprême car la Constitution détermine ce qu’est une loi. Elle détermine que si une loi porte atteinte à l’ordre juridique n’est pas une loi. \nPour savoir si une loi est conforme, on se réfère à la Constitution. \n\nChaque norme tire sa validité (= existence comme droit) de sa conformité aux normes supérieures. Une norme est inférieure à une autre norme dès lors qu’elle existe par rapport à une autre norme. \nLa Constitution n’est inférieure à rien. \nLa Constitution est suprême car il y a aucune norme juridique qui ne lui est supérieure dans l'ordre juridique interne.\n\na. La détermination de la procédure législative \nLes règles de droit sont ordonnées entre elles : on parle d’ordonnancement juridique ou d’ordre juridique. \nUne norme ne sort pas de nulle part : les normes sont liées les unes aux autres et appartiennent à un ensemble plus large qui permet de leur donner un sens et de les rattacher au reste du droit.\nUn commandement devient une règle de droit lorsqu’il est rattaché à un ordre juridique plus large. Il n’existe donc pas de norme juridique autonome, indépendante du système juridique. \nExemple : Hans Kelsen donne l’exemple d’une personne qui demande de l’argent en menaçant quelqu’un de conséquences s’il ne paie pas. Si un homme demande de l’argent en disant « donne-moi de l’argent sinon il va t’arriver des problèmes », il s’agit d’un commandement, mais ce n’est pas une règle de droit : il s’agit plutôt d’un racket, car ce commandement est extérieur au système juridique. En revanche, si un agent du fisc demande de l’argent en indiquant que des conséquences sont prévues en cas de non-paiement, son commandement relève du droit, car cet agent est habilité par le droit et applique la loi. Ainsi, un commandement devient une norme juridique lorsqu’il est rattaché au système juridique.\nLa meilleure manière de garantir l’unité du droit malgré la pluralité des normes est de les hiérarchiser. Cette idée est notamment représentée par la pyramide de Kelsen. Toutes les normes qui composent le droit n’ont pas la même valeur. Elles sont organisées selon une hiérarchie et les normes inférieures doivent respecter les normes qui leur sont supérieures. \nOn retrouve ainsi, de manière générale, la Constitution, puis le droit international, les lois, les actes administratifs tels que les décrets et les arrêtés, puis les contrats. \nChaque norme tire son existence en tant que norme juridique et sa validité de sa conformité aux normes qui lui sont supérieures. Les normes inférieures doivent donc satisfaire aux exigences des normes supérieures. \nLa Constitution est la norme fondamentale : elle est supérieure aux autres normes et définit notamment les conditions de validité de la loi. On peut ainsi retenir qu’elle est « supérieure à tout et inférieure à rien ». \nLe droit international comprend notamment les traités internationaux, qui sont des accords écrits conclus entre des États ou des organisations internationales afin de fixer des règles et de créer des engagements réciproques.\n La loi se définit comme une norme de portée générale et impersonnelle. Elle est considérée comme l’expression de la volonté générale et, à ce titre, elle doit être adoptée, délibérée et discutée par un Parlement élu par les citoyens. La loi occupe une place centrale dans le système juridique : la Constitution est fondamentale, mais la loi constitue le cœur du droit, autour duquel s’organisent les autres normes.\n\n\nb. La détermination de la hiérarchie des normes \nLes actes administratifs peuvent être des arrêtés, qui sont notamment pris par les ministres, les préfets ou les maires, ou des décrets. \nPar exemple, un maire peut modifier les pistes cyclables de sa commune, mais sa décision reste soumise au respect de la loi.\nLes décrets peuvent être réglementaires, lorsqu’ils posent une règle générale qui s’applique à un nombre indéterminé de personnes, ou individuels, lorsqu’ils ne concernent qu’une ou plusieurs personnes déterminées. Il existe également deux types de décrets : les décrets d’application, qui précisent les modalités d’application d’une loi, et les décrets autonomes, qui concernent des sujets ne relevant pas du domaine de la loi.\nLe premier traité international est le traité de Roskilde en 1658, qui met fin à la guerre entre le Danemark et la Suède.\nLe droit international se situe en dessous de la Constitution, car celle-ci fixe le cadre dans lequel les normes peuvent être considérées comme valides et notamment les procédures à respecter.\nLe principe est que chaque norme tire sa validité, c’est-à-dire son existence en tant que droit, de sa conformité aux normes qui lui sont supérieures. Les normes inférieures doivent donc satisfaire aux exigences des normes supérieures. Il existe autant d’ordres juridiques qu’il existe d’États. Un ordre juridique correspond à l’ensemble des règles qui, pour un État et à un moment donné, définissent le statut des personnes publiques et privées ainsi que les rapports juridiques qui existent entre elles. \nPour qu’un traité international soit considéré comme du droit et puisse être appliqué, il doit respecter la hiérarchie des normes. \nLa Constitution est supérieure au traité international et à la loi, car elle fixe les conditions de leur validité : elle est donc la norme suprême. \nLa loi est également située en dessous de la Constitution, car il n’existe pas de norme supérieure permettant de déterminer la validité de la Constitution elle-même : la Constitution ne tire pas sa validité d’une autre norme. La loi est également en dessous du droit international, la Constitution déterminant la place de celui-ci, notamment à travers son article 55.\n\nPour que la hiérarchie des normes ait réellement un effet, il faut mettre en place des moyens permettant de déterminer lorsqu’une norme n’est pas respectée. Il est donc possible de contester une norme et, par exemple, d’invalider un contrat au nom de la loi. Il existe ainsi un système de contrôle permettant de vérifier le respect de la hiérarchie des normes, notamment avec le contrôle de constitutionnalité des lois.\nEn droit constitutionnel, il faut distinguer le phénomène de l’élection, qui repose sur un système de votation, de celui de la nomination. Une personne n’est pas « votée », elle est élue. L’élection permet de désigner une personne pour exercer un mandat. La nomination, quant à elle, correspond à une décision qui n’est pas nécessairement collégiale et qui se distingue donc du vote.\nPar exemple, le Premier ministre n’est pas élu mais nommé par le Président de la République. Le Président de la République n’est pas membre du Gouvernement : le Gouvernement est composé des ministres et le Président nomme le Gouvernement.\nIl faut également distinguer l’élection du référendum. L’élection permet de désigner quelqu’un pour occuper un poste, tandis que le référendum consiste à répondre directement à une question portant sur le fond. Il existe des référendums à différents niveaux : communal, régional et national. \nLe référendum législatif débouche sur l’adoption d’une loi. Le régime de De Gaulle voulait faire du référendum un mécanisme classique de prise de décision, mais cette architecture a progressivement disparu.\nLa délibération est un débat ayant pour objectif de parvenir à une décision. Il s’agit d’un mécanisme juridique et d’un processus intellectuellement démocratique.\n La consultation, quant à elle, est également un phénomène juridique : c’est une procédure qui consiste à demander l’avis de certaines personnes ou d’une collectivité de personnes. Elle peut donner lieu à un débat ou à une controverse et peut parfois constituer une étape préalable à une prise de décision politique.\nDans le droit constitutionnel contemporain, la délibération est placée au centre de la prise de décision politique, tandis que la consultation occupe une place moins importante.\nLe Parlement est composé de chambres délibératives qui prennent les décisions concernant les lois par un vote à la majorité. Le Parlement détient ainsi le pouvoir législatif, c’est-à-dire le pouvoir de faire la loi.\nDans les systèmes constitutionnels, le pouvoir législatif est confié à une ou plusieurs assemblées délibératives, notamment au Parlement : « parlementer » signifie en effet débattre et délibérer.\nLe pouvoir constituant est le pouvoir qui fait la Constitution. \nLe pouvoir législatif est le pouvoir qui fait la loi.\n\nB. La définition formelle du droit constitutionnel \nDéfinition de la définition formation : La forme, c‘est la procédure d’adoption. Quand on se demande si la forme est respectée, ça renvoie à se demander si la procédure a été adoptée conformément. \nEn général la même procédure qui permet de créer du droit permet aussi de modifier ou d’abroger ce droit (=Parallélisme des formes). Quand on parle de définition formelle du droit constitutionnel. on parle de comment on fait une constitution. On essaye de définir le pouvoir constituant (l’auteur de la constitution) ce qui permet de donner une valeur au droit. ça suppose une procédure référendaire (Constitution de 1958). \nC’est quoi la définition formelle du droit constitutionnel? \nIl s’agit d’un droit dont l’adoption et la modification font l’objet d’une procédure particulièrement contraignante et solennelle par rapport à la loi ordinaire.\n Cette définition est RELATIVE. \nLa procédure constitutionnelle est très souvent similaire d’un état à un autre. \nComment on adopte une loi? \nD’abord il faut une initiative, qui prend souvent la forme d’un texte. C'est-à-dire d’un projet de loi, issu d’un membre du gouvernement tandis que les membres du parlement disposent aussi d’une initiative, mais on parle de proposition de loi.\nProjet= Pouvoir exécutif  | Proposition= Pouvoir législatif. \n\nEnsuite il faut un débat, une discussion sur le sujet. La loi doit être débattu sur chacune des 2 chambres du parlement (En France actuellement les 2 chambres sont: L'Assemblée Nationale et le Sénat). Pour que la loi passe il faut qu’elle soit adoptée par la majorité relative (plus de POUR que de CONTRE). \nEnfin pour que la loi soit adoptée il faut qu’elle soit promulguée (signer) par le président de la République. (Chef de l’Etat). On la publie au journal officiel, pour rendre la loi opposable. \nToute loi et processus délibératif doivent respecter ces 3 étapes. \nLe pouvoir constituant suit ces mêmes logiques, mais pour qu’on est une constitution selon la définition formelle il faut que ce soit plus contraignant et plus solennel que la loi ordinaire. \nPour étudier cette forme de la constitution et il faut se concentrer sur le pouvoir constituant, mais il faut distinguer 2 modalités de ce pouvoir constituant, les choses ne sont pas les mêmes selon qu’on cherche à modifier la constitution, la créer. Modifier et créer ne sont pas les mêmes choses. \nDans le cas de création on a un pouvoir constituants originaire= On crée la constitution de toute pièce, dans le cas de la modification on parle de pouvoir constituant dérivé= On change une constituant déjà existante \n\n1789: Révolution française \n1791: Première constitution française \n1958: Constitution actuelle \n1792: Proclamation de la première République. \n\nÉtablir une nouvelle constitution renvoie à abolir l’ancienne.\nLe pouvoir constituant originaire cherche à faire table rase du passé, on redessine les fondements de la République\n\n1. La souveraineté du pouvoir constituant originaire \nC’est celui qui fonde la constitution de toute pièce, or le pouvoir constituant originaire, crée le sommet de la hiérarchie des normes, donc il ne suit aucune règle, car il y a aucune norme qui dit ce qu’il faut mettre dans la constitution.\nLe PCO n’est pas soumis au droit, il met ce qu’il veut dans la constitution. On parle de souveraineté, il a une totale indépendance et liberté, il n'est pas contraint à une norme qui s'impose à lui. \nLa constitution étant la norme suprême, y’a aucune norme qui dit quoi y mettre. Le PCO naît du fait. La définition formelle de la constitution est très difficile, car la PCO n’a pas de loi, pas de norme à suivre pour créer la constitution. (exemple: Napoléon I qui s’autoproclame empereur grâce au PCO).\nEn 1852 on rentre dans un nouvel empire (le 2nd Empire), donc nouveau système constitutionnel,\nEn 1870, Napoléon est capturé par les Prussiens, donc il proclame la République, on fait une constitution. \nLe PCO est difficile à saisir car il ne répond pas à des règles juridiques, tout ce qu’on peut faire pour savoir si il y a un droit  constitutionnel formel est de faire du cas par cas(?).\nCette définition renvoie non seulement à la procédure d’adoption mais aussi à la procédure de modification du droit constitutionnel. Quand on parle de modification constitutionnelle, on parle de révision constitutionnelle(aux USA on appelle ça des amendements). \n\n2. L’encadrement du pouvoir constituant dérivé \nAlors que le PCO se caractérise par sa souveraineté, le PCD se caractérise lui par son encadrement juridique. Il répond à des règles, comment on modifie une constitution? Il est contraint et encadré par le droit. \nPCO = Souverain = crée la constitution \nPCD = encadré = modifie la constitution = basé sur la constitution = dépend de la constitution (dérive d’elle). \nPCD est un pouvoir constitué, mais aussi constituant c’est à dire qu’il est à la fois l’auteur de la constitution (il peut la modifier) mais à condition de respecter les limites de la constitution . C’est la constituante qui prévoit à quel point on peut la modifier. C’est un paradoxe. \nLa PCO prévoit comment on peut changer de Constitution. \nOn cherche à protéger l’œuvre tout en voulant l’adapter au contexte actuel. \n\na. Les contraintes liées aux circonstances de la révision \nDes contraintes procédurales. \nDes contraintes de circonstances temporelles, dans lesquelles on considère qu’on ne peut pas réviser la constitution. Il ne faut pas le faire dans l’urgence. \nLa constitution de 1958 prévoit que lorsque le territoire est occupé par l’ennemi on ne peut pas réviser la constitution (porter atteinte à l’intégrité totale du  territoire national).—Alinéa 4 de Art. 89 (le dernier article de la constitution de la Vème République.)\nOn ne peut pas réviser la constitution lorsqu’il y a une vacance du président de la République, (Vacances =  y’a pas de président élu).\nEn Espagne, on ne peut pas réviser la constitution en état d’urgence. Les contraintes  changent d’un pays à un autre. On n’essaye de la conserver dans un état normal, avant de la modifier.\nL’essentiel de ces contraintes va se baser sur les procédures. (Exemple: en Irlande, la modification de la constitution passe le référendum). \nOn exige les mêmes acteurs de la loi pour \nvérifier la constitution, on exige là une majorité AGGRAVÉE (50% des voix en faveur ou un vote favorable/ majorité des deux tiers dans chaque chambre). Le PCD est limité, car on ne peut pas réviser tout le temps la constitution, il y a des complications en matière de temps (temporalité).\nExemple : Au Portugal il faut minimum 5 ans entre chaque révision de la constitution. Pour prendre le temps de réfléchir. \n\nComment on révise la constitution en France? \nQui a l’initiative ? Les parlementaires, le président… \nEnsuite, une fois qu’on a un texte ça passe devant les chambres du parlement (Assemblée nationale,  Sénat) comme toute loi, majorité simple et relative exigée. Différence avec la loi ordinaire, les deux chambres doivent impérativement se mettre d’accord. Congrès: Sénat + Assemblée Nationale \n8 mars 2024: Dernière révision de la constitution sur l’IVG des femmes. \nLa Constitution formelle se distingue de la loi ordinaire par une procédure de révision plus contraignante. Cette rigidité vise à garantir la stabilité du texte fondamental et à éviter qu’il ne soit modifié trop facilement selon les fluctuations politiques du moment. En France, cette procédure est définie par l’article 89 de la Constitution de 1958, qui prévoit que toute modification constitutionnelle doit être approuvée par le peuple à travers un référendum. Le peuple devient ainsi l’organe qui contrebalance l’initiative parlementaire : si le projet de révision émane du Parlement, il doit obligatoirement être soumis au vote populaire. \nCependant, lorsque l’initiative vient du président de la République, celui-ci peut choisir une autre voie : au lieu d’organiser un référendum, il peut convoquer le Congrès, c’est-à-dire la réunion des deux chambres du Parlement à Versailles. Cette alternative s’explique par la nature même de la révision constitutionnelle, qui exige un consensus politique plus fort que celui nécessaire pour adopter une loi ordinaire. La révision est donc entourée de contraintes procédurales destinées à assurer la légitimité de la modification.\nDepuis 1958, la Constitution française a été modifiée vingt-cinq fois, mais une seule révision a été adoptée par référendum selon la procédure de l’article 89. Cela montre que, dans la pratique, le recours au Congrès est devenu la voie privilégiée.\nPar ailleurs, certaines révisions ont profondément transformé le fonctionnement des institutions, comme celle de 2002, qui a instauré le quinquennat : désormais, le président de la République et les députés sont élus pour cinq ans, contre sept ans auparavant.\nCette procédure illustre la volonté du pouvoir constituant originaire (PCO) de garantir la durée de son œuvre dans le temps. En répartissant le pouvoir de révision entre plusieurs organes politiques, le PCO cherche à éviter qu’un seul acteur ( notamment le Parlement ) puisse modifier la Constitution à lui seul. Ainsi, lorsqu’une proposition de révision émane du Parlement, elle doit nécessairement être validée par le peuple.\nLa révision constitutionnelle est donc plus contraignante que l’adoption d’une loi ordinaire : elle implique un processus collectif, mobilisant plusieurs institutions, afin de préserver la stabilité et la légitimité du texte fondamental.\n\nb. Les contraintes liées à la portée de la révision \nLa Constitution n’est pas souveraine en elle-même ; c’est le pouvoir constituant qui l’est. Autrement dit, la Constitution ne peut pas être personnifiée ni considérée comme une entité autonome : elle est le produit du pouvoir constituant originaire (PCO), qui l’a créée. Ce pouvoir se projette dans le temps et il est normal qu’il puisse la modifier, mais certaines dispositions sont considérées comme essentielles et ne peuvent pas être remises en cause. Ces dispositions constituent les limites matérielles du pouvoir de révision, c’est-à-dire les éléments exclus du champ de la révision.\nEn France, la Constitution de 1958 ne comporte qu’une seule limite matérielle explicite : la forme républicaine du gouvernement. L’article 89, alinéa 5, dispose que « la forme républicaine du gouvernement ne peut faire l’objet d’aucune révision ». Cela signifie que le pouvoir constituant dérivé (PCD) peut tout modifier, sauf transformer le titre de président de la République ou remettre en cause le principe républicain.\nLa République, dans son sens consensuel, s’oppose à la monarchie : elle repose sur un principe électif et non héréditaire. Les organes politiques doivent être élus et non transmis par héritage. L’article 1ᵉʳ de la Constitution précise que la France est une République démocratique, laïque et sociale. Ainsi, une révision qui introduit des éléments contraires à ces valeurs ( par exemple une réforme raciste ou discriminatoire ) porterait atteinte à la nature républicaine du régime, car la République repose sur la laïcité et l’égalité. \nLe principe est simple : tout ce qui n’est pas interdit est autorisé. Le pouvoir de révision peut donc ajouter des droits, mais aussi en supprimer, tant qu’il ne viole pas les limites matérielles fixées par la Constitution. En 2003, la révision constitutionnelle a introduit le principe de décentralisation, reconnaissant une autonomie aux régions, départements et communes vis-à-vis de l’État. Certains ont estimé que cela contredit l’idée d’une République centralisée, mais cette critique a été réfutée : la décentralisation n’est pas contraire à la forme républicaine, elle en est une évolution.\nTous les États ne fixent pas de limites au pouvoir de révision. Et lorsqu’elles existent, elles varient d’un pays à l’autre. Par exemple, aux États-Unis, la forme fédérale de l’État ne peut pas être modifiée : la Constitution repose sur l’union de plusieurs États fédérés. En Allemagne, la Loi fondamentale de 1949 protège à la fois le fédéralisme et les droits fondamentaux : les vingt premiers articles sont intangibles, c’est-à-dire qu’ils ne peuvent subir aucune modification. Ces principes intangibles constituent les limites matérielles du pouvoir de révision.\nAinsi, selon les systèmes constitutionnels, les limites matérielles peuvent protéger des valeurs différentes : la République, le fédéralisme ou les droits fondamentaux. Elles traduisent la volonté de préserver l’identité constitutionnelle de chaque État et de garantir que, même en cas de révision, certaines valeurs demeurent intouchables.\n\nc. L’efficacité limitée des contraintes de la révision \nEn théorie, la Constitution fixe des règles précises pour encadrer le pouvoir de révision. Mais dans la pratique, ces règles peuvent être contournées lorsque le pouvoir politique bénéficie d’un large soutien populaire. Si un consensus existe, la question se pose : faut-il vraiment respecter la forme ? En France, seule l’Assemblée nationale détient la légitimité démocratique, mais le président de la République peut aussi s’appuyer sur le peuple pour légitimer son action. L’article 11 de la Constitution de 1958 prévoit en effet que le président peut soumettre directement au peuple une loi ordinaire par référendum.\nL’exemple le plus marquant est celui de 1962, sous le général de Gaulle. À cette époque, une loi donnant l’indépendance à l’Algérie est adoptée par référendum, dans le cadre des accords d’Évian qui mettent fin à la guerre d’Algérie. De Gaulle utilise ensuite le référendum pour une réforme d’une portée supérieure à une loi ordinaire : il modifie la Constitution en changeant la procédure prévue. Soutenu par une grande majorité du peuple, il viole formellement la Constitution, mais cette violation est acceptée. Ce soutien populaire lui permet de museler le Parlement et d’imposer sa vision politique. En revanche, s’il n’avait pas eu ce soutien, il aurait dû démissionner.\nAinsi, en pratique, les limites juridiques de la révision peuvent être dépassées lorsque la légitimité démocratique l’emporte sur la légalité formelle.\nLa question du contrôle des limites matérielles se pose ensuite. Peut-on garantir le respect des principes intangibles de la Constitution ? En théorie, un juge constitutionnel pourrait exercer un contrôle sur le pouvoir de révision. Mais en France, le Conseil constitutionnel a refusé en 2003 de contrôler le pouvoir constituant dérivé, estimant qu’il n’en avait pas la compétence et que ce pouvoir était souverain. Il ne contrôle que les lois ordinaires. À l’inverse, dans certains États comme l’Allemagne, le juge constitutionnel vérifie que la révision ne remet pas en cause le fédéralisme ni les vingt premiers articles de la Loi fondamentale, qui proclament les droits fondamentaux.\nCependant, même lorsqu’un contrôle existe, il reste possible de contourner les procédures de révision. Dès lors qu’il n’existe pas de contrôle, la révision peut s’effectuer malgré les limites prévues.\nEnfin, il est possible de changer les formes de révision. Même avec un contrôle, des voies de contournement existent, notamment le recours au référendum, qui permet de légitimer une décision ne respectant pas la procédure. Dans ce cas, on ne touche pas directement aux limites matérielles, mais à la procédure elle-même. Le pouvoir constituant dérivé, bien que assujetti à la Constitution, peut modifier celle-ci, mais il ne peut pas tout faire. Par exemple, s’il voulait instaurer une monarchie, il ne pourrait pas modifier la forme républicaine prévue à l’article 89 alinéa 5. Il pourrait toutefois changer cet article pour supprimer la limite, puis réviser la Constitution. Théoriquement, la limite matérielle peut donc être abolie, et le pouvoir constituant dérivé peut s’émanciper pour obtenir une liberté totale d’action.\nLe problème reste le même : il ne faut pas changer la Constitution trop fréquemment, car elle perdrait toute valeur si elle pouvait être modifiée à volonté. Il faut donc pouvoir la faire évoluer tout en conservant ses éléments essentiels, afin de préserver son identité.\nLe pouvoir constituant dérivé est ainsi un idéal confronté à la pratique, où les contournements sont possibles. Le pouvoir constituant originaire, lui, est souverain : il établit la Constitution qui s’impose ensuite aux pouvoirs constitués, parmi lesquels le pouvoir constituant dérivé. Ce dernier peut jouer sur la Constitution, se modifier lui-même, voire s’émanciper complètement. En théorie, il est limité ; en réalité, il tend à devenir plus constituant que constitué, car il peut se donner sa propre liberté d’action. Tout dépend du système constitutionnel, du contexte politique et du degré de contrôle existant.\n\nC. Enjeux des définitions matérielle et formelle du droit constitutionnel \nAu moment de clore la phase de définition de notre objet, il faut bien reconnaître que les 2 définitions ne coïncident pas toujours : \nDes éléments matériellement constitutionnels peuvent ne pas être protégés par une procédure de révision particulière.\nIntégralement : Constitution coutumière britannique.\nPartiellement : mode de scrutin français déterminé par la loi ordinaire (Loi PLM (Paris, Lyon, Marseille) pour les municipales, débat actuel sur la proportionnelle aux élections législatives).\nDes éléments inscrits dans le texte de la Constitution ne relèvent pas au sens strict de la substance constitutionnelle.  \nProlixité de certains constituants, par exemple sur le statut des fonctionnaires.\nProlixité = caractère d'un discours, d'un écrit ou d'une personne qui s'exprime avec trop de mots, de façon excessivement longue et chargée de détails inutiles.\n(De mon point de vue prévaut la définition matérielle, parce qu’il me semble que la définition formelle est trop excluante (1), de même qu’une troisième conception du droit constitutionnel qui tend à se développer en doctrine, celle de la Constitution « normative » (2).)\n\n1. Les limites de la définition formelle de la Constitution : les changements constitutionnels informels \nEncore une fois, il me semble que la définition formelle n’existe qu’au service du fond de la Constitution ; elle est une modalité de la protection de l’œuvre constituante, pas l’œuvre constituante elle-même. Se contenter d’appréhender le droit constitutionnel par sa forme conduit à lui prêter beaucoup d’autorité alors que le détournement de procédure reste possible, comme on l’a vu.\nSurtout, il existe en droit constitutionnel tout un tas de phénomènes qui le font évoluer, sans que le texte ne soit affecté : pas de détournement de procédure au sens strict, plutôt un « contournement » de procédure, dans la mesure où elle n’est pas requise pour que la matière évolue.\n= Nécessaire interprétation (travail essentiel des juristes !) : les textes de loi restent nécessairement abstraits, généraux et doivent être appliqués à des cas concrets. Ils doivent donc être interprétés.\nExemple → article 311-1 du Code pénal : Le vol est la soustraction frauduleuse de la \nchose d'autrui.\nQuid des noisettes ramassées sur le trottoir ou cueillies par-dessus la haie ?\nQuid du voleur de pommes qui cherche à nourrir ses 5 enfants ? Est-il condamné de la même manière que le cambrioleur d’une maison de famille ? Ou de l’auteur d’un vol avec violence dans une bijouterie ? => Appliquer des textes suppose de les interpréter.\nJurisprudence\nInterprétation par les juges qui appliquent la Constitution ; cette jurisprudence est évolutive et constructive ou dynamique (ce qui explique que certaines décisions du Conseil constitutionnel soient particulièrement attendues). Elle permet manifestement de transformer le droit constitutionnel.\nExemple  → Art. 2 DDHC : « Le but de toute association politique est la conservation des droits naturels et imprescriptibles de l'Homme. Ces droits sont la liberté, la propriété, la sûreté, et la résistance à l'oppression », le Conseil constitutionnel en a déduit le droit au respect de la vie privée, y compris le droit à une protection des données personnelles générées par les activités en ligne (2012) et une particulière vigilance sur les données génétiques des citoyens (2023).\nExemple  → décision du 7 août 2025 à propos de la loi Duplomb : la ré-introduction controversée d’un pesticide dans la production agricole est contraire au droit de chacun de vivre dans un environnement sain ; la Constitution interdit donc, depuis cette date, l’usage de certains produits dangereux pour la santé.\nC’est du reste l’un des arguments en faveur d’un juge constitutionnel : il va, par son interprétation au jour le jour, favoriser l’adaptation et l’actualisation du texte constitutionnel, sans qu’il soit besoin de procéder formellement à sa mise à jour.\n \nCoutumes et conventions de la Constitution\nDifférence subtile sur laquelle je ne m’attarde pas : interprétation cette fois non par le juge mais par les institutions politiques, les autres pouvoirs constitués. Ces derniers se mettent d’accord (informellement) pour faire prévaloir une interprétation de la Constitution, soit de leur plein gré, soit forcés par les circonstances.\nExemples pléthoriques :\n-       IIIe République : absence de mention d’un chef de Gouvernement dans les lois constitutionnelles ; dès 1873 émerge pourtant la figure d’un Président du Conseil des ministres.\n-       Ve République : nomination et démission du Gouvernement\n\nArt. 8 : Le Président de la République nomme le Premier ministre. Il met fin à ses fonctions sur la présentation par celui-ci de la démission du Gouvernement. // Sur la proposition du Premier ministre, il nomme les autres membres du Gouvernement et met fin à leurs fonctions.\no   le Président nomme qui il veut si son parti est majoritaire à l’Assemblée nationale (dès de Gaulle en 1958)\no   dans les mêmes circonstances, le Président met un terme au mandat du Gouvernement lorsqu’il le souhaite (Borne 2024, Castex 2023, Philippe 2020…)\no   aucun délai ne s’impose au Président pour procéder à la nomination de l’article 8 (2024).\nL’organisation des pouvoirs politiques et la garantie des droits fondamentaux (= définition matérielle de la Constitution) se trouvent donc altérées, malgré un texte constant, par des mécanismes informels, et insaisissables si on ne se concentre que sur le texte. Il faut aller au-delà du texte et donc du PCD comme élément essentiel de définition de la Constitution.\n\n2. La nécessité d’une définition normative de la Constitution ? *\nConstitution normative = droit constitutionnel qui serait du vrai droit, en ceci qu’il serait appliqué, et non pas seulement une coquille vide et négligeable, ne disposant que d’une force invocatoire ; il n’y aurait de droit constitutionnel qu’autant qu’il y aurait un juge pour s’assurer qu’il est respecté.\nLe droit constitutionnel serait devenu un droit comme les autres dès lors qu’il s’est trouvé doté d’un juge, qu’on appelle le juge constitutionnel et sur lequel je reviendrai plus abondamment très bientôt.\nOr cela reviendrait à :\nConsidérer que le droit se définit par référence au critère de la sanction ou du moins de l’applicabilité par un tribunal, ce qui exclut de fait certaines normes juridiques appartenant indiscutablement au système juridique… (voir supra).\nEstimer qu’il n’y pas de droit constitutionnel en France avant 1958 voire 1971 ; plus de 15 régimes constitutionnels qui se succèdent et qui pourtant ne seraient pas opportuns au titre du droit constitutionnel…\nRegarder certaines dispositions de la Constitution comme non juridiques, dans la mesure où le juge n’en a jamais fait application (articles 8 à 10 de la Charte de l’Environnement, article 8 sur la nomination du PM, article 89 sur la révision de la Constitution…).\nL’établissement d’une justice constitutionnelle a indiscutablement participé à renforcer l’autorité juridique et l’efficacité du droit de la Constitution, en même temps qu’elle a développé les sources de ce droit, en lui adjoignant une jurisprudence de plus en plus abondante. Pour autant, l’essence constitutionnelle gît ailleurs, dans la logique mécaniste des jeux institutionnels, ainsi qu’il en va d’ailleurs depuis les premières ambitions constituantes de l’histoire.\n\n", "html": "<h2>Section 1 - Définitions du droit constitutionnel</h2>\n<p>(Le droit se manifeste par du langage parlé ou écrit.) </p>\n<h3>§1 - La Constitution comme texte</h3>\n<p>La Constitution est présentée comme un texte (écrite, numérotée…). </p>\n<p>Le texte de la Constitution est le support perceptible du droit, c’est un outil de communication pour savoir ce qu’il en est et d’en parler, mais il existe aussi en dehors du texte. </p>\n<p class=\"lesson-note\"> Exemple : si demain la Constitution est brûlée, elle perdure toujours ! </p>\n<p>Comment fixons-nous la liberté ? </p>\n<p>Il y a des principes et des limites à ceux-ci : on est libres OUI mais de tout faire NON. </p>\n<p class=\"lesson-note\">Exemple  : chacun est libre de s’exprimer, or porter atteinte et avoir des propos racistes est interdit, donc la liberté est limitée au nom de celle des autres (article 4 de la Constitution). </p>\n<p>La limite est fixée par la loi et bien d’autres autorités. </p>\n<p>Le droit ne se limite pas à un texte, il le dépasse. </p>\n<p class=\"lesson-note\">Exemple : article 2 de la Constitution</p>\n<p>Le texte n’est qu’un indice, il reste un texte. </p>\n<p>On doit l'interpréter et en déduire sa portée, c’est essentiellement ce à quoi sert le juge. Le texte a besoin d'être traduit essentiellement par des juges. </p>\n<p>En France aujourd’hui, il y a le bloc de constitutionnalité car il permet de brasser plus de textes. On a quand même un texte de la Constitution du 4 octobre 1958, le texte principal auquel le reste va se connaître autour  : </p>\n<p>La DDHC de 1789</p>\n<p>Le préambule de la Constitution de 1946 (qui proclame pleins de valeurs)</p>\n<p>La charte de l’environnement </p>\n<p>adoptée en 2004 et constitutionnalisée en 2005 (10 articles qui proclament des droits environnementaux). </p>\n<h3>§2 - La Constitution comme droit</h3>\n<p>Au XVIIIe siècle, les Corses revendiquent l’invention de la Constitution en 1768 par un mouvement indépendantiste, par Pasquale Paoli.  </p>\n<p>En 1789, en France, durant la Révolution française, instaure sa première Constitution parce que les français veulent mettre un terme à la monarchie, on veut changer la manière dont on veut diriger le pays. On veut séparer le pouvoir, on pense alors que la Constitution est le moyen pour changer les pouvoirs. </p>\n<p>→ On définit alors le droit constitutionnel comme un droit qui définit le droit politique. </p>\n<p>Le droit constitutionnel à raison de sa matière : c’est l'organisation du pouvoir politique. </p>\n<p>Le droit résulte d’une procédure particulière d’adoption. </p>\n<p>En droit il y a des dichotomies, c’est-à-dire deux parties, bien souvent, qui s'opposent. </p>\n<p>(Constitution = droit constitutionnel). </p>\n<h4>A. La définition matérielle du droit constitutionnel</h4>\n<p>→ organiser le pouvoir politique de la même manière sur tout le territoire français. Le droit constitutionnel est pensé comme une norme fondamentale (= qui pose les fondements de la société politique qu’on établit), une norme suprême.</p>\n<h5>1. L’organisation du pouvoir politique : une norme fondamentale</h5>\n<p>Dès 1789, il faut faire table rase du passé, on veut construire une société nouvelle. L’article 16 de la DDHC (toujours en vigueur aujourd’hui) : “Toute société, dans laquelle la garantie des droits n’est pas assurée, ni la séparation des pouvoirs déterminée n’a point de Constitution”. → toujours du droit positif, il organise le pouvoir politique et garantie les droits et libertés humains. </p>\n<h6>a. L’institutionnalisation du pouvoir politique</h6>\n<p>La DDHC évoque la séparation des pouvoirs politique. </p>\n<p>Elle existe depuis 1789, qu’en vertu du droit constitutionnel, c’est la Constitution qui fait tout (ex : il y a un président, élu pour 5 ans, car c’est écrit dans la Constitution sinon rien de tout cela ne serait possible). La Constitution crée un Parlement, c’est celui-ci qui vote les lois. </p>\n<p>La Constitution a vocation à organiser le pouvoir. </p>\n<p>Pour toutes les institutions créées par la Constitution, on appelle ces pouvoirs des pouvoirs “constitués” (= qui subit l’action). Alors qu’il existe un auteur de la Constitution, pour le désigner, on parle de pouvoir “constituant” (= qui vient avant la Constitution, c’est autorité politique). </p>\n<p>En 1958, De Gaulle ne rédige pas la Constitution, cela se fait par référendum (= vote du peuple à une question par oui ou non). </p>\n<h6>b. La garantie des droits fondamentaux</h6>\n<p>C’est le deuxième volet de la matière constitutionnelle, les Hommes sont obligés de faire société. Ils naissent libres et égaux, c’est la société qui limite leur liberté. </p>\n<p>Dans la Constitution, on détermine des principes, des droits, des libertés, dont disposent les Hommes, où la loi ne peut pas porter atteinte → c’est une limite de la loi. </p>\n<p>Quand on pose les grands principes de la société, on prévoit que les lois politiques ne peuvent pas porter atteinte. </p>\n<p>Ce n’est pas parce que le droit protège les libertés individuelles que ça a toujours été le cas, le droit constitutionnel n’est pas le seul à protéger ces droits. </p>\n<p>→ une règle de droit est faite pour être violée (marginalement) : si elle n’est pas transgressée, le droit n’a plus d'intérêt</p>\n<h5>2. L’organisation de l’ordre juridique : une norme suprême</h5>\n<p>La Constitution est vue comme une norme suprême, au-dessus de tout ce qui est produit dans un État. </p>\n<p>Si on ne regarde que des normes juridiques, on remarque que tout ça est ordonné, il y a un système juridique. </p>\n<p>Une norme devient du droit à partir du moment où il est rattachable à du droit. </p>\n<p class=\"lesson-note\">Exemple : quelqu'un nous demande 200€ avec la menace d’une sanction physique (arme, violence), ce n’est pas du droit et on est dans le comportement illégal conforme à la loi. Dans le cas où le fisc nous demande la même chose, c’est du droit car il y a une norme qui autorise l’agent du fisc à nous demander cette somme, c’est une norme juridique. </p>\n<p>Dans les 2 cas, il est possible de ne pas obtempérer. </p>\n<p>Dans un cas, on est dans le système juridique (fisc), dans l’autre, on n’est pas dans le système juridique (racket). </p>\n<p>→ Théorie de Hans Kelsen — Juriste. Il a révolutionné le droit, il a pensé la hiérarchie des normes, appelle “la pyramide de Kelsen”. </p>\n<p>C'est la meilleure manière de garantir l’unité au sein de la pluralité, qui attire sous son emprise des éléments divers pour en créer une nouvelle.</p>\n<p>Toutes les normes qui composent le droit n’ont pas les mêmes valeurs, certaines sont supérieures et d’autres inférieures. </p>\n<p>La loi se définit comme une norme de portée générale et impersonnelle. On estime que la loi doit être votée par un Parlement, élu par les citoyens. </p>\n<p>La loi c’est le droit, le droit c’est la loi. </p>\n<p>La prise des décrets, ou d'arrêtés sont des actes administratifs. </p>\n<p>Les contrats, sont des actes juridiques et sont des normes. </p>\n<p>C’est le résultat d’une réflexion, d’une façon de penser entres les normes. Il ne faut pas uniquement décrire le contenu des normes mais plutôt la définir, pour cela il faut la comprendre. </p>\n<p>La Constitution est au sommet de la hiérarchie des normes, elle est suprême car la Constitution détermine ce qu’est une loi. Elle détermine que si une loi porte atteinte à l’ordre juridique n’est pas une loi. </p>\n<p>Pour savoir si une loi est conforme, on se réfère à la Constitution. </p>\n<p>Chaque norme tire sa validité (= existence comme droit) de sa conformité aux normes supérieures. Une norme est inférieure à une autre norme dès lors qu’elle existe par rapport à une autre norme. </p>\n<p>La Constitution n’est inférieure à rien. </p>\n<p>La Constitution est suprême car il y a aucune norme juridique qui ne lui est supérieure dans l'ordre juridique interne.</p>\n<h6>a. La détermination de la procédure législative</h6>\n<p>Les règles de droit sont ordonnées entre elles : on parle d’ordonnancement juridique ou d’ordre juridique. </p>\n<p>Une norme ne sort pas de nulle part : les normes sont liées les unes aux autres et appartiennent à un ensemble plus large qui permet de leur donner un sens et de les rattacher au reste du droit.</p>\n<p>Un commandement devient une règle de droit lorsqu’il est rattaché à un ordre juridique plus large. Il n’existe donc pas de norme juridique autonome, indépendante du système juridique. </p>\n<p class=\"lesson-note\">Exemple : Hans Kelsen donne l’exemple d’une personne qui demande de l’argent en menaçant quelqu’un de conséquences s’il ne paie pas. Si un homme demande de l’argent en disant « donne-moi de l’argent sinon il va t’arriver des problèmes », il s’agit d’un commandement, mais ce n’est pas une règle de droit : il s’agit plutôt d’un racket, car ce commandement est extérieur au système juridique. En revanche, si un agent du fisc demande de l’argent en indiquant que des conséquences sont prévues en cas de non-paiement, son commandement relève du droit, car cet agent est habilité par le droit et applique la loi. Ainsi, un commandement devient une norme juridique lorsqu’il est rattaché au système juridique.</p>\n<p>La meilleure manière de garantir l’unité du droit malgré la pluralité des normes est de les hiérarchiser. Cette idée est notamment représentée par la pyramide de Kelsen. Toutes les normes qui composent le droit n’ont pas la même valeur. Elles sont organisées selon une hiérarchie et les normes inférieures doivent respecter les normes qui leur sont supérieures. </p>\n<p>On retrouve ainsi, de manière générale, la Constitution, puis le droit international, les lois, les actes administratifs tels que les décrets et les arrêtés, puis les contrats. </p>\n<p>Chaque norme tire son existence en tant que norme juridique et sa validité de sa conformité aux normes qui lui sont supérieures. Les normes inférieures doivent donc satisfaire aux exigences des normes supérieures. </p>\n<p>La Constitution est la norme fondamentale : elle est supérieure aux autres normes et définit notamment les conditions de validité de la loi. On peut ainsi retenir qu’elle est « supérieure à tout et inférieure à rien ». </p>\n<p>Le droit international comprend notamment les traités internationaux, qui sont des accords écrits conclus entre des États ou des organisations internationales afin de fixer des règles et de créer des engagements réciproques.</p>\n<p> La loi se définit comme une norme de portée générale et impersonnelle. Elle est considérée comme l’expression de la volonté générale et, à ce titre, elle doit être adoptée, délibérée et discutée par un Parlement élu par les citoyens. La loi occupe une place centrale dans le système juridique : la Constitution est fondamentale, mais la loi constitue le cœur du droit, autour duquel s’organisent les autres normes.</p>\n<h6>b. La détermination de la hiérarchie des normes</h6>\n<p>Les actes administratifs peuvent être des arrêtés, qui sont notamment pris par les ministres, les préfets ou les maires, ou des décrets. </p>\n<p>Par exemple, un maire peut modifier les pistes cyclables de sa commune, mais sa décision reste soumise au respect de la loi.</p>\n<p>Les décrets peuvent être réglementaires, lorsqu’ils posent une règle générale qui s’applique à un nombre indéterminé de personnes, ou individuels, lorsqu’ils ne concernent qu’une ou plusieurs personnes déterminées. Il existe également deux types de décrets : les décrets d’application, qui précisent les modalités d’application d’une loi, et les décrets autonomes, qui concernent des sujets ne relevant pas du domaine de la loi.</p>\n<p>Le premier traité international est le traité de Roskilde en 1658, qui met fin à la guerre entre le Danemark et la Suède.</p>\n<p>Le droit international se situe en dessous de la Constitution, car celle-ci fixe le cadre dans lequel les normes peuvent être considérées comme valides et notamment les procédures à respecter.</p>\n<p>Le principe est que chaque norme tire sa validité, c’est-à-dire son existence en tant que droit, de sa conformité aux normes qui lui sont supérieures. Les normes inférieures doivent donc satisfaire aux exigences des normes supérieures. Il existe autant d’ordres juridiques qu’il existe d’États. Un ordre juridique correspond à l’ensemble des règles qui, pour un État et à un moment donné, définissent le statut des personnes publiques et privées ainsi que les rapports juridiques qui existent entre elles. </p>\n<p>Pour qu’un traité international soit considéré comme du droit et puisse être appliqué, il doit respecter la hiérarchie des normes. </p>\n<p>La Constitution est supérieure au traité international et à la loi, car elle fixe les conditions de leur validité : elle est donc la norme suprême. </p>\n<p>La loi est également située en dessous de la Constitution, car il n’existe pas de norme supérieure permettant de déterminer la validité de la Constitution elle-même : la Constitution ne tire pas sa validité d’une autre norme. La loi est également en dessous du droit international, la Constitution déterminant la place de celui-ci, notamment à travers son article 55.</p>\n<p>Pour que la hiérarchie des normes ait réellement un effet, il faut mettre en place des moyens permettant de déterminer lorsqu’une norme n’est pas respectée. Il est donc possible de contester une norme et, par exemple, d’invalider un contrat au nom de la loi. Il existe ainsi un système de contrôle permettant de vérifier le respect de la hiérarchie des normes, notamment avec le contrôle de constitutionnalité des lois.</p>\n<p>En droit constitutionnel, il faut distinguer le phénomène de l’élection, qui repose sur un système de votation, de celui de la nomination. Une personne n’est pas « votée », elle est élue. L’élection permet de désigner une personne pour exercer un mandat. La nomination, quant à elle, correspond à une décision qui n’est pas nécessairement collégiale et qui se distingue donc du vote.</p>\n<p>Par exemple, le Premier ministre n’est pas élu mais nommé par le Président de la République. Le Président de la République n’est pas membre du Gouvernement : le Gouvernement est composé des ministres et le Président nomme le Gouvernement.</p>\n<p>Il faut également distinguer l’élection du référendum. L’élection permet de désigner quelqu’un pour occuper un poste, tandis que le référendum consiste à répondre directement à une question portant sur le fond. Il existe des référendums à différents niveaux : communal, régional et national. </p>\n<p>Le référendum législatif débouche sur l’adoption d’une loi. Le régime de De Gaulle voulait faire du référendum un mécanisme classique de prise de décision, mais cette architecture a progressivement disparu.</p>\n<p>La délibération est un débat ayant pour objectif de parvenir à une décision. Il s’agit d’un mécanisme juridique et d’un processus intellectuellement démocratique.</p>\n<p> La consultation, quant à elle, est également un phénomène juridique : c’est une procédure qui consiste à demander l’avis de certaines personnes ou d’une collectivité de personnes. Elle peut donner lieu à un débat ou à une controverse et peut parfois constituer une étape préalable à une prise de décision politique.</p>\n<p>Dans le droit constitutionnel contemporain, la délibération est placée au centre de la prise de décision politique, tandis que la consultation occupe une place moins importante.</p>\n<p>Le Parlement est composé de chambres délibératives qui prennent les décisions concernant les lois par un vote à la majorité. Le Parlement détient ainsi le pouvoir législatif, c’est-à-dire le pouvoir de faire la loi.</p>\n<p>Dans les systèmes constitutionnels, le pouvoir législatif est confié à une ou plusieurs assemblées délibératives, notamment au Parlement : « parlementer » signifie en effet débattre et délibérer.</p>\n<p>Le pouvoir constituant est le pouvoir qui fait la Constitution. </p>\n<p>Le pouvoir législatif est le pouvoir qui fait la loi.</p>\n<h4>B. La définition formelle du droit constitutionnel</h4>\n<p>Définition de la définition formation : La forme, c‘est la procédure d’adoption. Quand on se demande si la forme est respectée, ça renvoie à se demander si la procédure a été adoptée conformément. </p>\n<p>En général la même procédure qui permet de créer du droit permet aussi de modifier ou d’abroger ce droit (=Parallélisme des formes). Quand on parle de définition formelle du droit constitutionnel. on parle de comment on fait une constitution. On essaye de définir le pouvoir constituant (l’auteur de la constitution) ce qui permet de donner une valeur au droit. ça suppose une procédure référendaire (Constitution de 1958). </p>\n<p>C’est quoi la définition formelle du droit constitutionnel? </p>\n<p>Il s’agit d’un droit dont l’adoption et la modification font l’objet d’une procédure particulièrement contraignante et solennelle par rapport à la loi ordinaire.</p>\n<p> Cette définition est RELATIVE. </p>\n<p>La procédure constitutionnelle est très souvent similaire d’un état à un autre. </p>\n<p>Comment on adopte une loi? </p>\n<p>D’abord il faut une initiative, qui prend souvent la forme d’un texte. C'est-à-dire d’un projet de loi, issu d’un membre du gouvernement tandis que les membres du parlement disposent aussi d’une initiative, mais on parle de proposition de loi.</p>\n<p>Projet= Pouvoir exécutif  | Proposition= Pouvoir législatif. </p>\n<p>Ensuite il faut un débat, une discussion sur le sujet. La loi doit être débattu sur chacune des 2 chambres du parlement (En France actuellement les 2 chambres sont: L'Assemblée Nationale et le Sénat). Pour que la loi passe il faut qu’elle soit adoptée par la majorité relative (plus de POUR que de CONTRE). </p>\n<p>Enfin pour que la loi soit adoptée il faut qu’elle soit promulguée (signer) par le président de la République. (Chef de l’Etat). On la publie au journal officiel, pour rendre la loi opposable. </p>\n<p>Toute loi et processus délibératif doivent respecter ces 3 étapes. </p>\n<p>Le pouvoir constituant suit ces mêmes logiques, mais pour qu’on est une constitution selon la définition formelle il faut que ce soit plus contraignant et plus solennel que la loi ordinaire. </p>\n<p>Pour étudier cette forme de la constitution et il faut se concentrer sur le pouvoir constituant, mais il faut distinguer 2 modalités de ce pouvoir constituant, les choses ne sont pas les mêmes selon qu’on cherche à modifier la constitution, la créer. Modifier et créer ne sont pas les mêmes choses. </p>\n<p>Dans le cas de création on a un pouvoir constituants originaire= On crée la constitution de toute pièce, dans le cas de la modification on parle de pouvoir constituant dérivé= On change une constituant déjà existante </p>\n<p>1789: Rév
