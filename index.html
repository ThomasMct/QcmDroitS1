<style>
/* Mise en page : une colonne. Accueil = matières empilées, quiz = une question par écran, résultat = score + erreurs à revoir. */
:root {

  }

  --surface: #161d2e;
  --fg: #e7ebf3;

  --line: #27314a;
  --good: #4cc38a;

body {

  flex: none; min-width: 64px; height: 56px; padding: 0 10px; border-radius: 14px;
  background: color-mix(in srgb, var(--c) 13%, var(--surface));
  display: grid; place-items: center; font-size: 1.55rem; line-height: 1; letter-spacing: .08em;
}

/* Interrupteurs de mélange */
.switches { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 10px; margin: 0 0 16px; }
.sw {
  display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; min-width: 0;

}

.opt.wrong .tag { color: var(--bad); }

.fb { margin: 18px 0 0; padding: 12px 14px; border-radius: 10px; font-weight: 500; }

/* Choix du mode */
.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }

.row.course-child { margin-inline-start: clamp(16px, 4vw, 32px); width: auto; align-self: stretch; }
.course-chapter { color:var(--c); margin:28px 0 14px; font-size:1.4rem; }

/* Flashcards */
.fcard {
  display: flex; flex-direction: column; justify-content: center; gap: 14px; width: 100%; min-height: 260px;

/* Flashcards : deux faces superposées et geste tactile */
.fc-stage { margin-top:24px; }
.fcard { display:grid; position:relative; margin:0; padding:0; border:0; background:transparent; min-height:260px; transform-style:preserve-3d; transition:transform .48s cubic-bezier(.2,.7,.25,1); }
.fcard.is-flipped { transform:rotateY(180deg); }
.fc-face { grid-area:1/1; display:flex; flex-direction:column; justify-content:center; gap:14px; min-height:260px; box-sizing:border-box; padding:28px 24px; background:var(--surface); border:1.5px solid var(--line); border-radius:18px; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
.fc-answer { transform:rotateY(180deg); border-color:var(--c); background:color-mix(in srgb,var(--c) 9%,var(--surface)); }
.fc-answer .side { color:var(--c); }

.fc-drag.can-swipe, .fc-drag.can-swipe * { touch-action:none; }

.fc-stamp { position:absolute; top:12px; right:12px; z-index:2; padding:5px 10px; border:2px solid currentColor; border-radius:8px; font-weight:700; opacity:0; pointer-events:none; background:var(--surface); }
.fc-stamp.yes { color:var(--good); } .fc-stamp.no { color:var(--bad); }

@media (pointer:coarse) { .fc-mobile { display:flex; justify-content:space-between; gap:12px; font-size:.88rem; margin-top:14px; font-weight:600; } .fc-desktop { display:none; } .fc-drag { user-select:none; -webkit-user-select:none; } }

var LETTERS = ["A", "B", "C", "D"];
var KEY = "qcm-revisions-v1";
var app = document.getElementById("app");
/* S.items : questions du QCM en cours, chacune avec l'ordre d'affichage de ses réponses (map) */
var S = { view: "home", subject: null, qcm: null, items: [], i: 0, picks: [], shuffleQ: false, shuffleA: false, partial: false, last: null,
  /* flashcards */ deck: null, cards: [], ci: 0, flipped: false, known: [], missed: [], shuffleC: false };

function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function loadStats() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function saveStats(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }
function findSubject(id) { return SUBJECTS.filter(function (s) { return s.id === id; })[0]; }
function findQcm(s, id) { return s.qcms.filter(function (q) { return q.id === id; })[0]; }
function plural(n, one, many) { return n + " " + (n > 1 ? many : one); }
function shuffleArr(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function correctPos(it) { return it.map.indexOf(S.qcm.questions[it.qi][2]); }

/* ---------- Vues ---------- */
function homeView() {
  var cards = SUBJECTS.map(function (s) {
    var nq = s.qcms.reduce(function (n, q) { return n + q.questions.length; }, 0);
    var state = plural(s.qcms.length, "QCM", "QCM") + " · " + plural(nq, "flashcard", "flashcards");
    return '<button class="card" data-act="subject" data-id="' + s.id + '" style="--c:var(' + s.color + ')">' +
      '<span class="emo" aria-hidden="true">' + s.emoji + "</span>" +
      '<span class="ct"><h2>' + esc(s.name) + '</h2><span class="state' + (s.qcms.length ? "" : " off") + '">' + state + "</span></span>" +
      '<span class="chev" aria-hidden="true">›</span></button>';
  }).join("");
  return '<p class="brand">Révisions</p><h1 tabindex="-1" id="focus">Choisis une matière</h1>' +
    '<p class="lead">Révise en QCM ou en flashcards. Ton score est gardé sur cet appareil.</p>' +
    '<div class="stack">' + cards + "</div>" +
    '<button class="card feedback-link" data-act="feedback" style="--c:var(--c-const)"><span class="emo" aria-hidden="true">💬</span><span class="ct"><h2>Suggestions et signalements</h2><span class="state off">Une idée, une erreur ou un problème ?</span></span><span class="chev" aria-hidden="true">›</span></button>';
}

function switchBtn(id, key, icon, title, onText, offText) {
  var on = S[key];
  return '<button class="sw" id="' + id + '" role="switch" aria-checked="' + on + '" data-act="toggle" data-k="' + key + '">' +
    '<span class="ico" aria-hidden="true">' + icon + "</span>" +
    '<span class="txt"><strong>' + title + "</strong><span>" + (on ? onText : offText) + "</span></span>" +
    '<span class="track" aria-hidden="true"></span></button>';
}

function subjectView() {
  var s = findSubject(S.subject), stats = loadStats();
  var body;
  if (!s.qcms.length) {
    body = '<div class="empty">Cette matière n\'a pas encore de QCM. Envoie tes questions à Claude et elles seront ajoutées ici.</div>';
  } else {
    body = '<div class="switches">' +
      switchBtn("sw-q", "shuffleQ", "🔀", "Mélanger les questions", "Ordre aléatoire", "Ordre du cours") +
      switchBtn("sw-a", "shuffleA", "🎲", "Mélanger les réponses", "Réponses dans un ordre aléatoire", "Ordre d'origine (A, B, C, D)") +
      '</div><div class="list">' + s.qcms.map(function (q) {
        var st = stats[q.id], n = q.questions.length;
        var info = st ? "Dernier score : " + st.last + "/" + n + " · Meilleur : " + st.best + "/" + n : "Pas encore fait";
        return '<button class="row" data-act="start" data-id="' + q.id + '"><span class="rt"><strong>' + esc(q.title) + '</strong><span class="meta">' +
          plural(n, "question", "questions") + " · " + info + '</span></span><span class="go">' + (st ? "Refaire" : "Commencer") + "</span></button>";
      }).join("") + "</div>";
  }
  return '<button class="back" data-act="modes">← Modes de révision</button>' +
    '<div style="--c:var(' + s.color + ')"><p class="brand">QCM</p><div class="title-row"><span class="emo" aria-hidden="true">' + s.emoji + '</span><h1 tabindex="-1" id="focus" style="color:var(--c)">' + esc(s.name) + "</h1></div></div>" +
    '<div style="--c:var(' + s.color + ');margin-top:20px">' + body + "</div>";
}

function quizView() {
  var s = findSubject(S.subject), q = S.qcm, total = S.items.length;
  var it = S.items[S.i], item = q.questions[it.qi], good = correctPos(it);
  var pick = S.picks[S.i], locked = pick !== undefined && pick !== null;
  var okSoFar = 0;
  for (var k = 0; k < S.picks.length; k++) { if (S.picks[k] === correctPos(S.items[k])) okSoFar++; }
  var answered = S.picks.filter(function (p) { return p !== undefined && p !== null; }).length;
  var opts = it.map.map(function (orig, idx) {
    var cls = "opt", tag = "";
    if (locked) {
      if (idx === good) { cls += " correct"; tag = '<span class="tag">Bonne réponse</span>'; }
      else if (idx === pick) { cls += " wrong"; tag = '<span class="tag">Ta réponse</span>'; }
    }
    return '<button class="' + cls + '" data-act="pick" data-i="' + idx + '"' + (locked ? ' aria-disabled="true"' : "") + ">" +
      '<span class="l">' + LETTERS[idx] + '</span><span class="t">' + esc(item[1][orig]) + "</span>" + tag + "</button>";
  }).join("");
  var fb = "";
  if (locked) {
    fb = pick === good
      ? '<div class="fb ok" role="status">Bonne réponse.</div>'
      : '<div class="fb ko" role="status">Mauvaise réponse. La bonne réponse est la ' + LETTERS[good] + ".</div>";
    fb += '<div class="actions"><button class="btn" id="next" data-act="next">' + (S.i === total - 1 ? "Voir le résultat" : "Question suivante") + "</button></div>";
  }
  return '<div style="--c:var(' + s.color + ')">' +
    '<button class="back" data-act="quit">← Quitter ce QCM</button>' +
    '<div class="qhead"><span><strong>Question ' + (S.i + 1) + "</strong> sur " + total + "</span><span>" + esc(q.title) + " · " + okSoFar + "/" + answered + ' juste' + (okSoFar > 1 ? "s" : "") + "</span></div>" +
    '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + total + '" aria-valuenow="' + (S.i + (locked ? 1 : 0)) + '"><i style="width:' + (((S.i + (locked ? 1 : 0)) / total) * 100) + '%"></i></div>' +
    '<h2 class="question" tabindex="-1" id="focus">' + esc(item[0]) + "</h2>" +
    '<div class="opts' + (locked ? " locked" : "") + '">' + opts + "</div>" + fb + "</div>";
}

function resultView() {
  var s = findSubject(S.subject), q = S.qcm, total = S.items.length;
  var score = 0, wrong = [];
  S.items.forEach(function (it, pos) {
    if (S.picks[pos] === correctPos(it)) score++; else wrong.push({ it: it, pick: S.picks[pos] });
  });
  var pct = Math.round((score / total) * 100);
  var verdict = pct >= 80 ? "Très bien, le cours est solide." : pct >= 60 ? "Correct, quelques points à revoir." : "À retravailler : relis le cours puis recommence.";
  var review = "";
  if (wrong.length) {
    review = '<div class="review"><h2>À revoir (' + wrong.length + ")</h2>" + wrong.map(function (w) {
      var item = q.questions[w.it.qi], gp = correctPos(w.it);
      return '<div class="rev"><p>' + esc(item[0]) + '</p><div class="a no"><b>Ta réponse :</b> ' + LETTERS[w.pick] + ". " + esc(item[1][w.it.map[w.pick]]) +
        '</div><div class="a yes"><b>Bonne réponse :</b> ' + LETTERS[gp] + ". " + esc(item[1][item[2]]) + "</div></div>";
    }).join("") + "</div>";
  }
  var again = '<button class="btn" data-act="retry">Refaire le QCM</button>' +
    (wrong.length ? '<button class="btn ghost" data-act="retry-wrong">Refaire mes erreurs</button>' : "") +
    '<button class="btn ghost" data-act="quit">Retour à la matière</button>';
  return '<div style="--c:var(' + s.color + ')"><p class="brand">' + esc(s.name) + " · " + (S.partial ? "Erreurs refaites" : "Résultat") + "</p>" +
    '<h1 tabindex="-1" id="focus">' + esc(q.title) + "</h1>" +
    '<div class="score">' + score + "<small>/" + total + "</small></div>" +
    '<p class="verdict">' + pct + " % de bonnes réponses. " + verdict + "</p>" +
    '<div class="actions">' + again + "</div>" + review + "</div>";
}

function decksOf(s) {
  var decks = s.qcms.map(function (q) {
    return { id: q.id, title: q.title, cards: q.questions.map(function (x) { return { q: x[0], a: x[1][x[2]] }; }) };
  });
  if (decks.length > 1) {
    var all = [];
    decks.forEach(function (d) { all = all.concat(d.cards); });
    decks.unshift({ id: "all", title: s.id === "constitutionnel" ? "Tout le droit constitutionnel" : s.id === "civil" ? "Tout le droit civil" : s.id === "introduction-droit" ? "Toute l’introduction générale au droit" : "Toutes les séances", cards: all });
  }
  return decks;
}

var COURSES = {"introduction-droit": [{"title": "Partie 1 : Le droit objectif", "text": "Introduction générale au droit\n\n\nPARTIE 1 : le droit objectif. \n\nLe droit constitue un outil permettant d’organiser la vie en société, les juristes ajoutent souvent un qualificatif au mot droit. \nil y a 2 séries de qualificatifs : \nles qualificatifs nombreux, qui permettent de préciser le domaine auquel s'appliquent les règles juridiques dont on parle (ex : on distingue le droit constitutionnel, le droit des personnes, le droit de la famille, le droit pénal, le droit de la consommation, commercial…). \nles qualificatifs qui traduisent une opposition de fond entre 2 notions qui sont d’une part le Droit objectif et d’autre part les droits subjectifs. \n\nLe Droit objectif est l’ensemble des règles générales et impersonnelles qui, dans la société, régissent les rapports entre les êtres humains. \n\nLes droits subjectifs sont les préorgratives reconnus a un individu (homme ou femme), en vertu d’une règle de droit objectif. \nex → selon l’article 144 du Code civil, le mariage ne peut être contracté avant 18 ans révolu. A partir de là, on déduit de cette règle générale et impersonnelle le droit de se marier. \nLe sujet de droit a le droit subjectif de faire ceci ou cela. \n\nLe droit objectif désigne l’ensemble des règles de droit générales et impersonnelles applicables à tous les être humains dans les rapports sociaux. La notion de droit objectif soulève 3 questions : \nIl existe dans la société de nombreuses règles de conduite (règles morales, religieuses), toutes ces règles de conduite ne sont pas des règles de droits objectifs d'où : quels sont les caractères de la règle de droit et comment la distinguer des autres règles de conduite qui régissent les rapports entre les êtres humains ?\nD’où sont issus les règles de droit objectifs ? Quelles en sont les sources ? \nLa règle de droit est générale et impersonnelle, or il faut l’appliquer a des cas concrets d'où la nécessité parfois de l'interpréter. Quelles sont les méthodes d'interprétation pour appliquer la règle de droit ? \n\nChapitre 1 : Les caractères de la règle de droit\n\nL'être humain qui vit en société voit son comportement soumis à de nombreuses règles de conduites, qu'elles soient juridiques, morales, religieuses ou de courtoisie. Il faut donc définir les caractères de la règle de droit, puis comparer la règle de droit aux autres règles de conduite. \n\nSection 1 : Les caractères de la règle de droit \n§1 - La règle de droit est abstraite \n\nCela signifie que c’est une règle qui ne s’applique pas à une personne nommément désignée mais qui vise toute une catégorie de personnes. \nex → propriétaires / locataires, héritiers, salariés / employeurs, enfants nés sous x.\n\nLe caractère abstrait de la règle de droit a 3 conséquences : \nLa règle de droit est impersonnelle, cad qu’elle est la même pour toutes les personnes de la catégorie qu’elle vise. \nLa règle de droit est générale, cad qu’elle s’applique de la même manière sur tout le territoire français à la catégorie de personne qu’elle vise. \nLa règle de droit est permanente, cad qu’elle s’applique à chaque fois que ces conditions sont remplies et ceci de manière durable dans le temps entre le moment où elle entre en vigueur et le moment où elle cesse de s’appliquer. \n\n§2 - La règle de droit est nécessaire \n\n“Ubi societas, ibi jus” signifie “il n’y a pas de société sans droit”. L’homme est un être social qui vit dans des regroupements sociaux. Or dès qu’il y a une société, il y a des conflits d'intérêts. Pour assurer la sécurité de tous et permettre la résolution de ces conflits, des règles de droit sont nécessaires.\n\n§3 - La règle de droit est obligatoire \n\nLa règle de droit doit être respectée par tous, tant par les individus que par le juge, que par ceux qui l'instituent.\nSelon l’Adage, “nul n’est censé ignorer la loi”, Une personne ne peut pas prétendre échapper à l’application d’une règle de droit en prétendant qu’elle l’ignore.\nToutes les règles de droit n’ont cependant pas la même catégorie obligatoire : \n- les règles dites “impératives” ou “d’ordres publics” dans le caractère obligatoire est absolu. Donc les personnes auxquelles elles s’appliquent ne peuvent, par l’effet de leur volonté, s'y soustraire. \nex → les articles du code civil qui instituent une procédure devant le juge pour divorcer sont d’ordre public. Les époux, même s’ils sont d’accord, n’ont pas le droit de divorcer devant un arbitre mais devant le juge aux affaires familiales (JAF). \nex → les articles du Code pénal interdisent les homicides volontaires. Cette règle est d’ordre public, par conséquent jusqu’à récemment, une demande d’euthanasie active, même si elle était demandée par le patient, restait un homicide pénalement sanctionné. Par une loi du 18 aout 2026, la France a rejoint les nombreux pays qui autorisent l’euthanasie parmi lesquelles on retrouve : \nLes Pays-bas depuis 2001\nLa Belgique depuis 2002\nL’Espagne depuis 2021\nLe Portugal depuis le 16 mai 2023\nIl convient que la Suisse est souvent présenté comme le pays précursueur car depuis 1942, l’article 115 du Code pénal suisse dépénanlise l’assistance au suicide. C’est en se fondant sur cette disposition qu'a été mise en place en Suisse des maisons médicalisées, dans lesquelles un accompagnement est proposé aux personnes malades souhaitant mettre fin à leurs jours, avec fournitures par les médecins de la substance létale. Cependant, c’est le patient qui se l’administre lui-même, et il est interdit au personnel médical sous peine de sanction pénale de faire l’injection. \n\nLa loi française du 18 août 2026 institut d’une aide à mourir, pour en bénéficier le demandeur doit remplir 5 conditions cumulatives : \nêtre majeur (même les mineurs émancipés sont exclus). \nêtre français / ou résider de façon stable et régulière en France. \nêtre atteint d’une affection grave et incurable engageant le pronostic vital, et qui en phase avancée ou terminale. \nprésenter une souffrance réfractaire ou insupportable face à cette affection, la seule souffrance psychologique ne suffit pas. \nêtre apte à manifester une volonté libre et éclairée. De ce fait, les majeurs ne sont pas exclus par principe (les majeurs protégés ne sont pas exclus par principe, le critère n'étant pas la capacité juridique mais simplement l’aptitude à exprimer une volonté libre et éclairée). \n\nEn principe, l’injection doit être faite par la personne elle-même. \nLa française prévoit, contrairement à la Suisse, que l’injection peut être faite à titre suicidaire par un médecin ou par un infirmier. \n\nLes règles dites supplétives dont le caractère obligatoire est seulement relatif. En effet, ces règles ne s’appliquent que si les personnes qu’elles visent n’ont pas manifesté une volonté en sens contraire. \nex → selon le Code civil, dès lors que des personnes se marient, cela a des conséquences sur leurs biens et à partir de la date de leur mariage, ils sont en principe mariés sous le régime de la communauté réduite aux acquêts. Cette règle est seulement supplétive de volonté, en ce sens que les époux sont libres d’opter pour un autre régime matrimonial en signant un contrat de mariage devant un notaire (la séparation des biens). \n\n§4 - La règle de droit est coercitive \n\nCela signifie que son non-respect est sanctionné par les juridictions étatiques. La sanction qui va être prononcée par les juridictions peut poursuivre 3 finalités : \nElle peut tendre à obtenir l’exécution forcée de la règle de droit. \nex → si un débiteur / mauvais payeur ne paye pas ses dettes, les juridictions peuvent ordonner une saisie de ses biens qui seront ensuite vendus aux enchères et l’argent retiré de la vente permettra de payer le créancier. \nElle peut avoir une finalité réparatrice. \nex → si A blesse B, le juge doit condamner A a versé des dommages et intérêts à B pour réparer le préjudice subi. Il existe différentes règles de droits qui obligent celui qui cause un dommage à autrui de le réparer. \nLa sanction peut être instituée dans un but de punition, la contrainte par corps permettant de mettre en prison un débiteur / mauvais payeur a été supprimée par une loi du 22 juillet 1867. Depuis, c’est en matière pénale qu’on trouve des sanctions ayant un sens punitif. ex → amendes, travaux d'intérêts généraux, une peine d’emprisonnement, bracelet électronique (Marine Le Pen, Sarkozy). \n\nSection 2 : Règle de droit et autres règles de conduite \n\n§1 - Les règles de bienséance \n\nCe sont des règles de courtoisie, de politesse, de savoir-vivre. Il s’agit de règles de conduites dont le non- respect va être sanctionné. La nature de la sanction est différente. En cas de non- respect de cette règle, elle va s'en limiter à la pression du groupe en faveur de l’application de la règle et éventuellement en une aptitude d’exclusion. Pour les règles de droit s’ajoute à une réprobation, une sanction étatique avec un recours possible devant les tribunaux.\n\n§2 - Les règles de morale \n\nIl s'agit de normes qui rétablissent une opposition entre le bien et le mal. Le mot éthique est souvent utilisé à la place du mot morale, par un effet de mode et considéré par certains comme trop empreint d'une connotation religieuse. Toutes deux imposent des règles de conduite, dont le non- respect va être sanctionné. De nombreuses règles juridiques sont inspirés de la morale \n\nLes règles de morale diffèrent de la règle de droit à 4 points de vue : \n1er : différence quant à la finalité. Les règles morales ont pour but le perfectionnement intérieur de l’Homme. Le droit tant a assuré un ordre social afin que la vie en société se déroule dans de bonnes conditions malgré les conflits individuels.\n2e : différence quant aux sources. Les règles morales sont édictées par la conscience de chaque individu, elle peut différer d’un individu à l’autre. Les règles de droit trouvent leurs sources dans la loi, la coutume, la jurisprudence et la doctrine. \n3e : différence quant au contenu. La morale pose de grands principes visant à guider les consciences. Le droit impose des règles précises, dont certaines de ces règles sont inspirées de principes moraux. ex → règle morale = être honnête ; \nrègle de droit = article 137, dans un contrat il est interdit de tromper l’autre.  \n\nCependant, d’autres règles juridiques sont moralement neutres. \nex → les règles qui régissent le fonctionnement de l’état civil. \nD’autres règles juridiques, plus rares, sont contraires à la morale ou du moins jugés comme tel par certains parce qu’ils sont considérés comme immorales  : \nL’IVG\nLe mariage pour tous (loi Taubira de 2013)\nL'accès à la PMA pour les couples de femmes homosexuels\n\n4e : différence quant à la sanction. Il y a un sentiment de culpabilité et de réprobation du groupe social. Pour une règle de droit, il y a une sanction prononcée par une juridiction étatique. \n\n§3 - Les règles religieuses \n\nIl s’agit de règles imposées par la religion. \nPour la religion catholique, nous avons un Code de droits canoniques datant de 1983, ainsi que des juridictions ecclésiastiques chargées de se prononcer sur des questions de droit ecclésiastique. \nPour l’Islam, il s’agit des préceptes du Coran écrit entre 610 et 632 (mort du Prophète) qui se composent de 114 chapitres nommées “sourates”, elles-mêmes divisées en ayat (6236). \nDans un État laïque, comme la France, seul le non-respect du droit peut faire l’objet d’une sanction étatique. Le non-respect d’une règle religieuse est sanctionnée par Dieu, et ensuite par les juridictions. \n\n§4 - Les règles de déontologie \n\nCe sont les règles qui s'appliquent aux membres d’une profession réglementée, et qui sont imposées par leur ordre professionnel (ex → l’ordre des médecins, l’ordre des avocats…). \nLe non-respect de ces règles de déontologie a pour sanction de limiter ou de suspendre le métier exercé par la personne. Ces sanctions vont être faites par l'ordre professionnel réunis en formation disciplinaire (ex → pour les avocats c’est Conseil de l’ordre en 1er, puis ensuite en 2e la Cour d’appel, puis pour finir en 3e par la Cour de cassation ; \npour les notaires → depuis le 1er juillet 2022, les juridictions en 1er instance sont les juridictions disciplinaires générales composées d’un magistrat professionnel, ensuite en appel c’est la Cour nationale d’appel, et pour finir en cassation c’est la Cour de cassation). \n\nChapitre 2 : Les sources de la règle de droit \n\nOn oppose souvent les sources écrites du droit aux sources non écrites du droit constitué par la jurisprudence, par la coutume et par la doctrine.\nLa France fait partie des pays de droit écrits, les textes sont la principale source du droit. Tel n’est pas le cas des pays de la Common law (Angleterre, États-Unis, Irlande) dans lesquels la jurisprudence est la principale source du droit. \n\nSection 1 : Les sources écrites \n\nIl existe une hiérarchie entre les différentes sources écrites du droit théorisée par Hans Kelsen qui propose la présentation pyramidale des différentes types de normes écrites : \n\n\nNiveau 1 - La Constitution de 1958 qui fonde la IIIe République (aucun texte ne peut être contraire à la Constitution.)\nNiveau 2 - Les traités internationaux et le droit communautaire.\nNiveau 3 - Les lois organiques visées à l'article 46 de la Constitution. \nNiveau 4 - Il y a 5 catégories de textes : \nles lois ordinaires votées par le Parlement dans les domaines qui lui sont réservés par l’article 34 de la Constitution. \nles décisions du président de la république, à objet législatif, prisent en période de grave crise par application de l’article 16 de la Constitution. \nles ordonnances de l’article 38 de la Constitution prisent par le gouvernement suite à une loi d’habilitation dans les domaines normalement réservés au Parlement par l’article 34. \nles lois adoptées par référendum prises par application de l’article 11 de la Constitution. \nles décrets autonomes du premier ministre pris par application de l’article 37 de la constitution\nNiveau 5 - les décrets d’application pris par le gouvernement dont les matières semi-législatives prises par application de l’art 21 de la Constitution. \nNiveau 6 - les arrêtés interministériels et ministériels. \nNiveau 7 - les arrêtés préfectoraux, ceux du président du Conseil général et ceux du président du Conseil régional.\nNiveau 8 - tous les arrêtés municipaux. \n\nQuestion de QCM sur la pyramide de Kelsen : Le principe hiérarchique signifie qu’un texte de la catégorie inférieure ne peut pas contenir de dispositions qui sont contraires à celle contenue dans le texte supérieur. \n\nPar application du principe hiérarchique, la commercialisation du CBD a été autorisée en France. En effet, le CBD n’est pas classé dans la catégorie des stupéfiants en droit international et les textes de droit européen autorisent sa commercialisation. Il s’agit d’un texte de niveau 2 dans la pyramide de Kelsen donc d’une valeur supérieure au Code pénal et du Code de la santé publique (texte de niveau 4 de la pyramide de Kelsen) qui interdisait la commercialisation de toute extrait de cannabis.\nDans un arrêt rendu du 19 novembre 2020, la Cour de justice de l’Union Européenne (CJU) a jugé que la réglementation française interdisant la commercialisation du CBD était contraire au droit de l’UE. En revanche, la Cour de cassation se montre sévère à l'encontre des personnes qui conduisent en ayant consommé du CBD puisque dans un arrêt 21 juin 2023, la CJUE a jugé que le fait de conduire en ayant consommé du CBD constitué le délit de conduite sous emprise de stupéfiant entraînant un  retrait de 6 points et une peine pouvant aller jusqu’à 2 ans d’emprisonnement et 4000€ d’amende. \n\nIl existe deux types de contrôle juridictionnel pour vérifier le bon respect du principe hiérarchique : \n1er moyen : Le contrôle de la constitutionnalité assuré par la Conseil constitutionnel dont est chargé de vérifier que les textes de niveau 2, 3, 4 de la pyramide de Kelsen soient conformes à la Constitution.  \nAvant une réforme de la Constitution intervenue le 23 juillet 2008, le contrôle de la constitutionnalité ne pouvait être fait qu’avant la publication du texte au Journal Officiel. Désormais depuis cette loi, tout justiciable, à l'occasion d’un procès, peut prétendre que le texte applicable devant le juge n’est pas conforme à la Constitution. Le juge judiciaire ou administratif doit alors surseoir à statuer et transmettre la question à la Cour de cassation (juge judiciaire) ou au Conseil d’état (juge administratif). Si un problème de constitutionnalité semble se poser, la Cour de cassation ou le Conseil d’État transmettra le dossier au Conseil constitutionnel. \n\nPar une décision du 21 juillet 2023, le Conseil constitutionnel a jugé conforme à la Constitution les dispositions de la loi du 21 avril 2021 qui punissent de 20 ans de réclusion criminelle, toute acte de pénétration sexuelle commis par un majeur sur un mineur de moins de 15 ans ou commis par un mineur sur un autre mineur lorsque la différence d'âge entre les deux est de 5 ans. Et ceci, indépendamment ou non du consentement de la victime.\nLe requérant estimait comme instituant cette infraction, sans qu’il puisse avoir un débat sur le consentement ou non de la victime, que la loi du 21 avril 2021 instituait une présomption irréfragable de culpabilité contraire à la présomption d’innocence affirmée dans la Constitution. \n\n2e moyen : Le contrôle de la légalité est assuré par les juridictions administratives. \nCe contrôle permet de faire respecter la supériorité des textes n°4 sur tous les textes réglementaires (5, 6, 7 et 8) ainsi que la hiérarchie des textes réglementaires entre eux. \nPar exemple : le 27 août 2019, le Tribunal administratif de Rennes a annulé l'arrêté dit “anti-pesticides” prit par le maire de Langouet qui interdisait aux agriculteurs d’épandre des produits phytosanitaires sur les cultures situées à moins de 150 m de toutes parcelles cadastrales comprenant des habitations. \nLe juge administratif a estimé cet arrêté municipal illégal car le maire d’une commune est incompétent pour réglementer l’usage phytosanitaire, cette compétence appartient au préfet. \nDurant la crise sanitaire liée au Covid-19, de nombreuses décisions des tribunaux administratifs (TA) ont annulé les arrêtés municipaux qui limitaient le droit de sortir durant le confinement a une distance inférieure à 1 km. \n\n⇒ Les règles de droit peuvent être soit issues de textes internationaux soit de textes nationaux. \n\n§1 - Les sources internationales \n\nA) Les traités internationaux en général \n\nCes traités sont aussi appelés conventions, ou encore pactes, statuts (ex : statut de Rome créé par la CPI). Leur but est d’harmoniser les droits nationaux des états signataires ou de régir les rapports entre les États (ex → la convention d’extradition entre le Japon et la France, qui régit les conditions dans lesquelles une personne interpellé en France, poursuivi au Japon va être extradé vers le Japon et vice-versa). \nUne telle convention existe entre la France et le Japon mais n’existe pas entre le Japon et le Liban, ceci explique pourquoi Karl Goshn, (chef d’entreprise, ex patron de Nissan) a fui le japon dans une malle d'instruments de musique, s'est réfugié au Liban et refuse de revenir en France.\nCes traités internationaux sont négociés par l’intermédiaire de représentants de l'État français qui participent à des conférences soit multilatérales (concernant plus de 2 États), soit bilatérales (concernant 2 États). Ces représentants sont des agents diplomatiques qu’on appelle des plénipotentiaires. Une fois le texte adopté, il ne va s'appliquer dans le droit dans chaque pays signataire qu'après avoir été ratifié par ces instances nationales. Certains pays prévoient un minimum de ratification avant que le texte ne puisse entrer en vigueur. Tel a été le cas pour la Cour pénale internationale, qui siège à la Haye et est composée de 18 juges de nationalités différentes, elle a été instaurée par la Convention de Rome signée le 18 juillet 1998 suite au genocide, perpétuité en 1995 contre la communauté bosniaque en Ex-Yougoslavie. Ce TI prévoyait que la CPI entrerait en vigueur après la ratification de plus de 60 sur 137 États signataires. Les Etats-Unis, la Chine et la Russie n’ont jamais ratifié le traité de Rome. \nLa CPI a délivré le 17 mars 2023 un mandat d'arrêt contre Vladimir Poutine pour ses déportations d'enfants ukrainiens au début du conflit de février 2022, le mandat d'arrêt doit être fait si il sort de la Russie et s’il va dans un des 125 États ayant ratifiés le traité de Rome. \nC’est pourquoi, de ce mandat d'arrêt international, Poutine n’a pas pu assister au 1(e Sommet des BRICS (Brésil, Russie, Inde, Chine, et Afrique du Sud) qui s’est tenu en Afrique du Sud du 22 au 24 août 2023. \nEn septembre 2024, Poutine a provoqué la CPI en se rendant en Mongolie qui a ratifié le traité mais pourtant n’a pas procédé à l'arrestation de Poutine. \nUn mandat d'arrêt a aussi été déposé le 21 novembre 2024 contre Benjamin Netanyahu pour crimes de guerre et crimes contre l'humanité commis à Gaza. \n\nEn France, la Constitution du 4 octobre 1958 donne au Président de la République le pouvoir de ratifier les traités internationaux. Dès lors que le traité international entraîne modification du droit interne, le Président de la République peut le ratifier qu’une fois avoir obtenu une autorisation. Cette autorisation peut résulter d’une loi votée par le Parlement, soit d’un référendum. Une fois ratifié, le Traité est publié au Journal Officiel et son contenu s’applique au droit français le lendemain de sa publication. \nLes plénipotentiaires : Quelle est la force du contenu du traité par rapport au droit interne ? L’article 55 de la Constitution prévoit que les traités régulièrement ratifiés et publiés ont une autorité supérieure à celle des lois internes sous réserve d'être appliquées par les autres États signataires. \n\n1 - L'autorité supérieure du traité sur la loi interne \n\na) Les rapports entre le traité et la Constitution \n\nSelon l'article 54 de la Constitution, aucun Ti ne peut être ratifié par le Président de la République s’il contient des dispositions contraires à la Constitution. La Constitution a donc valeur supérieure aux traités internationaux. Cependant, les intérêts supérieurs de la France peuvent conduire à modifier la Constitution dans le seul but de ratifier un TI jugé essentiel. \n\nb) Les rapports entre le traité et les textes de niveau inférieur \n\nLes traités internationaux (TI) ont une valeur supérieure à tous les textes de niveau 3 à 8, mais cela n’a pas toujours été admis par la jurisprudence. Ce sont d’abord les juridictions de l’ordre judiciaire dans l'arrêt Café Jacques Vabre du 24 mai 1975 qui ont admis la supériorité des traités. Les juridictions administratives s’y sont ralliées dans l'arrêt Nicolo du 20 octobre 1989. Par conséquent, si le juge constate à l'occasion d’un litige qu’un texte de niveau 3 et suivants contiennent des dispositions contraire à un traité international, il y a 2 cas qui se distinguent : \nLe texte en question est antérieur aux traités internationaux, le juge va considérer que le texte de la loi a été abrogé par les TI et est obligé d’appliquer le dispositions du traité. \nLe texte en question est postérieur aux traités internationaux, c’est possible car le Conseil Constitutionnel n’a pas le job de vérifier la conformité d’une loi à un traité international. Si le juge constate qu’une loi est contraire au TI, il doit faire comme si la loi n’existait pas et doit appliquer les dispositions du traité. Parmi les TI les plus souvent invoqués, figurent notamment la CEDH. L’article 8 de la CEDH assure le droit au respect de la vie privée et l’article 6 assure le droit aux procès équitables. C’est en se fondant sur le droit aux procès équitables, l’assemblée plénière, a rendu 4 arrêts le 15 avril 2011, a jugé que les dispositions de l’article 63-4 du code procédure pénale qu’en cas de garde à vue (GAV), la personne voyait un avocat uniquement pendant 30 minutes à la 20e heure était contre au droit aux procès équitables. Désormais le gardé à vue a le droit d'être assisté d’un avocat dès le début de la GAV ainsi que pendant chaque interrogation par les forces de l’ordre. \nL’OPJ (Officier de Police Judiciaire) doit lui notifier, lors du placement en GAV, le droit de se taire, le droit d'être assisté par un avocat, le droit de prévenir l’un de ses proches et le droit de bénéficier d’un examen médical. Si le gardé à vue demande à voir un avocat sans avoir son propre avocat, l’OPJ prévient donc l’ordre des avocats et un avocat de permanence se rendra à la GAV. Les forces de l’ordre doivent attendre un délai de 2 heures après le début de la GAv pour commencer à interroger la personne et si au bout de ces 2 heures l’avocat de permanence n’est pas présent, les interrogatoires peuvent commencer. \n\n2 - Une autorité supérieure subordonnée au principe de réciprocité \n\nSi les autres États signataires ne respectaient pas le contenu du TI, l’État français est en droit de ne plus le respecter, c’est le principe de réciprocité. \n\nB) Le droit de l’Union Européenne \n\nPar rapport au droit international, le droit de l’UE constitue un droit régional particulier applicable dans les relations entre les 27 États membres de l’UE. L’UE est passée de 28 à 27 États depuis le 1er janvier 2021 où le Royaume-Uni s’est retiré avec le Brexit de l’UE. Le dernier pays ayant rejoint l’UE est la Croatie depuis le 1er juillet 2013. Le 28 février 2022, l’Ukraine à fait sa demande pour adhérer à l’UE et rejoint la liste des 10 pays candidats (Ukraine, Serbie, Islande, Monténégro, Bosnie-Herzégovine, Albanie, Turquie, Géorgie, Macédoine du Nord, Moldavie).\nEn 2026, nous sommes 8,2 milliards d'habitants sur la Terre et 452 millions pour l’UE, 349 millions pour les États-Unis, 1,59 millions en Afrique, 1,413 milliard pour la Chine, 1,477 milliard en Inde, 39,5 millions pour l’Ukraine\n\n1 - Le contenu du droit de l’UE \n\nOn oppose classiquement le droit de l’UE originaire au droit de l’UE dérivé.\n\na) Le droit de l’UE originaire (aussi appelé primaire) \n\nIl est constitué par les trois traités instituant à l’origine les 3 communautés européennes ainsi que par les traités modificatifs signés par la suite : \nLe Traité de Paris (18 avril 1951) qui institue la communauté européenne du charbon et de l’acier (CECA). \nLes deux traités de Rome (25 mars 1957) qui instituent d’une part la communauté économique européenne (CEE), et d’autre part la communauté européenne de l'énergie atomique (CECA). \n\nLes principaux traités modificatifs sont : \nL’acte unique européen signé le 17 février 1986, qui achève la mise en place du marché intérieur, et a permis également le 31 décembre 1992 la libre circulation des personnes, des marchandises et des capitaux. \nLe Traité de l’UE signé à Maastricht le 7 février 1992, il a deux objets : \nétendre la compétence de l’UE dans le domaine économique (mise en place de l’€ en 2002) et sociale (éducation, santé, culture, échanges Erasmus, la carte de sécurité sociale européenne). \ninstituer une coopération entre les États membres en matière de politique étrangère et de sécurité commune et également de santé publique\nLe Traité d'Amsterdam signé le 2 octobre 1997 vise à adapter les institutions de l’UE à l'élargissement progessif  à de nouveaux membres. \nLe Traité de Nice signé le 26 février 2001 prévoit l'élargissement de l’UE à de nouveaux membres et modifie les règles de vote notamment au sein du Conseil des ministres. \nLe Traité de Lisbonne signé le 13 décembre 2007 qui a été adopté suite à l’abandon du projet d’une Constitution Européenne, et prévoit plusieurs réformes institutionnelles importantes : \nL’UE se voit doter d’une personnalité juridique \nDepuis le 1er novembre 2014, toutes décisions au sein du conseil de l’UE supposent une double majorité (il faut qu’il y ait 55% des États membres représentant au moins 65% de la population de l’UE pour qu’une décision soit adoptée). \nLa présidence de l’UE est désormais scindée en 2. D’un côté, on a le président du Conseil de l’UE qui reste désigné comme auparavant durant 6 mois. D’un autre côté, il y a désormais un président du Conseil européen qui est élu à la majorité qualifiée pour une durée de 2 ans et demi renouvelable (Antonio Costa depuis 2024)\nLes citoyens européens peuvent désormais saisir directement la commission européenne pour que soit adoptée une directive ou un règlement européen sur tel ou tel sujet. Cette saisine directe suppose une proposition signée de plus d’1 million de signatures .\nPour la première fois, le traité prévoit dans son article 50 la possibilité pour l’un des États membres de sortir de l'UE (le Royaume-Uni a décidé de sortir de cette façon et c’est ce qui a permis le Brexit). \n\nRemarque (question de QCM possible) : Le 29 mai 2005, la France à refusé par référendum de ratifier un traité qui mettait en place une Constitution européenne. L’objet de ce traité était de réaménager le fonctionnement des institutions européennes pour tenir compte de l'élargissement de 6 au départ puis 28 avant le Brexit. Suite au refus de la France, les Pays Bas ont également rejeté le projet de la Constitution européenne. Si ce traité avait été adopté par la France, malgré le mot “Constitution européenne”, il aurait eu une valeur inférieure à la Constitution française de 1958 donc serait un texte de niveau 2. \n\nb) Le droit de l’UE communautaire dérivé \n\nIl s’agit des normes et décisions prises par le Conseil Européen, par la Commission Européenne et par le Parlement Européen qui siègent à Bruxelles.\nOn distingue deux types de normes et décisions européennes :\nLes règlements européens → sont des véritables règles de droit directement applicables dans tous les États membres sans qu’il soit nécessaire de les transposer en droit interne. Le justiciable français peut donc, lors d’un procès, invoquer un règlement européen qui devra être appliqué par le juge français (6 000 règlement européens) \nex → le 19 avril 2023, un des règlement interdit la commercialisation de véhicules neufs produisant du CO2 à compter du 1er janvier 2035. A partir de cette date, seuls les véhicules électriques et à hydrogène pourront être commercialisés. La commission européenne envisage de modifier ce règlement européen pour que la commercialisation de véhicules hybrides puisse continuer après le 1er janvier 2035. \nex → le règlement européen sur les services numériques du 19 octobre 2022 qui oblige les géants du web à mettre en place une modération des contenus et réglemente la protection de la vie privée des internautes et de l’usage de la publicité ciblée. \nEn cas de non-respect de cette réglementation, l’entreprise peut se voir infliger une amende allant jusqu’à 6% du chiffre d'affaires mondiale (CA mondiale). (Le 23 juillet 2026, 890 millions d’amendes sont prononcées pour Google.)\n\nLes directives européennes → elles visent à permettre l’harmonisation entre les législations internes des différents pays membres de l’UE. Elles ne sont pas directement applicables en droit interne, il faut que chaque état membre adopte une loi de transposition dans un délai fixé par la directive pour que les grandes lignes définies par la directive soient appliquées en droit interne. \nL’État qui ne transpose pas par la directive dans le délai s’expose à une procédure dite de manquement et pourrait être condamné par la Cour de justice de l’UE a de fortes amendes. Aujourd’hui, il y a 1800 directives européennes. \nex → une directive du 16 février 1998 permet une libre circulation des avocats au sein des Etats membres de l’UE. Grâce à cette directive, tout avocat ressortissant d’un Etat membre de l’UE peut exercer en France sous son titre d’origine. En revanche, pour exercer avec un titre français , l’avocat membre de l’UE doit passer un examen sur les règles de déontologie applicables entre avocats en France et non sur le droit français. Les statistiques révèlent que sur les 78 938 avocats exerçant au 1er janvier 2026, nous avions 2000 avocats en provenance d’un État membre de l’UE. \nex → une directive a été adoptée le 17 avril 2019 sur les droits d’auteurs et les droits voisins. Cette directive met en place dans ces articles 15 et 17 l’obligation pour toutes les entreprises du numérique de verser des droits d'auteurs à chaque fois qu’un internaute clique sur un lien le dirigeant vers un article ou une vidéo protégé au titre des droits d’auteurs. Il était question de mettre en place, dans cette directive, plus généralement une taxe sur les services numériques appelés “taxes GAFA” (Google, Amazon, Facebook, Apple). La Suède s'étant opposée, le gouvernement français a décidé seul de mettre en place une taxe GAFA par une loi du 11 juillet 2019. Y sont ainsi taxés à hauteur de 3%, les recettes réalisées par les entreprises du numérique, notamment en raison des publicités faites auprès des internautes français même si l'entreprise a son siège social a l’etranger. 700 à 800 millions d’€ rapportés à l'État français. \n\n2 - L'autorité supérieure du droit de l’UE \n\nDans la pyramide de Kelsen, le droit européen est au niveau 2 et a une valeur infra constitutionnelle mais supérieur à tous les autres textes de droit interne et ceci sans que s'applique le principe de réciprocité. \n\n§2 - Les sources nationales\nA) Les lois et les règlements \n1 – Les lois \na) Les différentes catégories de lois\n\nDans un sens large, la loi désigne l’ensemble des sources écrites du droit. Dans un sens strict, la loi désigne les textes votés par le Parlement, c’est-à-dire par l'Assemblée nationale et le Sénat. \nIl existe 3 catégories de lois : \nLa loi constitutionnelle constitué par la Constitution de 1958 et par le bloc de constitutionnalité (préambule de la Constitution de 1946, DDHC)\nLes lois organiques votées par le Parlement pour préciser ou compléter les dispositions de la Constitution. L’article 46 de la Constitution prévoit limitativement les cas de recours aux lois organiques et soumet celle-ci a une procédure d’adoption particulière. \nLes lois ordinaires sont les plus nombreuses et sont élaborées selon la procédure suivante : à l’origine d’une loi nous avons un texte qui porte le nom soit d’une proposition de loi lorsque les rédacteurs sont parlementaires, soit d’un projet de loi lorsque les rédacteurs sont des membres du gouvernement. \n\nLe projet de loi peut être remis indifféremment sur le bureau soit de l’Assemblée nationale (AN), soit du Sénat. La proposition de loi, quant à elle, doit obligatoirement être remise sur le bureau de la Chambre dont sont issues les personnes qui en sont à l’origine. \nSupposons que le texte soit remis sur le bureau de l’AN (Madame Braun Pivet est la présidente de l’AN élu en juin 2022 puis réélu en juillet 2024), le texte est alors soumis au vote des députés, articles après articles, qui peuvent éventuellement le modifier. \nCes modifications portent le nom d’amendement. Une fois le texte discuté et adopté par l’AN, le texte est alors soumis à “la navette parlementaire”, cela signifie qu’il est transmis au Sénat (le président est Gérard Larcher élu une première fois en octobre 2014 puis réélu en 2017, 2021 et 2023). \nLe Sénat va ensuite procéder à un vote article par article, avec d'éventuels amendements. \nEn principe, la navette parlementaire se poursuit tant que le texte n’a pas été adopté dans les mêmes termes par chacune des deux Chambres. \nPour éviter que ces renvois s’éternisent, la Constitution prévoit qu’après deux lectures par chaque Chambre ne débouchant pas sur un texte commun, le Premier ministre (Sébastien Lecornu) peut provoquer la réunion de commissions mixtes paritaires composés de 7 sénateurs et de 7 députés. \nLa réunion de cette commission est même possible après une seule lecture devant chaque Chambre lorsque le texte est voté selon la procédure dite accélérée prévue par l’article 45 alinéa 2 de la Constitution. \nLa commission mixte paritaire (CMP) est chargée d’établir un texte commun sur les dispositions de la loi qui font objet de divergence après 2 votes. \nA partir de là, il y a 2 cas de figure : \n1er cas → La CMP tombe d’accord sur un texte commun. Ce texte va d’abord revenir sur le bureau du Sénat puis à l’AN. Le texte sera adopté dans des termes identiques mais chaque Chambre conserve le droit de faire des amendements, et la version définitive du texte est celle retenue par l’AN. \n2e cas → La CMP ne tombe pas d’accord, le texte revient alors pour un ultime vote d’abord devant le Sénat puis devant l’AN. La version définitive du texte sera celle également retenue par l’AN.\n\nUne fois le texte définitif adopté, il est soumis à un éventuel contrôle de constitutionnalité fait par le Conseil Constitutionnel (le président est Laurent Fabius). Il peut être saisi soit par le Président de la République, soit par le Président d’une des deux chambres (AN = Braun Pivet ; Sénat = Gérard Larcher), soit par un groupe de 60 députés ou de 60 sénateurs. Le texte sera ensuite promulgué. \n\nPromulgation : l’acte par lequel le Président de la République atteste l’existence de la loi et en ordonne la publication au Journal Officiel. Sauf si contrôle de constitutionnalité, la promulgation doit intervenir au plus tard dans les 15 jours qui suivent l’adoption du texte. \n\nLa date de la promulgation sera la date attribuée à la loi. Après sa promulgation, la loi va être publiée au Journal Officiel (JO), ce qui rend la loi applicable au droit français et devient applicable le lendemain sa publication. \n\nSelon l'article 49-3 de la Constitution, le gouvernement peut faire adopter une loi en court-circuitant les débats parlementaires. Le Premier ministre est le seul à pouvoir décider de recourir au 49-3. Dans ce cas, le projet de loi va être déposé devant l’AN et va être considéré comme adopté dans l'État sauf si une motion de censure est votée, ce qui a pour effet de réserver le gouvernement et oblige le Président de la République a nommé un nouveau gouvernement. \n\nLa motion de censure doit être déposée par au moins un dixième des députés (au moins 50 députés sur 577) dans les 24h qui suivent le dépôt du projet de la loi. Elle est soumise au vote des 577 députés dans les 48h qui suivent. Le gouvernement est renversé si plus de 289 députés votent la motion de censure. \nDepuis l’adoption de la Ve république de 1958, l’article 49-3 a été invoqué 99 fois. \nC’est Michel Rocard (Premier ministre de François Mitterrand) qui s’en est le plus servi, c’est-à-dire 28 fois entre 1988 et 1991 à une époque où du fait de la cohabitation, la France était difficile à gouverner, le parti socialiste n'étant pas majoritaire à l’AN . \nLa réforme constitutionnelle de 2008 à limiter le recours au 49-3, car désormais il ne peut être utilisé que pour un seul texte par session parlementaire, hors du projet de loi de finance ou de financement sur la sécurité sociale. \n\nb) Le domaine de la loi ordinaire \n\nL’article 34 de la Constitution liste un certain nombre de matières dans lesquelles c’est au Parlement de légiférer. \nIl y a 2 types de matières à distinguer d'après l’article 34 : \nLes matières dites purement législatives, qui constituent le domaine réservé du Parlement. En ce sens, le Gouvernement fixe les détails d’application de ces règles. Il s’agit premièrement de tout ce qui concerne les garanties fondamentales accordées aux citoyens par l'exercice des libertés publiques. \nex → la nationalité, l’État et la capacité des personnes, les régimes matrimoniaux (mariage, diovrce), les règles successorales… Autre domaine de compétences du Parlement est la détermination des crimes et des délits (loi sur harcèlement de rue), tout ce qui concerne aussi les impôts est du domaine du Parlement. \nLes matières dites semi-législatives dans lesquelles le Parlement fixe simplement les principes généraux. Une fois la loi publiée, il appartiendra au gouvernement de définir les règles qui assureront la mise en œuvre concrète de ces principes à travers des décrets d’application. Il y a un partage de compétences entre le Parlement et le gouvernement. \nex → l'organisation de la défense nationale, l’enseignement, le droit du travail, le droit de la santé, le droit de propriété…\n\nRemarque : Dans certains codes, il y a des articles qui commencent par la lettre L (correspond aux principes élaborés par le Parlement) et R (correspond aux décrets d’application). \n\n2 – Les règlements \na) Les différentes catégories de règlements \n\nCe sont des règles de portée générale et impersonnelle, édictées par le pouvoir exécutif (gouvernement et par d’autres instances administratives compétentes). \nLes principales catégories de règlements sont : \nLes décisions du Président de la République a objet législatif pris en vertu de l’Article 16 en période de crise. L’article 16 n’a été actionné qu’une seule fois par le Général De Gaulle durant la guerre en Algérie. \nLes ordonnances de l’article 38 sont prises par le gouvernement avec l'autorisation du Parlement dans les matières, qui en vertu de l’article 34, sont soit législatives ou semi législatives. Ex → différentes ordonnances prises par le gouvernement pendant la crise du Covid en vertu d’une loi du 23 mars 2020, dite d'urgence sanitaire. Cette loi a autorisé le gouvernement à intervenir dans 43 domaines qui sont normalement de la compétence du Parlement. L’urgence sanitaire a été levée le 31 mai 2021. \nLes décrets autonomes de l’article 37 pris par le gouvernement dans les matières qui ne sont pas listées à l'article 34 de la Constitution.  \nLes décrets d’application sont pris par le Premier ministre pour compléter les lois intervenues dans les matières semi-législatives. \nLes différents arrêtés, qui peuvent être soit pris par un ou plusieurs ministres, soit pris par le préfet, soit par le président du Conseil régional, soit par le Président du Conseil général ou par un maire. \n\nb) Le domaine des décrets autonomes \n\nLes règlements ou décrets autonomes sont constitués par les décrets de l’article 37. Selon cet article : “les matières autres que celles qui sont du domaine de la loi ont un caractère réglementaire”. Toutes les matières qui ne sont pas listées expressément à l’article 37 de la Constitution, le gouvernement peut intervenir. \nex → les règles de déontologie médicales avec le Code de déontologie médical adoptait en 1895 issue d’un décret autonome. \n\nB) La détermination des lois ou des règlements en vigueur \n\nIl s’agit ici de répondre à 2 questions : \nÀ partir de quand un texte, qu’il s’agit d’une loi ou un règlement, devient applicable ?\nÀ partir de quand un texte cesse d’etre applicable ?\n\n1 - La date d'entrée en vigueur du texte\n\nSelon l’article 1er du Code civil, les lois et les règlements entrent en vigueur à la date qu’il fixe ou à défaut, le lendemain de leur publication au JO.\n \nPremière remarque : \nTous les textes n’entrent pas en vigueur le lendemain de leur publication au JO. \nPremier cas : le texte est une loi, la première possibilité est de faire rétroagir la loi en la déclarant expressément rétroactive. \nex → la loi du 04 mars 2002 qui met en place un système d’indemnisation des accidents médicaux, s’applique à tous les accidents médicaux survenus à compter du 1er septembre 2001.\nLa deuxième possibilité est de faire retarder l’application de la loi nouvelle. \nDeuxième cas : le texte nouveau est un règlement. Le gouvernement ou l’autorité administrative qui l’a prise n’a pas le droit de faire rétroagir le texte, il peut seulement en retarder l’application. \n\nDeux type de considération qui peuvent expliquer la volonté de différer l'application du \ntexte : \n la volonté de laisser à l’opinion publique ou aux autorités administratives et judiciaires le temps de se familiariser avec des dispositions nouvelles .\nex → la loi du 14 février 2022 a créé un nouveau statut applicable aux entrepreneurs individuels. \n\nDésormais, tout entrepreneur individuel se trouve automatiquement à la tête de 2 patrimoines ; d’une part, son patrimoine professionnel qui ne peut être saisi que par ses créanciers professionnels et d’autre part, son patrimoine personnel qui ne peut être saisi que par ses créanciers personnels. L'entrepreneur n’a plus nécessairement besoin de mettre son patrimoine à l'abri et créer une société dotée de la personnalité morale, donc doté de son propre patrimoine. Le législateur a laissé un délai de 3 mois entre la promulgation du texte et son entrée en vigueur, elle est entrée en vigueur le 14 mai 2022.\n\nex → une loi du 2 mars 2022 permet à toute personne majeure, quelque soit son nom jusqu'à présent, de choisir de porter dorénavant soit le nom de son père, soit le nom de sa mère, soit le nom des deux dans n’importe quel ordre. Ce changement est cependant possible qu’une seule fois. Pour se faire, le demandeur se rend à la mairie soit de son lieu de naissance, soit de son domicile et remplit un simple formulaire qu’il remet au service de l’état civil. Un délai d’un mois à partir du dépôt du formulaire est censé être un délai de réflexion. Au bout d’un mois, la personne repassée à la mairie doit conformer sa demande et doit changer son nom à l'état civil. Le législateur a décidé que cette loi est entrée en vigueur le 1er juillet 2022. \n\nDans les matières semi-législatives, le Parlement fixe les principes généraux mais il faut attendre la sortie des décrets d’application. \nex → les lois bioéthiques du 29 juillet 1994 ont admis la possibilité pour un couple en courant a une PMA, d'accueillir les embryons surnuméraires d’un autre couple si ce couple n’a plus de projet parental. Il a fallu attendre un décret d’application du 2 novembre 1999 pour que cet accueil soit possible. \n\nDeuxième remarque : \nParfois, des erreurs de retranscription se glissent entre le texte original et le texte qu’il est publié au JO. Dès lors que l’erreur est décelée, les services ministériels publient au JO un “erratum” (rectificatif qui rétablit le texte original de la loi ou du règlement). \n\nProblème : Les tribunaux sont-ils obligés de tenir compte de l’erratum ?\nPremière hypothèse → l’erratum rectifie une erreur matérielle (faute d’impression, un oubli de lettre, de mot, faute dans le numéro d’article). Les tribunaux vont considérer que le texte publié dans l’erratum s’applique a la date du texte qu’il vient de corriger. \nDeuxième hypothèse → l’erratum entraîne une modification du sens du texte qui était à l’origine publié par erreur au JO (tel est le cas lorsque l’erratum consiste à rajouter une phrase qui selon les services admistraifs auraient ete oublies, ou même de rajouter l’adverbe “notamment” devant une énumération de choses). \n\nLa Cour de cassation distingue deux points : \nLe rectificatif concerne un règlement. \nLa Cour de cassation considère l’erratum comme valable seulement, à la seule lecture du texte publié, qu’il y a une erreur. En revanche, si le texte publié au départ est cohérent, pour la Cour de cassation, les tribunaux ne prennent pas compte de l’erratum. La solution consistera, pour l’autorité administrative dont le texte a été publié au JO avec une erreur, a refaire une nouvelle délibération et a publié au JO un nouveau texte modifiant / supprimant l'erreur. \nLe rectificatif concerne une loi. Les juridictions ont un outil de travail pour vérifier si l’erratum est bien réel. A côté du JO, on trouve un JO qui reprend les débats du Sénat et un JO qui reprend les débats de l’AN. Il suffit que le juge consulte legifrance et consulte les JO pour savoir si l’erratum existe bien.\n\n2 - La date d'expiration du texte \n\nEn principe, un texte cesse d'être applicable à partir de la date de son abrogation. Seule l’autorité qui a été l’investigateur du texte (le Parlement pour une loi, le ministre pour un arrêté ministériel…) a le pbr d’abroger le texte. Cette abrogation peut être soit expresse, soit tacite. Elle est expresse lorsqu’un texte nouveau contient un article déclarant que les dispositions nouvelles entraînent l'abrogation de telles dispositions anciennes. Elle est tacite lorsque le texte nouveau, même s’il ne déclare pas expressément, abroge telles dispositions qui sont incompatibles avec des textes anciens. \n\nEn dehors de l’abrogation, il y a deux autres causes d’expiration du texte : \nL’annulation qui produit un effet rétroactif. En ce sens, on fera comme si le texte n’avait jamais existé. L’annulation d’une loi est très rare et elle peut intervenir à la suite d’une période troublée ; un régime politique succède à un autre. \nex → Les lois votées sous Vichy confisquant les biens possédés par les personnes juives ont été annulées. Ce qui a entraîné la restitution des biens à leur légitime propriétaire ou à leurs héritiers / héritières. \nL'annulation d’un règlement est plus fréquente et peut être décidée par des juridictions administratives, car elle constate soit que le texte a été pris par une autorité incompétente, soit car ça porte atteinte à une liberté fondamentale protégée par un texte de niveau supérieur de la pyramide de Kelsen. \nex → le Conseil d’État avait annulé dans un arrêt du 26 août 2016 les arrêtés anti-burkinis au motif que les arrêtés portaient une atteinte grave et illégale aux libertés fondamentales (liberté d’aller et de venir, la liberté de conscience et la liberté personnelle). La même solution a été réaffirmée le 1er juillet 2023 par le Conseil d’État, saisi par la ligue des droits de l’homme, qui a annulé un arrêté municipal d’un maire qui voulait interdire le port du burkini sur une plage de sa commune durant l'été 2023. \n\nL’arrivée du terme qui avait été fixée dans le texte. Un certain nombre d'arrêtés municipaux sont pris par la période estivale. \nex → interdiction de se garer sur le parking des Francofolies de telle date à telle date ; interdiction de promener son chien sur le plage de Châtel de telle date à telle date. \nIl arrive aussi que des lois soient expressément prévues comme devant s’appliquer pour une durée déterminée. \nex → la loi du 17 juillet 1975 relative à l'IVG avait été, dans un premier temps, votée pour une durée de 5 ans pour permettre à l'opinion public très divisée de lui accepter le principe d’IVG à titre d’essai. Sur les 577 députés, en 1975, il n’y avait que 7 femmes dont Simone Veil. Une loi du 31 décembre 1979 lui a été substituée pour rendre l’IVG permanent. Depuis lors, plusieurs lois se sont succédées pour banaliser le recours à l’IVG comme par exemple : \nLa loi du 4 juillet 2001 qui a porté de 10 à 12 semaines, le délai durant lequel une femme peut se décider d’avoir recours à l’IVG pour convenance personnelle. \nLa loi du 4 aout 2014 qui indique que la femme peut par simple choix personnelle, sans avoir à jusitifer d’une situation de detresse, recourir à l’ivg pour convenance personnelle. \nLa loi du 26 janvier 2016 qui supprime le délai de réflexion de 7 jours qui devait s'écouler entre la première consultation et la pratique de l’IVG, qui facilite l’usage des IVG médicamenteuse et qui autorise les sages-femmes à prescrire l’IVG. \nLa loi du 2 mars 2022 qui porte de 12 à 14 semaines le delai pendant lequel une femme peut decider d’avoir recourir a l’IVG pour convenance personnelle (en ANgletterre, l’IVG est aurorisé jusq’a 21 semaines). \nLe droit à l’IVG a été remis en cause dans certaines pays : \nEn 2020 pour la Pologne \nEn 2022 pour la Hongrie \nEn 2022 pour les USA, ou la Cour suprême a, le 24 juin 2022, remis en cause le droit à l’avortement en autorisant chaque etat federal de legiferer à son sujet.\nÀ ce jour, 13 États américains ont totalement interdit l’IVG, et d’autres ont limité l'accès à l’IVG comme la Floride, qui depuis avril 2023, n’autorise l’IVG que dans les cas où les femmes sont enceintes de moins de 6 semaines.\n\nEn France, le droit à l’IVG a été intégré dans la Constitution française le 4 mars 2024, puisque l’article 34 de la Constitution affirme que “la loi détermine les conditions dans lesquelles s’exerce la liberté de mettre fin à une grossesse”. Cela fait de la France le premier pays à avoir inscrit le droit à l’IVG dans la Constitution. Cette révision constitutionnelle a été adopté pour proteger le droit à l’avortement contre ttes tentatives de restrcution futures par une majorité parlementaire comme notamment le RN de remtter ene cause ce droit de l’IVG.  \nEn 2024, il y a eu 251 270 IVG et dans 80% des cas ce sont des IMG (interruption médicamenteuse de grossesse) qui sont faites, pour 663 000 naissances (c’est le même niveau que pdt la Second guerre mondiale). \n27,5% des embryons conçus sont éliminés via un avortement, et statistquement il y a plus d’1 femmes sur 3 qui sont recours à l’avortement. \n\nC) Les conflits de lois dans le temps \n\nSelon l’article 2 du Code civil : “La loi ne dispose que pour l'avenir ; elle n'a point d'effet rétroactif.”. \nIl y a 2 règles qui découlent de cet article : \n1ère règle : la loi nouvelle à un effet immédiat et doit s'appliquer à toutes les situations juridiques qui naissent après son entrée en vigueur. \n2e règle : la loi nouvelle n’a, en principe, pas d’effet rétroactif, c’est-à-dire qu’elle ne doit pas s’appliquer aux situations juridiques qui sont nées avant son entrée en vigueur et dont les effets sont achevées à la date de son entrée en vigueur. \nCependant le problème vient du fait qu'il existe un certain nombre de situations juridiques nées avant l'entrée en vigueur de la loi nouvelle et qui continue à produire des effets juridiques sous l’empire de la loi nouvelle. \nOn parle, pour les désigner, de situations juridiques en cours. La question posée est celle de savoir s’il faut appliquer à ces situations la loi nouvelle ou la loi ancienne ? \nex → une loi du 3 décembre 2001 a accordé aux enfants adultérins les mêmes droits successoraux qu’aux enfants légitimes. S'appliquent-elles aux enfants adultérins avant son entrée en vigueur ? \nex → une loi du 5 juillet 1974 a abaissé l'âge de la majorité de 21 à 18 ans (Valéry Giscard d’Estaing est à l’origine de cette loi). Supposons qu'une loi repasse la majorité à 21 ans, que se passe-t-il ? Est-ce qu'on redevient mineur ou non ? \nPour répondre à ces questions, 2 théories se sont succédées sachant que dans certaines hypothèses, indépendamment de l’application de ces théories, la loi nouvelle sera rétroactive. \n\n1 – La théorie classique et le principe de la non rétroactivité \n\nCette première théorie distingue les droits acquis et les simples espoirs expectatives (“espoirs de droit”). La loi nouvelle n’a pas d’effet sur les droits acquis de l’individu lais en revanche, remet en cause les espoirs du droit. \nex → si une loi nouvelle remet la majorité a 21 ans, les jeunes qui ont entre 18 et 21 ans ont le droit acquis d'être majeur donc ils restent majeurs. Or, celui qui fêtait son anniversaire de sa majorité après cette loi, devra attendre d’avoir 21 ans. \n\nCette théorie est parfois difficile à mettre en œuvre car il n’est pas toujours facile de savoir ce qui est du droit acquis et des simples espoirs de droit. \n\n2 – La théorie moderne et le principe de la non rétroactivité \n\nCette théorie a été développée par le professeur Roubier dans un ouvrage de 1928 intitulé “les conflits de loi dans le temps”. Cet auteur propose de distinguer parmi les situations jurications en cours (les situations légales et les situations contractuelles) : \nPour les situations légales, on applique strictement l'article 2. C’est-à-dire que “la loi nouvelle ne régira que les effets futurs sans modifier les effets passés”. Par situation légale, il faut entendre toutes les situations juridiques qui trouvent leur source non pas dans un contrat mais dans la loi. Tout ce qui concerne l'état des personnes entre dans la catégorie des situations légales. L'état des personnes regroupent la \ncapacité / l'incapacité, la nationalité, les droits successoraux, le mariage, le divoce…\nex → avant 1938, dans les facultés de droit : lorsqu’on enviseait la femme mariée, elle n’avait pas la capacité juridique mais était representé par son époux pour l’accomplissement des actes juridiques, tout comme l’enfant. Il s'agit là d’une situation légale. La loi nouvelle de 1938 s’applique pour le futur mais ne remet pas en cause le passé. Concrètement à partir de 1938, toutes femmes n’a plus besoin d'être représenté par son mari pour faire des actes juridiques, par contre les actes juridiques appliquées avant 1938 restent annulables.  \n\nLes situations contractuelles en cours, pour lesquelles le respect de la volonté des contractants s’opposent à ce qu'on applique la loi nouvelle au contrat signé avant et dont les effets se poursuivent après l'entrée en vigueur de la loi nouvelle. En effet, les parties au contrat se sont engagées en vertu d’un cadre juridique qu'ils connaissaient. admettre que la loi nouvelle puisse modifier l'engagement initial est contraire à la volonté des partis. \nex → un contrat de vente est signé aujourd'hui, une loi nouvelle modifie l'étendue de la garantie contre les vices cachés. On s'adapte à la date du contrat et non à la loi nouvelle. \n\n3 – Les cas où la loi nouvelle est rétroactive \n\nNous avons 5 hypothèses, dans lesquelles une loi nouvelle va s’appliquer à des situations juridiques en cours sans que cela résulte de la théorie moderne. \n1er cas : c’est le cas pour les lois nouvelles que le législateur déclare expressément rétroactives. En effet, le principe de non rétroactivité est affirmé à l'article 2 du Code civil donc dans un texte de niveau 4 de la pyramide de Kelsen. Donc dans un autre texte de niveau 4, le législateur peut déclarer que la loi rétroagit. Par exception, ce n’est qu’en matière pénal que ce principe est appliqué dans la DDHC qui fait partie du bloc de constitutionnalité donc dans un texte de niveau 1. Cela interdit au législateur d'édicter des crimes ou des délits nouveaux et de les déclarer applicables à des comportements antérieurs à l'entrée en vigueur de la loi nouvelle. \nex → une loi du 3 août 2018 a instauré une infraction nouvelle qui est l’infraction a l’outrage sexiste (Art.621- 1 du Code Pénal). Cette infraction va être constitué dans les cas suivants : \nsifflements\nsuggérant ou portant un acte sexuel\ngestes ou paroles obscene \npropositions sexuelles ou des questions intrusives sur sa vie sexuelle\ncommentaires dégradants sur le physique ou la tenue vestimentaire\nle fait de suivre de manière insistante une femme dans la rue. \nLa peine encourue est une amende correspondant à une contravention de 4e classe ( de 90€ jusqu’au 750€ si l’amende n’est pas payée) ou de 5e classe en cas de circonstance aggravantes ou si la personne est en situation de récidive (jusqu'à 1500€). Depuis le 1er avril 2023, l'outrage sexiste est devenu un délit punissable d’une amende jusqu'à 3750€, s’il est commis avec l’une des circonstances aggravantes suivantes : \nl'outrage sexiste est commis dans un transport en commun,\nl'outrage sexiste est commis par un groupe de personnes,\nlorsque la personne a été choisi pour son orientation sexuelle,\nlorsque la victime a moins de 15 ans. \nEn 2023 : 2400 condamnations ; 2024 : 3926 condamnations ; 2025 : 3900 condamnations. \nOn peut noter que le législateur n’aurait pas eu le droit de déclarer cette sanction applicable à des comportements antérieurs à l'entrée en vigueur de la loi. \n\nex → de manière plus fine, le problème s’est posé à propos d’une loi du 25 février 2008. Cette loi donne la possibilité au juge de placer le criminel qui a purgé sa peine en centre de rétention de sûreté pour une durée d’1 an renouvelable, s'il est encore dangereux pour la société. Cette loi devait s'appliquer à toutes les personnes en prison, condamnés pour des faits antérieurs au 25 février 2008. Le 21 février 2008, le Conseil constitutionnel a déclaré que la loi nouvelle ne pouvait s'appliquer qu’aux personnes ayant commis des faits après l'entrée en vigueur de la loi nouvelle. \n\n2e cas : c’est le cas pour les lois dites interprétatives dont l’objet est de clarifier ou de préciser le contenu d’une loi antérieure. Ces lois rétroagissent, en ce sens qu’elles s’appliquent à la date de loi qu'elle vient interpréter. \n3e cas : c’est le cas pour les lois pénales plus douces. C’est-à-dire les lois qui édictent des peines moins sévères que celles prévues dans les textes qu’elles remplacent, voire qui suppriment une infraction. On va appliquer ici les dispositions nouvelles, même aux infractions commises avant son entrée en vigueur à condition que le procès soit en cours et que l'infraction n'ait pas donné lieu à une condamnation définitive. C’est en vertu de ce principe que le Tribunal Correctionnel de Paris a été dans l'impossibilité, le 27 octobre 2009, de prononcer la dissolution de l’association qui représente en France l’église de scientologie. Cette décision / ce jugement condamné l'église de scientologie à payer d'importantes amendes (+ de 60000€) pour escroquerie en bandes organisées suite à des plaintes déposées par des anciens adeptes dépouilles de leurs biens. Les faits ont été commis à l'époque où le Code pénal prévoyait la possibilité de prononcer à titre de sanction, la dissolution des personnes morales coupables d’escroquerie. Par un curieux hasard des calendriers, alors que des poursuites pénales étaient en cours contre l’église de scientologie, une loi du 12 mai 2009 a supprimé la possibilité de prononcer la dissolution des personnes morales coupables d’escroquerie. C’est une loi pénale plus douce qui a donc bénéficié à l'église de scientologie qui n’avait pas été définitivement condamnée. \n4e cas : les lois dites de procédures qui rétroagissent en ce sens qu’elles vont s'appliquer à toutes les procédures en cours et pas seulement aux procédures ouvertes avant l'entrée en vigueur de la loi. \nex → la loi du 23 mars 2019 a remplacé le TGI par les tribunaux judiciaires donc les lois de procédures ne s'appliquent pas qu’aux procédures nouvelles.  A VERIFIER LA DATE !!!!\n5e cas : les lois déclarées d’ordre public (impératives) soit par la jurisprudence, soit par législateur lui-même qui concerne des situations contractuelles en cours. Ces lois s'appliquent à toutes les situations contractuelles en cours mm si le contrat en question a été conclu à l'époque de la loi ancienne. \nex → la loi du 14 décembre 2020 instaure un congé de paternité de 25 jours contre 11 avant, indemnisé par la sécurité sociale et qui s’ajoute aux 3 jours de naissance payés par l’employeur. Ce congé de paternité s’applique pour les enfants, mais après le 1er juillet 2021, et ceci quelle que soit la date ou le contrat de travail a été signé. Le père est obligé de prendre en plus des 3 jours de naissance 4 jours de congé paternité. Les 21 jours restants ne sont pas obligatoires et pourront être pris de manière fractionnée dans les 6 mois qui suivent la naissance. Le but de cette réforme est, petit à petit, de faire passer à une société matriarcale (éducation du fait des mères) à une société plus égalitaire entre les sexes, dans les rapports parents-enfants comme dans bcp de pays du nord de l’Europe. \n\nD) Les conflits de lois dans l’espace \n\nLe problème posé ici est de savoir dans quel cas la loi française va s'appliquer lorsque dans un litige donné il y a un élément d'extranéité (un élément qui pourrait conduire à appliquer une loi étrangère). \nIl y a deux règles qui découlent de l’article 3 du Code civil : \nLa règle de la territorialité de la loi, selon laquelle la loi française s’applique sur le territoire français dès lors qu’il s’agit d’une loi de sûreté ou de police (de loi pénale ou de procédure pénale), ou d’une loi concernant un immeuble. Cela a donc 2 conséquences : \nSi un étranger commet une infraction sur le territoire français, la loi française s'applique indépendamment de la nationalité du prévenu. \nSi un étranger est propriétaire d’un immeuble situé en France, la loi française régit les règles applicables à cet immeuble indépendamment de la nationalité du propriétaire. \n\nLa règle de la personnalité de la loi, selon laquelle la loi française s’applique à tous les français, même s'ils sont domiciliés à l’étranger pour tout ce qui concerne l’état (mariage, filiation) et la capacité des personnes. \nex → deux français habitent à l’étranger et ont des enfants, c’est la loi française qui régit la filiation des enfants. Ils veulent divorcer à Bruxelles, c’est aussi la loi française qui régit le divorce. L’un d'eux souffre de la maladie d'Alzheimer, il faut le mettre sous tutelle selon la loi française. \n\nRemarque : les dispositions de l’article 3 du Code civil ne permettent que de régler des questions relativement simples. Il existe des situations plus compliquées dont le mode de résolution est déterminé par des règles de droit qui relèvent d’une branche du droit appelé le droit international privé. \nex → accident de la circulation en Allemagne entre 2 voitures conduites par un français ou une voiture conduite par un français et l’autre par un étranger, quelle loi appliquer ? \nSolution : le règlement européen Rome II, adopté par la commission européenne le 16 mai 2007, affirme que la loi applicable est la loi du lieu où le dommage s’est réalisé. \nex → le décès de Johnny Hallyday le 6 décembre 2017 en France. Celui-ci s'était installé en Californie depuis 2000 pour échapper aux impôts français. La loi californienne ne fait pas des enfants du défunt des héritiers réservataires de la succession. En revanche, la loi française interdit de déshériter totalement ses enfants qui sont des héritiers réservataires. Le dernier testament rédigé par Johnny Hallyday déshéritait totalement ses 2 aînés en faveur de Laetitia Hallyday et ses 2 enfants qu’il avait adopté avec elle. Ce testament est-il \nvalable ? Oui, si la loi californienne s’applique et non, si la loi française s’applique. C’est un problème de droit international privé. Un règlement européen, entré en vigueur en 2015, prévoit que la loi qui va régir la succession est la loi du dernier domicile du défunt peu importe sa nation alité. Toute la question était donc de déterminer le dernier domicile de Johnny Hallyday. Dans un jugement du 28 mai 2019, le TGI de Nanterre s'est déclaré compétent pour examiner la succession de Johnny Hallyday, et a donc considéré que son dernier domicile était en France. Les juge ont été sensibles au fait que Johnny ait conservé sa maison de Marne La coquette ou il est mort le 6 décembre 2017, le fait qu’il soit enterré en France (Saint-Barthélemy), le fait que plus de 90% des revenus de Johnny proviennent de sa musique en France de sorte que ses intérêts financiers sont en France et le fait que les interactions sur tous ses réseaux sociaux et pour l'essentiel, étaient des adresses IP en France. Laetitia a, dans un premier temps, interjeté appel, et en août 2020 il y a eu transaction des avocats français et américains qui reconnaissent les enfants aînés de Johnny dans leurs droits avec un désistement devant la Cour d’appel de Paris. \n\nSection 2 : Les sources non écrites \n§1 – La jurisprudence \n\nD'après le professeur Malaurie, la jurisprudence désigne un ensemble de décisions judiciaires d'où se dégage une règle de droit car elles ont été constamment rendues dans le même sens et sur les mêmes questions. La règle jurisprudentielle permet de compléter et d'éclairer l’application de la loi. Une décision isolée ne constitue pas à elle seule une jurisprudence. La formation de la jurisprudence suppose des décisions judiciaires allant dans le même sens et dont certaines émanent de juridictions supérieures. \n\nA) L’existence de décisions judiciaires \n\nD’un point du vue terminologique, on parle de jugements ou ordonnances pour des décisions rendues par les juges de 1ère instance. \nOn parle deuxièmement
