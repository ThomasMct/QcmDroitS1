Allemagne) que régional (Italie, Espagne) ou unitaire (France). Contrairement à la plupart des États-gendarmes ou providence, dans lesquels c’est la loi qui est l’instrument déterminant, la Constitution est alors la norme de référence pour déterminer son existence, puisque c’est la Constitution qui détermine l’entité à laquelle est confiée la souveraineté, en l’occurrence la nation.*\n- *Plus spécifiquement et plus actuellement sans doute, existe aussi ce qu’on appelle l’État de droit, que paradoxalement, tout le monde connaît, et que tout le monde est bien en peine de définir clairement. Là encore, une approche historique s’impose pour comprendre ce que signifie cette notion devenue centrale dans les démocraties occidentales, et cruciale à l’heure contemporaine, à la fois lorsqu’elle est pensée (Section 1) et lorsqu’elle est mise en œuvre (Section 2).*\n\n\n\n\n\n**Section 1 – Les ambivalences de la théorie de l’État de droit **\n\n- La notion d’État de droit apparaît à la fin du XIXe siècle dans la littérature allemande (*Rechtsstaat*) et britannique (*Rule of law*) ; c’est depuis la doctrine d’outre-Rhin que le terme est importé en France, d’où il résulte une certaine différenciation avec la conception anglo-saxonne, sur laquelle nous reviendrons. La théorie est d’abord celle de** Raymond Carré de Malberg** (§1), dont la pensée sera discutée par **Kelsen **(§2) ; d’où une difficulté persistante à concevoir une définition claire et indubitable de ce fameux État de droit (§3).\n\n\n\n**§1 – Raymond Carré de Malberg et la théorie de l’autolimitation de l’État **\n\n- *Professeur strasbourgeois (germanophone), constitutionnaliste étudiant la IIIe République, le régime parlementaire qui s’y déploie, et l’héritage de la pensée révolutionnaire dans les lois constitutionnelles de 1875.*\n- *Penseur libéral, défavorable au despotisme et partisan des libertés individuelles, il est aussi un penseur de la souveraineté de l’État ; l’État n’a donc pas de limite dans l’exercice de son pouvoir, si ce n’est celles qu’il s’impose à lui-même. D’où l’idée d’**autolimitation**.*\n\n*⇒ personnification paroxystique de l’État, dont l’autorité dépend de la **cohérence** de son pouvoir (confusion entre État et corps politique l’incarnant) ; si le pouvoir édicte des règles, il ne peut obtenir des citoyens qu’ils les respectent que si le corps politique s’y soumet lui-même. *\n\n*[argument déployé à propos de la condamnation du RN et de **Marine Le Pen **(mars 2025) // ou lorsque **Bruno Retailleau** critiquait une décision du TA de Melun annulant une OQTF (fév. 2025) en vertu d’une loi qu’il a lui-même défendue et votée quelques mois auparavant]*\n\n\n\n**§2 – Hans Kelsen et la théorie de la hiérarchie des normes **\n\n- ***Kelsen **est un contemporain plus jeune de Carré de Malberg, et il se prévaut d’une Théorie **pure** du droit, c’est-à-dire d’une science du droit qui exclut de son analyse toute dimension extra-juridique – politique, sociologique ou économique : on dit qu’il est **normativiste**, c’est-à-dire qu’il définit exclusivement le droit comme un ensemble de **normes**. À ce titre, il ne peut se satisfaire de la conception strasbourgeoise de Carré de Malberg, non plus qu’il n’emploie le terme de souveraineté, indéfinissable par le seul recours aux normes juridiques.*\n- *Pour **Kelsen**, l’État n’est donc pas une puissance souveraine, mais un **ordre juridique unifié et hiérarchisé** ayant cours sur une zone géographique donnée. L’État est donc fondamentalement **de droit **; les deux notions sont synonymes.*\n\n***⇒ Ou pour résumer rapidement la pensée de Kelsen :  Hiérarchie des normes = État = État de droit***\n\n- *Il en résulte qu’on a un État dès lors que **chaque norme** – expression juridique d’un pouvoir politique – **est adoptée en vertu d’une norme supérieure**, Constitution exceptée. Ainsi entendu, un État de droit est un État dans lequel le pouvoir administratif est soumis à la loi, loi dont on est certain qu’elle est conforme à la Constitution. L’État de droit appelle donc la mise en œuvre de la **justice constitutionnelle**. Ce qui explique d’ailleurs l’apparition simultanée de ces deux phénomènes dans l’histoire récente : après la seconde guerre mondiale, en Europe, se développe partout la culture de l’État de droit en même temps que fleurissent les Cours constitutionnelles.*\n\n ***Il existe encore d’autres définitions par la doctrine d’entre-deux guerres de l’État de droit, notamment celle de Léon Duguit, sur laquelle je ne m’attarde pas. Toutes ont nourri ce qu’on appelle globalement « État de droit » aujourd’hui.***\n\n\n\n**§3 – Principes et limites de l’État de droit **\n\n- ***Principe** : **le pouvoir politique s’exerce dans le respect du droit**, ce qui comporte des garanties sur le fait qu’il ne soit pas despotique, c’est-à-dire attentatoire à la liberté individuelle, puisque la Constitution spécifiquement comporte des garanties dont on est sûr qu’elles seront respectées. On parle aussi de principe de **prééminence du droit **(Conseil de l’Europe).*\n- ***Principe de légitimité** : on peut faire confiance à la décision politique prise en la forme juridique puisqu’elle respecte les valeurs fondamentales identifiées par le Constituant.*\n\n*⇒ Réconciliation entre Carré de Malberg et **Kelsen **puisque l’État s’autolimite en adoptant du droit auquel il se soumet lui-même, en l’inscrivant dans les hautes sphères de la hiérarchie des normes.*\n\n- *La limite conceptuelle est justement celle-ci : tout le pouvoir politique exercé au sein de l’État ne peut pas être soumis au droit, puisque le droit ne tombe pas du ciel (en toute laïcité), mais résulte lui-même **ultimement**, d’une décision politique qui appartient au **pouvoir constituant originaire**, caractérisé par sa souveraineté, c’est-à-dire son absence totale de soumission au droit. Ni l'auto-limitation ni la hiérarchie des normes ne permettent de surmonter cette aporie conceptuelle qu’il n’existe aucune garantie que le droit constitutionnel et donc toute la hiérarchie des normes, soient conformes à des valeurs quelconque. Rien ne permet d’empêcher en théorie que le droit constitutionnel ne consacre un régime dictatorial ou des atteintes aux droits fondamentaux.*\n\n***⇒ Retenez bien que le droit ne comporte aucune vérité absolue, seulement celle (relative) des contingences qui le voient naître ; il reste un produit de la volonté humaine.***\n\n- *Pour faillible ou inachevée qu’elle puisse être, la théorie de l’État de droit a toutefois été prise à bras-le-corps par des pouvoirs constituants au lendemain de la seconde guerre mondiale, ce qui en fait désormais une notion incontournable du droit constitutionnel contemporain.*\n\n\n\n**Section 2 – Les modalités de la mise en œuvre de l’État de droit* ***\n\n- *À partir de 1945, l’État de droit se substitue progressivement à l’**État légal **(**M.-J. Redor-Fichot**), lui-même expression du **légicentrisme** hérité de la Révolution : sacralisation de la loi, dont on présume qu’elle est infaillible puisqu’elle est issue de la représentation nationale depuis 1789. Cela conduit à établir dans le droit constitutionnel un certain nombre de garanties (§1), aujourd’hui remises en cause (§2).*\n\n\n\n**§1 – Les garanties de l’État de droit **\n\n- *Définition aujourd’hui **substantialisée** de l’État de droit, par association à la Rule of law, notamment par le développement du droit européen, qui réconcilie des notions nées dans un contexte national ; à la conception formelle inspirée d’un Kelsen se conjugue désormais une **conception matérielle**, portant un certain nombre de valeurs éthiques et politiques jugées constitutives d’un État de droit et protégées unanimement par la plupart des ordres constitutionnels (A), jusqu’à ce que l’État de droit se confonde presque avec la démocratie (B).*\n\n\n\n**A. Les déclinaisons de l’État de droit **\n\n- *Certains droits constitutionnels énoncent expressément l’attachement de leurs auteurs au respect de l’État de droit, éventuellement démocratique et social : Portugal, Hongrie, Pologne, Roumanie, Rép. tchèque… + Union européenne.*\n- *Qu’elle soit mentionnée ou pas, le concept se développe partout, par les juges ou par la doctrine (Commission de Venise), et elle renvoie toujours à des valeurs et mécanismes communément admis.*\n\n → **Des libertés publiques aux libertés fondamentales**\n\n- *Si le Parlement peut porter atteinte aux droits individuels et opérer des discriminations, la loi ne suffit pas pour protéger les droits de chacun ; **rehaussement** des droits et libertés devenant fondamentaux, bénéficiant d’une protection **constitutionnelle **ou** conventionnelle**.*\n\n***Exemple **→ liberté d’association ou syndicale, principe de non-discrimination, jusqu’à la liberté de l’IVG*\n\n **→ La sécurité juridique**\n\n- *Nul n’est censé ignorer la loi, qui doit en retour être intelligible et prévisible pour ses sujets.*\n- *En sus d’éléments de légistique, la sécurité juridique implique aussi une protection des **droits acquis **et des garanties contre la **rétroactivité de la loi**, spécifiquement en droit pénal (légalité des délits et des peines).*\n\n **→ L’indépendance de la justice**\n\n- *Disposer de droits contre le pouvoir politique, y compris législatif, suppose d’être en mesure de les faire valoir, et d’obtenir réparation s’il y est porté atteinte ; un droit proclamé ne suffit pas, il doit être **subjectif**. D’où le rôle crucial conféré aux juridictions dans un État de droit – État du juge ? – mais qui ne serait d’aucun effet si le pouvoir judiciaire était acoquiné avec le législateur ou n’importe quel pouvoir politique. L’**indépendance** et l’**impartialité** de la justice sont donc les premières garanties du **droit à un procès équitable**, lui-même droit premier des libertés fondamentales.*\n\n **→ La séparation des pouvoirs**\n\n- *L’indépendance de la justice est l’une des modalités de la séparation des pouvoirs, celle-ci étant plus largement un instrument de lutte contre la concentration du pouvoir, donc le despotisme et l’autocratie. Pour que les citoyens soient libres, il faut que le pouvoir soit divisé, ainsi que le préconisent les Constitutions modernes.*\n- *Dans chacune de ces déclinaisons, l’État de droit est un **perfectionnement** de mécanismes inventés en 1789 par le constitutionnalisme ; soumettre l’État au droit consiste simplement à garantir l’effectivité des garanties constitutionnelles pensées par les Révolutionnaires. *\n\n\n\n**B. L’articulation de l’État de droit avec la démocratie **\n\n- *La démocratie se développe avant l’État de droit, et celui-ci peut être envisagé comme un instrument de celle-ci : si la démocratie est l’exercice du pouvoir confié à l’ensemble des citoyens, elle va supposer que ces citoyens disposent de droits politiques (suffrage, expression, association…) **effectifs**, c’est-à-dire protégés contre le législateur.*\n- *La démocratie par l’élection implique que les majorités puissent évoluer, et qu’une élection ne fasse pas l’autre ; on peut donc estimer qu’un régime démocratique est celui qui protège les **droits des minorités**, de façon à ce qu’elles puissent devenir majoritaires. Là encore, le registre des libertés fondamentales dote la démocratie d’une substance, et l’État de droit qui en permet la promotion, en devient l’instrument privilégié.*\n- *Démocratie et État de droit sont ainsi parfois entendues comme synonymes dans le langage journalistique, ce qu’ils ne sont pas exactement ; leurs développements et leur promotion dans les systèmes politiques vont toutefois souvent de pair.*\n\n\n\n**§2 – Les menaces contre l’État de droit**\n\n- ***B. Retailleau**, « L’État de droit n’est ni intangible ni sacré » ; langage performatif : rien qu’en le disant, le ministre de l’Intérieur à l’époque désacralise l’État de droit.*\n- *Et de fait, si l’on peut bien considérer que l’État de droit est **sacré **en ce qu’il est la seule méthode connue de promotion de la démocratie, certes imparfaite (il est donc sacré pour les démocrates…), force est de constater qu’il n’est pas intangible, pas plus que le droit (constitutionnel) ou la démocratie : il est incroyablement facile de lui porter atteinte, dès lors qu’on remet en cause ses éléments constitutifs.*\n- *Remise en cause de l’indépendance de la justice*\n\n*o   Structurellement : Hongrie et Pologne, réforme du mode de nomination*\n\n*o   Rhétoriquement en France, en criant à tort et à travers que les juges sont politiques.*\n\n*[Précision et articulation avec **pouvoir interprétatif** – donc politique – des juges : distinction entre juge constitutionnel (dernier mot, composition, laconisme du texte) et juge administratif ou judiciaire // dire que le juge exerce par un acte de volonté ne signifie pas qu’il n’est pas indépendant du pouvoir politique].*\n\n- *Atteinte à la transparence et à la déontologie politiques*\n- *Problème des décisions politiques prises dans les alcôves du pouvoir, loin de toute audience, favorisant les conflits d’intérêts au détriment de l’intérêt général, remettant en cause la séparation des pouvoirs et usurpant ce faisant la souveraineté nationale censée prévaloir en vertu des dispositions constitutionnelles. *\n\n* *Un « recul » des droits fondamentaux est-il une remise en cause de l’État de droit ?*\n\n***Exemple **→ d’une réforme constitutionnelle qui viendrait abolir un droit régulièrement inscrit*\n\n*Remise en cause de l’avortement Pologne 2020 / États-Unis 2022.*\n\n***= Moins de droits fondamentaux mais respect des formes juridiques : dissociation voire contrariété entre État de droit et démocratie ? Peut-on penser un État de droit illibéral ? Aucun exemple satisfaisant…***\n\n\n\n*⇒ Dénigrer ou saboter l’État de droit est le plus souvent annonciateur d’une attaque masquée contre la démocratie et les droits et libertés individuels, autres enjeux essentiels du droit constitutionnel contemporain.*\n", "html": "<h2>Chapitre 3 – Les déclinaisons de l’État : l’État de droit</h2>\n<ul>\n<li><em>Il est fréquent de voir la notion d’État accolée à un autre nom (nation, gendarme, droit…). Et le but de ce dernier chapitre est de préciser ce que cela implique.</em></li>\n<li><em>Les notions que vous connaissez sans doute le mieux à ce titre sont celles d’État-gendarme et d’État-providence que l’on a tendance à opposer, et qui sont toutes les deux relativement désuètes (respectivement fin XIXe et mi-XXe) ; elles se réfèrent à des modèles idéologiques ou politiques quant au rôle que l’État est réputé assumer :</em></li>\n</ul>\n<p><em>-       <strong>État-gendarme</strong> : il se contente de maintenir l’ordre public en faisant prévaloir la liberté des acteurs ; avec toutefois un poids considérable à la morale publique voire de l’<strong>ordre moral</strong>, qui le distingue du modèle de l’ultra-libéralisme actuel. En vérité, c’est un modèle politique conservateur, qui vise à protéger ceux qui bénéficient des faveurs de la conjoncture.</em></p>\n<p><em>-       <strong>État-providence</strong> : associé le plus souvent à une théorie économique de la relance promue par le modèle keynésien, il consiste à attribuer à l’État un rôle de pourvoyeur d’activité économique, de sécurité sociale, de solidarité entre les citoyens (</em><strong>Welfare state de F. D. Roosevelt</strong>_ à partir de 1933)_</p>\n<ul>\n<li><p><em>Ces modèles sont d’ordre politique et théorique : ils n’ont que peu d’incidence sur la structure juridique de l’État mais davantage sur les politiques publiques qui vont être conduites par les majorités politiques, détenant le pouvoir législatif. (cf. cours d’Institutions administratives au semestre 2)</em></p>\n</li>\n<li><p><em>On a aussi beaucoup parlé du modèle de l’<strong>État-nation</strong>, qui se développe dès le XVIIIe et se généralise aux XXe avec les mouvements de décolonisation : la souveraineté de l’État est placée entre les mains d’une nation, c’est-à-dire d’un ensemble relativement homogène de personnes, partageant des caractéristiques linguistiques, culturelles, religieuses ou ethniques communes.</em></p>\n</li>\n<li><p>Attention<strong>, tous les États ne sont pas, ou plus, des États-nations, dans la mesure où existent des États multinationaux</strong> (Hongrie, Serbie, Roumanie…). Un État-nation peut être aussi bien fédéral (Allemagne) que régional (Italie, Espagne) ou unitaire (France). Contrairement à la plupart des États-gendarmes ou providence, dans lesquels c’est la loi qui est l’instrument déterminant, la Constitution est alors la norme de référence pour déterminer son existence, puisque c’est la Constitution qui détermine l’entité à laquelle est confiée la souveraineté, en l’occurrence la nation.</p>\n</li>\n<li><p><em>Plus spécifiquement et plus actuellement sans doute, existe aussi ce qu’on appelle l’État de droit, que paradoxalement, tout le monde connaît, et que tout le monde est bien en peine de définir clairement. Là encore, une approche historique s’impose pour comprendre ce que signifie cette notion devenue centrale dans les démocraties occidentales, et cruciale à l’heure contemporaine, à la fois lorsqu’elle est pensée (Section 1) et lorsqu’elle est mise en œuvre (Section 2).</em></p>\n</li>\n</ul>\n<h2>Section 1 – Les ambivalences de la théorie de l’État de droit</h2>\n<ul>\n<li>La notion d’État de droit apparaît à la fin du XIXe siècle dans la littérature allemande (<em>Rechtsstaat</em>) et britannique (<em>Rule of law</em>) ; c’est depuis la doctrine d’outre-Rhin que le terme est importé en France, d’où il résulte une certaine différenciation avec la conception anglo-saxonne, sur laquelle nous reviendrons. La théorie est d’abord celle de Raymond Carré de Malberg (§1), dont la pensée sera discutée par Kelsen (§2) ; d’où une difficulté persistante à concevoir une définition claire et indubitable de ce fameux État de droit (§3).</li>\n</ul>\n<h3>§1 – Raymond Carré de Malberg et la théorie de l’autolimitation de l’État</h3>\n<ul>\n<li><em>Professeur strasbourgeois (germanophone), constitutionnaliste étudiant la IIIe République, le régime parlementaire qui s’y déploie, et l’héritage de la pensée révolutionnaire dans les lois constitutionnelles de 1875.</em></li>\n<li><em>Penseur libéral, défavorable au despotisme et partisan des libertés individuelles, il est aussi un penseur de la souveraineté de l’État ; l’État n’a donc pas de limite dans l’exercice de son pouvoir, si ce n’est celles qu’il s’impose à lui-même. D’où l’idée d’<strong>autolimitation</strong>.</em></li>\n</ul>\n<p class=\"lesson-note\">⇒ personnification paroxystique de l’État, dont l’autorité dépend de la <strong>cohérence</strong> de son pouvoir (confusion entre État et corps politique l’incarnant) ; si le pouvoir édicte des règles, il ne peut obtenir des citoyens qu’ils les respectent que si le corps politique s’y soumet lui-même. *</p>\n<p><em>[argument déployé à propos de la condamnation du RN et de <strong>Marine Le Pen (mars 2025) // ou lorsque Bruno Retailleau</strong> critiquait une décision du TA de Melun annulant une OQTF (fév. 2025) en vertu d’une loi qu’il a lui-même défendue et votée quelques mois auparavant]</em></p>\n<h3>§2 – Hans Kelsen et la théorie de la hiérarchie des normes</h3>\n<ul>\n<li>Kelsen <strong>est un contemporain plus jeune de Carré de Malberg, et il se prévaut d’une Théorie pure</strong> du droit, c’est-à-dire d’une science du droit qui exclut de son analyse toute dimension extra-juridique – politique, sociologique ou économique : on dit qu’il est <strong>normativiste</strong>, c’est-à-dire qu’il définit exclusivement le droit comme un ensemble de <strong>normes</strong>. À ce titre, il ne peut se satisfaire de la conception strasbourgeoise de Carré de Malberg, non plus qu’il n’emploie le terme de souveraineté, indéfinissable par le seul recours aux normes juridiques.</li>\n<li><em>Pour <strong>Kelsen</strong>, l’État n’est donc pas une puissance souveraine, mais un <strong>ordre juridique unifié et hiérarchisé</strong> ayant cours sur une zone géographique donnée. L’État est donc fondamentalement de droit ; les deux notions sont synonymes.</em></li>\n</ul>\n<p class=\"lesson-note\"><em><strong>⇒ Ou pour résumer rapidement la pensée de Kelsen :  Hiérarchie des normes = État = État de droit</strong></em></p>\n<ul>\n<li><em>Il en résulte qu’on a un État dès lors que <strong>chaque norme</strong> – expression juridique d’un pouvoir politique – <strong>est adoptée en vertu d’une norme supérieure</strong>, Constitution exceptée. Ainsi entendu, un État de droit est un État dans lequel le pouvoir administratif est soumis à la loi, loi dont on est certain qu’elle est conforme à la Constitution. L’État de droit appelle donc la mise en œuvre de la <strong>justice constitutionnelle</strong>. Ce qui explique d’ailleurs l’apparition simultanée de ces deux phénomènes dans l’histoire récente : après la seconde guerre mondiale, en Europe, se développe partout la culture de l’État de droit en même temps que fleurissent les Cours constitutionnelles.</em></li>\n</ul>\n<p> <em><strong>Il existe encore d’autres définitions par la doctrine d’entre-deux guerres de l’État de droit, notamment celle de Léon Duguit, sur laquelle je ne m’attarde pas. Toutes ont nourri ce qu’on appelle globalement « État de droit » aujourd’hui.</strong></em></p>\n<h3>§3 – Principes et limites de l’État de droit</h3>\n<ul>\n<li>Principe : <strong>le pouvoir politique s’exerce dans le respect du droit</strong>, ce qui comporte des garanties sur le fait qu’il ne soit pas despotique, c’est-à-dire attentatoire à la liberté individuelle, puisque la Constitution spécifiquement comporte des garanties dont on est sûr qu’elles seront respectées. On parle aussi de principe de prééminence du droit (Conseil de l’Europe).</li>\n<li>Principe de légitimité : on peut faire confiance à la décision politique prise en la forme juridique puisqu’elle respecte les valeurs fondamentales identifiées par le Constituant.</li>\n</ul>\n<p class=\"lesson-note\"><em>⇒ Réconciliation entre Carré de Malberg et Kelsen puisque l’État s’autolimite en adoptant du droit auquel il se soumet lui-même, en l’inscrivant dans les hautes sphères de la hiérarchie des normes.</em></p>\n<ul>\n<li><em>La limite conceptuelle est justement celle-ci : tout le pouvoir politique exercé au sein de l’État ne peut pas être soumis au droit, puisque le droit ne tombe pas du ciel (en toute laïcité), mais résulte lui-même <strong>ultimement</strong>, d’une décision politique qui appartient au <strong>pouvoir constituant originaire</strong>, caractérisé par sa souveraineté, c’est-à-dire son absence totale de soumission au droit. Ni l'auto-limitation ni la hiérarchie des normes ne permettent de surmonter cette aporie conceptuelle qu’il n’existe aucune garantie que le droit constitutionnel et donc toute la hiérarchie des normes, soient conformes à des valeurs quelconque. Rien ne permet d’empêcher en théorie que le droit constitutionnel ne consacre un régime dictatorial ou des atteintes aux droits fondamentaux.</em></li>\n</ul>\n<p class=\"lesson-note\"><em><strong>⇒ Retenez bien que le droit ne comporte aucune vérité absolue, seulement celle (relative) des contingences qui le voient naître ; il reste un produit de la volonté humaine.</strong></em></p>\n<ul>\n<li><em>Pour faillible ou inachevée qu’elle puisse être, la théorie de l’État de droit a toutefois été prise à bras-le-corps par des pouvoirs constituants au lendemain de la seconde guerre mondiale, ce qui en fait désormais une notion incontournable du droit constitutionnel contemporain.</em></li>\n</ul>\n<h2>Section 2 – Les modalités de la mise en œuvre de l’État de droit</h2>\n<ul>\n<li><em>À partir de 1945, l’État de droit se substitue progressivement à l’<strong>État légal (</strong>M.-J. Redor-Fichot<strong>), lui-même expression du légicentrisme</strong> hérité de la Révolution : sacralisation de la loi, dont on présume qu’elle est infaillible puisqu’elle est issue de la représentation nationale depuis 1789. Cela conduit à établir dans le droit constitutionnel un certain nombre de garanties (§1), aujourd’hui remises en cause (§2).</em></li>\n</ul>\n<h3>§1 – Les garanties de l’État de droit</h3>\n<ul>\n<li><em>Définition aujourd’hui <strong>substantialisée</strong> de l’État de droit, par association à la Rule of law, notamment par le développement du droit européen, qui réconcilie des notions nées dans un contexte national ; à la conception formelle inspirée d’un Kelsen se conjugue désormais une <strong>conception matérielle</strong>, portant un certain nombre de valeurs éthiques et politiques jugées constitutives d’un État de droit et protégées unanimement par la plupart des ordres constitutionnels (A), jusqu’à ce que l’État de droit se confonde presque avec la démocratie (B).</em></li>\n</ul>\n<h4>A. Les déclinaisons de l’État de droit</h4>\n<ul>\n<li><em>Certains droits constitutionnels énoncent expressément l’attachement de leurs auteurs au respect de l’État de droit, éventuellement démocratique et social : Portugal, Hongrie, Pologne, Roumanie, Rép. tchèque… + Union européenne.</em></li>\n<li><em>Qu’elle soit mentionnée ou pas, le concept se développe partout, par les juges ou par la doctrine (Commission de Venise), et elle renvoie toujours à des valeurs et mécanismes communément admis.</em></li>\n</ul>\n<p> → <strong>Des libertés publiques aux libertés fondamentales</strong></p>\n<ul>\n<li><em>Si le Parlement peut porter atteinte aux droits individuels et opérer des discriminations, la loi ne suffit pas pour protéger les droits de chacun ; <strong>rehaussement</strong> des droits et libertés devenant fondamentaux, bénéficiant d’une protection <strong>constitutionnelle ou</strong> conventionnelle.</em></li>\n</ul>\n<p class=\"lesson-note\">Exemple → liberté d’association ou syndicale, principe de non-discrimination, jusqu’à la liberté de l’IVG</p>\n<p> <strong>→ La sécurité juridique</strong></p>\n<ul>\n<li><em>Nul n’est censé ignorer la loi, qui doit en retour être intelligible et prévisible pour ses sujets.</em></li>\n<li><em>En sus d’éléments de légistique, la sécurité juridique implique aussi une protection des <strong>droits acquis et des garanties contre la rétroactivité de la loi</strong>, spécifiquement en droit pénal (légalité des délits et des peines).</em></li>\n</ul>\n<p> <strong>→ L’indépendance de la justice</strong></p>\n<ul>\n<li><em>Disposer de droits contre le pouvoir politique, y compris législatif, suppose d’être en mesure de les faire valoir, et d’obtenir réparation s’il y est porté atteinte ; un droit proclamé ne suffit pas, il doit être <strong>subjectif</strong>. D’où le rôle crucial conféré aux juridictions dans un État de droit – État du juge ? – mais qui ne serait d’aucun effet si le pouvoir judiciaire était acoquiné avec le législateur ou n’importe quel pouvoir politique. L’<strong>indépendance</strong> et l’<strong>impartialité</strong> de la justice sont donc les premières garanties du <strong>droit à un procès équitable</strong>, lui-même droit premier des libertés fondamentales.</em></li>\n</ul>\n<p> <strong>→ La séparation des pouvoirs</strong></p>\n<ul>\n<li><em>L’indépendance de la justice est l’une des modalités de la séparation des pouvoirs, celle-ci étant plus largement un instrument de lutte contre la concentration du pouvoir, donc le despotisme et l’autocratie. Pour que les citoyens soient libres, il faut que le pouvoir soit divisé, ainsi que le préconisent les Constitutions modernes.</em></li>\n<li>Dans chacune de ces déclinaisons, l’État de droit est un <strong>perfectionnement</strong> de mécanismes inventés en 1789 par le constitutionnalisme ; soumettre l’État au droit consiste simplement à garantir l’effectivité des garanties constitutionnelles pensées par les Révolutionnaires. *</li>\n</ul>\n<h4>B. L’articulation de l’État de droit avec la démocratie</h4>\n<ul>\n<li><em>La démocratie se développe avant l’État de droit, et celui-ci peut être envisagé comme un instrument de celle-ci : si la démocratie est l’exercice du pouvoir confié à l’ensemble des citoyens, elle va supposer que ces citoyens disposent de droits politiques (suffrage, expression, association…) <strong>effectifs</strong>, c’est-à-dire protégés contre le législateur.</em></li>\n<li><em>La démocratie par l’élection implique que les majorités puissent évoluer, et qu’une élection ne fasse pas l’autre ; on peut donc estimer qu’un régime démocratique est celui qui protège les <strong>droits des minorités</strong>, de façon à ce qu’elles puissent devenir majoritaires. Là encore, le registre des libertés fondamentales dote la démocratie d’une substance, et l’État de droit qui en permet la promotion, en devient l’instrument privilégié.</em></li>\n<li><em>Démocratie et État de droit sont ainsi parfois entendues comme synonymes dans le langage journalistique, ce qu’ils ne sont pas exactement ; leurs développements et leur promotion dans les systèmes politiques vont toutefois souvent de pair.</em></li>\n</ul>\n<h3>§2 – Les menaces contre l’État de droit</h3>\n<ul>\n<li>B. Retailleau, « L’État de droit n’est ni intangible ni sacré » ; langage performatif : rien qu’en le disant, le ministre de l’Intérieur à l’époque désacralise l’État de droit.</li>\n<li><em>Et de fait, si l’on peut bien considérer que l’État de droit est sacré en ce qu’il est la seule méthode connue de promotion de la démocratie, certes imparfaite (il est donc sacré pour les démocrates…), force est de constater qu’il n’est pas intangible, pas plus que le droit (constitutionnel) ou la démocratie : il est incroyablement facile de lui porter atteinte, dès lors qu’on remet en cause ses éléments constitutifs.</em></li>\n<li><em>Remise en cause de l’indépendance de la justice</em></li>\n</ul>\n<p><em>o   Structurellement : Hongrie et Pologne, réforme du mode de nomination</em></p>\n<p><em>o   Rhétoriquement en France, en criant à tort et à travers que les juges sont politiques.</em></p>\n<p><em>[Précision et articulation avec <strong>pouvoir interprétatif</strong> – donc politique – des juges : distinction entre juge constitutionnel (dernier mot, composition, laconisme du texte) et juge administratif ou judiciaire // dire que le juge exerce par un acte de volonté ne signifie pas qu’il n’est pas indépendant du pouvoir politique].</em></p>\n<ul>\n<li><em>Atteinte à la transparence et à la déontologie politiques</em></li>\n<li>Problème des décisions politiques prises dans les alcôves du pouvoir, loin de toute audience, favorisant les conflits d’intérêts au détriment de l’intérêt général, remettant en cause la séparation des pouvoirs et usurpant ce faisant la souveraineté nationale censée prévaloir en vertu des dispositions constitutionnelles. *</li>\n</ul>\n<ul>\n<li><em>Un « recul » des droits fondamentaux est-il une remise en cause de l’État de droit ?</em></li>\n</ul>\n<p class=\"lesson-note\">Exemple → d’une réforme constitutionnelle qui viendrait abolir un droit régulièrement inscrit</p>\n<p><em>Remise en cause de l’avortement Pologne 2020 / États-Unis 2022.</em></p>\n<p><em><strong>= Moins de droits fondamentaux mais respect des formes juridiques : dissociation voire contrariété entre État de droit et démocratie ? Peut-on penser un État de droit illibéral ? Aucun exemple satisfaisant…</strong></em></p>\n<p class=\"lesson-note\"><em>⇒ Dénigrer ou saboter l’État de droit est le plus souvent annonciateur d’une attaque masquée contre la démocratie et les droits et libertés individuels, autres enjeux essentiels du droit constitutionnel contemporain.</em></p>\n", "nested": true}];

COURSES.civil = (COURSES.civil || []).concat([{"title": "Art. Code civil", "text": "Domicile\n102 : le domicile correspond au principal établissement d'une personne.\n103 : le domicile change lorsque le principal établissement est transféré.\n104-105 : règles de déclaration et de preuve du changement de domicile.\n107 à 109 : certains domiciles sont déterminés par la loi.\n111 : possibilité d'élire un domicile pour certains actes.\n\nNaissance\n55 : obligation de déclarer la naissance dans le délai légal.\n57 : contient les mentions essentielles de l'acte de naissance.\n318 : la personnalité juridique suppose une naissance vivante et viable.\n79-1 : reconnaissance juridique de l'enfant sans vie.\n\nÉtat civil\n55 : déclaration de naissance.\n57 : contenu de l'acte de naissance.\n99 : rectification des actes de l'état civil.\n\nSuccessions (vis-à-vis du nouveau-né)\n711 : modes d'acquisition de la propriété.\n725 : vocation successorale de l'enfant conçu.\n\nFiliation (vis-à-vis du nouveau-né)\n311 : période légale de conception.\n\nMort\n78 et suivants : établissement de l'acte de décès.\n16-1-1 : respect du corps humain après la mort.\n\nSuccessions\n720 : ouverture de la succession au décès.\n895 : définition du testament.\n711 : transmission du patrimoine par succession.\n\nAbsence et disparition\n112 : définition de l'absence.\n113 : administration des biens de l'absent.\n118 : conséquences du retour de l'absent.\n122 : déclaration judiciaire d'absence.\n88 à 92 : disparition et jugement déclaratif de décès.\n\nPersonnalité juridique\n16 : protection de la dignité humaine.\n16-1 : inviolabilité et respect du corps humain.\n9 : protection de la vie privée.\n1240 : responsabilité civile pour faute.\n\nPersonnes morales\n1145 : capacité limitée à l'objet de la personne morale.\n1832 : définition de la société.\n1842 : acquisition de la personnalité morale par immatriculation.\n\nTransidentité / Transsexualisme\n61-5 : conditions de modification de la mention du sexe.\n61-6 : procédure judiciaire.\n61-7 : adaptation des prénoms.\n61-8 : maintien des liens de filiation.\n143 : mariage entre deux personnes.\n61-8 : maintien de la filiation après changement de sexe.\n\nIntersexualité (gros post-it)\n16-3 : interventions médicales encadrées.\n57 : mention du sexe dans l'acte de naissance.\n99 : rectification de l'état civil.\n\nLa Personne\n\nCorps humain et bioéthique (pas utile pour l’instant)\n16 : primauté de la personne humaine.\n16-1 : respect du corps humain.\n16-3 : atteintes au corps humain limitées à certains cas.\n16-4 : protection de l'espèce humaine.\n16-8-1 : accès encadré aux données du donneur.\n\nLe Nom (orange fluo)\n\nNom de famille\n311-21 : choix du nom de l'enfant.\n61 à 61-3-1 : changement de nom.\n225-1 : utilisation du nom du conjoint.\n264 : conséquences du divorce sur l'usage du nom.\n363 : nom en cas d'adoption simple.\n311-24-2 : nom d'usage.\n\nPrénom\n57 : inscription du prénom à l'état civil.\n60 : changement de prénom.\n\nAUTRES\n\nAnimal\n515-14 : l'animal est reconnu comme un être vivant doué de sensibilité.\n\nLa Famille\n363 : effets de l'adoption simple.", "html": "<div class=\"civil-articles\"><section class=\"civil-topic\"><h3>Domicile</h3><ul><li><strong>Art. 102</strong><span>le domicile correspond au principal établissement d&#x27;une personne.</span></li><li><strong>Art. 103</strong><span>le domicile change lorsque le principal établissement est transféré.</span></li><li><strong>Art. 104-105</strong><span>règles de déclaration et de preuve du changement de domicile.</span></li><li><strong>Art. 107 à 109</strong><span>certains domiciles sont déterminés par la loi.</span></li><li><strong>Art. 111</strong><span>possibilité d&#x27;élire un domicile pour certains actes.</span></li></ul></section><section class=\"civil-topic\"><h3>Naissance</h3><ul><li><strong>Art. 55</strong><span>obligation de déclarer la naissance dans le délai légal.</span></li><li><strong>Art. 57</strong><span>contient les mentions essentielles de l&#x27;acte de naissance.</span></li><li><strong>Art. 318</strong><span>la personnalité juridique suppose une naissance vivante et viable.</span></li><li><strong>Art. 79-1</strong><span>reconnaissance juridique de l&#x27;enfant sans vie.</span></li></ul></section><section class=\"civil-topic\"><h3>État civil</h3><ul><li><strong>Art. 55</strong><span>déclaration de naissance.</span></li><li><strong>Art. 57</strong><span>contenu de l&#x27;acte de naissance.</span></li><li><strong>Art. 99</strong><span>rectification des actes de l&#x27;état civil.</span></li></ul></section><section class=\"civil-topic\"><h3>Successions (vis-à-vis du nouveau-né)</h3><ul><li><strong>Art. 711</strong><span>modes d&#x27;acquisition de la propriété.</span></li><li><strong>Art. 725</strong><span>vocation successorale de l&#x27;enfant conçu.</span></li></ul></section><section class=\"civil-topic\"><h3>Filiation (vis-à-vis du nouveau-né)</h3><ul><li><strong>Art. 311</strong><span>période légale de conception.</span></li></ul></section><section class=\"civil-topic\"><h3>Mort</h3><ul><li><strong>Art. 78 et suivants</strong><span>établissement de l&#x27;acte de décès.</span></li><li><strong>Art. 16-1-1</strong><span>respect du corps humain après la mort.</span></li></ul></section><section class=\"civil-topic\"><h3>Successions</h3><ul><li><strong>Art. 720</strong><span>ouverture de la succession au décès.</span></li><li><strong>Art. 895</strong><span>définition du testament.</span></li><li><strong>Art. 711</strong><span>transmission du patrimoine par succession.</span></li></ul></section><section class=\"civil-topic\"><h3>Absence et disparition</h3><ul><li><strong>Art. 112</strong><span>définition de l&#x27;absence.</span></li><li><strong>Art. 113</strong><span>administration des biens de l&#x27;absent.</span></li><li><strong>Art. 118</strong><span>conséquences du retour de l&#x27;absent.</span></li><li><strong>Art. 122</strong><span>déclaration judiciaire d&#x27;absence.</span></li><li><strong>Art. 88 à 92</strong><span>disparition et jugement déclaratif de décès.</span></li></ul></section><section class=\"civil-topic\"><h3>Personnalité juridique</h3><ul><li><strong>Art. 16</strong><span>protection de la dignité humaine.</span></li><li><strong>Art. 16-1</strong><span>inviolabilité et respect du corps humain.</span></li><li><strong>Art. 9</strong><span>protection de la vie privée.</span></li><li><strong>Art. 1240</strong><span>responsabilité civile pour faute.</span></li></ul></section><section class=\"civil-topic\"><h3>Personnes morales</h3><ul><li><strong>Art. 1145</strong><span>capacité limitée à l&#x27;objet de la personne morale.</span></li><li><strong>Art. 1832</strong><span>définition de la société.</span></li><li><strong>Art. 1842</strong><span>acquisition de la personnalité morale par immatriculation.</span></li></ul></section><section class=\"civil-topic\"><h3>Transidentité / Transsexualisme</h3><ul><li><strong>Art. 61-5</strong><span>conditions de modification de la mention du sexe.</span></li><li><strong>Art. 61-6</strong><span>procédure judiciaire.</span></li><li><strong>Art. 61-7</strong><span>adaptation des prénoms.</span></li><li><strong>Art. 61-8</strong><span>maintien des liens de filiation.</span></li><li><strong>Art. 143</strong><span>mariage entre deux personnes.</span></li><li><strong>Art. 61-8</strong><span>maintien de la filiation après changement de sexe.</span></li></ul></section><section class=\"civil-topic\"><h3>Intersexualité (gros post-it)</h3><ul><li><strong>Art. 16-3</strong><span>interventions médicales encadrées.</span></li><li><strong>Art. 57</strong><span>mention du sexe dans l&#x27;acte de naissance.</span></li><li><strong>Art. 99</strong><span>rectification de l&#x27;état civil.</span></li></ul></section><h2 class=\"civil-group\">La Personne</h2><section class=\"civil-topic\"><h3>Corps humain et bioéthique (pas utile pour l’instant)</h3><ul><li><strong>Art. 16</strong><span>primauté de la personne humaine.</span></li><li><strong>Art. 16-1</strong><span>respect du corps humain.</span></li><li><strong>Art. 16-3</strong><span>atteintes au corps humain limitées à certains cas.</span></li><li><strong>Art. 16-4</strong><span>protection de l&#x27;espèce humaine.</span></li><li><strong>Art. 16-8-1</strong><span>accès encadré aux données du donneur.</span></li></ul></section><h2 class=\"civil-group\">Le Nom (orange fluo)</h2><section class=\"civil-topic\"><h3>Nom de famille</h3><ul><li><strong>Art. 311-21</strong><span>choix du nom de l&#x27;enfant.</span></li><li><strong>Art. 61 à 61-3-1</strong><span>changement de nom.</span></li><li><strong>Art. 225-1</strong><span>utilisation du nom du conjoint.</span></li><li><strong>Art. 264</strong><span>conséquences du divorce sur l&#x27;usage du nom.</span></li><li><strong>Art. 363</strong><span>nom en cas d&#x27;adoption simple.</span></li><li><strong>Art. 311-24-2</strong><span>nom d&#x27;usage.</span></li></ul></section><section class=\"civil-topic\"><h3>Prénom</h3><ul><li><strong>Art. 57</strong><span>inscription du prénom à l&#x27;état civil.</span></li><li><strong>Art. 60</strong><span>changement de prénom.</span></li></ul></section><h2 class=\"civil-group\">AUTRES</h2><section class=\"civil-topic\"><h3>Animal</h3><ul><li><strong>Art. 515-14</strong><span>l&#x27;animal est reconnu comme un être vivant doué de sensibilité.</span></li></ul></section><section class=\"civil-topic\"><h3>La Famille</h3><ul><li><strong>Art. 363</strong><span>effets de l&#x27;adoption simple.</span></li></ul></section></div>"}]);

COURSES.civil = COURSES.civil.concat([{"title": "Introduction – Le droit des personnes", "text": "**Droit civil (les personnes)**\n\n\n\n**Introduction&#x20;**_(SÉANCE de TD numéro 1)_\n\n\n\n**I. Notions et histoire du droit des personnes&#xA0;**\n\n**A) Notions de personnes/personnalité juridique/capacité juridique&#xA0;**\n\n**1) Définition de la personne&#xA0;**\n\n- *Il y a une distinction entre les personnes et les choses en droit. La personne est l'être (humain) qui se distingue des choses.&#xA0;*\n- *Il existe 2 types de personnes :&#xA0;*\n\n* ***les personnes physiques&#x20;**= être fait de chair et de sang&#xA0;*\n* ***les personnes morales** = entités abstraites&#xA0;*\n\n- *Juridiquement, une personne est un sujet de loi de droit doté de la personnalité juridique.*\n\n**2) Définition de la personnalité juridique&#xA0;**\n\n- *La personnalité juridique est l’aptitude à être titulaire de droits et à être assujettie à des obligations. Seule une personne peut acquérir des droits.&#xA0;*\n- *Toute personne peut jouir de droits subjectifs (droit de vote, respect de la VP, etc.).&#xA0;*\n- *Ces droits peuvent être exercés par des personnes physiques mais peuvent aussi appartenir à des personnes morales (associations, sociétés…).&#xA0;*\n\n**3) Définition de la capacité juridique • Incapacité de jouissance • Incapacité d’exercice**\n\n- *On peut avoir la personnalité juridique mais en revanche, certaines personnes n’ont pas la capacité juridique. Cela peut être en raison de sa vulnérabilité (mineurs, majeurs protégés…).&#xA0;*\n\n*➱ **Incapacité de jouissance&#x20;**→ elle correspond à l’inaptitude de jouir d’un droit. Elle ne peut jamais être générale donc elle est spéciale.&#xA0;*\n\n*➱ **Incapacité d’exercice** → cela va concerner ces personnes vulnérables, soit en raison de leur âge ou en raison de l'altération de leurs facultés physiques et/ou mentales. C’est l'inaptitude à exercer un droit dont on est titulaire.&#xA0;*\n\n\n\n**B) Histoire du droit des personnes&#xA0;**\n\n**1) En 1804, une matière peu abordée par le Code civil&#xA0;**\n\n- *En 1804, le Code civil (ancien code **Napoléon**) est adopté, cependant à cette époque, le sujet sur le droit des personnes est peu abordé. Il y avait 2281 articles, dont seuls 500 étaient consacrés à la personne.&#xA0;*\n\n**2) Un intérêt plus marqué du législateur à partir des années 1970&#xA0;**\n\n- *Le législateur s’est intéressé aux personnes physiques. Il y a eu plusieurs lois :&#xA0;*\n  - ***Loi du 5 juillet 1974** : majorité abaissée à 18 ans par **Valéry Giscard d’Estaing. &#xA0;***\n\n* ***Loi du 17 juillet 1970** : loi du respect de la vie privée (**article 9 du Code civil).&#xA0;***\n\n\n\n**3) Un droit moderne fondé sur les principes d’égalité, de liberté et de contractualisation&#xA0;**\n\n- *Dans les années 1990, le législateur a continué a légiféré dans le domaine du droit des personnes en consacrant des principes dans le Code civil.&#xA0;*\n- ***La loi du 29 juillet 1994&#x20;**&#x65;st la **première loi bioéthique,** qui a commencé à donner des nouveaux droits aux personnes physiques :&#xA0;*\n\n*↪**&#x20;article 16** → primauté des personnes et interdit toute atteinte à la dignité de la personne.&#xA0;*\n\n*↪**&#x20;article 16-1&#x20;**→ droit au respect de son corps, inviolabilité du corps humain.&#xA0;*\n\n\n\n- *Le 6 août 2004, c’est **la 2e loi bioéthique&#x20;**&#x71;ui a ajouté de nouveaux droits dans le Code civil :&#xA0;*\n\n*↪**&#x20;article 16-4&#x20;**→ principe de protection de l'intégrité de l'espèce humaine.&#xA0;*\n\n\n\n- ***Les autres lois bioéthiques&#x20;**&#x73;ont apparues le 7 juillet 2011 et du 2 août 2021.&#xA0;*\n\n* *Pour les majeurs protégés, il y a **une loi du 5 mars 2007 qui a réformé le droit des majeurs protégés.&#xA0;***\n* *En 1999, le **PACS&#x20;**&#x65;st ouvert aux couples homosexuels.&#xA0;*\n* *A partir de 2013, il y a une promotion des libertés avec les couples homosexuels qui ont la possibilité de se marier (**Loi Taubira** = droit au mariage pour les couples homosexuels donc égalité entre les couples homosexuels et hétérosexuels )*\n* *Il y a également une égalité entre les parents qui exercent conjointement l’autorité parentale sur leurs enfants (nom de famille, etc…).&#xA0;*\n\n- *On parle de contractualisation car le législateur veut laisser de plus en plus de coopération et de négociation entre les individus. &#xA0;*\n- *Il y a donc plus de libertés laissées aux individus.&#xA0;*\n\n**Exemple&#x20;**: en 2006, la Cour de cassation a rendu la décision de reconnaître la validité des conventions de concubinage. ou encore : depuis la réforme de 2004, le divorce peut se faire par consentement mutuel. \n\n\n\n**II. Sources du droit des personnes&#xA0;**\n\n**A) Sources internes** \n\n**1) Loi (surtout le Code civil)&#xA0;**\n\n- *La Loi est un acte adopté par les législateurs qui vient consacrer des droits.&#xA0;*\n- *Au fil du temps, les lois modifient les articles du Code civil. **La loi est générale et impersonnelle !***\n\n\n\n**2) Jurisprudence&#xA0;**\n\n- *Le juge a différents rôles :&#xA0;*\n\n* *Interpréter la loi&#xA0;*\n* *Appliquer la loi (dans un litige…)*\n* *Il peut être créateur du droit. &#xA0;*\n\n- *Il y a ce qu’on appelle le silence de la loi qui peut arriver dans certaines situations, celui qui va donc prendre le relais est le juge qui doit prendre position face à une question juridique nouvelle.&#xA0;*\n\n* *Au fur et à mesure de l’évolution de la société, le juge accorde des droits aux concubins (originalement rarement concernés par le droit).*\n* *Le droit s’adapte aux évolutions de la technologie, de la science et de la société (PMA).*\n\n\n\n**3) Sources constitutionnelles**\n\n- *Le conseil constitutionnel est le gardien des lois constitutionnelles en France (ex : le droit de se marier = principe constitutionnel).&#xA0;*\n- *En 1999, le législateur a créé le PACS (l'alternative au mariage) et donc le conseil constitutionnel a étudié cette loi pour voir si elle était conforme à la Constitution puis la ensuite validé. &#xA0;*\n\n* *En 2010, la QPC (question prioritaire de constitutionnalité) a été créée. C’est-à-dire que lors d’un litige, on peut contester la loi en disant qu'elle n’est pas conforme à la norme suprême de la constitutionnalité. Depuis 2016, elle abroge des lois contraires à la Constitution.&#xA0;*\n\n\n\n**B) Sources internationales&#xA0;**\n\n**1) Sources européennes&#xA0;**\n\n**- liées au Conseil de l’Europe :&#xA0;**\n\n- *Il y a une organisation qui se nomme le conseil de l’Europe où il y a plus de 27 pays (Europe élargie). Le droit européen a une valeur juridique importante. &#xA0;*\n\n\n\n*• Convention européenne des droits de l’Homme (Conv. EDH) → est un traité international (supérieur à la loi française) qui va énoncer des droits fondamentaux aux êtres humains.*\n\n**Exemple :&#x20;**_droit de fonder une famille, droit au respect de la vie familiale, droit à la vie…_\n\n*➱  Cour européenne des droits de l’Homme (CEDH) → est à Strasbourg et applique la Convention EDH.&#xA0;*\n\n- *Le juge de la CEDH a un rôle important car il a parfois pu faire fléchir la cour de cassation dans ses positions. Sous l’influence de la CEDH, la cour de cassation a déjà modifié sa jurisprudence ( ses positions juridiques ). Par exemple : en 2000, la cour de cassation a cessé les discriminations sur les enfants nés d’adultère.*\n\n\n\n**- liées à l’Union européenne&#xA0;**\n\n- *Il y a de nombreux textes européens adoptés par les instances de l’Union européenne qui s’applique aux 27 États membres de l’UE.&#xA0;*\n\n*➱ Traités → (Rome, Maastricht…)&#xA0;*\n\n- *Il y a aussi deux autres types de textes :&#xA0;*\n\n*➱ Les règlements européens → s’appliquent directement dans tous les États membres de l’UE.&#xA0;*\n\n*➱ Directives, etc  → visent à harmoniser les législations des États membres.&#xA0;*\n\n\n\n**2) Sources internationales**\n\n***Exemple&#x20;**: la CIDE (Convention internationale des droits de l’enfant) → date de 1989 et où plusieurs pays du monde se sont engagés à la faire respecter.  &#xA0;*\n\n- *Elle va reconnaître des droits importants pour les enfants comme :&#xA0;*\n\n* *droit inhérent à la vie*\n* *droit pour chaque enfant de connaître et d'être élevé par ses parents*\n* *droit à la liberté d’expression, de pensée, de conscience et de religion de l’enfant.&#xA0;*\n\n- *Certains articles de la CIDE sont directement appliqués aux juges français. De fait, le droit civil français est de plus en plus influencé par les sources extérieures.*\n\n\n\n**&#xA0;§3. Catégorisation du droit des personnes&#xA0;**\n\n\n\n**A) Distinction personnes/choses&#xA0;**\n\n- *Les personnes ont la personnalité juridique ce qui n’est pas le cas pour les choses, qui ont eux, aucun droit.&#xA0;*\n\n**B) Distinction des deux catégories de personnes&#xA0;**\n\n**1) Les personnes physiques&#xA0;**\n\n- *Les personnes physiques sont des êtres humains vivants, seules les être humains peuvent accéder à la personnalité juridique. Les mineurs et majeurs protégés ont des droits mais ne peuvent pas tous les exercer.&#xA0;*\n\n\n\n**2) Les personnes morales&#xA0;**\n\n- *Ce sont des entités abstraites qui prennent la forme d’un groupement de personnes ou de biens, qui sous certaines conditions, possèdent la personnalité juridique.&#xA0;*\n\n***Exemple&#x20;**&#x70;ersonnes morales : États, sociétés, associations, organisations…*\n\n*Attention, les personnes physiques ET morales sont toutes deux munies d’une personnalité juridique !*\n\n\n\n**C) L’exclusion des catégories de personnes (statut de choses)&#xA0;**\n\n- *Par ailleurs, deux catégories sont radicalement exclues des catégories de personnes, bien que nous pourrions penser qu’elles ne sont pas des choses; l’animal et le robot.*\n\n\n\n**1) L’animal&#xA0;**\n\n- *L’animal, en tant que chose, n’a pas la personnalité juridique mais est un objet de droit.&#xA0;*\n- *Au Moyen-Âge, il était courant de condamner des animaux pour meurtre.&#xA0;*\n- *L’animal peut être perçu comme un bien meuble (meuble par nature).*\n- ***L’UNESCO**, en 1978, avait proclamé une déclaration des droits de l’animal ; mais c’est une simple déclaration, elle n’a donc pas de valeur juridique.&#xA0;*\n- *Mais, le législateur persiste à classer l’animal dans la catégorie des choses. Pour le régime juridique, l’animal est toujours une chose car il obéit au droit des biens.&#xA0;*\n- *On va quand même protéger l’animal, notamment en interdisant certains actes sur les animaux dans le Code Pénal :&#xA0;*\n\n**Exemple&#x20;**_: **- loi du 16 février 2015&#x20;**= **article 515-14**; qualifie l’animal d’être vivant , doué de sensibilité._\n\n- ***Article 521-1-2;&#x20;**&#x65;st constitutif d’un acte de complicité de sévices graves, actes de cruauté ou atteintes sexuelles sur un animal domestique, apprivoisé ou tenu en captivité, prévus au premier alinéa des articles 521-1 et 521-1-1, et est puni des peines prévues aux mêmes articles 521-1 et 521-1-1 le fait d’enregistrer sciemment, par quelques moyens que ce soit et sur quelques supports que ce soit, des images relatives à la commission des infractions mentionnées au premier alinéa.*\n\n* *Néanmoins, l’animal peut parfois être traité comme une personne par destination, il peut par exemple aider des personnes en situation de handicaps ou autres.&#xA0;*\n\n**Exemple&#x20;**:*&#x20;chiens d’aveugle, considérés comme le prolongement de la personne.&#xA0;*\n\n*En 1999, le tribunal de Lille a qualifié un chien d’aveugle, qui a eu un accident, d’être “une prothèse de l'être humain aveugle”, car c’est une atteinte à une partie intégrante de la personne humaine.&#xA0;*\n\n\n\n**2) Le robot&#xA0;**\n\n- *Le robot aura-t-il une personnalité juridique dans quelques années ?*\n- *Les robots sont aujourd'hui des choses juridiquement. Cependant, le robot peut détenir ce que l’on va appeler une personnalité électronique, mais cette vision reste encore très abstraite dans le monde juridique.&#xA0;*\n\n* *Des questions éthiques se posent, car on peut concevoir un être humain en laboratoire (bébé éprouvette, etc.). On ne peut également pas cloner un être humain car en droit français il y a des limites et des principes qui doivent être respectées dans les laboratoires par rapport aux êtres humains.&#xA0;*\n", "html": "<h2>Droit civil (les personnes)<\/h2>\n<h2>Introduction <em>(SÉANCE de TD numéro 1)<\/em><\/h2>\n<h2>I. Notions et histoire du droit des personnes<\/h2>\n<h4>A) Notions de personnes/personnalité juridique/capacité juridique<\/h4>\n<h5>1) Définition de la personne<\/h5>\n<ul>\n<li>*Il y a une distinction entre les personnes et les choses en droit. La personne est l'être (humain) qui se distingue des choses. *<\/li>\n<li>*Il existe 2 types de personnes : *<\/li>\n<\/ul>\n<ul>\n<li>***les personnes physiques **= être fait de chair et de sang *<\/li>\n<li>***les personnes morales** = entités abstraites *<\/li>\n<\/ul>\n<ul>\n<li><em>Juridiquement, une personne est un sujet de loi de droit doté de la personnalité juridique.<\/em><\/li>\n<\/ul>\n<h5>2) Définition de la personnalité juridique<\/h5>\n<ul>\n<li>*La personnalité juridique est l’aptitude à être titulaire de droits et à être assujettie à des obligations. Seule une personne peut acquérir des droits. *<\/li>\n<li>*Toute personne peut jouir de droits subjectifs (droit de vote, respect de la VP, etc.). *<\/li>\n<li>*Ces droits peuvent être exercés par des personnes physiques mais peuvent aussi appartenir à des personnes morales (associations, sociétés…). *<\/li>\n<\/ul>\n<h5>3) Définition de la capacité juridique • Incapacité de jouissance • Incapacité d’exercice<\/h5>\n<ul>\n<li>*On peut avoir la personnalité juridique mais en revanche, certaines personnes n’ont pas la capacité juridique. Cela peut être en raison de sa vulnérabilité (mineurs, majeurs protégés…). *<\/li>\n<\/ul>\n<p>*➱ **Incapacité de jouissance **→ elle correspond à l’inaptitude de jouir d’un droit. Elle ne peut jamais être générale donc elle est spéciale. *<\/p>\n<p>*➱ <strong>Incapacité d’exercice<\/strong> → cela va concerner ces personnes vulnérables, soit en raison de leur âge ou en raison de l'altération de leurs facultés physiques et/ou mentales. C’est l'inaptitude à exercer un droit dont on est titulaire. *<\/p>\n<h4>B) Histoire du droit des personnes<\/h4>\n<h5>1) En 1804, une matière peu abordée par le Code civil<\/h5>\n<ul>\n<li>*En 1804, le Code civil (ancien code <strong>Napoléon<\/strong>) est adopté, cependant à cette époque, le sujet sur le droit des personnes est peu abordé. Il y avait 2281 articles, dont seuls 500 étaient consacrés à la personne. *<\/li>\n<\/ul>\n<h5>2) Un intérêt plus marqué du législateur à partir des années 1970<\/h5>\n<ul>\n<li>*Le législateur s’est intéressé aux personnes physiques. Il y a eu plusieurs lois : *<ul>\n<li>***Loi du 5 juillet 1974** : majorité abaissée à 18 ans par **Valéry Giscard d’Estaing.  ***<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<ul>\n<li>***Loi du 17 juillet 1970** : loi du respect de la vie privée (**article 9 du Code civil). ***<\/li>\n<\/ul>\n<h5>3) Un droit moderne fondé sur les principes d’égalité, de liberté et de contractualisation<\/h5>\n<ul>\n<li>*Dans les années 1990, le législateur a continué a légiféré dans le domaine du droit des personnes en consacrant des principes dans le Code civil. *<\/li>\n<li>***La loi du 29 juillet 1994 <strong>est la **première loi bioéthique,<\/strong> qui a commencé à donner des nouveaux droits aux personnes physiques : *<\/li>\n<\/ul>\n<p>*↪** article 16** → primauté des personnes et interdit toute atteinte à la dignité de la personne. *<\/p>\n<p>*↪** article 16-1 **→ droit au respect de son corps, inviolabilité du corps humain. *<\/p>\n<ul>\n<li>*Le 6 août 2004, c’est **la 2e loi bioéthique **qui a ajouté de nouveaux droits dans le Code civil : *<\/li>\n<\/ul>\n<p>*↪** article 16-4 **→ principe de protection de l'intégrité de l'espèce humaine. *<\/p>\n<ul>\n<li>***Les autres lois bioéthiques **sont apparues le 7 juillet 2011 et du 2 août 2021. *<\/li>\n<\/ul>\n<ul>\n<li>*Pour les majeurs protégés, il y a **une loi du 5 mars 2007 qui a réformé le droit des majeurs protégés. ***<\/li>\n<li>*En 1999, le **PACS **est ouvert aux couples homosexuels. *<\/li>\n<li><em>A partir de 2013, il y a une promotion des libertés avec les couples homosexuels qui ont la possibilité de se marier (<strong>Loi Taubira<\/strong> = droit au mariage pour les couples homosexuels donc égalité entre les couples homosexuels et hétérosexuels )<\/em><\/li>\n<li>*Il y a également une égalité entre les parents qui exercent conjointement l’autorité parentale sur leurs enfants (nom de famille, etc…). *<\/li>\n<\/ul>\n<ul>\n<li>*On parle de contractualisation car le législateur veut laisser de plus en plus de coopération et de négociation entre les individus.  *<\/li>\n<li>*Il y a donc plus de libertés laissées aux individus. *<\/li>\n<\/ul>\n<p>**Exemple **: en 2006, la Cour de cassation a rendu la décision de reconnaître la validité des conventions de concubinage. ou encore : depuis la réforme de 2004, le divorce peut se faire par consentement mutuel.<\/p>\n<h2>II. Sources du droit des personnes<\/h2>\n<h4>A) Sources internes<\/h4>\n<h5>1) Loi (surtout le Code civil)<\/h5>\n<ul>\n<li>*La Loi est un acte adopté par les législateurs qui vient consacrer des droits. *<\/li>\n<li>*Au fil du temps, les lois modifient les articles du Code civil. **La loi est générale et impersonnelle !***<\/li>\n<\/ul>\n<h5>2) Jurisprudence<\/h5>\n<ul>\n<li>*Le juge a différents rôles : *<\/li>\n<\/ul>\n<ul>\n<li>*Interpréter la loi *<\/li>\n<li><em>Appliquer la loi (dans un litige…)<\/em><\/li>\n<li>*Il peut être créateur du droit.  *<\/li>\n<\/ul>\n<ul>\n<li>*Il y a ce qu’on appelle le silence de la loi qui peut arriver dans certaines situations, celui qui va donc prendre le relais est le juge qui doit prendre position face à une question juridique nouvelle. *<\/li>\n<\/ul>\n<ul>\n<li><em>Au fur et à mesure de l’évolution de la société, le juge accorde des droits aux concubins (originalement rarement concernés par le droit).<\/em><\/li>\n<li><em>Le droit s’adapte aux évolutions de la technologie, de la science et de la société (PMA).<\/em><\/li>\n<\/ul>\n<h5>3) Sources constitutionnelles<\/h5>\n<ul>\n<li>*Le conseil constitutionnel est le gardien des lois constitutionnelles en France (ex : le droit de se marier = principe constitutionnel). *<\/li>\n<li>*En 1999, le législateur a créé le PACS (l'alternative au mariage) et donc le conseil constitutionnel a étudié cette loi pour voir si elle était conforme à la Constitution puis la ensuite validé.  *<\/li>\n<\/ul>\n<ul>\n<li>*En 2010, la QPC (question prioritaire de constitutionnalité) a été créée. C’est-à-dire que lors d’un litige, on peut contester la loi en disant qu'elle n’est pas conforme à la norme suprême de la constitutionnalité. Depuis 2016, elle abroge des lois contraires à la Constitution. *<\/li>\n<\/ul>\n<h4>B) Sources internationales<\/h4>\n<h5>1) Sources européennes<\/h5>\n<p>**- liées au Conseil de l’Europe : **<\/p>\n<ul>\n<li>*Il y a une organisation qui se nomme le conseil de l’Europe où il y a plus de 27 pays (Europe élargie). Le droit européen a une valeur juridique importante.  *<\/li>\n<\/ul>\n<p><em>• Convention européenne des droits de l’Homme (Conv. EDH) → est un traité international (supérieur à la loi française) qui va énoncer des droits fondamentaux aux êtres humains.<\/em><\/p>\n<p>**Exemple : **<em>droit de fonder une famille, droit au respect de la vie familiale, droit à la vie…<\/em><\/p>\n<p>*➱  Cour européenne des droits de l’Homme (CEDH) → est à Strasbourg et applique la Convention EDH. *<\/p>\n<ul>\n<li><em>Le juge de la CEDH a un rôle important car il a parfois pu faire fléchir la cour de cassation dans ses positions. Sous l’influence de la CEDH, la cour de cassation a déjà modifié sa jurisprudence ( ses positions juridiques ). Par exemple : en 2000, la cour de cassation a cessé les discriminations sur les enfants nés d’adultère.<\/em><\/li>\n<\/ul>\n<p>**- liées à l’Union européenne **<\/p>\n<ul>\n<li>*Il y a de nombreux textes européens adoptés par les instances de l’Union européenne qui s’applique aux 27 États membres de l’UE. *<\/li>\n<\/ul>\n<p>*➱ Traités → (Rome, Maastricht…) *<\/p>\n<ul>\n<li>*Il y a aussi deux autres types de textes : *<\/li>\n<\/ul>\n<p>*➱ Les règlements européens → s’appliquent directement dans tous les États membres de l’UE. *<\/p>\n<p>*➱ Directives, etc  → visent à harmoniser les législations des États membres. *<\/p>\n<h5>2) Sources internationales<\/h5>\n<p>***Exemple **: la CIDE (Convention internationale des droits de l’enfant) → date de 1989 et où plusieurs pays du monde se sont engagés à la faire respecter.   *<\/p>\n<ul>\n<li>*Elle va reconnaître des droits importants pour les enfants comme : *<\/li>\n<\/ul>\n<ul>\n<li><em>droit inhérent à la vie<\/em><\/li>\n<li><em>droit pour chaque enfant de connaître et d'être élevé par ses parents<\/em><\/li>\n<li>*droit à la liberté d’expression, de pensée, de conscience et de religion de l’enfant. *<\/li>\n<\/ul>\n<ul>\n<li><em>Certains articles de la CIDE sont directement appliqués aux juges français. De fait, le droit civil français est de plus en plus influencé par les sources extérieures.<\/em><\/li>\n<\/ul>\n<h3>§3. Catégorisation du droit des personnes<\/h3>\n<h4>A) Distinction personnes/choses<\/h4>\n<ul>\n<li>*Les personnes ont la personnalité juridique ce qui n’est pas le cas pour les choses, qui ont eux, aucun droit. *<\/li>\n<\/ul>\n<h4>B) Distinction des deux catégories de personnes<\/h4>\n<h5>1) Les personnes physiques<\/h5>\n<ul>\n<li>*Les personnes physiques sont des êtres humains vivants, seules les être humains peuvent accéder à la personnalité juridique. Les mineurs et majeurs protégés ont des droits mais ne peuvent pas tous les exercer. *<\/li>\n<\/ul>\n<h5>2) Les personnes morales<\/h5>\n<ul>\n<li>*Ce sont des entités abstraites qui prennent la forme d’un groupement de personnes ou de biens, qui sous certaines conditions, possèdent la personnalité juridique. *<\/li>\n<\/ul>\n<p>***Exemple **personnes morales : États, sociétés, associations, organisations…*<\/p>\n<p><em>Attention, les personnes physiques ET morales sont toutes deux munies d’une personnalité juridique !<\/em><\/p>\n<h4>C) L’exclusion des catégories de personnes (statut de choses)<\/h4>\n<ul>\n<li><em>Par ailleurs, deux catégories sont radicalement exclues des catégories de personnes, bien que nous pourrions penser qu’elles ne sont pas des choses; l’animal et le robot.<\/em><\/li>\n<\/ul>\n<h5>1) L’animal<\/h5>\n<ul>\n<li>*L’animal, en tant que chose, n’a pas la personnalité juridique mais est un objet de droit. *<\/li>\n<li>*Au Moyen-Âge, il était courant de condamner des animaux pour meurtre. *<\/li>\n<li><em>L’animal peut être perçu comme un bien meuble (meuble par nature).<\/em><\/li>\n<li>***L’UNESCO**, en 1978, avait proclamé une déclaration des droits de l’animal ; mais c’est une simple déclaration, elle n’a donc pas de valeur juridique. *<\/li>\n<li>*Mais, le législateur persiste à classer l’animal dans la catégorie des choses. Pour le régime juridique, l’animal est toujours une chose car il obéit au droit des biens. *<\/li>\n<li>*On va quand même protéger l’animal, notamment en interdisant certains actes sur les animaux dans le Code Pénal : *<\/li>\n<\/ul>\n<p><strong>Exemple **_: **- loi du 16 février 2015 **= **article 515-14<\/strong>; qualifie l’animal d’être vivant , doué de sensibilité._<\/p>\n<ul>\n<li>***Article 521-1-2; **est constitutif d’un acte de complicité de sévices graves, actes de cruauté ou atteintes sexuelles sur un animal domestique, apprivoisé ou tenu en captivité, prévus au premier alinéa des articles 521-1 et 521-1-1, et est puni des peines prévues aux mêmes articles 521-1 et 521-1-1 le fait d’enregistrer sciemment, par quelques moyens que ce soit et sur quelques supports que ce soit, des images relatives à la commission des infractions mentionnées au premier alinéa.*<\/li>\n<\/ul>\n<ul>\n<li>*Néanmoins, l’animal peut parfois être traité comme une personne par destination, il peut par exemple aider des personnes en situation de handicaps ou autres. *<\/li>\n<\/ul>\n<p>**Exemple **:* chiens d’aveugle, considérés comme le prolongement de la personne. *<\/p>\n<p>*En 1999, le tribunal de Lille a qualifié un chien d’aveugle, qui a eu un accident, d’être “une prothèse de l'être humain aveugle”, car c’est une atteinte à une partie intégrante de la personne humaine. *<\/p>\n<h5>2) Le robot<\/h5>\n<ul>\n<li><em>Le robot aura-t-il une personnalité juridique dans quelques années ?<\/em><\/li>\n<li>*Les robots sont aujourd'hui des choses juridiquement. Cependant, le robot peut détenir ce que l’on va appeler une personnalité électronique, mais cette vision reste encore très abstraite dans le monde juridique. *<\/li>\n<\/ul>\n<ul>\n<li>*Des questions éthiques se posent, car on peut concevoir un être humain en laboratoire (bébé éprouvette, etc.). On ne peut également pas cloner un être humain car en droit français il y a des limites et des principes qui doivent être respectées dans les laboratoires par rapport aux êtres humains. *<\/li>\n<\/ul>\n", "nested": false, "civilLesson": true, "partStart": false}, {"title": "Titre 1 : L’existence des personnes physiques", "text": "**TITRE 1 : L’existence des personnes physiques** \n\n*(SÉANCE de TD numéro 2)&#xA0;*\n\n**CHAPITRE 1 : Le début de la personnalité juridique** \n\n**Section 1. Le principe : la naissance&#xA0;**\n\n- *La personnalité juridique commence à la naissance*\n\n**§1 : L’acquisition de la personnalité juridique par la naissance**\n\n**A) Condition nécessaire à l’acquisition de la personnalité juridique&#xA0;**\n\n- *Avant la naissance (embryon et foetus), l’enfant n’a pas de personnalité distincte de sa mère, il se confond avec elle, les deux ne font qu’un. Ce n’est que lors de l'accouchement que l’enfant devient une personne à part entière et peut acquérir la personnalité juridique*\n\n*&#xA0;—> tout être humain une fois né obtient la personnalité juridique.&#xA0;*\n\n- *Or, les esclaves n’avaient pas la personnalité juridique. **Aristote&#x20;**&#x6C;es qualifiait comme objet de droit. En 1848, **Schoelcher&#x20;**&#x61; aboli l’esclavage en France. Depuis 2001, l’esclavage et la traite d’êtres humains sont des crimes contre l’humanité.&#xA0;*\n\n*—> La naissance n’est donc pas suffisante pour acquérir la personnalité juridique*\n\n\n\n**B) Condition insuffisante à l’acquisition de la personnalité juridique&#xA0;**\n\n**1) Deux conditions cumulatives : • Né vivant • Né viable&#xA0;**\n\n- *Il faut un enfant qui soi&#x74;**&#x20;né vivant et viable**. Ces 2 conditions sont indispensables **pour obtenir la personnalité juridique**. Ces conditions sont déduites de certains articles du Code Civil (ex: **art. 318; art. 725; art. 906**).*\n- *L’enfant est né vivant s’il respire. L’enfant est né viable lorsqu’il est apte à la vie.**&#x20;Il existe 2 types de viabilité:***\n  - ***la viabilité in utero**: aptitude à poursuivre son développement dans le corps de sa mère*\n  - ***la viabilité ex utero:** aptitude à vivre en dehors du corps maternel*\n\n* *C’est la viabilité ex utero qui est retenue par le droit, elle relève de l’appréciation des médecins. **L’OMS&#x20;**&#x61; donné une définition de la viabilité en 1977: elle est reconnue aux enfants nés après **22 semaines d’aménoré** (= absence de règles), il doit **atteindre le poids de 500 grammes minimum** car on présume qu’un foetus nés après **22 semaines d’aménoré et de plus de 500 grammes peut vivre hors du corps de sa mère.&#xA0;***\n* *En résumé, un enfant né vivant et viable peut avoir la personnalité juridique. Or, selo&#x6E;**&#x20;l’art 55 du Code Civil,** les déclarations de naissance doivent se faire dans les 5 jours après l’accouchement (attribution d’un prénom et nom de famille, inscription sur le livret de famille…). Un enfant né vivant et viable peut succéder même s’il meurt peu de temps après sa naissance. Mais il peut mourir avant sa déclaration de naissance et dans ce cas là, l’officier de l'État civil va établir un acte de naissance suivi d’un acte de décès avec la fourniture d’un certificat médical (**art 79-1 du Code Civil)***\n\n\n\n**2) Cas de l’absence d’une des deux conditions (enfants sans vie ou non viable)&#xA0;**\n\n- *Dans ce cas on peut parler d’enfan&#x74;**&#x20;« mort né »** ou d’enfant **« né vivant mais non-viable ».** L’officier de l'État civil peut produire un acte d’enfant sans vie (= permet aux parents de donner à l’enfant un prénom qui sera mentionné sur les registres de l'État civil et sur le livret de famille, il permet aussi d’organiser des obsèques, d’obtenir certains droits sociaux comme la prime de naissance, les congés maternité/paternité…) avec des conditions juridiques plus limitées qu’un enfant né vivant et viable. Face à l’absence de ces 2 conditions, une question se pose: est ce que la délivrance d’un acte d’enfant sans vie doit être accordé qu'aux enfants qui respectent une de ces 2 conditions ou doit-on étendre cette délivrance à toutes les conditions (ex: enfants mort né non viable) ?&#xA0;*\n- *La circulaire du 30 novembre 2001 avait retenu qu’il fallait une des 2 conditions, elle reprenait la définition de **l’OMS&#x20;**&#x73;ur la viabilité. Cependant la cour de cassation a fini par réagir, elle refuse l’application de la circulaire de 2001 car selon la cour elle rajoutait des conditions à la loi. Plusieurs décisions de justice ont été rendues de 6 février 2008. Selon la cour,**&#x20;l’art 79-1 du Code Civil&#x20;**&#x6E;e subordonné l’établissement d’un acte d’enfant sans vie ni au poids du foetus ni à la durée de la grossesse: autrement dit, tout foetus né sans vie peut être inscrit dans les registres civils peu importe son niveau de développement. Des décrets ont été adoptés le 20 août 2008 qui ont subordonné l’acte d’enfant sans vie à la délivrance d’un certificat médical d’accouchement. Or, les textes excluent les IVG, les fausses couches précoces, les embryons morts nés avant la 12ème semaine de grossesse… Il y a donc un élargissement de la catégorie des enfants sans vie.*\n\n\n\n**§2 : La responsabilité liée à une naissance&#xA0;**\n\n**A) La naissance d’un enfant non désiré&#xA0;**\n\n- *La naissance d’un enfant ne peut pas être perçue comme un préjudice par le droit. Une loi le rappelle, c’est celle du 4 mars 2002 sur le droit des malades (art. L114-5 du Code de l’action sociale et des familles: nul ne peut se prévaloir d’un préjudice du seul fait de sa naissance.). Si cet enfant non-désiré résulte d’un viol, peut agir en réparation d’un préjudice moral de son géniteur envers sa mère, c’est à dire que l’enfant va expliquer devant un juge que, par exemple, il souffre psychologiquement d’être né d’un viol*\n\n\n\n**B) La naissance d’un enfant avec un handicap &#xA0;**\n\n- *On va distinguer 2 cas:*\n\n-**la faut commise avant la naissance**: \n\n- *la faute qui cause le handicap de l’enfant qui va naître: le droit prévoit que l’auteur de cette faute doit être condamné à réparer le préjudice corporel causé ou aggravé à l’enfant selon les règles classiques de la responsabilité, ou si l’intervention médicale n’a pas permis d’atténuer le handicap (art. L114-5 du Code de l’action sociale et des familles). &#xA0;*\n- *La faute du tiers n’a pas provoqué directement le handicap mais n’a pas permis aux parents de détecter ce handicap car dans le cas caite la mère aurait pu recourir à une intervention médicale pour stopper la grossesse*\n- *Dans certains cas, le médecin n’a pas causé de handicap. Ici, le juge judiciaire admettait que les parents et l’enfant agissent contre le médecin responsable. Les juges administratifs refusaient à l’enfant la réparation de son préjudice  mais ils admettaient le réparation du préjudice des parents (préjudice moral, la souffrance de savoir qu’ils auront un enfant handicapé). Il faut que la faute du médecin soit prouvée pour pouvoir arrêter la grossesse. Depui&#x73;**&#x20;la loi du 4 mars 2002,** les règles ont changé: la réparation du préjudice de l’enfant et des parents relèvent de la solidarité nationale.&#xA0;*\n\n-**la faute commise après la naissance**:\n\n- *Il y a des situations dans lesquelles les médecins ont rendu la vie des enfants nés en état de mort apparente. Il arrive que les médecins réaniment un enfant à la naissance mais les laissent avec des séquelles physiques et des troubles mentaux (ex: le cordon ombilical est entouré autour du bébé et l’étrangle). Le 2 juin 2009 le tribunal administratif de Nîmes admet que les médecins sont fautifs car ils estiment que les médecins doivent connaître les séquelles que la réanimation causera à l’enfant. Le 12 mars 2015, la cour administrative de Marseille a annulé cette accusation.*\n\n**Section 2. L’exception : la conception&#xA0;**\n\n**A) La nature juridique de l’embryon : une chose&#xA0;**\n\n- *L’embryon est une chose juridique. C’est à la naissance qu’il devient une personne. L’embryon est une **« chose humaine »**, c’est une personne en développement.*\n- *Il y a un développement des méthodes médicales qui permetten&#x74;**&#x20;la fécondation in vitro,** et de la **PMA&#x20;**&#x64;ans les années 1980. La loi appréhende la nature juridique de l’embryon comme une chose, donc la nature juridique de chose s’applique avant la naissance de tout être humain. Il n’y a pas de différence en fonction des différentes méthodes de grossesse. A sa naissance, l’embryon deviendra une personne s’il est vivant et viable.&#xA0;*\n- *Pourquoi l’embryon n’est pas une personne ? —> car s’il l’était l’IVG serait un meurtre, ce qui n’est pas le cas depui&#x73;**&#x20;la loi Veil de 1975.&#xA0;***\n- ***L’art 16** dit que la loi garantit le respect de l’être humain dès le commencement de sa vie. Mais quand la vie commence-t-elle ? Si l’être humain en devenir n’est pas une personne, il est impossible de commettre un homicide/un meurtre sur l’embryon. La Cour de Cassation a refusé de reconnaître coupable d’homicide une personne qui provoque la mort d’un foetus. Un homicide/meurtre c’est tuer une personne, l’embryon étant une chose on ne peut pas commettre un homicide sur une chose. L’homicide sera retenu uniquement si le foetus naît vivant et meurt à la naissance à cause de la faute d’un tiers. L’auteur de la mort d’un foetus engagera sa responsabilité civile mais pas sa responsabilité pénale. Si une mère veut avoir recours à l’IVG, elle n’est pas dans l’obligation d’avoir une raison particulière. Au-delà du délai déterminé, cet acte devient illégal. Dans certains des cas, une intervention médicale peut être possible. Selon le Conseil Constitutionnel en 1994, affirme que le législateur a estimé que ce principe de respect de l’être commencement de sa vie n’est pas applicable à l’embryon in vitro, c’est à dire conçu artificiellement. En revanche, l’autre principe concernant le respect de la dignité de l’être humain, le Conseil Constitutionnel a reconnu en 2013 que la dignité humaine s’applique à l’embryon in vitro. L’embryon humain est une chose particulière qui mérite d’être protégé et qui deviendra PEUT ÊTRE une personne à part entière dans le futur.*\n\n**B) L’embryon : une personne en devenir&#xA0;**\n\n\n\n- *Dans certains cas, le droit a recours à une fiction juridique, il fait comme si. Dans certains cas, le droit traite l’embryon comme une personne via la fiction juridique.**&#x20;« Infans conceptus pro nato habetur quoties de commodis ejus agitur »** l’enfant conçu est considéré comme né chaque fois qu’il va de son intérêt. Ici, l’enfant n’est pas né et pourtant pendant sa conception on estime qu’il peut acquérir des droits. **L’art 725** dit que « pour succéder, il faut exister à l’instant de l’ouverture de la succession ou, ayant déjà été conçu, naître viable »**. L’art 906&#x20;**&#x64;it que « Pour être capable de recevoir entre vifs, il suffit d’être conçu au moment de la donation. Pour être capable de recevoir par testament, il suffit d’être conçu à l’époque du décès du testateur. Néanmoins, la donation ou le testament n’auront leur effet qu’autant que l’enfant sera né viable ». L’art L132-8 du Code des Assurance dit que les enfants nés ou à naître peuvent bénéficier d’une assurance UNIQUEMENT si leur parents sont titulaires d’une assurance eux aussi et si la grossesse va à terme.**&#x20;L’art 311 du Code Civil&#x20;**&#x63;oncerne la notion de conception: la loi instaure une présomption de période pendant laquelle l’enfant à été conçu avant la date de la naissance. Il est possible de faire appelle à ses droits après la naissance si les évènements se sont déroulés pendant la période de conception de l’enfant.&#xA0;*\n\n\n\nMais alors quel est le régime juridique applicable à l’embryon ? \n\n- l’embryon **in utero&#x20;**(= dans le ventre de sa mère): en principe, un tiers ne peut pas porter atteinte à l’être humain, seule la loi peut par exception définir les cas dans lesquels une atteinte à l'être humain peut être possible. La loi réglemente le droit à l’interruption de grossesse. Il y a 3 types: \n  - **l’IVG praticable avant la fin de la 14ème semaine de grossesse**, ce qui équivaut à 16 semaines d’absences de règles (1). La loi fait prévaloir à la femme le droit de disposer de son corps pendant les 14/16 semaines de délai. Au-delà, la loi protège le foetus contre sa mère, l’IVG n’est plus autoris&#xE9;**&#x20;(article L2222-2 du Code Civil)** et peut-être condamné pénalement. \n  - **l’IMG (=interruption médicale de grossesse)&#x20;**&#x70;raticable à tout moment de la grossesse avec un motif médical valable. L’article L2213-1 du Code de la Santé Publique réglemente le type d’interruption de grossesse.  Selon cet article, l’IMG exige que la poursuite de la grossesse mette en péril la vie de la mère ou s’il existe une forte probabilité que l’enfant à naître soit atteint d’un affection, d’une particulière gravit
