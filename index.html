i la définition formelle du droit constitutionnel? </p>\n<p>Il s’agit d’un droit dont l’adoption et la modification font l’objet d’une procédure particulièrement contraignante et solennelle par rapport à la loi ordinaire.</p>\n<p> Cette définition est RELATIVE. </p>\n<p>La procédure constitutionnelle est très souvent similaire d’un état à un autre. </p>\n<p>Comment on adopte une loi? </p>\n<p>D’abord il faut une initiative, qui prend souvent la forme d’un texte. C'est-à-dire d’un projet de loi, issu d’un membre du gouvernement tandis que les membres du parlement disposent aussi d’une initiative, mais on parle de proposition de loi.</p>\n<p>Projet= Pouvoir exécutif  | Proposition= Pouvoir législatif. </p>\n<p>Ensuite il faut un débat, une discussion sur le sujet. La loi doit être débattu sur chacune des 2 chambres du parlement (En France actuellement les 2 chambres sont: L'Assemblée Nationale et le Sénat). Pour que la loi passe il faut qu’elle soit adoptée par la majorité relative (plus de POUR que de CONTRE). </p>\n<p>Enfin pour que la loi soit adoptée il faut qu’elle soit promulguée (signer) par le président de la République. (Chef de l’Etat). On la publie au journal officiel, pour rendre la loi opposable. </p>\n<p>Toute loi et processus délibératif doivent respecter ces 3 étapes. </p>\n<p>Le pouvoir constituant suit ces mêmes logiques, mais pour qu’on est une constitution selon la définition formelle il faut que ce soit plus contraignant et plus solennel que la loi ordinaire. </p>\n<p>Pour étudier cette forme de la constitution et il faut se concentrer sur le pouvoir constituant, mais il faut distinguer 2 modalités de ce pouvoir constituant, les choses ne sont pas les mêmes selon qu’on cherche à modifier la constitution, la créer. Modifier et créer ne sont pas les mêmes choses. </p>\n<p>Dans le cas de création on a un pouvoir constituants originaire= On crée la constitution de toute pièce, dans le cas de la modification on parle de pouvoir constituant dérivé= On change une constituant déjà existante </p>\n<p>1789: Révolution française </p>\n<p>1791: Première constitution française </p>\n<p>1958: Constitution actuelle </p>\n<p>1792: Proclamation de la première République. </p>\n<p>Établir une nouvelle constitution renvoie à abolir l’ancienne.</p>\n<p>Le pouvoir constituant originaire cherche à faire table rase du passé, on redessine les fondements de la République</p>\n<h5>1. La souveraineté du pouvoir constituant originaire</h5>\n<p>C’est celui qui fonde la constitution de toute pièce, or le pouvoir constituant originaire, crée le sommet de la hiérarchie des normes, donc il ne suit aucune règle, car il y a aucune norme qui dit ce qu’il faut mettre dans la constitution.</p>\n<p>Le PCO n’est pas soumis au droit, il met ce qu’il veut dans la constitution. On parle de souveraineté, il a une totale indépendance et liberté, il n'est pas contraint à une norme qui s'impose à lui. </p>\n<p>La constitution étant la norme suprême, y’a aucune norme qui dit quoi y mettre. Le PCO naît du fait. La définition formelle de la constitution est très difficile, car la PCO n’a pas de loi, pas de norme à suivre pour créer la constitution. (exemple: Napoléon I qui s’autoproclame empereur grâce au PCO).</p>\n<p>En 1852 on rentre dans un nouvel empire (le 2nd Empire), donc nouveau système constitutionnel,</p>\n<p>En 1870, Napoléon est capturé par les Prussiens, donc il proclame la République, on fait une constitution. </p>\n<p>Le PCO est difficile à saisir car il ne répond pas à des règles juridiques, tout ce qu’on peut faire pour savoir si il y a un droit  constitutionnel formel est de faire du cas par cas(?).</p>\n<p>Cette définition renvoie non seulement à la procédure d’adoption mais aussi à la procédure de modification du droit constitutionnel. Quand on parle de modification constitutionnelle, on parle de révision constitutionnelle(aux USA on appelle ça des amendements). </p>\n<h5>2. L’encadrement du pouvoir constituant dérivé</h5>\n<p>Alors que le PCO se caractérise par sa souveraineté, le PCD se caractérise lui par son encadrement juridique. Il répond à des règles, comment on modifie une constitution? Il est contraint et encadré par le droit. </p>\n<p>PCO = Souverain = crée la constitution </p>\n<p>PCD = encadré = modifie la constitution = basé sur la constitution = dépend de la constitution (dérive d’elle). </p>\n<p>PCD est un pouvoir constitué, mais aussi constituant c’est à dire qu’il est à la fois l’auteur de la constitution (il peut la modifier) mais à condition de respecter les limites de la constitution . C’est la constituante qui prévoit à quel point on peut la modifier. C’est un paradoxe. </p>\n<p>La PCO prévoit comment on peut changer de Constitution. </p>\n<p>On cherche à protéger l’œuvre tout en voulant l’adapter au contexte actuel. </p>\n<h6>a. Les contraintes liées aux circonstances de la révision</h6>\n<p>Des contraintes procédurales. </p>\n<p>Des contraintes de circonstances temporelles, dans lesquelles on considère qu’on ne peut pas réviser la constitution. Il ne faut pas le faire dans l’urgence. </p>\n<p>La constitution de 1958 prévoit que lorsque le territoire est occupé par l’ennemi on ne peut pas réviser la constitution (porter atteinte à l’intégrité totale du  territoire national).—Alinéa 4 de Art. 89 (le dernier article de la constitution de la Vème République.)</p>\n<p>On ne peut pas réviser la constitution lorsqu’il y a une vacance du président de la République, (Vacances =  y’a pas de président élu).</p>\n<p>En Espagne, on ne peut pas réviser la constitution en état d’urgence. Les contraintes  changent d’un pays à un autre. On n’essaye de la conserver dans un état normal, avant de la modifier.</p>\n<p>L’essentiel de ces contraintes va se baser sur les procédures. (Exemple: en Irlande, la modification de la constitution passe le référendum). </p>\n<p>On exige les mêmes acteurs de la loi pour </p>\n<p>vérifier la constitution, on exige là une majorité AGGRAVÉE (50% des voix en faveur ou un vote favorable/ majorité des deux tiers dans chaque chambre). Le PCD est limité, car on ne peut pas réviser tout le temps la constitution, il y a des complications en matière de temps (temporalité).</p>\n<p class=\"lesson-note\">Exemple : Au Portugal il faut minimum 5 ans entre chaque révision de la constitution. Pour prendre le temps de réfléchir. </p>\n<p>Comment on révise la constitution en France? </p>\n<p>Qui a l’initiative ? Les parlementaires, le président… </p>\n<p>Ensuite, une fois qu’on a un texte ça passe devant les chambres du parlement (Assemblée nationale,  Sénat) comme toute loi, majorité simple et relative exigée. Différence avec la loi ordinaire, les deux chambres doivent impérativement se mettre d’accord. Congrès: Sénat + Assemblée Nationale </p>\n<p>8 mars 2024: Dernière révision de la constitution sur l’IVG des femmes. </p>\n<p>La Constitution formelle se distingue de la loi ordinaire par une procédure de révision plus contraignante. Cette rigidité vise à garantir la stabilité du texte fondamental et à éviter qu’il ne soit modifié trop facilement selon les fluctuations politiques du moment. En France, cette procédure est définie par l’article 89 de la Constitution de 1958, qui prévoit que toute modification constitutionnelle doit être approuvée par le peuple à travers un référendum. Le peuple devient ainsi l’organe qui contrebalance l’initiative parlementaire : si le projet de révision émane du Parlement, il doit obligatoirement être soumis au vote populaire. </p>\n<p>Cependant, lorsque l’initiative vient du président de la République, celui-ci peut choisir une autre voie : au lieu d’organiser un référendum, il peut convoquer le Congrès, c’est-à-dire la réunion des deux chambres du Parlement à Versailles. Cette alternative s’explique par la nature même de la révision constitutionnelle, qui exige un consensus politique plus fort que celui nécessaire pour adopter une loi ordinaire. La révision est donc entourée de contraintes procédurales destinées à assurer la légitimité de la modification.</p>\n<p>Depuis 1958, la Constitution française a été modifiée vingt-cinq fois, mais une seule révision a été adoptée par référendum selon la procédure de l’article 89. Cela montre que, dans la pratique, le recours au Congrès est devenu la voie privilégiée.</p>\n<p>Par ailleurs, certaines révisions ont profondément transformé le fonctionnement des institutions, comme celle de 2002, qui a instauré le quinquennat : désormais, le président de la République et les députés sont élus pour cinq ans, contre sept ans auparavant.</p>\n<p>Cette procédure illustre la volonté du pouvoir constituant originaire (PCO) de garantir la durée de son œuvre dans le temps. En répartissant le pouvoir de révision entre plusieurs organes politiques, le PCO cherche à éviter qu’un seul acteur ( notamment le Parlement ) puisse modifier la Constitution à lui seul. Ainsi, lorsqu’une proposition de révision émane du Parlement, elle doit nécessairement être validée par le peuple.</p>\n<p>La révision constitutionnelle est donc plus contraignante que l’adoption d’une loi ordinaire : elle implique un processus collectif, mobilisant plusieurs institutions, afin de préserver la stabilité et la légitimité du texte fondamental.</p>\n<h6>b. Les contraintes liées à la portée de la révision</h6>\n<p>La Constitution n’est pas souveraine en elle-même ; c’est le pouvoir constituant qui l’est. Autrement dit, la Constitution ne peut pas être personnifiée ni considérée comme une entité autonome : elle est le produit du pouvoir constituant originaire (PCO), qui l’a créée. Ce pouvoir se projette dans le temps et il est normal qu’il puisse la modifier, mais certaines dispositions sont considérées comme essentielles et ne peuvent pas être remises en cause. Ces dispositions constituent les limites matérielles du pouvoir de révision, c’est-à-dire les éléments exclus du champ de la révision.</p>\n<p>En France, la Constitution de 1958 ne comporte qu’une seule limite matérielle explicite : la forme républicaine du gouvernement. L’article 89, alinéa 5, dispose que « la forme républicaine du gouvernement ne peut faire l’objet d’aucune révision ». Cela signifie que le pouvoir constituant dérivé (PCD) peut tout modifier, sauf transformer le titre de président de la République ou remettre en cause le principe républicain.</p>\n<p>La République, dans son sens consensuel, s’oppose à la monarchie : elle repose sur un principe électif et non héréditaire. Les organes politiques doivent être élus et non transmis par héritage. L’article 1ᵉʳ de la Constitution précise que la France est une République démocratique, laïque et sociale. Ainsi, une révision qui introduit des éléments contraires à ces valeurs ( par exemple une réforme raciste ou discriminatoire ) porterait atteinte à la nature républicaine du régime, car la République repose sur la laïcité et l’égalité. </p>\n<p>Le principe est simple : tout ce qui n’est pas interdit est autorisé. Le pouvoir de révision peut donc ajouter des droits, mais aussi en supprimer, tant qu’il ne viole pas les limites matérielles fixées par la Constitution. En 2003, la révision constitutionnelle a introduit le principe de décentralisation, reconnaissant une autonomie aux régions, départements et communes vis-à-vis de l’État. Certains ont estimé que cela contredit l’idée d’une République centralisée, mais cette critique a été réfutée : la décentralisation n’est pas contraire à la forme républicaine, elle en est une évolution.</p>\n<p>Tous les États ne fixent pas de limites au pouvoir de révision. Et lorsqu’elles existent, elles varient d’un pays à l’autre. Par exemple, aux États-Unis, la forme fédérale de l’État ne peut pas être modifiée : la Constitution repose sur l’union de plusieurs États fédérés. En Allemagne, la Loi fondamentale de 1949 protège à la fois le fédéralisme et les droits fondamentaux : les vingt premiers articles sont intangibles, c’est-à-dire qu’ils ne peuvent subir aucune modification. Ces principes intangibles constituent les limites matérielles du pouvoir de révision.</p>\n<p>Ainsi, selon les systèmes constitutionnels, les limites matérielles peuvent protéger des valeurs différentes : la République, le fédéralisme ou les droits fondamentaux. Elles traduisent la volonté de préserver l’identité constitutionnelle de chaque État et de garantir que, même en cas de révision, certaines valeurs demeurent intouchables.</p>\n<h6>c. L’efficacité limitée des contraintes de la révision</h6>\n<p>En théorie, la Constitution fixe des règles précises pour encadrer le pouvoir de révision. Mais dans la pratique, ces règles peuvent être contournées lorsque le pouvoir politique bénéficie d’un large soutien populaire. Si un consensus existe, la question se pose : faut-il vraiment respecter la forme ? En France, seule l’Assemblée nationale détient la légitimité démocratique, mais le président de la République peut aussi s’appuyer sur le peuple pour légitimer son action. L’article 11 de la Constitution de 1958 prévoit en effet que le président peut soumettre directement au peuple une loi ordinaire par référendum.</p>\n<p>L’exemple le plus marquant est celui de 1962, sous le général de Gaulle. À cette époque, une loi donnant l’indépendance à l’Algérie est adoptée par référendum, dans le cadre des accords d’Évian qui mettent fin à la guerre d’Algérie. De Gaulle utilise ensuite le référendum pour une réforme d’une portée supérieure à une loi ordinaire : il modifie la Constitution en changeant la procédure prévue. Soutenu par une grande majorité du peuple, il viole formellement la Constitution, mais cette violation est acceptée. Ce soutien populaire lui permet de museler le Parlement et d’imposer sa vision politique. En revanche, s’il n’avait pas eu ce soutien, il aurait dû démissionner.</p>\n<p>Ainsi, en pratique, les limites juridiques de la révision peuvent être dépassées lorsque la légitimité démocratique l’emporte sur la légalité formelle.</p>\n<p>La question du contrôle des limites matérielles se pose ensuite. Peut-on garantir le respect des principes intangibles de la Constitution ? En théorie, un juge constitutionnel pourrait exercer un contrôle sur le pouvoir de révision. Mais en France, le Conseil constitutionnel a refusé en 2003 de contrôler le pouvoir constituant dérivé, estimant qu’il n’en avait pas la compétence et que ce pouvoir était souverain. Il ne contrôle que les lois ordinaires. À l’inverse, dans certains États comme l’Allemagne, le juge constitutionnel vérifie que la révision ne remet pas en cause le fédéralisme ni les vingt premiers articles de la Loi fondamentale, qui proclament les droits fondamentaux.</p>\n<p>Cependant, même lorsqu’un contrôle existe, il reste possible de contourner les procédures de révision. Dès lors qu’il n’existe pas de contrôle, la révision peut s’effectuer malgré les limites prévues.</p>\n<p>Enfin, il est possible de changer les formes de révision. Même avec un contrôle, des voies de contournement existent, notamment le recours au référendum, qui permet de légitimer une décision ne respectant pas la procédure. Dans ce cas, on ne touche pas directement aux limites matérielles, mais à la procédure elle-même. Le pouvoir constituant dérivé, bien que assujetti à la Constitution, peut modifier celle-ci, mais il ne peut pas tout faire. Par exemple, s’il voulait instaurer une monarchie, il ne pourrait pas modifier la forme républicaine prévue à l’article 89 alinéa 5. Il pourrait toutefois changer cet article pour supprimer la limite, puis réviser la Constitution. Théoriquement, la limite matérielle peut donc être abolie, et le pouvoir constituant dérivé peut s’émanciper pour obtenir une liberté totale d’action.</p>\n<p>Le problème reste le même : il ne faut pas changer la Constitution trop fréquemment, car elle perdrait toute valeur si elle pouvait être modifiée à volonté. Il faut donc pouvoir la faire évoluer tout en conservant ses éléments essentiels, afin de préserver son identité.</p>\n<p>Le pouvoir constituant dérivé est ainsi un idéal confronté à la pratique, où les contournements sont possibles. Le pouvoir constituant originaire, lui, est souverain : il établit la Constitution qui s’impose ensuite aux pouvoirs constitués, parmi lesquels le pouvoir constituant dérivé. Ce dernier peut jouer sur la Constitution, se modifier lui-même, voire s’émanciper complètement. En théorie, il est limité ; en réalité, il tend à devenir plus constituant que constitué, car il peut se donner sa propre liberté d’action. Tout dépend du système constitutionnel, du contexte politique et du degré de contrôle existant.</p>\n<h4>C. Enjeux des définitions matérielle et formelle du droit constitutionnel</h4>\n<p>Au moment de clore la phase de définition de notre objet, il faut bien reconnaître que les 2 définitions ne coïncident pas toujours : </p>\n<p>Des éléments matériellement constitutionnels peuvent ne pas être protégés par une procédure de révision particulière.</p>\n<p>Intégralement : Constitution coutumière britannique.</p>\n<p>Partiellement : mode de scrutin français déterminé par la loi ordinaire (Loi PLM (Paris, Lyon, Marseille) pour les municipales, débat actuel sur la proportionnelle aux élections législatives).</p>\n<p>Des éléments inscrits dans le texte de la Constitution ne relèvent pas au sens strict de la substance constitutionnelle.  </p>\n<p>Prolixité de certains constituants, par exemple sur le statut des fonctionnaires.</p>\n<p>Prolixité = caractère d'un discours, d'un écrit ou d'une personne qui s'exprime avec trop de mots, de façon excessivement longue et chargée de détails inutiles.</p>\n<p>(De mon point de vue prévaut la définition matérielle, parce qu’il me semble que la définition formelle est trop excluante (1), de même qu’une troisième conception du droit constitutionnel qui tend à se développer en doctrine, celle de la Constitution « normative » (2).)</p>\n<h5>1. Les limites de la définition formelle de la Constitution : les changements constitutionnels informels</h5>\n<p>Encore une fois, il me semble que la définition formelle n’existe qu’au service du fond de la Constitution ; elle est une modalité de la protection de l’œuvre constituante, pas l’œuvre constituante elle-même. Se contenter d’appréhender le droit constitutionnel par sa forme conduit à lui prêter beaucoup d’autorité alors que le détournement de procédure reste possible, comme on l’a vu.</p>\n<p>Surtout, il existe en droit constitutionnel tout un tas de phénomènes qui le font évoluer, sans que le texte ne soit affecté : pas de détournement de procédure au sens strict, plutôt un « contournement » de procédure, dans la mesure où elle n’est pas requise pour que la matière évolue.</p>\n<p>= Nécessaire interprétation (travail essentiel des juristes !) : les textes de loi restent nécessairement abstraits, généraux et doivent être appliqués à des cas concrets. Ils doivent donc être interprétés.</p>\n<p class=\"lesson-note\">Exemple → article 311-1 du Code pénal : Le vol est la soustraction frauduleuse de la </p>\n<p>chose d'autrui.</p>\n<p>Quid des noisettes ramassées sur le trottoir ou cueillies par-dessus la haie ?</p>\n<p>Quid du voleur de pommes qui cherche à nourrir ses 5 enfants ? Est-il condamné de la même manière que le cambrioleur d’une maison de famille ? Ou de l’auteur d’un vol avec violence dans une bijouterie ? =&gt; Appliquer des textes suppose de les interpréter.</p>\n<p>Jurisprudence</p>\n<p>Interprétation par les juges qui appliquent la Constitution ; cette jurisprudence est évolutive et constructive ou dynamique (ce qui explique que certaines décisions du Conseil constitutionnel soient particulièrement attendues). Elle permet manifestement de transformer le droit constitutionnel.</p>\n<p class=\"lesson-note\">Exemple  → Art. 2 DDHC : « Le but de toute association politique est la conservation des droits naturels et imprescriptibles de l'Homme. Ces droits sont la liberté, la propriété, la sûreté, et la résistance à l'oppression », le Conseil constitutionnel en a déduit le droit au respect de la vie privée, y compris le droit à une protection des données personnelles générées par les activités en ligne (2012) et une particulière vigilance sur les données génétiques des citoyens (2023).</p>\n<p class=\"lesson-note\">Exemple  → décision du 7 août 2025 à propos de la loi Duplomb : la ré-introduction controversée d’un pesticide dans la production agricole est contraire au droit de chacun de vivre dans un environnement sain ; la Constitution interdit donc, depuis cette date, l’usage de certains produits dangereux pour la santé.</p>\n<p>C’est du reste l’un des arguments en faveur d’un juge constitutionnel : il va, par son interprétation au jour le jour, favoriser l’adaptation et l’actualisation du texte constitutionnel, sans qu’il soit besoin de procéder formellement à sa mise à jour.</p>\n<p>Coutumes et conventions de la Constitution</p>\n<p>Différence subtile sur laquelle je ne m’attarde pas : interprétation cette fois non par le juge mais par les institutions politiques, les autres pouvoirs constitués. Ces derniers se mettent d’accord (informellement) pour faire prévaloir une interprétation de la Constitution, soit de leur plein gré, soit forcés par les circonstances.</p>\n<p>Exemples pléthoriques :</p>\n<p>-       IIIe République : absence de mention d’un chef de Gouvernement dans les lois constitutionnelles ; dès 1873 émerge pourtant la figure d’un Président du Conseil des ministres.</p>\n<p>-       Ve République : nomination et démission du Gouvernement</p>\n<p>Art. 8 : Le Président de la République nomme le Premier ministre. Il met fin à ses fonctions sur la présentation par celui-ci de la démission du Gouvernement. // Sur la proposition du Premier ministre, il nomme les autres membres du Gouvernement et met fin à leurs fonctions.</p>\n<p>o   le Président nomme qui il veut si son parti est majoritaire à l’Assemblée nationale (dès de Gaulle en 1958)</p>\n<p>o   dans les mêmes circonstances, le Président met un terme au mandat du Gouvernement lorsqu’il le souhaite (Borne 2024, Castex 2023, Philippe 2020…)</p>\n<p>o   aucun délai ne s’impose au Président pour procéder à la nomination de l’article 8 (2024).</p>\n<p>L’organisation des pouvoirs politiques et la garantie des droits fondamentaux (= définition matérielle de la Constitution) se trouvent donc altérées, malgré un texte constant, par des mécanismes informels, et insaisissables si on ne se concentre que sur le texte. Il faut aller au-delà du texte et donc du PCD comme élément essentiel de définition de la Constitution.</p>\n<h5>2. La nécessité d’une définition normative de la Constitution ?</h5>\n<p>Constitution normative = droit constitutionnel qui serait du vrai droit, en ceci qu’il serait appliqué, et non pas seulement une coquille vide et négligeable, ne disposant que d’une force invocatoire ; il n’y aurait de droit constitutionnel qu’autant qu’il y aurait un juge pour s’assurer qu’il est respecté.</p>\n<p>Le droit constitutionnel serait devenu un droit comme les autres dès lors qu’il s’est trouvé doté d’un juge, qu’on appelle le juge constitutionnel et sur lequel je reviendrai plus abondamment très bientôt.</p>\n<p>Or cela reviendrait à :</p>\n<p>Considérer que le droit se définit par référence au critère de la sanction ou du moins de l’applicabilité par un tribunal, ce qui exclut de fait certaines normes juridiques appartenant indiscutablement au système juridique… (voir supra).</p>\n<p>Estimer qu’il n’y pas de droit constitutionnel en France avant 1958 voire 1971 ; plus de 15 régimes constitutionnels qui se succèdent et qui pourtant ne seraient pas opportuns au titre du droit constitutionnel…</p>\n<p>Regarder certaines dispositions de la Constitution comme non juridiques, dans la mesure où le juge n’en a jamais fait application (articles 8 à 10 de la Charte de l’Environnement, article 8 sur la nomination du PM, article 89 sur la révision de la Constitution…).</p>\n<p>L’établissement d’une justice constitutionnelle a indiscutablement participé à renforcer l’autorité juridique et l’efficacité du droit de la Constitution, en même temps qu’elle a développé les sources de ce droit, en lui adjoignant une jurisprudence de plus en plus abondante. Pour autant, l’essence constitutionnelle gît ailleurs, dans la logique mécaniste des jeux institutionnels, ainsi qu’il en va d’ailleurs depuis les premières ambitions constituantes de l’histoire.</p>"}, {"title": "Section 2 – Histoire et perspectives du droit constitutionnel", "text": "**Section 2 – Histoire et perspectives du droit constitutionnel&#xA0;**\n\nDiscipline profondément ancrée dans l’histoire, ici française.\n\n\n\n**§1 – La naissance du droit constitutionnel : la Révolution de 1789 \\***\n\n- *La Révolution française (comme toutes celles du XIXe d’ailleurs) sont liées à des ambitions constitutionnelles ; à partir de 1789, on pose les jalons de ce qu’est encore le droit constitutionnel aujourd’hui, et que nous étudierons ensuite plus en détail.*\n- *Étudier la naissance de la Constitution permet de mieux en comprendre les ressorts*\n\n**A. Ce qu’est la Révolution de 1789 : l’invention de la représentation nationale et des droits de l’Homme&#xA0;**\n\n- *Rappel sur la convocation des États généraux, siégeant et votant par ordre, seulement consultés par le Roi : refus du Tiers État de siéger (5 mai), la situation s’enlise jusqu’au serment du jeu de paume (20 juin) → les élus du Tiers et du Clergé (ainsi que certains aristocrates) se jurent de doter la France d’une Constitution et se proclament Assemblée nationale.*\n- *L’idée qui fait son chemin est la suivante : le roi détient tous les pouvoirs, exerce seul la souveraineté, c’est-à-dire le pouvoir suprême ; il faut mettre fin à ce despotisme (pas de totalitarisme) et confier la souveraineté à la Nation tout entière.*\n- *Attention : **il n’est pas question d’abolir la monarchie dans un premier temps**, seulement de tempérer le pouvoir royal par l’instauration d’une chambre délibérative (qu’on appellera beaucoup plus tard un Parlement). Monarchie constitutionnelle en 1791, ce n’est qu’à la suite de la fuite du roi à Varennes que la République sera proclamée à demi-mots le 22 septembre 1792 (An I).*\n\n*&#xA0;Beaucoup d’inventions révolutionnaires traversent encore le droit constitutionnel contemporain et nous aurons l’occasion d’en étudier un certain nombre en détails :*\n\n- *La souveraineté est confiée à la nation mais n’est pas exercée directement par la nation, qui doit se doter d’élus : c’est le principe de la **représentation nationale**.*\n- *Les représentants de la nation siègent essentiellement dans une ou plusieurs chambres parlementaires qui se voient confier le **pouvoir législatif** (principe de la délibération publique, début des partis politiques et apparition de la gauche et la droite, la loi exprime dès lors la volonté générale)*\n- *Le retour de l’absolutisme doit être empêché par la mécanique constitutionnelle, qui doit veiller à **séparer les pouvoirs**, et plus précisément encore à garantir l’indépendance des tribunaux (condamnation par un organe impartial, et en vertu d’une loi, contre les lettres de cachet)*\n- *Les citoyens doivent se voir reconnaître des droits individuels (naturels) auxquels la puissance publique ne peut pas porter atteinte (DDHC du 26 août 1789, toujours en vigueur / DDHC 1793)*\n- *Tous les citoyens sont égaux devant la loi (abolition des privilèges le 4 août) – prémisses du principe de non discrimination.*\n\n* ***Art. 6 DDHC :&#x20;**&#x4C;a loi est l'expression de la volonté générale. Tous les citoyens ont droit de concourir personnellement, ou par leurs Représentants, à sa formation. Elle doit être la même pour tous, soit qu'elle protège, soit qu'elle punisse. Tous les citoyens étant égaux à ses yeux sont également admissibles à toutes dignités, places et emplois publics, selon leur capacité, et sans autre distinction que celle de leurs vertus et de leurs talents.&#xA0;*\n\n\n\n- *La Révolution commence le 5 mai 1789, mais il est beaucoup plus délicat de dire quand elle se termine ; **Napoléon&#x20;**&#x61;ffirmera lui-même terminer la Révolution en 1799. Ce qui est certain, c’est que beaucoup de ses acquis – jusqu’à la conception même de la Constitution comme soumission des pouvoirs constitués au pouvoir constituant souverain – sont toujours d’actualité.*\n\n\n\n**B. Ce que n’est pas la Révolution de 1789 : l’instauration de la démocratie et de l’État de droit&#xA0;**\n\n- *Ce qu’on appelle aujourd’hui la démocratie n’existe pas en France en 1789 ; les Conventionnels de 1792, les premiers républicains, travaillent à une Constitution véritablement démocratique, adoptée (par référendum) en 1793 mais jamais appliquée, et définitivement enterrée en 1794 avec la fin de la Terreur.*\n- *Certains éléments révolutionnaires sont aujourd’hui rattachés à la démocratie dans sa signification contemporaine (principe électif, suffrage universel, séparation des pouvoirs, garantie des droits individuels, non-discrimination) mais elle ne représente pas un modèle politique majoritaire (sauf **Robespierre** et Terreur).*\n\n\n\n- *De même, nous y reviendrons, l’État ne naît pas avec la Révolution de 1789 : il existe déjà depuis plusieurs siècles (A. de Tocqueville, L’Ancien régime et la Révolution).*\n\n**§2 – L’épanouissement du droit constitutionnel : la valse-hésitation au XIXe siècle&#xA0;**\n\n- *Après la révolution s’enchaînent les régimes, à un rythme effréné, jusqu’à ce que s’impose le modèle républicain à partir de 1870, et la Ve République à partir de 1958 – ce qui en fait le régime le plus pérenne que la France ait connu.*\n- *Rappel bref, dont vous retrouverez toutes les détails dans n’importe quel ouvrage :&#xA0;*\n- *Monarchie constitutionnelle (1791-92) – Première République (Convention 1792-93 – Terreur 1793-94 – Directoire 1795-99 – Consulat 1799-1904) – Premier empire (1804-14/15) – Restauration (1814/15-1830) – Cent jours (1815) – Monarchie de juillet (1830-48) – Seconde République (1848-51) – Second Empire (1852-1870) – IIIe Rép. (proclamée en 1870, lois constitutionnelles de 1875) – Vichy (1940-44) – IVe Rép. (1946-1958) – Ve Rép. (1958-…).*\n\n\n\n*Vous noterez que, à la lumière de ces dénominations :*\n\n*-       La République désigne simplement un régime dans lequel la charge de chef de l’État n’est pas héréditaire mais élective ; **elle ne se confond donc pas avec la démocratie** (Directoire, régime de la première République : pas de suffrage universel) ;*\n\n*-       Le droit constitutionnel n’est pas forcément démocratique ou républicain ;*\n\n*-       Chaque régime donnant lieu à une nouvelle Constitution, il n’y a pas de vérité constitutionnelle ; le droit constitutionnel n’est pas l’horizon indépassable de la politique. Au contraire, il est aux prises avec le pouvoir, et doit lui aussi faire l’objet d’un débat sur son opportunité et sa légitimité.*\n\n\n\n**A. L’expérimentation des formes constitutionnelles&#xA0;**\n\n**B. L’expérimentation des régimes constitutionnels&#xA0;**\n\n**§3 – La juridictionnalisation du droit constitutionnel à l’âge contemporain&#xA0;**\n\n- *Depuis le début du droit constitutionnel outre-Atlantique, mais seulement depuis à peine un siècle en Europe, s’est posée la question de l’effectivité du droit constitutionnel. S’est alors développée la **justice constitutionnelle**, envisagée comme un moyen de **garantir** la norme constitutionnelle et de s’assurer qu’elle ne sera pas enfreinte, non pas tant par des personnes que par des normes (les actes du pouvoir politique) = **contrôle de constitutionnalité des lois**, garantie de la hiérarchie des normes.*\n- *Le contexte d’apparition de la jeune Constitution (JC) est déterminant pour comprendre l’enjeu de cette justice constitutionnelle (A) ainsi que les modèles qu’elle épouse (B). Aujourd’hui encore, continue toutefois de se poser la question de la légitimité de la justice constitutionnelle (C).*\n\n\n\n**A. La justification de la justice constitutionnelle&#xA0;**\n\n- *Le juge constitutionnel est d’abord inventé aux États-Unis, **Marbury&#x20;**&#x76;s **Madison**, 1803, par la Cour suprême instaurée quelques années auparavant, qui se reconnaît la compétence de contrôler les lois au regard de leur conformité aux prescriptions constitutionnelles.*\n- *Rhétorique de la décision : si la jeune Constitution doit produire quelque effet en matière d’organisation et de répartition du pouvoir politique, elle a besoin d’un **gardien**, d’un juge chargé de veiller à ce qu’elle ne soit pas enfreinte, et compétent pour la faire prévaloir si elle devait entrer en conflit avec une loi. Si la Constitution fixe la procédure législative mais que le Congrès est libre de faire comme si elle n’existait pas, la Constitution ne sert à rien.*\n\n\n\n- *En Europe, les choses sont plus tardives, très certainement parce que depuis la Révolution qui s’est étendue sur le continent, on entretient le culte de la loi : le **légicentrisme**. C’est logique : expression volonté générale, infaillible, souveraineté de la Nation… On croit au caractère invocatoire de la Constitution (cf. débats constituants sur une jurie constitutionnaire), et à la bonne volonté du Parlement. On ne peut envisager de remettre en cause la loi.*\n- *Contrôle juridictionnel du pouvoir politique inventé plus tôt – fin du XIXe – pour les actes de l’Administration, donc du pouvoir exécutif, confié au juge administratif : **contrôle de légalité** (émanation du légicentrisme).*\n- *Théorie **Kelsen&#x20;**&#x64;ès 1919 (RDP 1928) : instauration Cour constitutionnelle autrichienne, au nom de l’effectivité de la HN ; il semble logique de transposer la logique du contrôle juridictionnel de légalité au degré supérieur.*\n- *Basculement post-seconde guerre mondiale : faillibilité établie du Parlement en France, en Allemagne, en Espagne, en Italie… (lois antisémites, antidémocratiques, attentatoires aux libertés + pleins pouvoirs à Pétain). Les Constitutions d’après-guerre généralisent l’établissement d’un contrôle de constitutionnalité (en France, prémisse en 1946, confirmation timide en 1958 d’un tribunal qui depuis s’est largement affirmé).*\n\n\n\n*⇒ S’assurer que le législateur (pouvoir constitué) n’outrepasse pas les valeurs et procédures inscrites dans la Constitution par le pouvoir constituant originaire, légitime et souverain (le peuple).*\n\n\n\n**B. Les modèles de justice constitutionnelle&#xA0;**\n\n- *En raison des contextes de leur avènement, il existe deux grands modèles de justice constitutionnelle.*\n\n**1. Le modèle diffus de justice constitutionnelle (américain : États-Unis, Canada, Brésil)&#xA0;**\n\n- ***Diffus / décentralisé&#x20;**: Il n’est pas réservé à un tribunal spécialisé, il peut être exercé par n’importe quel juge. Reste soumis à la hiérarchie juridictionnelle, la CS reste le tribunal de dernier ressort, y compris sur les matières constitutionnelles.*\n- ***Contrôle par voie d’exception, et concret&#x20;**: N’importe quel juge donc n’importe quel litige ; le contrôle de constitutionnalité n’est pas l’action principale du litige*\n\n***Exemple&#x20;**→ Roe vs Wade (proc. de Dallas), 22 janv. 1973 : pénalisation de l’avortement vs droit à la vie privée. Par conséquent, le contrôle est **concret** : le juge va regarder la situation individuelle qui résulte de l’application de la loi et si cette situation présente une inconstitutionnalité ou non (Mrs Roe interdite d’avorter au Texas).*\n\n- ***Contrôle a posteriori&#x20;**: après l’entrée en vigueur de la loi. Elle a été votée, promulguée et s’applique. La constitutionnalité est contestable ad vitam aeternam.*\n- ***Effet inter partes / relatif&#x20;**: la loi existe toujours dans l’OJ et pourra s’appliquer dans d’autres hypothèses concrètes.*\n\n\n\n**2. Le modèle concentré de justice constitutionnelle (Europe)&#xA0;**\n\n- *Davantage inspiré de la théorie de **Kelsen**, et en réponse à une organisation juridictionnelle différente que dans les systèmes de Common law (dualité juridictionnelle, exclusion du Royaume-Uni).*\n\n* ***Concentré&#x20;**: Un seul juge, spécialement dédié au contrôle de constitutionnalité des lois, en vertu de la Constitution elle-même : Tribunal, Cour ou Conseil constitutionnel.*\n* ***Contrôle a priori&#x20;**: Avant l’entrée en vigueur de la loi, entre son vote et sa promulgation (**Exemple. Loi Duplomp**) : logique préventive d’anticipation des inconstitutionnalités.*\n* ***Contrôle par voie d’action, et abstrait&#x20;**: non entrée en vigueur, la loi ne peut pas être contestée lors d’un procès, et le juge ne peut pas évaluer ses effets concrets ; il ne peut donc, en pratique, que confronter deux textes.*\n* ***Effet erga omnes / absolu&#x20;**: encore une fois logique : la loi n’a jamais existé puisqu’elle n’est pas entrée en vigueur. Le contrôle empêche sa promulgation. On purge effectivement l’ordre juridique (OJ) des défauts dans sa hiérarchie des normes (HN)*.\n\n\n\n\n\n\n\n\n\n**3. Les limites à la modélisation&#xA0;**\n\n- *Même si on raisonne à partir de ces deux modèles opposés, il faut en réalité relativiser leur opposition.*\n\n* *Précaution géographique : en Europe, le modèle diffus peut s’appliquer (Royaume-Uni, Grèce)*\n* *Développement en Europe de contrôle **a posteriori**, et concrétisés, déclenchés au cours d’une instance (France depuis 2010, Italie) ou même par voie d’action (Allemagne, Espagne).*\n* *Symétriquement, portée absolue des décisions d’inconstitutionnalité : force du précédent, surtout lorsqu’il est établi par la ou une CS ; c’est d’ailleurs la raison pour laquelle on peut évoquer une politique jurisprudentielle des Cours.*\n\n\n\n*[Effet absolu non seulement sur l’application de la loi déclarée non conforme, mais aussi sur l’**interprétation de la Constitution&#x20;**&#x71;ui en résulte : si la criminalisation de l’avortement au Texas est inapplicable à partir de 1973, elle est également proscrite dans l’ensemble des États fédérés des États-Unis.*\n\n*Bien sûr, la force du précédent n’empêche pas, par parallélisme des formes, de le renverser et d’établir une jurisprudence distincte ou opposée : Dobbs v. Jackson Women's Health Organization, 24 juin 2022].*\n\n\n\n- *La différence principale qui subsiste entre les deux modèles renvoie donc finalement à la seule question de savoir si l’organe qui opère le contrôle de constitutionnalité des lois est un tribunal spécialisé ou si c’est au contraire une mission qui est confiée à tous les juges dans l’État.*\n\n\n\n**C. Les limites à la légitimité de la justice constitutionnelle&#xA0;**\n\n- *Aujourd’hui, rares sont les États dénués d’un juge constitutionnel, spécialisé ou non, devenu l’un des marqueurs de ce qu’on appelle l’État de droit. Pourtant, la réticence des premiers constituants défavorables à l’instauration de la jurie n’était pas dénuée de fondement, et emporte toujours des limites à la légitimité du contrôle judiciaire constitutionnalité : certains ont estimé que le rôle du gardien de la Constitution devait être confié au chef de l’État (**C. Schmitt**), d’autres qu’il relevait d’une assemblée parlementaire élue par les citoyens (**J. Barthélemy**).*\n- *3 aspects critiquables : la composition (1), le pouvoir d’interprétation (2) et le pouvoir de dernier mot (3). .*\n\n**1. La composition des cours constitutionnelles&#xA0;**\n\n- ***Idée d’un tribunal** = gage d’indépendance et d’impartialité (personnalités formées, devoir de réserve, neutralité à l’égard du pouvoir politique) – dès lors, il faut éviter le processus électoral, pourtant a priori plus démocratique.*\n\n*Sauf que :*\n\n- ***aux États-Unis** : Cour suprême, membres nommés à vie par le Président, avec aval du Sénat, nomination comme enjeu (aléatoire) des mandats présidentiels (plus ou moins chanceux) – la durée illimitée du mandat et le nombre de neuf juges sont censés tempérer le pouvoir ainsi dévolu, mais ces garanties restent limitées (politiques institutionnelles).*\n- ***en France (et contrairement aux autres États européens, où sont exigées une expérience et une compétence éprouvées en droit, et en gages d’impartialité) :** nominations politiques sans conditions (possible véto commission 2/3) + membres de droit (!).*\n- ***en Hongrie (et Pologne)** : contournement des règles de nomination pour « noyée » la Cour de personnalités favorables à une politique illibérale et anti-européenne.*\n\n*⇒ Juges constitutionnels non élus, potentiellement non compétents, non responsables de leurs décisions.*\n\n\n\n**2. Le pouvoir d’interprétation des juges constitutionnels&#xA0;**\n\n- *Savoir si la Constitution est violée suppose de l’interpréter : texte lacunaire, laconique, abstrait et vieux. Établir un juge constitutionnel revient à lui confier la mission de déterminer en priorité la **signification&#x20;**&#x64;u texte constitutionnel, et la portée qu’il entend lui conférer à l’encontre du pouvoir législatif.*\n\n*⇒ le juge peut annuler ou écarter la loi, ce qui lui donne un pouvoir considérable sur elle ; mais il peut le faire également en vertu de sa propre interprétation d’un texte toujours trop vague… Immense pouvoir politique ! Le juge peut neutraliser la volonté politique exprimée par les représentants de la Nation, et lui dicter la Constitution qu’il décide.*\n\n\n\n- ***Théorie réaliste de l’interprétation** (**M. Troper**) : ce n’est pas l’auteur du texte mais l’interprète qui fait la loi (ou la Constitution) ; le juge serait donc co-législateur (négatif : il peut effacer ou remodeler une loi), mais également (co-)**constituant**. **Par son interprétation**, il exerce un véritable pouvoir politique.*\n\n*Exemple → loi sur les retraites 2023, **loi Duplomp&#x20;**&#x32;025 : le Conseil constitutionnel est également le lieu où se poursuit la discussion politique après l’arène parlementaire ou le terrain de lutte sociale.*\n\n\n\n- *Inversion du syllogisme judiciaire : syllogisme dont la prémisse majeure est décidée postérieurement pour justifier la conclusion privilégiée.*\n\n* ***Syllogisme judiciaire (la façon dont le juge est censé raisonner) :&#xA0;***\n  - *La Constitution protège la liberté d’expression (prémisse majeure) ;&#xA0;*\n  - *La loi porte une atteinte excessive à la liberté d’expression (prémisse mineure) ;*\n  - *Donc la loi est contraire à la Constitution (conclusion).*\n* ***Syllogisme inversé (la façon dont le juge raisonne en réalité selon la théorie réaliste de l'interprétation) :&#xA0;***\n  - *La loi doit être déclarée contraire à la Constitution (finalité) ;&#xA0;*\n  - *La loi doit être regardée comme portant une atteinte excessive à la liberté d’expression ;&#xA0;*\n  - *Donc la Constitution doit être interprétée comme interdisant une telle atteinte à la liberté d’expression.*\n\n\n\n***Exemple&#x20;**→ **JL Debré** président du Conseil constitutionnel en 2012, à propos de la taxe à 75% sur les revenus supérieurs à 1 million d’euros : il expliquait que d’abord il avait considéré que le seuil était trop élevé, ensuite (seulement) qu’il avait cherché dans le bloc de constitutionnalité les arguments pour le déclarer inconstitutionnel.Il faisait ainsi l’aveu qu’il interprétait le texte de façon instrumentale, et donc que le juge ne se contente pas d’appliquer le droit constitutionnel, il participe à le créer.*\n\n\n\n- *C’est ce qui explique que la justice constitutionnelle soit si régulièrement critiquée comme un obstacle à l’expression de la volonté démocratique des élus du peuple : non seulement peut-elle abroger une loi votée mais en plus peut-elle le faire sur le fondement de sa propre interprétation d’un texte imprécis. Elle dispose donc de fait d’un pouvoir politique considérable.*\n- *Il est possible de tempérer ce pouvoir, à défaut considérable et obscur : le juge constitutionnel doit également veiller à être crédible, à faire preuve de cohérence, au risque de confesser son autorité indue, et de se décrédibiliser dans un système*\n\n\n\n**3. Le pouvoir de dernier mot des juges constitutionnels&#xA0;**\n\n- *En faveur de la légitimité du juge constitutionnel, est avancé l’argument qu’il ne dispose pas du dernier mot, qui appartient bien au peuple ou à ses représentants : c’est l&#x61;**&#x20;théorie de l’aiguilleur** (expression de Louis Favoreu) et du **lit de justice** (Georges Vedel ; l’image emprunte à l’Ancien régime lorsque le Roi se présentait « en majesté », c’est-à-dire dans un lit, au Parlement de Paris, lorsque celui-ci refusait d’enregistrer ses édits).*\n- ***Aiguilleur** : le juge ne bloque par le pouvoir politique, il lui indique la bonne voie.*\n- ***Lit de justice** : le peuple ou ses représentants peuvent reprendre la main et « briser ses arrêts ».*\n\n***Exemple&#x20;**→ loi instaurant la parité sur les listes électorales censurée par le Conseil constitutionnel en 1998, le principe a été constitutionnalisé en 1999 : art. 1er al. 2 (depuis 2008) : La loi favorise l'égal accès des femmes et des hommes aux mandats électoraux et fonctions électives, ainsi qu'aux responsabilités professionnelles et sociales).*\n\n\n\n- *Ces théories, qui défendent la légitimité de la justice constitutionnelle, connaissent toutefois des limites, car les juges sont susceptibles de faire œuvre d’imagination dans la réception des révisions constitutionnelles.*\n\n***Exemple&#x20;**→ États-Unis XIIIe amendement 1865 : abolition de l’esclavage / XIVe 1866 : égalité entre les citoyens / XVe 1870 : droit de vote pour tous.*\n\n*Plessy vs. Ferguson, 18 mai 1896 : « séparés mais égaux », théorisation de la ségrégation sous couvert d’une égalité (factice) de droits // renversement jurisprudentiel et fin de la lecture ségrégationniste de la Constitution : Brown vs. Board of Education of Topeka, 17 mai 1954.*\n\n\n\n- *Par ailleurs, même pragmatiquement, en France une décision du juge suppose un consensus entre 5 personnes (majorité des membres du Conseil constitutionnel), alors que la révision constitutionnelle suppose l’aval soit de plusieurs millions de citoyens, soit 555 parlementaires (et un temps beaucoup plus long). Le lit de justice reste donc une théorie dont on trouve quelques exemples en pratique, plutôt qu’une véritable limite au pouvoir exercé par le juge constitutionnel.*\n\n***Exemple&#x20;**→ **Le Pen et Retailleau** : référendum immigration impossible, ils en appellent donc à une révision.*\n\n- *Il n’en reste pas moins que le juge constitutionnel, encore une fois, **présente des garanties par sa fonction de contrôle de la loi, loi de la majorité politique contre laquelle il oppose les droits des minorités.** A ce titre, il est un acteur de la démocratie et surtout de ce qu’on appelle l’État de droit.*\n- *En tout état de cause, la garantie de la Constitution par les juges représente une part importante du droit constitutionnel. On a même consacré à la question une matière qui s’appelle le **contentieux constitutionnel** (français, étranger ou comparé).*\n", "html": "<h2>Section 2 – Histoire et perspectives du droit constitutionnel</h2>\n<p>Discipline profondément ancrée dans l’histoire, ici française.</p>\n<h3>§1 – La naissance du droit constitutionnel : la Révolution de 1789</h3>\n<ul>\n<li><em>La Révolution française (comme toutes celles du XIXe d’ailleurs) sont liées à des ambitions constitutionnelles ; à partir de 1789, on pose les jalons de ce qu’est encore le droit constitutionnel aujourd’hui, et que nous étudierons ensuite plus en détail.</em></li>\n<li><em>Étudier la naissance de la Constitution permet de mieux en comprendre les ressorts</em></li>\n</ul>\n<h4>A. Ce qu’est la Révolution de 1789 : l’invention de la représentation nationale et des droits de l’Homme</h4>\n<ul>\n<li><em>Rappel sur la convocation des États généraux, siégeant et votant par ordre, seulement consultés par le Roi : refus du Tiers État de siéger (5 mai), la situation s’enlise jusqu’au serment du jeu de paume (20 juin) → les élus du Tiers et du Clergé (ainsi que certains aristocrates) se jurent de doter la France d’une Constitution et se proclament Assemblée nationale.</em></li>\n<li><em>L’idée qui fait son chemin est la suivante : le roi détient tous les pouvoirs, exerce seul la souveraineté, c’est-à-dire le pouvoir suprême ; il faut mettre fin à ce despotisme (pas de totalitarisme) et confier la souveraineté à la Nation tout entière.</em></li>\n<li><em>Attention : <strong>il n’est pas question d’abolir la monarchie dans un premier temps</strong>, seulement de tempérer le pouvoir royal par l’instauration d’une chambre délibérative (qu’on appellera beaucoup plus tard un Parlement). Monarchie constitutionnelle en 1791, ce n’est qu’à la suite de la fuite du roi à Varennes que la République sera proclamée à demi-mots le 22 septembre 1792 (An I).</em></li>\n</ul>\n<p>* Beaucoup d’inventions révolutionnaires traversent encore le droit constitutionnel contemporain et nous aurons l’occasion d’en étudier un certain nombre en détails :</p>\n<ul>\n<li><em>La souveraineté est confiée à la nation mais n’est pas exercée directement par la nation, qui doit se doter d’élus : c’est le principe de la <strong>représentation nationale</strong>.</em></li>\n<li><em>Les représentants de la nation siègent essentiellement dans une ou plusieurs chambres parlementaires qui se voient confier le <strong>pouvoir législatif</strong> (principe de la délibération publique, début des partis politiques et apparition de la gauche et la droite, la loi exprime dès lors la volonté générale)</em></li>\n<li><em>Le retour de l’absolutisme doit être empêché par la mécanique constitutionnelle, qui doit veiller à <strong>séparer les pouvoirs</strong>, et plus précisément encore à garantir l’indépendance des tribunaux (condamnation par un organe impartial, et en vertu d’une loi, contre les lettres de cachet)</em></li>\n<li><em>Les citoyens doivent se voir reconnaître des droits individuels (naturels) auxquels la puissance publique ne peut pas porter atteinte (DDHC du 26 août 1789, toujours en vigueur / DDHC 1793)</em></li>\n<li><em>Tous les citoyens sont égaux devant la loi (abolition des privilèges le 4 août) – prémisses du principe de non discrimination.</em></li>\n</ul>\n<ul>\n<li>Art. 6 DDHC : La loi est l'expression de la volonté générale. Tous les citoyens ont droit de concourir personnellement, ou par leurs Représentants, à sa formation. Elle doit être la même pour tous, soit qu'elle protège, soit qu'elle punisse. Tous les citoyens étant égaux à ses yeux sont également admissibles à toutes dignités, places et emplois publics, selon leur capacité, et sans autre distinction que celle de leurs vertus et de leurs talents. *</li>\n</ul>\n<ul>\n<li><em>La Révolution commence le 5 mai 1789, mais il est beaucoup plus délicat de dire quand elle se termine ; Napoléon affirmera lui-même terminer la Révolution en 1799. Ce qui est certain, c’est que beaucoup de ses acquis – jusqu’à la conception même de la Constitution comme soumission des pouvoirs constitués au pouvoir constituant souverain – sont toujours d’actualité.</em></li>\n</ul>\n<h4>B. Ce que n’est pas la Révolution de 1789 : l’instauration de la démocratie et de l’État de droit</h4>\n<ul>\n<li><p><em>Ce qu’on appelle aujourd’hui la démocratie n’existe pas en France en 1789 ; les Conventionnels de 1792, les premiers républicains, travaillent à une Constitution véritablement démocratique, adoptée (par référendum) en 1793 mais jamais appliquée, et définitivement enterrée en 1794 avec la fin de la Terreur.</em></p>\n</li>\n<li><p><em>Certains éléments révolutionnaires sont aujourd’hui rattachés à la démocratie dans sa signification contemporaine (principe électif, suffrage universel, séparation des pouvoirs, garantie des droits individuels, non-discrimination) mais elle ne représente pas un modèle politique majoritaire (sauf <strong>Robespierre</strong> et Terreur).</em></p>\n</li>\n<li><p><em>De même, nous y reviendrons, l’État ne naît pas avec la Révolution de 1789 : il existe déjà depuis plusieurs siècles (A. de Tocqueville, L’Ancien régime et la Révolution).</em></p>\n</li>\n</ul>\n<h3>§2 – L’épanouissement du droit constitutionnel : la valse-hésitation au XIXe siècle</h3>\n<ul>\n<li><em>Après la révolution s’enchaînent les régimes, à un rythme effréné, jusqu’à ce que s’impose le modèle républicain à partir de 1870, et la Ve République à partir de 1958 – ce qui en fait le régime le plus pérenne que la France ait connu.</em></li>\n<li>Rappel bref, dont vous retrouverez toutes les détails dans n’importe quel ouvrage : *</li>\n<li><em>Monarchie constitutionnelle (1791-92) – Première République (Convention 1792-93 – Terreur 1793-94 – Directoire 1795-99 – Consulat 1799-1904) – Premier empire (1804-14/15) – Restauration (1814/15-1830) – Cent jours (1815) – Monarchie de juillet (1830-48) – Seconde République (1848-51) – Second Empire (1852-1870) – IIIe Rép. (proclamée en 1870, lois constitutionnelles de 1875) – Vichy (1940-44) – IVe Rép. (1946-1958) – Ve Rép. (1958-…).</em></li>\n</ul>\n<p><em>Vous noterez que, à la lumière de ces dénominations :</em></p>\n<p><em>-       La République désigne simplement un régime dans lequel la charge de chef de l’État n’est pas héréditaire mais élective ; <strong>elle ne se confond donc pas avec la démocratie</strong> (Directoire, régime de la première République : pas de suffrage universel) ;</em></p>\n<p><em>-       Le droit constitutionnel n’est pas forcément démocratique ou républicain ;</em></p>\n<p><em>-       Chaque régime donnant lieu à une nouvelle Constitution, il n’y a pas de vérité constitutionnelle ; le droit constitutionnel n’est pas l’horizon indépassable de la politique. Au contraire, il est aux prises avec le pouvoir, et doit lui aussi faire l’objet d’un débat sur son opportunité et sa légitimité.</em></p>\n<h4>A. L’expérimentation des formes constitutionnelles</h4>\n<h4>B. L’expérimentation des régimes constitutionnels</h4>\n<h3>§3 – La juridictionnalisation du droit constitutionnel à l’âge contemporain</h3>\n<ul>\n<li><em>Depuis le début du droit constitutionnel outre-Atlantique, mais seulement depuis à peine un siècle en Europe, s’est posée la question de l’effectivité du droit constitutionnel. S’est alors développée la <strong>justice constitutionnelle</strong>, envisagée comme un moyen de <strong>garantir</strong> la norme constitutionnelle et de s’assurer qu’elle ne sera pas enfreinte, non pas tant par des personnes que par des normes (les actes du pouvoir politique) = <strong>contrôle de constitutionnalité des lois</strong>, garantie de la hiérarchie des normes.</em></li>\n<li><em>Le contexte d’apparition de la jeune Constitution (JC) est déterminant pour comprendre l’enjeu de cette justice constitutionnelle (A) ainsi que les modèles qu’elle épouse (B). Aujourd’hui encore, continue toutefois de se poser la question de la légitimité de la justice constitutionnelle (C).</em></li>\n</ul>\n<h4>A. La justification de la justice constitutionnelle</h4>\n<ul>\n<li><p><em>Le juge constitutionnel est d’abord inventé aux États-Unis, <strong>Marbury vs Madison</strong>, 1803, par la Cour suprême instaurée quelques années auparavant, qui se reconnaît la compétence de contrôler les lois au regard de leur conformité aux prescriptions constitutionnelles.</em></p>\n</li>\n<li><p><em>Rhétorique de la décision : si la jeune Constitution doit produire quelque effet en matière d’organisation et de répartition du pouvoir politique, elle a besoin d’un <strong>gardien</strong>, d’un juge chargé de veiller à ce qu’elle ne soit pas enfreinte, et compétent pour la faire prévaloir si elle devait entrer en conflit avec une loi. Si la Constitution fixe la procédure législative mais que le Congrès est libre de faire comme si elle n’existait pas, la Constitution ne sert à rien.</em></p>\n</li>\n<li><p><em>En Europe, les choses sont plus tardives, très certainement parce que depuis la Révolution qui s’est étendue sur le continent, on entretient le culte de la loi : le <strong>légicentrisme</strong>. C’est logique : expression volonté générale, infaillible, souveraineté de la Nation… On croit au caractère invocatoire de la Constitution (cf. débats constituants sur une jurie constitutionnaire), et à la bonne volonté du Parlement. On ne peut envisager de remettre en cause la loi.</em></p>\n</li>\n<li><p><em>Contrôle juridictionnel du pouvoir politique inventé plus tôt – fin du XIXe – pour les actes de l’Administration, donc du pouvoir exécutif, confié au juge administratif : <strong>contrôle de légalité</strong> (émanation du légicentrisme).</em></p>\n</li>\n<li><p><em>Théorie Kelsen dès 1919 (RDP 1928) : instauration Cour constitutionnelle autrichienne, au nom de l’effectivité de la HN ; il semble logique de transposer la logique du contrôle juridictionnel de légalité au degré supérieur.</em></p>\n</li>\n<li><p><em>Basculement post-seconde guerre mondiale : faillibilité établie du Parlement en France, en Allemagne, en Espagne, en Italie… (lois antisémites, antidémocratiques, attentatoires aux libertés + pleins pouvoirs à Pétain). Les Constitutions d’après-guerre généralisent l’établissement d’un contrôle de constitutionnalité (en France, prémisse en 1946, confirmation timide en 1958 d’un tribunal qui depuis s’est largement affirmé).</em></p>\n</li>\n</ul>\n<p class=\"lesson-note\"><em>⇒ S’assurer que le législateur (pouvoir constitué) n’outrepasse pas les valeurs et procédures inscrites dans la Constitution par le pouvoir constituant originaire, légitime et souverain (le peuple).</em></p>\n<h4>B. Les modèles de justice constitutionnelle</h4>\n<ul>\n<li><em>En raison des contextes de leur avènement, il existe deux grands modèles de justice constitutionnelle.</em></li>\n</ul>\n<h5>1. Le modèle diffus de justice constitutionnelle (américain : États-Unis, Canada, Brésil)</h5>\n<ul>\n<li>Diffus / décentralisé : Il n’est pas réservé à un tribunal spécialisé, il peut être exercé par n’importe quel juge. Reste soumis à la hiérarchie juridictionnelle, la CS reste le tribunal de dernier ressort, y compris sur les matières constitutionnelles.</li>\n<li>Contrôle par voie d’exception, et concret : N’importe quel juge donc n’importe quel litige ; le contrôle de constitutionnalité n’est pas l’action principale du litige</li>\n</ul>\n<p class=\"lesson-note\">Exemple <strong>→ Roe vs Wade (proc. de Dallas), 22 janv. 1973 : pénalisation de l’avortement vs droit à la vie privée. Par conséquent, le contrôle est concret</strong> : le juge va regarder la situation individuelle qui résulte de l’application de la loi et si cette situation présente une inconstitutionnalité ou non (Mrs Roe interdite d’avorter au Texas).</p>\n<ul>\n<li>Contrôle a posteriori : après l’entrée en vigueur de la loi. Elle a été votée, promulguée et s’applique. La constitutionnalité est contestable ad vitam aeternam.</li>\n<li>Effet inter partes / relatif : la loi existe toujours dans l’OJ et pourra s’appliquer dans d’autres hypothèses concrètes.</li>\n</ul>\n<h5>2. Le modèle concentré de justice constitutionnelle (Europe)</h5>\n<ul>\n<li><em>Davantage inspiré de la théorie de <strong>Kelsen</strong>, et en réponse à une organisation juridictionnelle différente que dans les systèmes de Common law (dualité juridictionnelle, exclusion du Royaume-Uni).</em></li>\n</ul>\n<ul>\n<li>Concentré : Un seul juge, spécialement dédié au contrôle de constitutionnalité des lois, en vertu de la Constitution elle-même : Tribunal, Cour ou Conseil constitutionnel.</li>\n<li>Contrôle a priori <strong>: Avant l’entrée en vigueur de la loi, entre son vote et sa promulgation (</strong>Exemple. Loi Duplomp) : logique préventive d’anticipation des inconstitutionnalités.</li>\n<li>Contrôle par voie d’action, et abstrait : non entrée en vigueur, la loi ne peut pas être contestée lors d’un procès, et le juge ne peut pas évaluer ses effets concrets ; il ne peut donc, en pratique, que confronter deux textes.</li>\n<li>Effet erga omnes / absolu : encore une fois logique : la loi n’a jamais existé puisqu’elle n’est pas entrée en vigueur. Le contrôle empêche sa promulgation. On purge effectivement l’ordre juridique (OJ) des défauts dans sa hiérarchie des normes (HN).</li>\n</ul>\n<h5>3. Les limites à la modélisation</h5>\n<ul>\n<li><em>Même si on raisonne à partir de ces deux modèles opposés, il faut en réalité relativiser leur opposition.</em></li>\n</ul>\n<ul>\n<li><em>Précaution géographique : en Europe, le modèle diffus peut s’appliquer (Royaume-Uni, Grèce)</em></li>\n<li><em>Développement en Europe de contrôle <strong>a posteriori</strong>, et concrétisés, déclenchés au cours d’une instance (France depuis 2010, Italie) ou même par voie d’action (Allemagne, Espagne).</em></li>\n<li><em>Symétriquement, portée absolue des décisions d’inconstitutionnalité : force du précédent, surtout lorsqu’il est établi par la ou une CS ; c’est d’ailleurs la raison pour laquelle on peut évoquer une politique jurisprudentielle des Cours.</em></li>\n</ul>\n<p><em>[Effet absolu non seulement sur l’application de la loi déclarée non conforme, mais aussi sur l’interprétation de la Constitution qui en résulte : si la criminalisation de l’avortement au Texas est inapplicable à partir de 1973, elle est également proscrite dans l’ensemble des États fédérés des États-Unis.</em></p>\n<p><em>Bien sûr, la force du précédent n’empêche pas, par parallélisme des formes, de le renverser et d’établir une jurisprudence distincte ou opposée : Dobbs v. Jackson Women's Health Organization, 24 juin 2022].</em></p>\n<ul>\n<li><em>La différence principale qui subsiste entre les deux modèles renvoie donc finalement à la seule question de savoir si l’organe qui opère le contrôle de constitutionnalité des lois est un tribunal spécialisé ou si c’est au contraire une mission qui est confiée à tous les juges dans l’État.</em></li>\n</ul>\n<h4>C. Les limites à la légitimité de la justice constitutionnelle</h4>\n<ul>\n<li><em>Aujourd’hui, rares sont les États dénués d’un juge constitutionnel, spécialisé ou non, devenu l’un des marqueurs de ce qu’on appelle l’État de droit. Pourtant, la réticence des premiers constituants défavorables à l’instauration de la jurie n’était pas dénuée de fondement, et emporte toujours des limites à la légitimité du contrôle judiciaire constitutionnalité : certains ont estimé que le rôle du gardien de la Constitution devait être confié au chef de l’État (<strong>C. Schmitt</strong>), d’autres qu’il relevait d’une assemblée parlementaire élue par les citoyens (<strong>J. Barthélemy</strong>).</em></li>\n<li><em>3 aspects critiquables : la composition (1), le pouvoir d’interprétation (2) et le pouvoir de dernier mot (3). .</em></li>\n</ul>\n<h5>1. La composition des cours constitutionnelles</h5>\n<ul>\n<li>Idée d’un tribunal = gage d’indépendance et d’impartialité (personnalités formées, devoir de réserve, neutralité à l’égard du pouvoir politique) – dès lors, il faut éviter le processus électoral, pourtant a priori plus démocratique.</li>\n</ul>\n<p><em>Sauf que :</em></p>\n<ul>\n<li>aux États-Unis : Cour suprême, membres nommés à vie par le Président, avec aval du Sénat, nomination comme enjeu (aléatoire) des mandats présidentiels (plus ou moins chanceux) – la durée illimitée du mandat et le nombre de neuf juges sont censés tempérer le pouvoir ainsi dévolu, mais ces garanties restent limitées (politiques institutionnelles).</li>\n<li>en France (et contrairement aux autres États européens, où sont exigées une expérience et une compétence éprouvées en droit, et en gages d’impartialité) : nominations politiques sans conditions (possible véto commission 2/3) + membres de droit (!).</li>\n<li>en Hongrie (et Pologne) : contournement des règles de nomination pour « noyée » la Cour de personnalités favorables à une politique illibérale et anti-européenne.</li>\n</ul>\n<p class=\"lesson-note\"><em>⇒ Juges constitutionnels non élus, potentiellement non compétents, non responsables de leurs décisions.</em></p>\n<h5>2. Le pouvoir d’interprétation des juges constitutionnels</h5>\n<ul>\n<li><em>Savoir si la Constitution est violée suppose de l’interpréter : texte lacunaire, laconique, abstrait et vieux. Établir un juge constitutionnel revient à lui confier la mission de déterminer en priorité la signification du texte constitutionnel, et la portée qu’il entend lui conférer à l’encontre du pouvoir législatif.</em></li>\n</ul>\n<p class=\"lesson-note\"><em>⇒ le juge peut annuler ou écarter la loi, ce qui lui donne un pouvoir considérable sur elle ; mais il peut le faire également en vertu de sa propre interprétation d’un texte toujours trop vague… Immense pouvoir politique ! Le juge peut neutraliser la volonté politique exprimée par les représentants de la Nation, et lui dicter la Constitution qu’il décide.</em></p>\n<ul>\n<li>Théorie réaliste de l’interprétation (<strong>M. Troper</strong>) : ce n’est pas l’auteur du texte mais l’interprète qui fait la loi (ou la Constitution) ; le juge serait donc co-législateur (négatif : il peut effacer ou remodeler une loi), mais également (co-)<strong>constituant</strong>. <strong>Par son interprétation</strong>, il exerce un véritable pouvoir politique.</li>\n</ul>\n<p class=\"lesson-note\"><em>Exemple → loi sur les retraites 2023, loi Duplomp 2025 : le Conseil constitutionnel est également le lieu où se poursuit la discussion politique après l’arène parlementaire ou le terrain de lutte sociale.</em></p>\n<ul>\n<li><em>Inversion du syllogisme judiciaire : syllogisme dont la prémisse majeure est décidée postérieurement pour justifier la conclusion privilégiée.</em></li>\n</ul>\n<ul>\n<li>Syllogisme judiciaire (la façon dont le juge est censé raisonner) : <ul>\n<li>La Constitution protège la liberté d’expression (prémisse majeure) ; *</li>\n<li><em>La loi porte une atteinte excessive à la liberté d’expression (prémisse mineure) ;</em></li>\n<li><em>Donc la loi est contraire à la Constitution (conclusion).</em></li>\n</ul>\n</li>\n<li>Syllogisme inversé (la façon dont le juge raisonne en réalité selon la théorie réaliste de l'interprétation) : <ul>\n<li>La loi doit être déclarée contraire à la Constitution (finalité) ; *</li>\n<li>La loi doit être regardée comme portant une atteinte excessive à la liberté d’expression ; *</li>\n<li><em>Donc la Constitution doit être interprétée comme interdisant une telle atteinte à la liberté d’expression.</em></li>\n</ul>\n</li>\n</ul>\n<p class=\"lesson-note\">Exemple <strong>→ JL Debré</strong> président du Conseil constitutionnel en 2012, à propos de la taxe à 75% sur les revenus supérieurs à 1 million d’euros : il expliquait que d’abord il avait considéré que le seuil était trop élevé, ensuite (seulement) qu’il avait cherché dans le bloc de constitutionnalité les arguments pour le déclarer inconstitutionnel.Il faisait ainsi l’aveu qu’il interprétait le texte de façon instrumentale, et donc que le juge ne se contente pas d’appliquer le droit constitutionnel, il participe à le créer.</p>\n<ul>\n<li><em>C’est ce qui explique que la justice constitutionnelle soit si régulièrement critiquée comme un obstacle à l’expression de la volonté démocratique des élus du peuple : non seulement peut-elle abroger une loi votée mais en plus peut-elle le faire sur le fondement de sa propre interprétation d’un texte imprécis. Elle dispose donc de fait d’un pouvoir politique considérable.</em></li>\n<li><em>Il est possible de tempérer ce pouvoir, à défaut considérable et obscur : le juge constitutionnel doit également veiller à être crédible, à faire preuve de cohérence, au risque de confesser son autorité indue, et de se décrédibiliser dans un système</em></li>\n</ul>\n<h5>3. Le pouvoir de dernier mot des juges constitutionnels</h5>\n<ul>\n<li><em>En faveur de la légitimité du juge constitutionnel, est avancé l’argument qu’il ne dispose pas du dernier mot, qui appartient bien au peuple ou à ses représentants : c’est la théorie de l’aiguilleur (expression de Louis Favoreu) et du <strong>lit de justice</strong> (Georges Vedel ; l’image emprunte à l’Ancien régime lorsque le Roi se présentait « en majesté », c’est-à-dire dans un lit, au Parlement de Paris, lorsque celui-ci refusait d’enregistrer ses édits).</em></li>\n<li>Aiguilleur : le juge ne bloque par le pouvoir politique, il lui indique la bonne voie.</li>\n<li>Lit de justice : le peuple ou ses représentants peuvent reprendre la main et « briser ses arrêts ».</li>\n</ul>\n<p class=\"lesson-note\">Exemple → loi instaurant la parité sur les listes électorales censurée par le Conseil constitutionnel en 1998, le principe a été constitutionnalisé en 1999 : art. 1er al. 2 (depuis 2008) : La loi favorise l'égal accès des femmes et des hommes aux mandats électoraux et fonctions électives, ainsi qu'aux responsabilités professionnelles et sociales).</p>\n<ul>\n<li><em>Ces théories, qui défendent la légitimité de la justice constitutionnelle, connaissent toutefois des limites, car les juges sont susceptibles de faire œuvre d’imagination dans la réception des révisions constitutionnelles.</em></li>\n</ul>\n<p class=\"lesson-note\">Exemple → États-Unis XIIIe amendement 1865 : abolition de l’esclavage / XIVe 1866 : égalité entre les citoyens / XVe 1870 : droit de vote pour tous.</p>\n<p><em>Plessy vs. Ferguson, 18 mai 1896 : « séparés mais égaux », théorisation de la ségrégation sous couvert d’une égalité (factice) de droits // renversement jurisprudentiel et fin de la lecture ségrégationniste de la Constitution : Brown vs. Board of Education of Topeka, 17 mai 1954.</em></p>\n<ul>\n<li><em>Par ailleurs, même pragmatiquement, en France une décision du juge suppose un consensus entre 5 personnes (majorité des membres du Conseil constitutionnel), alors que la révision constitutionnelle suppose l’aval soit de plusieurs millions de citoyens, soit 555 parlementaires (et un temps beaucoup plus long). Le lit de justice reste donc une théorie dont on trouve quelques exemples en pratique, plutôt qu’une véritable limite au pouvoir exercé par le juge constitutionnel.</em></li>\n</ul>\n<p class=\"lesson-note\">Exemple <strong>→ Le Pen et Retailleau</strong> : référendum immigration impossible, ils en appellent donc à une révision.</p>\n<ul>\n<li><em>Il n’en reste pas moins que le juge constitutionnel, encore une fois, <strong>présente des garanties par sa fonction de contrôle de la loi, loi de la majorité politique contre laquelle il oppose les droits des minorités.</strong> A ce titre, il est un acteur de la démocratie et surtout de ce qu’on appelle l’État de droit.</em></li>\n<li><em>En tout état de cause, la garantie de la Constitution par les juges représente une part importante du droit constitutionnel. On a même consacré à la question une matière qui s’appelle le <strong>contentieux constitutionnel</strong> (français, étranger ou comparé).</em></li>\n</ul>\n"}, {"title": "Section 3 – Enjeux du droit constitutionnel", "text": "## §1 – Un droit public\n\n- Deux grandes branches public / privé (même au sein des historiens) : critère de la verticalité de la relation entretenue par la puissance publique, exorbitance du droit commun.\n- Droit constitutionnel comme **droit du pouvoir politique**, logique ou notions comparables à d’autres branches du droit public (administratif, collectivités territoriales, contentieux, européen voire international, droits et libertés…).\n- Importance d’acquérir un contenu mais aussi **une méthode**, en droit privé ET en droit public (TD) : la méthode diffère (la nôtre est mieux), parce que non la logique mais les mécanismes sont adaptés. Il y a bien sûr beaucoup d’accointances mais nous (et je dis « nous », c’est significatif) cultivons une distinction, au sein des parcours de formation universitaire, au sein de la formation des universitaires et au sein des instances notamment juridictionnelles.\n- Si vous rêvez tous de devenir notaire ou juge pour enfants (sauf si c’est déjà passé de mode), vous y êtes par nature réfractaires alors que, statistiquement, vous avez une chance solide de finir par faire du droit public…\n\n## §2 – Un droit de la citoyenneté\n\n- Parmi le droit public, c’est très certainement le droit qui n’a pas besoin d’être technique pour être utile, intéressant (voire passionnant) ; particulièrement adapté à de jeunes citoyens qui sont à l’aube de leur intégration dans la société politique.\n- C’est le droit constitutionnel, non seulement le droit positif actuel, mais également sa théorie, son histoire et sa philosophie, qui dessinent les contours de votre citoyenneté : pour qui vote-on ? Comment ? Pourquoi ? Quels sont nos droits ? Comment les faire valoir s’ils sont enfreints ? Comment les changer, les abolir ou les étendre ?\n- En fait, c’est le droit constitutionnel qui **définit la collectivité politique** de laquelle nous sommes membres (sauf étrangers, auquel cas vous apprendrez spécifiquement comment fonctionne le droit français, mais par là comment fonctionne le droit constitutionnel partout = « théorie générale »).\n- Au terme de cette très longue introduction, si vous êtes censés savoir ce qu’est le droit constitutionnel, il est temps de découvrir à quoi il sert : il dessine l’unité politique d’une collectivité de citoyens à travers ce qu’on appelle l’État (Partie I) ; et il en détermine les modalités de fonctionnement de cette collectivité en visant – à l’heure contemporaine du moins – l’établissement de ce qu’on appelle (abusivement) la démocratie (Partie II).", "html": "<h3>§1 – Un droit public</h3>\n<ul>\n<li>Deux grandes branches public / privé (même au sein des historiens) : critère de la verticalité de la relation entretenue par la puissance publique, exorbitance du droit commun.</li>\n<li>Droit constitutionnel comme <strong>droit du pouvoir politique</strong>, logique ou notions comparables à d’autres branches du droit public (administratif, collectivités territoriales, contentieux, européen voire international, droits et libertés…).</li>\n<li>Importance d’acquérir un contenu mais aussi <strong>une méthode</strong>, en droit privé ET en droit public (TD) : la méthode diffère (la nôtre est mieux), parce que non la logique mais les mécanismes sont adaptés. Il y a bien sûr beaucoup d’accointances mais nous (et je dis « nous », c’est significatif) cultivons une distinction, au sein des parcours de formation universitaire, au sein de la formation des universitaires et au sein des instances notamment juridictionnelles.</li>\n<li>Si vous rêvez tous de devenir notaire ou juge pour enfants (sauf si c’est déjà passé de mode), vous y êtes par nature réfractaires alors que, statistiquement, vous avez une chance solide de finir par faire du droit public…</li>\n</ul>\n<h3>§2 – Un droit de la citoyenneté</h3>\n<ul>\n<li>Parmi le droit public, c’est très certainement le droit qui n’a pas besoin d’être technique pour être utile, intéressant (voire passionnant) ; particulièrement adapté à de jeunes citoyens qui sont à l’aube de leur intégration dans la société politique.</li>\n<li>C’est le droit constitutionnel, non seulement le droit positif actuel, mais également sa théorie, son histoire et sa philosophie, qui dessinent les contours de votre citoyenneté : pour qui vote-on ? Comment ? Pourquoi ? Quels sont nos droits ? Comment les faire valoir s’ils sont enfreints ? Comment les changer, les abolir ou les étendre ?</li>\n<li>En fait, c’est le droit constitutionnel qui <strong>définit la collectivité politique</strong> de laquelle nous sommes membres (sauf étrangers, auquel cas vous apprendrez spécifiquement comment fonctionne le droit français, mais par là comment fonctionne le droit constitutionnel partout = « théorie générale »).</li>\n<li>Au terme de cette très longue introduction, si vous êtes censés savoir ce qu’est le droit constitutionnel, il est temps de découvrir à quoi il sert : il dessine l’unité politique d’une collectivité de citoyens à travers ce qu’on appelle l’État (Partie I) ; et il en détermine les modalités de fonctionnement de cette collectivité en visant – à l’heure contemporaine du moins – l’établissement de ce qu’on appelle (abusivement) la démocratie (Partie II).</li>\n</ul>\n"}, {"title": "Préambule partie 1", "text": "- *Le premier objet du droit constitutionnel est d’établir les contours de la collectivité politique, de constituer ce qui se donne à voir comme une unité sur le plan international, depuis le point de vue externe. Ce qu’on appelle donc des États. Attention toutefois, cela ne signifie pas que l’État a besoin d’une Constitution pour exister, non plus qu’une Constitution n’existe que pour définir un État : comme nous allons le voir, l’État est **antérieur** à l’invention du droit constitutionnel, et il peut exister une Constitution sans qu’elle s’applique à un État au sens du droit international (Constitution de Californie, ou projet constitutionnel européen de 2004).*\n- *En tout état de cause, l’étude de l’État comme structure politique relève à la fois du droit international et du droit constitutionnel ; c’est ce dernier qui définit notamment les éléments caractéristiques internes par lesquels la puissance publique se donne à voir comme un État, comme une collectivité unifiée, sur la scène internationale.*\n\n* *C’est en effet la Constitution qui participe le plus souvent à déterminer les composantes de l’État (Chap. 1), la forme de l’État (Chap. 2) ainsi que les déclinaisons de l’État (Chap. 3).*", "html": "<ul>\n<li><em>Le premier objet du droit constitutionnel est d’établir les contours de la collectivité politique, de constituer ce qui se donne à voir comme une unité sur le plan international, depuis le point de vue externe. Ce qu’on appelle donc des États. Attention toutefois, cela ne signifie pas que l’État a besoin d’une Constitution pour exister, non plus qu’une Constitution n’existe que pour définir un État : comme nous allons le voir, l’État est <strong>antérieur</strong> à l’invention du droit constitutionnel, et il peut exister une Constitution sans qu’elle s’applique à un État au sens du droit international (Constitution de Californie, ou projet constitutionnel européen de 2004).</em></li>\n<li><em>En tout état de cause, l’étude de l’État comme structure politique relève à la fois du droit international et du droit constitutionnel ; c’est ce dernier qui définit notamment les éléments caractéristiques internes par lesquels la puissance publique se donne à voir comme un État, comme une collectivité unifiée, sur la scène internationale.</em></li>\n</ul>\n<ul>\n<li><em>C’est en effet la Constitution qui participe le plus souvent à déterminer les composantes de l’État (Chap. 1), la forme de l’État (Chap. 2) ainsi que les déclinaisons de l’État (Chap. 3).</em></li>\n</ul>\n", "nested": true, "partStart": "Partie I – L’État : la détermination juridique de la collectivité politique"}, {"title": "Chapitre 1 – La définition de l’État", "text": "\n\n**Chapitre 1 – La définition de l’État **\n\n- ***Le mot État prend toujours une majuscule**, pour distinguer la forme politique ainsi désignée (synonyme approximatif de pays, plus vague et moins juridique) du mot commun désignant une situation ou une condition de fait (état de fait, état des lieux, remise en l’état…). C’est d’ailleurs comme cela qu’il a été inventé : par l’attribution d’une majuscule de nature à souligner un état de fait politique.*\n- *Car l’État comme je vais vous le définir n’a pas toujours existé, il correspond à la **forme moderne de la politique** (**S. Goyard-Fabre**), par référence à la **modernité philosophique et juridique **: tournant renaissant et humaniste des XVe et XVIe siècles, qui place l’homme au cœur de toute chose (subjectivisme), qui fait du droit l’expression d’une volonté (et non de la nature) et qui valorise la **Raison** (**René Descartes **1596-1650).*\n- *L’État aujourd’hui correspond encore fondamentalement au modèle politique émergent à cette période, spécifiquement en France (mais aussi en Angleterre ou en Espagne). Et le droit constitutionnel s’en est saisi, au moment de son avènement, comme
