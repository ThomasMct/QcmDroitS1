 dans les 15 jours à la marge de l’acte de naissance. Cette procédure concerne le changement de sexe et le changement de prénom.*\n\n* ***Article 61-7 alinéa 2 du Code civil&#x20;**&#x70;our la modification du prénom : “les modifications de prénoms corrélatives à une décision de modification de sexe ne sont portées en marge des actes de l'état civil des conjoints et enfants qu'avec le consentement des intéressés ou de leurs représentants légaux.”*\n* *La modification du sexe est valable dans les autres États.*\n\n\n\n**Section 2 : Les effets juridiques du changement de sexe à l’état civi&#x6C;*&#xA0;***\n\n**§1 : Les conséquences sur le passé&#xA0;**\n\n**A) Le cas du mariage conclu avant le changement de sexe&#xA0;**\n\n- *Avant 2013, le mariage ne pouvait être célébré qu’entre 2 personnes de sexes différents sinon il était annulé.&#xA0;*\n- *L’annulation a un effet rétroactif, c’est comme s’il n’avait jamais eu lieu.&#xA0;*\n\n***Exemple →&#x20;**&#x64;urant les années 2000, un homme devient femme après s’être marié avec une femme, le mariage ne pouvait pas être maintenu car il manque la condition d’hétérosexualité. Que faire ? Annuler le mariage ou divorcer ?&#xA0;*\n\n- *Depuis la **loi du 17 mai 2013 (loi Taubira),** l’hétérosexualité n’est plus une condition du mariage (**article 143 du Code civil**). Le divorce peut aussi être prononcé en cas de soucis au sein du couple, mais c’est aux époux d’en décider, il n’y a plus d’incidence en cas de changement de sexe.&#xA0;*\n\n\n\n**B) Le cas des enfants nés avant le changement de sexe&#xA0;**\n\n- *Pour les enfants nés avant le changement de sexe, le législateur a opté pour le maintien du lien de filiation.&#xA0;*\n- ***Article 61-8 du Code civil&#xA0;**: “la modification de la mention du sexe dans les actes de l’état civil est sans effet sur les obligations contractées à l’égard de tiers ni sur les filiations établies avant cette modification”*\n- *La personne transgenre subit une sorte de **dédoublement sexuel&#xA0;**: dans sa relation avec l’enfant, la personne gardera son sexe d’origine ; alors que durant ces relations avec les tiers, elle se présentera comme le sexe opposé.&#xA0;*\n\n***Exemple&#x20;**→ le papa reste le papa homme de ces enfants même s’il devient légalement une femme à l’état civil, aux yeux de la société il est devenu une femme mais aux yeux de son enfant il restera le père.*\n\n\n\n\n\n\n\n**§2 : Les conséquences sur le futur&#xA0;**\n\n**A) Le cas du mariage conclu après le changement de sexe&#xA0;**\n\n- *Après **la loi française de 2013**, la personne transexuelle pouvait se marier avec une personne de sexe juridique différent de lui, mais qui avait un sexe génétique physique d’origine identique.&#xA0;*\n- *La CJUE et le CEDH se sont réunis à propos de la législation britannique. La Grande Bretagne empêchait à l’époque les personnes transgenres de se marier, **elle à été condamné dans un arrêt Goodwin le 11 juillet 2002.&#xA0;***\n- *La discordance des facteurs biologiques chez une personne opéré médicalement n’est plus un motif suffisant pour refuser le changement juridique de sexe dès lors qu’un tel refus empêchait ce dernier de se marier avec une personne de son choix.&#xA0;*\n\n* *Selon la CJUE , la législation britannique était discriminatoire. Donc la Grande Bretagne a mis en place que la personne transgenre, pour changer son état civil, devait voir son mariage antérieur être dissous.*\n* *En 2005, la CEDH a estimé que la nouvelle législation britannique ne condamnait pas **l’article 12 de la Convention des Droit de l’Homme.&#xA0;***\n\n\n\n**B) Le cas des enfants nés après le changement de sexe**\n\n- *Il y a deux situations à distinguer :&#xA0;*\n  - ***Si la personne transgenre a subi une opération de conversion sexuelle qui la rend stérile** : peut-elle avoir des enfants ? Oui, la personne peut recourir à des techniques de PMA.*\n\n* ***Cas dans un couple hétérosexuel** : un homme biologique a subi une opération de conversion sexuelle pour devenir une femme mais cette opération l’a rendu stérile et il n’a donc pas de faculté reproductrice. Cet homme est avec un homme biologique et de genre, ce qui veut dire qu'ils ne peuvent pas recourir à cette situation car les couples d’hommes ne peuvent pas porter la vie. Le recours à la GPA peut être envisagé, mais ce recours est interdit en France.&#xA0;*\n* ***Autre cas dans un couple hétérosexuel** : une femme biologique devient un homme de genre et ne peut pas procréer mais sa compagne femme biologique à la possibilité de recourir à la PMA. Les femmes, physiquement et légalement, peuvent y recourir car on estime que, biologiquement, il y a une possibilité de procréer avec le sperme d’un tiers donneur.*\n\n\n\n- ***Article 342-13 du Code civil** : “Celui qui, après avoir consenti à l'assistance médicale à la procréation, ne reconnaît pas l'enfant qui en est issu engage sa responsabilité envers la mère et envers l'enfant.*\n\n*En outre, sa paternité est judiciairement déclarée.”*\n\n- ***Cas dans un couple homosexuel** : la PMA est ouverte aux couples de femmes (depuis 2021) dont l’une était autrefois un homme. Il est arrivé que des hommes biologiques aient pu faire recueillir leur spermatozoïde avant de devenir femme, il est donc possible d’utiliser ces spermatozoïdes pour inséminer l’ovocyte de la compagne de cette homme biologique devenu femme juridique.*\n\n\n\n- ***Si la personne trasngenre subit simplement des traitements hormonaux réversible** :&#xA0;*\n  - *L’enfant est conçu naturellement par 2 hommes ou 2 femmes juridiquement&#xA0;*\n\n***Exemple&#x20;**→ une femme devient un homme légalement sans perdre ses facultés procréatives féminine OU un homme biologique devenu une femme juridique peut aussi procréer si elle n’a pas perdu ces capacités procréatives.&#xA0;*\n\n*Pour la filiation, est-elle paternelle ou maternelle ?&#xA0;*\n\n- *En droit français, la règle est que la personne qui accouche est la mère de l’enfant, l’homme marié à la mère de l’enfant est présumé le père de l’enfant. Pour les couples non mariés, le père doit faire une reconnaissance de paternité. La filiation de l’enfant est fixée en fonction de l’origine du sexe biologique du parent.&#xA0;*\n- *L’homme devenu femme est père sur l’acte de naissance de l’enfant mais sur son état civil propre à lui c’est une femme, reconnu comme femme dans la société.&#xA0;*\n- *La Cour de cassation refuse une filiation neutre c’est-à-dire père ou mère de l’enfant et estime qu’on ne peut pas créer de nouvelle catégorie.*\n\n\n\n**CHAPITRE 2 : L’intersexualisme&#xA0;**\n\n- Cas d’une personne née avec les caractéristiques des deux sexes (binarité des sexes) OU variation du développement génital.\n\n\n\n**Section 1 : La levée par opération médicale de l’incertitude sexuell&#x65;*&#xA0;***\n\n- ***Article 16-3 du Code civil** : “Il ne peut être porté atteinte à l'intégrité du corps humain qu'en cas de nécessité médicale pour la personne ou à titre exceptionnel dans l'intérêt thérapeutique d'autrui.*\n\n*Le consentement de l'intéressé doit être recueilli préalablement hors le cas où son état rend nécessaire une intervention thérapeutique à laquelle il n'est pas à même de consentir.” → un acte médical ne peut être effectué que s’il est nécessaire médicalement et il faut également le consentement de la personne.*\n\n- *Les médecins vont alors prodiguer une action de réassignation sexuelle d’un des 2 sexes, soit féminisation soit masculinisation / virilisation. Ce sont les parents qui font le choix avec les équipes médicales ; ces actes sont encadrés et doivent être effectués en réponse à un motif médical très sérieux. Le médecin doit peser le pour et le contre vis-à-vis des coûts possibles.&#xA0;*\n- *Il faut que le patient soit orienté vers des centres spécialisés dans ces maladies rares, ces centres vont devoir proposer de manière collégiale un diagnostic. Une intervention peut arriver aussi à l'âge adulte (dans le cas de recherche sur la cause de stérilité par exemple) et requiert le consentement de la personne avant intervention.&#xA0;*\n- *Avec **la loi de 2010**, les législateurs prévoient que davantage d’information soit donnés aux parents*\n\n\n\n\n\n**Section 2 : L’inscription du sexe sur l’état civil**\n\n- *En droit français, la déclaration de naissance impose en principe l'indication immédiate du sexe de l'enfant dans un délai de cinq jours à compter de l'accouchement, conformément &#xE0;**&#x20;l'article 55 du Code civil.** Cependant, en présence d'une situation d'intersexualité entraînant une ambiguïté sexuelle à la naissance, la **circulaire ministérielle de 2011** permettait déjà d'ajourner provisoirement cette mention avec l'accord du Procureur de la République. Ce dispositif a été consacré et encadré par la **loi bioéthique du 2 août 2021**, qui a inséré un alinéa à **l'article 57 du Code civil** : “En cas d'impossibilité médicalement constatée de déterminer le sexe de l'enfant au jour de l'établissement de l'acte, le procureur de la République peut autoriser l'officier de l'état civil à ne pas faire figurer immédiatement le sexe sur l'acte de naissance. L'inscription du sexe médicalement constaté intervient à la demande des représentants légaux de l'enfant ou du procureur de la République dans un délai qui ne peut être supérieur à trois mois à compter du jour de la déclaration de naissance. Le procureur de la République ordonne de porter la mention du sexe en marge de l'acte de naissance et, à la demande des représentants légaux, de rectifier l'un des ou les prénoms de l'enfant.”*\n- *Lorsque la mention initiale s'avère erronée ou inadaptée, la jurisprudence a progressivement admis la possibilité d'une rectification.&#xA0;*\n- *Ainsi, par **un arrêt marquant du 22 juin 2000** concernant un enfant né en 1995 ayant subi une intervention de féminisation après l'échec de stimulations hormonales, la Cour d'appel de Versailles a autorisé la modification de l'état civil sans y voir une violation du principe d'indisponibilité de l'état des personnes.&#xA0;*\n- ***Cette rectification repose traditionnellement sur trois conditions cumulatives :&#xA0;***\n\n* *elle doit constituer l'aboutissement juridique d'une situation médicalement constatée et conseillée,&#xA0;*\n* *résulter d'une impossibilité médicale de mettre fin à l'ambiguïté dans le sexe déclaré,&#xA0;*\n* *être suivie d'une éducation de l'enfant en conformité avec son nouveau sexe.&#xA0;*\n\n\n\n- *Sur le plan procédural, cette correction d'une erreur initiale, qui revêt un caractère rétroactif,  s'inscrit dans le cadre fixé par **l'article 99 du Code civil**, relevant de la compétence du président du tribunal judiciaire ou du Procureur de la République pour les erreurs purement matérielles, permettant également l'ajustement des prénoms.&#xA0;*\n- ***Article 99 du Code civil*** : “*La rectification des actes de l'état civil est ordonnée par le président du tribunal. La rectification de l'indication du sexe et, le cas échéant, des prénoms est ordonnée à la demande de toute personne présentant une variation du développement génital ou, si elle est mineure, à la demande de ses représentants légaux, s'il est médicalement constaté que son sexe ne correspond pas à celui figurant sur son acte de naissance. L'annulation des actes de l'état civil est ordonnée par le tribunal. Toutefois, le procureur de la République territorialement compétent peut faire procéder à l'annulation de l'acte lorsque celui-ci est irrégulièrement dressé.”&#xA0;*\n\n\n\n- *Enfin, si ce régime traite les ambiguïtés biologiques à la naissance, le droit français demeure strictement fondé sur la binarité des sexes et refuse **l'inscription d'un « sexe neutre » ou le statut de non-binarité à l'état civil** ; la jurisprudence considère que la dualité binaire des sexes poursuit un but légitime et s'avère nécessaire, dans la mesure où l'introduction d'un sexe neutre engendrerait des répercussions profondes sur l'ensemble du système juridique français et nécessiterait de majeures modifications législatives.*\n", "html": "<h2>TITRE 2 : Le sexe, élément d’identification des personnes physiques</h2>\n<p>(SÉANCE de TD numéro 5) </p>\n<ul>\n<li>Le système juridique français reconnaît la différence des sexes, mais aussi leur égalité. La personne morale n’a pas de sexe et le sexe permet d’identifier l’individu dans la société. </li>\n<li>L’article 34 de la Constitution fixe les règles compétentes du législateur pour l’attribution et les changements par rapport aux éléments d’identifications des personnes physiques.</li>\n<li>Article 57 du Code civil : “L'acte de naissance énoncera le jour, l'heure et le lieu de la naissance, le sexe de l'enfant, les prénoms qui lui seront donnés, le nom de famille, suivi le cas échéant de la mention de la déclaration conjointe de ses parents quant au choix effectué, ainsi que les prénoms, noms, âges, professions et domiciles des père et mère et, s'il y a lieu, ceux du déclarant. Si les père et mère de l'enfant ou l'un d'eux ne sont pas désignés à l'officier de l'état civil, il ne sera fait sur les registres aucune mention à ce sujet.”</li>\n</ul>\n<p><em>Le corps médical observe les organes génitaux pour identifier le sexe de l’enfant à la naissance.</em></p>\n<ul>\n<li>La doctrine a tendance à expliquer qu’il existe deux principales composantes du sexe : </li>\n</ul>\n<ul>\n<li>sexe physique (anatomique, gonadique et chromosomique) → évaluation médicale.</li>\n<li>sexe psychique (psychologique et psychosocial) → le sentiment d’appartenir au sexe masculin ou féminin. Le sexe psychosocial est le comportement que la personne adopte dans la société par rapport à son sexe. On peut associé le genre au sexe psychique. </li>\n</ul>\n<ul>\n<li><em>Dans la majorité des cas, il y a une concordance entre le sexe physique et le sexe psychique, c’est-à-dire que le sexe inscrit sur l’état civil de la personne correspond à son identité de genre.</em></li>\n</ul>\n<h2>CHAPITRE 1 : Le transsexualisme (ou transgendérisme)</h2>\n<ul>\n<li><p>Discordance entre les composantes physiques et psychiques du sexe </p>\n</li>\n<li><p><em>C’est un phénomène qui a été identifié en 1953 par 2 personnes ; un professeur de science _Küss _qui avait fait une déclaration en 1982 devant l'académie nationale de médecine</em> → “<em>c’est le sentiment profond et inébranlable d’appartenir au sexe opposé à celui qui est génétiquement, anatomiquement et juridiquement le sien, accompagné du besoin intense et constant de changer de sexe et d’état civil</em>”.</p>\n</li>\n<li><p><em>La personne transgenre est convaincue depuis longtemps qu’elle appartient au sexe opposé. Il est arrivé que certaines personnes transgenres demandent aux médecins de modifier leur sexe anatomique pour la faire correspondre au sexe psychique.</em></p>\n</li>\n<li><p><em>L’objectif est de faire une ablation des organes génitaux de la personne et le corps médical va créer des organes de l’autre sexe. Cette opération est une opération de conversion sexuelle et est remboursée par la sécurité sociale.</em></p>\n</li>\n<li><p><em>Sur le plan juridique, la personne transgenre peut obtenir la modification de son mention de sexe à l’état civil, qu’elle ait ou non subi une opération chirurgicale ou des traitements médicaux.</em></p>\n</li>\n</ul>\n<h3>Section 1 : L’encadrement juridique du changement de sexe à l’état civil</h3>\n<h4>§1 : La position de la jurisprudence avant la loi du 18 novembre 2016</h4>\n<h5>A) Le refus initial du changement de sexe avant 1992</h5>\n<ul>\n<li><em>Avant 1992 et pendant longtemps, la Cour de cassation avait ignoré pendant longtemps la dimension psychique du sexe et s’est opposée fermement à la modification. Le motif était que la Cour estimait que le principe d’indisponibilité de l’état des personnes s’opposait à la modification du sexe à l’état civil, elle a donc refusé.</em></li>\n<li>La jurisprudence a également estimée que la transformation physique de la personne transgenre résultait d’un choix délibéré. </li>\n<li><em>Le 21 mai 1990, la Cour de cassation maintient son refus mais a changé son motif, elle a admis que la personne transgenre pouvait changer de prénom mais pas de sexe à l’état civil. De plus, la Cour dit « mais attendue que le transsexualisme, même lorsqu’il est médicalement reconnu, ne peut s’analyser comme un véritable changement de sexe ».</em></li>\n</ul>\n<h5>B) L’admission du changement de sexe depuis 1992</h5>\n<ul>\n<li><em>Il y a une impulsion donnée par la Cour Européenne des Droits de l’Homme (CEDH) rendu le 25 mars 1992 ; dans cette affaire, la CEDH se soucie peu des droits de l'Homme, elle va en revanche se soucier de l'individu.</em></li>\n<li><em>La Cour de cassation de la France va être condamnée par le droit européen.</em></li>\n<li>La France va devoir revoir ses lois et il y a 2 solutions : </li>\n</ul>\n<ul>\n<li>Adopter la voie minimale : ne modifie pas l’état civil de ces personnes mais décide d’exclure la mention du sexe dans les papiers d’identité et on autorise le changement de prénom.</li>\n<li>Adopter la voie maximale : autoriser la modification de la mention du sexe à l’état civil.</li>\n</ul>\n<p><em>⇒ La Cour de cassation rend sa decision le 11 décembre 1992, elle a décidé d’adopter la voie maximale sous conditions ; elle admet la modification du sexe à l’état civil.</em></p>\n<ul>\n<li>Dans l’arrêt de 1992, elle a posé 4 conditions : </li>\n</ul>\n<ul>\n<li>Le syndrome du transsexualisme </li>\n<li>Un traitement médico-chirurgical à but thérapeutique </li>\n<li>La perte des caractères de son sexe d’origine </li>\n<li><em>Une apparence physique et un comportement social correspondant à l’autre sexe</em></li>\n</ul>\n<ul>\n<li><em>En 2013, il faut que la réalité du syndrome soit prouvée scientifiquement, le changement de sexe est irréversible.</em></li>\n<li>Depuis 1992, de nombreuses personnes ont fait des changements de sexe. </li>\n<li><em>Le souci est qu’il a été constaté que dans certaines opérations, il y avait des complications post-opératoires pour les patients. C’est une opération à risque, donc beaucoup de personnes étaient réticentes.</em></li>\n</ul>\n<ul>\n<li><em>Le 7 juin 2012, la Cour de cassation admet le changement de sexe à l’état civil mais il faut que la personne transgenre établisse : « au regard de ce qui est communément admis dans la communauté scientifique la réalité du syndrome transsexuel dont elle est atteinte ainsi que le caractère irréversible de la transformation de son apparence ».</em></li>\n</ul>\n<ul>\n<li><em>La CEDH, le 6 avril 2017 a condamné la France car elle obligeait les personnes transgenres à faire une opération stérilisante pour obtenir le changement à l’état civil. Elle estime que cela constitue une violation de leur droit au respect de la vie privée et remet en cause la condition d’irréversibilité.</em></li>\n</ul>\n<ul>\n<li>En 2021, la CEDH a affirmer que l’opération de conversion sexuelle ne peut plus être une condition préalable à la modification du sexe à l’état civil. </li>\n</ul>\n<h4>§2 : La loi du 18 novembre 2016 assouplissant les conditions du changement de sexe</h4>\n<ul>\n<li>Le législateur est intervenu pour supprimer les conditions médicales qui avaient été posées par la Cour de cassation. Depuis cette loi, la modification de sexe à l’état civil n’est plus subordonnée à des cas médicaux. </li>\n<li>Article 61-5 du Code civil : “Toute personne majeure ou mineure émancipée qui démontre par une réunion suffisante de faits que la mention relative à son sexe dans les actes de l'état civil ne correspond pas à celui dans lequel elle se présente et dans lequel elle est connue peut en obtenir la modification.</li>\n<li><em>Les principaux de ces faits, dont la preuve peut être rapportée par tous moyens, peuvent être :</em></li>\n</ul>\n<p><em>1° Qu'elle se présente publiquement comme appartenant au sexe revendiqué ;</em></p>\n<p><em>2° Qu'elle est connue sous le sexe revendiqué de son entourage familial, amical ou professionnel ;</em></p>\n<p>3° Qu'elle a obtenu le changement de son prénom afin qu'il corresponde au sexe revendiqué.” → Il existe toujours des conditions mais elles ont été assouplies, les preuves peuvent être apportées par différents moyens (autre que médicaux).</p>\n<ul>\n<li><em><strong>Liste de faits indicatifs mais pas exhaustifs dans l’article :</strong></em></li>\n</ul>\n<ul>\n<li>Qu'elle se présente publiquement comme appartenant au sexe revendiqué </li>\n<li>Qu'elle est connue sous le sexe revendiqué de son entourage familial, amical ou professionnel </li>\n<li><em>Qu'elle a obtenu le changement de son prénom afin qu'il corresponde au sexe revendiqué</em></li>\n</ul>\n<ul>\n<li>Article 61-6 du Code civil : “La demande est présentée devant le tribunal judiciaire. Le demandeur fait état de son consentement libre et éclairé à la modification de la mention relative à son sexe dans les actes de l'état civil et produit tous éléments de preuve au soutien de sa demande.Le fait de ne pas avoir subi des traitements  médicaux, une opération chirurgicale ou une stérilisation ne peut motiver le refus de faire droit à la demande.”  </li>\n<li><em>La modification ne joue que pour l’avenir et doit être faite dans les 15 jours à la marge de l’acte de naissance. Cette procédure concerne le changement de sexe et le changement de prénom.</em></li>\n</ul>\n<ul>\n<li>Article 61-7 alinéa 2 du Code civil pour la modification du prénom : “les modifications de prénoms corrélatives à une décision de modification de sexe ne sont portées en marge des actes de l'état civil des conjoints et enfants qu'avec le consentement des intéressés ou de leurs représentants légaux.”</li>\n<li><em>La modification du sexe est valable dans les autres États.</em></li>\n</ul>\n<h3>Section 2 : Les effets juridiques du changement de sexe à l’état civil</h3>\n<h4>§1 : Les conséquences sur le passé</h4>\n<h5>A) Le cas du mariage conclu avant le changement de sexe</h5>\n<ul>\n<li>Avant 2013, le mariage ne pouvait être célébré qu’entre 2 personnes de sexes différents sinon il était annulé. </li>\n<li>L’annulation a un effet rétroactif, c’est comme s’il n’avait jamais eu lieu. </li>\n</ul>\n<p class=\"lesson-note\">Exemple → durant les années 2000, un homme devient femme après s’être marié avec une femme, le mariage ne pouvait pas être maintenu car il manque la condition d’hétérosexualité. Que faire ? Annuler le mariage ou divorcer ? </p>\n<ul>\n<li>Depuis la <strong>loi du 17 mai 2013 (loi Taubira),</strong> l’hétérosexualité n’est plus une condition du mariage (<strong>article 143 du Code civil</strong>). Le divorce peut aussi être prononcé en cas de soucis au sein du couple, mais c’est aux époux d’en décider, il n’y a plus d’incidence en cas de changement de sexe. </li>\n</ul>\n<h5>B) Le cas des enfants nés avant le changement de sexe</h5>\n<ul>\n<li>Pour les enfants nés avant le changement de sexe, le législateur a opté pour le maintien du lien de filiation. </li>\n<li>Article 61-8 du Code civil : “la modification de la mention du sexe dans les actes de l’état civil est sans effet sur les obligations contractées à l’égard de tiers ni sur les filiations établies avant cette modification”</li>\n<li>La personne transgenre subit une sorte de dédoublement sexuel : dans sa relation avec l’enfant, la personne gardera son sexe d’origine ; alors que durant ces relations avec les tiers, elle se présentera comme le sexe opposé. </li>\n</ul>\n<p class=\"lesson-note\">Exemple → le papa reste le papa homme de ces enfants même s’il devient légalement une femme à l’état civil, aux yeux de la société il est devenu une femme mais aux yeux de son enfant il restera le père.</p>\n<h4>§2 : Les conséquences sur le futur</h4>\n<h5>A) Le cas du mariage conclu après le changement de sexe</h5>\n<ul>\n<li>Après <strong>la loi française de 2013</strong>, la personne transexuelle pouvait se marier avec une personne de sexe juridique différent de lui, mais qui avait un sexe génétique physique d’origine identique. </li>\n<li>La CJUE et le CEDH se sont réunis à propos de la législation britannique. La Grande Bretagne empêchait à l’époque les personnes transgenres de se marier, elle à été condamné dans un arrêt Goodwin le 11 juillet 2002. </li>\n<li>La discordance des facteurs biologiques chez une personne opéré médicalement n’est plus un motif suffisant pour refuser le changement juridique de sexe dès lors qu’un tel refus empêchait ce dernier de se marier avec une personne de son choix. </li>\n</ul>\n<ul>\n<li><em>Selon la CJUE , la législation britannique était discriminatoire. Donc la Grande Bretagne a mis en place que la personne transgenre, pour changer son état civil, devait voir son mariage antérieur être dissous.</em></li>\n<li>En 2005, la CEDH a estimé que la nouvelle législation britannique ne condamnait pas l’article 12 de la Convention des Droit de l’Homme. </li>\n</ul>\n<h5>B) Le cas des enfants nés après le changement de sexe</h5>\n<ul>\n<li>Il y a deux situations à distinguer : <ul>\n<li>Si la personne transgenre a subi une opération de conversion sexuelle qui la rend stérile : peut-elle avoir des enfants ? Oui, la personne peut recourir à des techniques de PMA.</li>\n</ul>\n</li>\n</ul>\n<ul>\n<li>Cas dans un couple hétérosexuel : un homme biologique a subi une opération de conversion sexuelle pour devenir une femme mais cette opération l’a rendu stérile et il n’a donc pas de faculté reproductrice. Cet homme est avec un homme biologique et de genre, ce qui veut dire qu'ils ne peuvent pas recourir à cette situation car les couples d’hommes ne peuvent pas porter la vie. Le recours à la GPA peut être envisagé, mais ce recours est interdit en France. </li>\n<li>Autre cas dans un couple hétérosexuel : une femme biologique devient un homme de genre et ne peut pas procréer mais sa compagne femme biologique à la possibilité de recourir à la PMA. Les femmes, physiquement et légalement, peuvent y recourir car on estime que, biologiquement, il y a une possibilité de procréer avec le sperme d’un tiers donneur.</li>\n</ul>\n<ul>\n<li>Article 342-13 du Code civil : “Celui qui, après avoir consenti à l'assistance médicale à la procréation, ne reconnaît pas l'enfant qui en est issu engage sa responsabilité envers la mère et envers l'enfant.</li>\n</ul>\n<p><em>En outre, sa paternité est judiciairement déclarée.”</em></p>\n<ul>\n<li><p>Cas dans un couple homosexuel : la PMA est ouverte aux couples de femmes (depuis 2021) dont l’une était autrefois un homme. Il est arrivé que des hommes biologiques aient pu faire recueillir leur spermatozoïde avant de devenir femme, il est donc possible d’utiliser ces spermatozoïdes pour inséminer l’ovocyte de la compagne de cette homme biologique devenu femme juridique.</p>\n</li>\n<li><p>Si la personne trasngenre subit simplement des traitements hormonaux réversible : </p>\n<ul>\n<li>L’enfant est conçu naturellement par 2 hommes ou 2 femmes juridiquement </li>\n</ul>\n</li>\n</ul>\n<p class=\"lesson-note\">Exemple → une femme devient un homme légalement sans perdre ses facultés procréatives féminine OU un homme biologique devenu une femme juridique peut aussi procréer si elle n’a pas perdu ces capacités procréatives. </p>\n<p>Pour la filiation, est-elle paternelle ou maternelle ? </p>\n<ul>\n<li>En droit français, la règle est que la personne qui accouche est la mère de l’enfant, l’homme marié à la mère de l’enfant est présumé le père de l’enfant. Pour les couples non mariés, le père doit faire une reconnaissance de paternité. La filiation de l’enfant est fixée en fonction de l’origine du sexe biologique du parent. </li>\n<li>L’homme devenu femme est père sur l’acte de naissance de l’enfant mais sur son état civil propre à lui c’est une femme, reconnu comme femme dans la société. </li>\n<li><em>La Cour de cassation refuse une filiation neutre c’est-à-dire père ou mère de l’enfant et estime qu’on ne peut pas créer de nouvelle catégorie.</em></li>\n</ul>\n<h2>CHAPITRE 2 : L’intersexualisme</h2>\n<ul>\n<li>Cas d’une personne née avec les caractéristiques des deux sexes (binarité des sexes) OU variation du développement génital.</li>\n</ul>\n<h3>Section 1 : La levée par opération médicale de l’incertitude sexuelle</h3>\n<ul>\n<li>Article 16-3 du Code civil : “Il ne peut être porté atteinte à l'intégrité du corps humain qu'en cas de nécessité médicale pour la personne ou à titre exceptionnel dans l'intérêt thérapeutique d'autrui.</li>\n</ul>\n<p><em>Le consentement de l'intéressé doit être recueilli préalablement hors le cas où son état rend nécessaire une intervention thérapeutique à laquelle il n'est pas à même de consentir.” → un acte médical ne peut être effectué que s’il est nécessaire médicalement et il faut également le consentement de la personne.</em></p>\n<ul>\n<li>Les médecins vont alors prodiguer une action de réassignation sexuelle d’un des 2 sexes, soit féminisation soit masculinisation / virilisation. Ce sont les parents qui font le choix avec les équipes médicales ; ces actes sont encadrés et doivent être effectués en réponse à un motif médical très sérieux. Le médecin doit peser le pour et le contre vis-à-vis des coûts possibles. </li>\n<li>Il faut que le patient soit orienté vers des centres spécialisés dans ces maladies rares, ces centres vont devoir proposer de manière collégiale un diagnostic. Une intervention peut arriver aussi à l'âge adulte (dans le cas de recherche sur la cause de stérilité par exemple) et requiert le consentement de la personne avant intervention. </li>\n<li><em>Avec <strong>la loi de 2010</strong>, les législateurs prévoient que davantage d’information soit donnés aux parents</em></li>\n</ul>\n<h3>Section 2 : L’inscription du sexe sur l’état civil</h3>\n<ul>\n<li><em>En droit français, la déclaration de naissance impose en principe l'indication immédiate du sexe de l'enfant dans un délai de cinq jours à compter de l'accouchement, conformément à l'article 55 du Code civil. Cependant, en présence d'une situation d'intersexualité entraînant une ambiguïté sexuelle à la naissance, la <strong>circulaire ministérielle de 2011</strong> permettait déjà d'ajourner provisoirement cette mention avec l'accord du Procureur de la République. Ce dispositif a été consacré et encadré par la <strong>loi bioéthique du 2 août 2021</strong>, qui a inséré un alinéa à <strong>l'article 57 du Code civil</strong> : “En cas d'impossibilité médicalement constatée de déterminer le sexe de l'enfant au jour de l'établissement de l'acte, le procureur de la République peut autoriser l'officier de l'état civil à ne pas faire figurer immédiatement le sexe sur l'acte de naissance. L'inscription du sexe médicalement constaté intervient à la demande des représentants légaux de l'enfant ou du procureur de la République dans un délai qui ne peut être supérieur à trois mois à compter du jour de la déclaration de naissance. Le procureur de la République ordonne de porter la mention du sexe en marge de l'acte de naissance et, à la demande des représentants légaux, de rectifier l'un des ou les prénoms de l'enfant.”</em></li>\n<li>Lorsque la mention initiale s'avère erronée ou inadaptée, la jurisprudence a progressivement admis la possibilité d'une rectification. </li>\n<li>Ainsi, par <strong>un arrêt marquant du 22 juin 2000</strong> concernant un enfant né en 1995 ayant subi une intervention de féminisation après l'échec de stimulations hormonales, la Cour d'appel de Versailles a autorisé la modification de l'état civil sans y voir une violation du principe d'indisponibilité de l'état des personnes. </li>\n<li>Cette rectification repose traditionnellement sur trois conditions cumulatives : </li>\n</ul>\n<ul>\n<li>elle doit constituer l'aboutissement juridique d'une situation médicalement constatée et conseillée, </li>\n<li>résulter d'une impossibilité médicale de mettre fin à l'ambiguïté dans le sexe déclaré, </li>\n<li>être suivie d'une éducation de l'enfant en conformité avec son nouveau sexe. </li>\n</ul>\n<ul>\n<li><p>Sur le plan procédural, cette correction d'une erreur initiale, qui revêt un caractère rétroactif,  s'inscrit dans le cadre fixé par <strong>l'article 99 du Code civil</strong>, relevant de la compétence du président du tribunal judiciaire ou du Procureur de la République pour les erreurs purement matérielles, permettant également l'ajustement des prénoms. </p>\n</li>\n<li><p><em><strong>Article 99 du Code civil</strong></em> : “La rectification des actes de l'état civil est ordonnée par le président du tribunal. La rectification de l'indication du sexe et, le cas échéant, des prénoms est ordonnée à la demande de toute personne présentant une variation du développement génital ou, si elle est mineure, à la demande de ses représentants légaux, s'il est médicalement constaté que son sexe ne correspond pas à celui figurant sur son acte de naissance. L'annulation des actes de l'état civil est ordonnée par le tribunal. Toutefois, le procureur de la République territorialement compétent peut faire procéder à l'annulation de l'acte lorsque celui-ci est irrégulièrement dressé.” </p>\n</li>\n<li><p><em>Enfin, si ce régime traite les ambiguïtés biologiques à la naissance, le droit français demeure strictement fondé sur la binarité des sexes et refuse <strong>l'inscription d'un « sexe neutre » ou le statut de non-binarité à l'état civil</strong> ; la jurisprudence considère que la dualité binaire des sexes poursuit un but légitime et s'avère nécessaire, dans la mesure où l'introduction d'un sexe neutre engendrerait des répercussions profondes sur l'ensemble du système juridique français et nécessiterait de majeures modifications législatives.</em></p>\n</li>\n</ul>\n", "nested": true, "civilLesson": true, "partStart": false}, {"title": "Titre 3 : Le domicile, élément d’identification des personnes", "text": "**TITRE 3 : Le domicile, élément d’identification des personnes**\n\n (SÉANCE de TD numéro 6) \n\nLivre 1 du Code civil « des Personnes » titre 3 s’intitule du domicile et il s’agit des articles 102 à 111. \n\n\n\n**CHAPITRE 1 : L’existence du domicile&#xA0;**\n\n- *Le terme “domicile” possède 2 attributs :&#xA0;*\n\n* ***un attribut lié à la personnalité, prolongement du corps humain dans l’espace** : on n’a pas le droit de violer un domicile.*\n* ***un attribut lié à un instrument de police civile pour localiser l'individu**. Il répond au principe de nécessité du domicile, selon lequel toute personne doit avoir obligatoirement un domicile, et d’autre part au principe d’unicité du domicile qui impose à chacun d’avoir un seul et unique domicile principal. &#xA0;*\n\n- *En tant qu’individu on a des obligations (ex → voter), donc les autorités publiques ont besoin de notre domicile pour nous envoyer des courriers (ex → courriels fiscaux).&#xA0;*\n- ***Le tribunal compétent est celui du lieu où demeure (domicile) du défendeur.***\n\n\n\n**Section 1 : La définition du domicil&#x65;*&#xA0;***\n\n- *D'après **l’article 102 du Code civil** : “Le domicile de tout Français, quant à l'exercice de ses droits civils, est au lieu où il a son principal établissement.”&#xA0;*\n- *Chaque individu peut partir en vacances, se déplacer, etc… mais le domicile est l’endroit où la personne a ses intérêts principaux.&#xA0;*\n- ***Il y a deux notions à ne pas confondre :&#xA0;***\n\n* ***Domicile (notion abstraite)**: Le plus souvent, le domicile correspond à la résidence principale. Il s'agit d'un raccordement juridique unique : une personne n'a qu'un seul et unique domicile.*\n* ***Résidence (notion concrète)&#x20;**: C'est le lieu où la personne demeure effectivement. Une personne peut avoir plusieurs résidences (par exemple une résidence secondaire), mais celles-ci ne constituent pas son domicile.*\n\n\n\n- *Selon les objectifs poursuivis, le législateur se réfère au domicile seul, comme pour l'ouverture des successions selon **l’article 720 du Code civil**, ou parfois à la seule résidence, à l'image des règles de compétence du juge aux affaires familiales (art. 1070 C. pr. civ.).*\n- ***Article 720 du Code civil** : “Les successions s'ouvrent par la mort, au dernier domicile du défunt.”*\n- ***Article 1070 du Code civil** : “Le juge aux affaires familiales territorialement compétent est :*\n\n*- le juge du lieu où se trouve la résidence de la famille ;*\n\n*- si les parents vivent séparément, le juge du lieu de résidence du parent avec lequel résident habituellement les enfants mineurs en cas d'exercice en commun de l'autorité parentale, ou du lieu de résidence du parent qui exerce seul cette autorité ;*\n\n*- dans les autres cas, le juge du lieu où réside celui qui n'a pas pris l'initiative de la procédure.”*\n\n\n\n- *Il arrive également que ces notions soient associées ou articulées de manière subsidiaire : ainsi, en procédure civile, l'impossibilité de connaître le domicile du défendeur permet une assignation au lieu de sa résidence (**article 42 du Code de procédure civile**), tandis qu'en matière de célébration du mariage, la loi laisse le choix entre la commune du domicile ou celle d'une résidence établie par au moins un mois d'habitation continue (**article 74 du Code civil**).&#xA0;*\n- ***Article 42 du Code de procédure civile** : “La juridiction territorialement compétente est, sauf disposition contraire, celle du lieu où demeure le défendeur.*\n\n*S'il y a plusieurs défendeurs, le demandeur saisit, à son choix, la juridiction du lieu où demeure l'un d'eux.*\n\n*Si le défendeur n'a ni domicile ni résidence connus, le demandeur peut saisir la juridiction du lieu où il demeure ou celle de son choix s'il demeure à l'étranger.”*\n\n- ***Article 74 du Code civil** : “Le mariage sera célébré, au choix des époux, dans la commune où l'un d'eux, ou l'un de leurs parents, aura son domicile ou sa résidence établie par un mois au moins d'habitation continue à la date de la publication prévue par la loi.”*\n- *Enfin, la notion d'habitation s'en distingue par son caractère très temporaire (telle une chambre d'hôtel ou d'hôpital), mais elle bénéficie d'une protection renforcée en droit pénal : **l'article 226-4 du Code pénal** adopte en effet une conception large du domicile en y assimilant tout local d'habitation contenant des biens appartenant à la personne, afin de punir le délit de violation de domicile et d'en garantir l'inviolabilité.*\n- ***Article 226-4 du Code pénal** : “L'introduction dans le domicile d'autrui à l'aide de manœuvres, menaces, voies de fait ou contrainte, hors les cas où la loi le permet, est puni de trois ans d'emprisonnement et de 45 000 euros d'amende.”*\n\n\n\n**Section 2 : La détermination du domicile&#xA0;**\n\n**§1 : Le domicile volontaire&#xA0;**\n\n- *Le domicile volontaire est déterminé par la personne qui va elle-même le déterminer, contrairement au domicile légal.*\n- ***La détermination du domicile repose sur 2 éléments :&#xA0;***\n\n* ***un élément matériel** → il faut que la personne se soit établi un endroit de manière effective où elle concentre ses activités.*\n* ***un élément de volonté / intentionnel&#x20;**→ il faut que la personne se soit établi intentionnellement un lieu de domicile.*\n\n- *L'existence et la localisation du domicile relèvent d'une appréciation souveraine des faits par les juges du fond, échappant ainsi au contrôle de la Cour de cassation.*\n- ***Article 102 du Code civil** : “Le domicile de tout Français, quant à l'exercice de ses droits civils, est au lieu où il a son principal établissement.”*\n- ***Article 103 du Code civil** : “Le changement de domicile s'opérera par le fait d'une habitation réelle dans un autre lieu, joint à l'intention d'y fixer son principal établissement.”*\n- ***Article 104 du Code civil** : “La preuve de l'intention résultera d'une déclaration expresse, faite tant à la municipalité du lieu que l'on quittera, qu'à celle du lieu où on aura transféré son domicile.” →* **il faut faire une déclaration à la mairie pour que les tiers en soient informés.**\n- ***Article 105 du Code civil*** : “*A défaut de déclaration expresse, la preuve de l'intention dépendra des circonstances.”*\n\n\n\n**§2 : Le domicile légal&#xA0;**\n\n- *Le domicile légal est un domicile directement attribué par la loi, par opposition au domicile de choix.&#xA0;*\n- *Historiquement, le droit prévoyait des **domiciles dits de dépendance**, comme celui qui imposait à la femme mariée d'avoir pour domicile celui de son époux ; cette règle a toutefois été abrogée par la **loi du 11 juillet 1975.**&#xA0;*\n- ***L'article 108 alinéa 1er du Code civil** dispose : “Le mari et la femme peuvent avoir un domicile distinct sans qu'il soit pour autant porté atteinte aux règles relatives à la communauté de la vie.”*\n- *Aujourd'hui, les seuls domiciles de dépendance maintenus par le législateur concernent les personnes vulnérables, à savoir les mineurs non émancipés, domiciliés chez leurs parents ou chez celui avec lequel ils résident en cas de domiciles distincts (**article 108-2 du Code civil**), ainsi que les majeurs sous tutelle, qui sont légalement domiciliés chez leur tuteur (**article 108-3 du Code civil**).*\n- ***Article 108-2 du Code civil** : “Le mineur non émancipé est domicilié chez ses père et mère. Si les père et mère ont des domiciles distincts, il est domicilié chez celui des parents avec lequel il réside.”*\n- ***Article 108-3 du Code civil** : “Le majeur en tutelle est domicilié chez son tuteur.”*\n- *Il y a un deuxième type de domicile légal appelé “**le domicile des employés de maison**” ⇒ ce sont des personnes logées chez leur employeur.&#xA0;*\n- ***Article 109 du Code civil** : “Les majeurs qui servent ou travaillent habituellement chez autrui, auront le même domicile que la personne qu'ils servent ou chez laquelle ils travaillent, lorsqu'ils demeureront avec elle dans la même maison.”&#xA0;*\n- *Dernier type de domicile légal, vu dans **l’article 107 du Code civil**, concerne les fonctionnaires publics inamovibles / élus à vie (ex → magistrats du siège, officiers ministériels).*\n- ***Article 107 du Code civil** : “L'acceptation de fonctions conférées à vie, emportera translation immédiate du domicile du fonctionnaire dans le lieu où il doit exercer ces fonctions.”*\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n**CHAPITRE 2 : Les caractéristiques du domicile&#xA0;**\n\n**Section 1 : Une personne = un seul domicile**\n\n**§1 : Le principe&#xA0;**\n\n- *Le principe d’une personne = un seul domicile.&#xA0;*\n- *Pour trouver ce domicile, il faut chercher quel est son principe d'établissement. C’est la règle du principe d’unicité du domicile.*\n\n**§2 : Les exceptions&#xA0;**\n\n- *Il y a 3 exceptions :&#xA0;*\n\n* *1ère exception : le domicile élu&#xA0;*\n* *2ème : la théorie des gares principales*\n* *3ème : le domicile apparent*\n\n\n\n- ***Le domicile élu (article 111 du Code civil)** → cela veut dire que le domicile est un domicile fictif, il va servir dans **le cas où on conclut un contrat.&#xA0;***\n\n***Exemple&#x20;**→ dans le cadre des litiges contractuels, il existe une clause qui va prévoir le lieu du juge compétent.&#xA0;*\n\n- *Les parties au contrat (= les personnes qui concluent les contrats) vont élire le domicile fictif à tel endroit précisé dans le contrat / où sera jugé l→ c’est la clause attributive de compétence.*\n\n* ***Il y a aussi dans le cas d’opposition du mariage** → **Article 176 du Code civil** : “Tout acte d'opposition énonce la qualité qui donne à l'opposant le droit de la former. Il contient également les motifs de l'opposition, reproduit le texte de loi sur lequel est fondée l'opposition et contient élection de domicile dans le lieu où le mariage doit être célébré. Toutefois, lorsque l'opposition est faite en application de l'article[ 171-4](https://www.legifrance.gouv.fr/affichCodeArticle.do?cidTexte=LEGITEXT000006070721\\&idArticle=LEGIARTI000006422271\\&dateTexte=\\&categorieLien=cid), le ministère public fait élection de domicile au siège de son tribunal.”*\n\n- ***La théorie des gares principales** → cela va concerner le domicile des personnes morales. (voir document 10 de la fiche de TD 6).*\n- *Historiquement, cette théorie s'appliquait aux compagnies de chemins de fer. Le domicile des personnes morales est ce qu’on appelle “le siège social” qui est désigné dans les statuts (sociétés, associations…).*\n- *Les personnes morales ont différentes succursales (= lieu où il y a eu un contrat / différents établissements implantés) ; avec cette théorie, les juges ont permis aux tiers qui contractent avec une succursale d’une personne morale de pouvoir assigner la personne morale au lieu de la succursale.&#xA0;*\n\n* ***Le domicile apparent** → d'après la théorie de l'apparence, le droit dit que si une personne fait croire aux tiers que tel lieu était son domicile alors que ce n'était pas le cas, le droit va donc dire que c’est bien le domicile réel.&#xA0;*\n* *Les tiers doivent être de bonne foi, ils pensaient que le domicile réel était le domicile dont avait parlé la personne physique ou morale.*\n\n\n\n\n\n\n\n\n\n**Section 2 : L’obligation d’avoir un domicil&#x65;*&#xA0;***\n\n- *Toute personne a l’obligation d’avoir un domicile.&#xA0;*\n- *On peut changer de domicile avec une procédure → la nécessité d’avoir un domicile.*\n- ***Il y a 2 cas importants :&#xA0;***\n\n* *Les bateliers&#xA0;*\n* *Les sans domicile fixes&#xA0;*\n\n\n\n- ***Les bateliers** → ils n’ont pas de domicile stable car ils sont souvent sur des bateaux. On retrouve cette règle dans **l’article 102 du Code civil** : “Les bateliers et autres personnes vivant à bord d'un bateau de navigation intérieure immatriculé en France, qui n'ont pas le domicile prévu à l'alinéa précédent ou un domicile légal, sont tenus de choisir un domicile dans l'une des communes dont le nom figure sur une liste établie par arrêté du garde des sceaux, ministre de la justice, du ministre de l'intérieur et du ministre des travaux publics, des transports et du tourisme. Toutefois, les bateliers salariés et les personnes vivant à bord avec eux peuvent se domicilier dans une autre commune à condition que l'entreprise qui exploite le bateau y ait son siège ou un établissement ; dans ce cas, le domicile est fixé dans les bureaux de cette entreprise ; à défaut de choix par eux exercé, ces bateliers et personnes ont leur domicile au siège de l'entreprise qui exploite le bateau et, si ce siège est à l'étranger, au bureau d'affrètement de Paris.”&#xA0;*\n\n\n\n- ***Les sans domiciles fixes** → il existe pour eux un droit à domiciliation.&#xA0;*\n\n***Article L264-1 du Code de l’action sociale et des familles (CASF)** : “Pour prétendre au service des prestations sociales légales, réglementaires et conventionnelles, à l'exercice des droits civils qui leur sont reconnus par la loi, ainsi qu'à la délivrance d'un titre national d'identité, à l'inscription sur les listes électorales ou à l'aide juridictionnelle,**&#x20;les personnes sans domicile stable doivent élire domicile soit auprès d'un centre communal ou intercommunal d'action sociale, soit auprès d'un organisme agréé à cet effet**.”*\n\n\n\n**Section 3 : Le principe de l’inviolabilité du domicile**\n\n- Le domicile est un lieu où se déroule la vie privée de la personne et donc il y a un principe appelé “***le principe d’inviolabilité du domicile***” → une personne ne peut pas entrer dans un domicile d’un tiers sans son consentement / autorisation.\n- ***Article 9 du Code civil (responsabilité civile)*** : “*Chacun a droit au respect de sa vie privée”.*\n- ***Article 226-4 du Code pénal (responsabilité pénale)*** : “*L'introduction dans le domicile d'autrui à l'aide de manœuvres, menaces, voies de fait ou contrainte, hors les cas où la loi le permet, est puni de trois ans d'emprisonnement et de 45 000 euros d'amende.*\n- *Le maintien dans le domicile d'autrui à la suite de l'introduction mentionnée au premier alinéa, hors les cas où la loi le permet, est puni des mêmes peines.*\n- *Constitue notamment le domicile d'une personne, au sens du présent article, tout local d'habitation contenant des biens meubles lui appartenant, que cette personne y habite ou non et qu'il s'agisse de sa résidence principale ou non.”*\n- En ce qui concerne les perquisitions, c’est une autorisation d’entrer dans le domicile d’autrui permise par la loi.\n- ***Il y a une double responsabilité possible (responsabilité civile et pénale) pour la violation du domicile.***\n", "html": "<h2>TITRE 3 : Le domicile, élément d’identification des personnes</h2>\n<p>(SÉANCE de TD numéro 6)</p>\n<p>Livre 1 du Code civil « des Personnes » titre 3 s’intitule du domicile et il s’agit des articles 102 à 111.</p>\n<h2>CHAPITRE 1 : L’existence du domicile</h2>\n<ul>\n<li>Le terme “domicile” possède 2 attributs : </li>\n</ul>\n<ul>\n<li>un attribut lié à la personnalité, prolongement du corps humain dans l’espace : on n’a pas le droit de violer un domicile.</li>\n<li>un attribut lié à un instrument de police civile pour localiser l'individu. Il répond au principe de nécessité du domicile, selon lequel toute personne doit avoir obligatoirement un domicile, et d’autre part au principe d’unicité du domicile qui impose à chacun d’avoir un seul et unique domicile principal.  </li>\n</ul>\n<ul>\n<li>En tant qu’individu on a des obligations (ex → voter), donc les autorités publiques ont besoin de notre domicile pour nous envoyer des courriers (ex → courriels fiscaux). </li>\n<li><em><strong>Le tribunal compétent est celui du lieu où demeure (domicile) du défendeur.</strong></em></li>\n</ul>\n<h3>Section 1 : La définition du domicile</h3>\n<ul>\n<li>D'après <strong>l’article 102 du Code civil</strong> : “Le domicile de tout Français, quant à l'exercice de ses droits civils, est au lieu où il a son principal établissement.” </li>\n<li>Chaque individu peut partir en vacances, se déplacer, etc… mais le domicile est l’endroit où la personne a ses intérêts principaux. </li>\n<li>Il y a deux notions à ne pas confondre : </li>\n</ul>\n<ul>\n<li>Domicile (notion abstraite): Le plus souvent, le domicile correspond à la résidence principale. Il s'agit d'un raccordement juridique unique : une personne n'a qu'un seul et unique domicile.</li>\n<li>Résidence (notion concrète) : C'est le lieu où la personne demeure effectivement. Une personne peut avoir plusieurs résidences (par exemple une résidence secondaire), mais celles-ci ne constituent pas son domicile.</li>\n</ul>\n<ul>\n<li><em>Selon les objectifs poursuivis, le législateur se réfère au domicile seul, comme pour l'ouverture des successions selon <strong>l’article 720 du Code civil</strong>, ou parfois à la seule résidence, à l'image des règles de compétence du juge aux affaires familiales (art. 1070 C. pr. civ.).</em></li>\n<li>Article 720 du Code civil : “Les successions s'ouvrent par la mort, au dernier domicile du défunt.”</li>\n<li>Article 1070 du Code civil : “Le juge aux affaires familiales territorialement compétent est :</li>\n</ul>\n<p><em>- le juge du lieu où se trouve la résidence de la famille ;</em></p>\n<p><em>- si les parents vivent séparément, le juge du lieu de résidence du parent avec lequel résident habituellement les enfants mineurs en cas d'exercice en commun de l'autorité parentale, ou du lieu de résidence du parent qui exerce seul cette autorité ;</em></p>\n<p><em>- dans les autres cas, le juge du lieu où réside celui qui n'a pas pris l'initiative de la procédure.”</em></p>\n<ul>\n<li>Il arrive également que ces notions soient associées ou articulées de manière subsidiaire : ainsi, en procédure civile, l'impossibilité de connaître le domicile du défendeur permet une assignation au lieu de sa résidence (<strong>article 42 du Code de procédure civile</strong>), tandis qu'en matière de célébration du mariage, la loi laisse le choix entre la commune du domicile ou celle d'une résidence établie par au moins un mois d'habitation continue (<strong>article 74 du Code civil</strong>). </li>\n<li>Article 42 du Code de procédure civile : “La juridiction territorialement compétente est, sauf disposition contraire, celle du lieu où demeure le défendeur.</li>\n</ul>\n<p><em>S'il y a plusieurs défendeurs, le demandeur saisit, à son choix, la juridiction du lieu où demeure l'un d'eux.</em></p>\n<p><em>Si le défendeur n'a ni domicile ni résidence connus, le demandeur peut saisir la juridiction du lieu où il demeure ou celle de son choix s'il demeure à l'étranger.”</em></p>\n<ul>\n<li>Article 74 du Code civil : “Le mariage sera célébré, au choix des époux, dans la commune où l'un d'eux, ou l'un de leurs parents, aura son domicile ou sa résidence établie par un mois au moins d'habitation continue à la date de la publication prévue par la loi.”</li>\n<li><em>Enfin, la notion d'habitation s'en distingue par son caractère très temporaire (telle une chambre d'hôtel ou d'hôpital), mais elle bénéficie d'une protection renforcée en droit pénal : <strong>l'article 226-4 du Code pénal</strong> adopte en effet une conception large du domicile en y assimilant tout local d'habitation contenant des biens appartenant à la personne, afin de punir le délit de violation de domicile et d'en garantir l'inviolabilité.</em></li>\n<li>Article 226-4 du Code pénal : “L'introduction dans le domicile d'autrui à l'aide de manœuvres, menaces, voies de fait ou contrainte, hors les cas où la loi le permet, est puni de trois ans d'emprisonnement et de 45 000 euros d'amende.”</li>\n</ul>\n<h3>Section 2 : La détermination du domicile</h3>\n<h4>§1 : Le domicile volontaire</h4>\n<ul>\n<li><em>Le domicile volontaire est déterminé par la personne qui va elle-même le déterminer, contrairement au domicile légal.</em></li>\n<li>La détermination du domicile repose sur 2 éléments : </li>\n</ul>\n<ul>\n<li>un élément matériel → il faut que la personne se soit établi un endroit de manière effective où elle concentre ses activités.</li>\n<li>un élément de volonté / intentionnel → il faut que la personne se soit établi intentionnellement un lieu de domicile.</li>\n</ul>\n<ul>\n<li><em>L'existence et la localisation du domicile relèvent d'une appréciation souveraine des faits par les juges du fond, échappant ainsi au contrôle de la Cour de cassation.</em></li>\n<li>Article 102 du Code civil : “Le domicile de tout Français, quant à l'exercice de ses droits civils, est au lieu où il a son principal établissement.”</li>\n<li>Article 103 du Code civil : “Le changement de domicile s'opérera par le fait d'une habitation réelle dans un autre lieu, joint à l'intention d'y fixer son principal établissement.”</li>\n<li>Article 104 du Code civil : “La preuve de l'intention résultera d'une déclaration expresse, faite tant à la municipalité du lieu que l'on quittera, qu'à celle du lieu où on aura transféré son domicile.” → <strong>il faut faire une déclaration à la mairie pour que les tiers en soient informés.</strong></li>\n<li><em><strong>Article 105 du Code civil</strong></em> : “<em>A défaut de déclaration expresse, la preuve de l'intention dépendra des circonstances.”</em></li>\n</ul>\n<h4>§2 : Le domicile légal</h4>\n<ul>\n<li>Le domicile légal est un domicile directement attribué par la loi, par opposition au domicile de choix. </li>\n<li>Historiquement, le droit prévoyait des <strong>domiciles dits de dépendance</strong>, comme celui qui imposait à la femme mariée d'avoir pour domicile celui de son époux ; cette règle a toutefois été abrogée par la <strong>loi du 11 juillet 1975.</strong> </li>\n<li>L'article 108 alinéa 1er du Code civil dispose : “Le mari et la femme peuvent avoir un domicile distinct sans qu'il soit pour autant porté atteinte aux règles relatives à la communauté de la vie.”</li>\n<li><em>Aujourd'hui, les seuls domiciles de dépendance maintenus par le législateur concernent les personnes vulnérables, à savoir les mineurs non émancipés, domiciliés chez leurs parents ou chez celui avec lequel ils résident en cas de domiciles distincts (<strong>article 108-2 du Code civil</strong>), ainsi que les majeurs sous tutelle, qui sont légalement domiciliés chez leur tuteur (<strong>article 108-3 du Code civil</strong>).</em></li>\n<li>Article 108-2 du Code civil : “Le mineur non émancipé est domicilié chez ses père et mère. Si les père et mère ont des domiciles distincts, il est domicilié chez celui des parents avec lequel il réside.”</li>\n<li>Article 108-3 du Code civil : “Le majeur en tutelle est domicilié chez son tuteur.”</li>\n<li>Il y a un deuxième type de domicile légal appelé “<strong>le domicile des employés de maison</strong>” ⇒ ce sont des personnes logées chez leur employeur. </li>\n<li>Article 109 du Code civil : “Les majeurs qui servent ou travaillent habituellement chez autrui, auront le même domicile que la personne qu'ils servent ou chez laquelle ils travaillent, lorsqu'ils demeureront avec elle dans la même maison.” </li>\n<li><em>Dernier type de domicile légal, vu dans <strong>l’article 107 du Code civil</strong>, concerne les fonctionnaires publics inamovibles / élus à vie (ex → magistrats du siège, officiers ministériels).</em></li>\n<li>Article 107 du Code civil : “L'acceptation de fonctions conférées à vie, emportera translation immédiate du domicile du fonctionnaire dans le lieu où il doit exercer ces fonctions.”</li>\n</ul>\n<h2>CHAPITRE 2 : Les caractéristiques du domicile</h2>\n<h3>Section 1 : Une personne = un seul domicile</h3>\n<h4>§1 : Le principe</h4>\n<ul>\n<li>Le principe d’une personne = un seul domicile. </li>\n<li><em>Pour trouver ce domicile, il faut chercher quel est son principe d'établissement. C’est la règle du principe d’unicité du domicile.</em></li>\n</ul>\n<h4>§2 : Les exceptions</h4>\n<ul>\n<li>Il y a 3 exceptions : </li>\n</ul>\n<ul>\n<li>1ère exception : le domicile élu </li>\n<li><em>2ème : la théorie des gares principales</em></li>\n<li><em>3ème : le domicile apparent</em></li>\n</ul>\n<ul>\n<li>Le domicile élu (article 111 du Code civil) → cela veut dire que le domicile est un domicile fictif, il va servir dans le cas où on conclut un contrat. </li>\n</ul>\n<p class=\"lesson-note\">Exemple → dans le cadre des litiges contractuels, il existe une clause qui va prévoir le lieu du juge compétent. </p>\n<ul>\n<li><em>Les parties au contrat (= les personnes qui concluent les contrats) vont élire le domicile fictif à tel endroit précisé dans le contrat / où sera jugé l→ c’est la clause attributive de compétence.</em></li>\n</ul>\n<ul>\n<li>Il y a aussi dans le cas d’opposition du mariage → <strong>Article 176 du Code civil</strong> : “Tout acte d'opposition énonce la qualité qui donne à l'opposant le droit de la former. Il contient également les motifs de l'opposition, reproduit le texte de loi sur lequel est fondée l'opposition et contient élection de domicile dans le lieu où le mariage doit être célébré. Toutefois, lorsque l'opposition est faite en application de l'article<a href=\"https://www.legifrance.gouv.fr/affichCodeArticle.do?cidTexte=LEGITEXT000006070721&amp;idArticle=LEGIARTI000006422271&amp;dateTexte=&amp;categorieLien=cid\"> 171-4</a>, le ministère public fait élection de domicile au siège de son tribunal.”</li>\n</ul>\n<ul>\n<li>La théorie des gares principales → cela va concerner le domicile des personnes morales. (voir document 10 de la fiche de TD 6).</li>\n<li><em>Historiquement, cette théorie s'appliquait aux compagnies de chemins de fer. Le domicile des personnes morales est ce qu’on appelle “le siège social” qui est désigné dans les statuts (sociétés, associations…).</em></li>\n<li>Les personnes morales ont différentes succursales (= lieu où il y a eu un contrat / différents établissements implantés) ; avec cette théorie, les juges ont permis aux tiers qui contractent avec une succursale d’une personne morale de pouvoir assigner la personne morale au lieu de la succursale. </li>\n</ul>\n<ul>\n<li>Le domicile apparent → d'après la théorie de l'apparence, le droit dit que si une personne fait croire aux tiers que tel lieu était son domicile alors que ce n'était pas le cas, le droit va donc dire que c’est bien le domicile réel. </li>\n<li><em>Les tiers doivent être de bonne foi, ils pensaient que le domicile réel était le domicile dont avait parlé la personne physique ou morale.</em></li>\n</ul>\n<h3>Section 2 : L’obligation d’avoir un domicile</h3>\n<ul>\n<li>Toute personne a l’obligation d’avoir un domicile. </li>\n<li><em>On peut changer de domicile avec une procédure → la nécessité d’avoir un domicile.</em></li>\n<li>Il y a 2 cas importants : </li>\n</ul>\n<ul>\n<li>Les bateliers </li>\n<li>Les sans domicile fixes </li>\n</ul>\n<ul>\n<li><p>Les bateliers → ils n’ont pas de domicile stable car ils sont souvent sur des bateaux. On retrouve cette règle dans <strong>l’article 102 du Code civil</strong> : “Les bateliers et autres personnes vivant à bord d'un bateau de navigation intérieure immatriculé en France, qui n'ont pas le domicile prévu à l'alinéa précédent ou un domicile légal, sont tenus de choisir un domicile dans l'une des communes dont le nom figure sur une liste établie par arrêté du garde des sceaux, ministre de la justice, du ministre de l'intérieur et du ministre des travaux publics, des transports et du tourisme. Toutefois, les bateliers salariés et les personnes vivant à bord avec eux peuvent se domicilier dans une autre commune à condition que l'entreprise qui exploite le bateau y ait son siège ou un établissement ; dans ce cas, le domicile est fixé dans les bureaux de cette entreprise ; à défaut de choix par eux exercé, ces bateliers et personnes ont leur domicile au siège de l'entreprise qui exploite le bateau et, si ce siège est à l'étranger, au bureau d'affrètement de Paris.” </p>\n</li>\n<li><p>Les sans domiciles fixes → il existe pour eux un droit à domiciliation. </p>\n</li>\n</ul>\n<p>Article L264-1 du Code de l’action sociale et des familles (CASF) : “Pour prétendre au service des prestations sociales légales, réglementaires et conventionnelles, à l'exercice des droits civils qui leur sont reconnus par la loi, ainsi qu'à la délivrance d'un titre national d'identité, à l'inscription sur les listes électorales ou à l'aide juridictionnelle, les personnes sans domicile stable doivent élire domicile soit auprès d'un centre communal ou intercommunal d'action sociale, soit auprès d'un organisme agréé à cet effet.”</p>\n<h3>Section 3 : Le principe de l’inviolabilité du domicile</h3>\n<ul>\n<li>Le domicile est un lieu où se déroule la vie privée de la personne et donc il y a un principe appelé “<em><strong>le principe d’inviolabilité du domicile</strong></em>” → une personne ne peut pas entrer dans un domicile d’un tiers sans son consentement / autorisation.</li>\n<li><em><strong>Article 9 du Code civil (responsabilité civile)</strong></em> : “<em>Chacun a droit au respect de sa vie privée”.</em></li>\n<li><em><strong>Article 226-4 du Code pénal (responsabilité pénale)</strong></em> : “<em>L'introduction dans le domicile d'autrui à l'aide de manœuvres, menaces, voies de fait ou contrainte, hors les cas où la loi le permet, est puni de trois ans d'emprisonnement et de 45 000 euros d'amende.</em></li>\n<li><em>Le maintien dans le domicile d'autrui à la suite de l'introduction mentionnée au premier alinéa, hors les cas où la loi le permet, est puni des mêmes peines.</em></li>\n<li><em>Constitue notamment le domicile d'une personne, au sens du présent article, tout local d'habitation contenant des biens meubles lui appartenant, que cette personne y habite ou non et qu'il s'agisse de sa résidence principale ou non.”</em></li>\n<li>En ce qui concerne les perquisitions, c’est une autorisation d’entrer dans le domicile d’autrui permise par la loi.</li>\n<li><em><strong>Il y a une double responsabilité possible (responsabilité civile et pénale) pour la violation du domicile.</strong></em></li>\n</ul>\n", "nested": true, "civilLesson": true, "partStart": false}]);

var METHOD_CONTENT = ["<h2>Définition</h2><p>La fiche d&#x27;arrêt est un exercice permettant de comprendre et de présenter une décision de justice de manière synthétique. Elle constitue également l&#x27;introduction du commentaire d&#x27;arrêt.</p><h2>Préparation</h2><p>Avant toute rédaction :</p><ul><li>lire plusieurs fois la décision ;</li><li>identifier s&#x27;il s&#x27;agit d&#x27;un arrêt de rejet ou d&#x27;un arrêt de cassation ;</li><li>repérer les faits, la procédure, les arguments des parties et la solution retenue ;</li><li>établir éventuellement une chronologie des événements.</li></ul><h2>Structure d&#x27;une fiche d&#x27;arrêt</h2><p>La fiche d&#x27;arrêt comporte six parties :</p><h3>1. Les faits</h3><ul><li>Il s&#x27;agit de tous les éléments matériels ayant conduit au litige ou à la demande en justice.</li><li>Les faits doivent être présentés de manière objective et chronologique.</li></ul><h3>2. La procédure</h3><p>Il faut retracer les différentes étapes du procès :</p><ul><li>qui a saisi la justice ;</li><li>pour quelle demande ;</li><li>décision de première instance ;</li><li>appel éventuel ;</li><li>décision de la cour d&#x27;appel ;</li><li>pourvoi en cassation ;</li><li>décision de la Cour de cassation.</li></ul><p class=\"method-note\">Il ne faut mentionner que les éléments présents dans l&#x27;arrêt étudié.</p><h3>3. Les prétentions des parties ou les moyens du pourvoi</h3><p>Il s&#x27;agit de présenter les arguments juridiques avancés par chaque partie.</p><p>On expose :</p><ul><li>les prétentions du demandeur ;</li><li>les prétentions du défendeur ;</li><li>les moyens invoqués devant la Cour de cassation lorsqu&#x27;il s&#x27;agit d&#x27;un arrêt de cassation ou de rejet.</li></ul><h3>4. Le problème juridique</h3><p>Le problème juridique correspond à la question de droit posée au juge.</p><p>Il doit être :</p><ul><li>formulé juridiquement ;</li><li>rédigé sous forme de question ;</li><li>abstrait ;</li><li>dépourvu de toute référence au nom des parties.</li></ul><p>Une même décision peut soulever plusieurs problèmes de droit.</p><h3>5. Le sens de la décision</h3><p>Il faut indiquer la réponse apportée par la juridiction :</p><ul><li>demande accueillie ou rejetée ;</li><li>jugement confirmé ou infirmé ;</li><li>arrêt cassé ou confirmé.</li></ul><h3>6. La motivation et la portée</h3><h4>La motivation</h4><p>Elle correspond au raisonnement juridique suivi par les juges.</p><p>Pour les arrêts de rejet, elle apparaît généralement après la formule :</p><blockquote><p>« Mais attendu que... »</p></blockquote><p>Pour les arrêts de cassation, elle repose principalement sur :</p><ul><li>le visa ;</li><li>l&#x27;attendu de principe ;</li><li>le passage commençant par : « Qu&#x27;en statuant ainsi... »</li></ul><h4>La portée</h4><p>Elle consiste à apprécier l&#x27;importance de la décision :</p><ul><li>arrêt classique ;</li><li>arrêt de principe ;</li><li>arrêt innovant ;</li><li>revirement de jurisprudence ;</li><li>confirmation d&#x27;une solution existante.</li></ul><p>Cette partie exige souvent des recherches doctrinales et jurisprudentielles.</p>", "<h2>Définition</h2><p>Le commentaire d&#x27;arrêt ne consiste ni à paraphraser une décision de justice ni à réciter son cours.</p><p>Son objectif est de démontrer :</p><ul><li>que l&#x27;on a compris la décision ;</li><li>que l&#x27;on maîtrise le droit applicable ;</li><li>que l&#x27;on est capable d&#x27;en proposer une analyse critique.</li></ul><h2>Les trois éléments indispensables</h2><h3>1. L&#x27;analyse de la décision</h3><p>Elle repose sur la fiche d&#x27;arrêt.</p><h3>2. L&#x27;exposé du droit positif</h3><p>Il faut présenter :</p><ul><li>les textes applicables ;</li><li>la jurisprudence ;</li><li>la doctrine.</li></ul><h3>3. La réflexion critique</h3><p>Il faut apprécier :</p><ul><li>la valeur de la décision ;</li><li>son intérêt ;</li><li>ses conséquences ;</li><li>sa portée dans l&#x27;évolution du droit.</li></ul><h2>L&#x27;introduction du commentaire</h2><p>Elle comprend :</p><h4>Une phrase d&#x27;accroche</h4><p>Elle situe la décision dans son contexte juridique.</p><h4>La fiche d&#x27;arrêt</h4><p>Sans faire apparaître les rubriques.</p><h4>Le problème juridique</h4><h4>La problématique</h4><h4>L&#x27;annonce du plan</h4><p>Formule classique :</p><blockquote><p>« Il conviendra d&#x27;étudier dans un premier temps... (I), puis dans un second temps... (II). »</p></blockquote><h2>Le plan du commentaire</h2><p>Le commentaire est structuré en :</p><ul><li>deux parties ;</li><li>deux sous-parties dans chaque partie.</li></ul><h4>Structure</h4><blockquote><p>I. Titre</p><p>Chapeau.</p><p>A. Première sous-partie</p><p>B. Deuxième sous-partie</p><p>Transition.</p><p>II. Titre</p><p>Chapeau.</p><p>A. Première sous-partie</p><p>B. Deuxième sous-partie</p></blockquote><h2>Construction du plan</h2><p>Le plan doit être bâti autour de la motivation de l&#x27;arrêt.</p><p>Il faut identifier :</p><ul><li>les problèmes traités ;</li><li>les solutions apportées ;</li><li>le raisonnement des juges.</li></ul><p>Le plan doit être :</p><ul><li>équilibré ;</li><li>dynamique ;</li><li>fondé sur les enjeux de la décision.</li></ul><p>Sont à exclure :</p><ul><li>« Avant l&#x27;arrêt / Après l&#x27;arrêt » ;</li><li>« Solution de la cour d&#x27;appel / Solution de la Cour de cassation » ;</li><li>« Faits et procédure / Contenu de la décision ».</li></ul><h2>Analyse critique de la décision</h2><p>Plusieurs questions doivent être posées :</p><ul><li>La décision est-elle conforme au droit antérieur ?</li><li>constitue-t-elle un arrêt de principe ?</li><li>apporte-t-elle une innovation ?</li><li>tranche-t-elle une controverse ?</li><li>opère-t-elle un revirement de jurisprudence ?</li></ul><p>Il faut également apprécier :</p><ul><li>sa cohérence juridique ;</li><li>son utilité ;</li><li>son équité ;</li><li>ses conséquences sociales, économiques et juridique.</li></ul><h2>Règles de rédaction</h2><ul><li>Toujours partir de l&#x27;arrêt étudié.</li><li>Commenter la décision tout au long du devoir.</li><li>Soigner les intitulés.</li><li>Utiliser des titres courts, symétriques et sans verbe conjugué.</li><li>Ne pas rédiger de conclusion.</li><li>Éventuellement ouvrir la réflexion en fin de II.B.</li></ul>", "<h2>Définition</h2><p>Le cas pratique consiste à résoudre une situation concrète en appliquant des règles de droit à des faits donnés.</p><p>Il s&#x27;agit d&#x27;une véritable consultation juridique.</p><h2>Étape 1 : l&#x27;analyse des faits</h2><p>Le travail porte d&#x27;abord sur les faits.</p><p>Il faut :</p><ul><li>lire plusieurs fois l&#x27;énoncé ;</li><li>distinguer les faits importants des faits inutiles ;</li><li>établir une chronologie précise ;</li><li>identifier les dates importantes.</li></ul><p>Les faits doivent ensuite être traduits en langage juridique.</p><p>Cette opération est appelée qualification juridique des faits.</p><p>Le ou les problèmes juridiques doivent être formulés sous forme de questions de droit.</p><h2>Étape 2 : la recherche des règles de droit</h2><p>Il faut rechercher :</p><h4>Les textes applicables</h4><p>Par exemple :</p><ul><li>Constitution ; Code civil ;</li><li>lois spéciales ;</li><li>principes généraux du droit ;</li><li>coutume ;</li><li>adages juridiques.</li></ul><h4>La jurisprudence applicable</h4><p>Il convient de privilégier :</p><ul><li>les décisions récentes ;</li><li>les arrêts de principe ;</li><li>les décisions des juridictions suprêmes.</li></ul><h2>Étape 3 : l&#x27;application des règles aux faits</h2><p>Il faut appliquer les règles de droit aux faits de l&#x27;espèce.</p><p>Cette méthode est appelée :</p><h4>Le syllogisme juridique</h4><p>Il comprend trois éléments :</p><ul><li>la majeure : la règle de droit ;</li><li>la mineure : les faits du cas ;</li><li>la conclusion : la solution juridique.</li></ul><h2>La rédaction du cas pratique</h2><h3>Introduction</h3><p>Elle doit être courte et comprendre :</p><ul><li>une présentation générale du sujet ;</li><li>l&#x27;annonce du plan.</li></ul><p>Le nombre de parties dépend du nombre de problèmes juridiques à résoudre.</p><p class=\"method-note\">(Toujours essayer de faire son introduction en 5 parties minimum)</p><h2>Structure de chaque partie</h2><p>I. Titre correspondant au problème juridique</p><ol><li>Résumé des faits pertinents et qualification juridique.</li><li>Formulation du problème juridique.</li><li>Exposé des règles de droit applicables.</li><li>Application des règles aux faits.</li><li>Solution proposée.</li></ol><p>La même méthode doit être répétée pour chaque problème soulevé.</p><h2>Conclusion</h2><p>Elle est facultative.</p><p>Lorsqu&#x27;elle est rédigée, elle doit :</p><ul><li>résumer les différentes solutions retenues ;</li><li>éventuellement ouvrir sur une question complémentaire, comme la juridiction compétente ou les suites possibles du litige.</li></ul><p class=\"method-note\">mieux vos privilégiés de ne pas faire de conclusion.</p>", "<h2>Définition</h2><p>La dissertation juridique est un exercice consistant à exposer un raisonnement juridique de manière claire, structurée et démonstrative à partir d&#x27;un sujet donné. Elle exige des connaissances solides, mais surtout une capacité d&#x27;analyse, d&#x27;organisation des idées et de démonstration. Une dissertation n&#x27;est ni une récitation du cours ni une œuvre d&#x27;imagination. L&#x27;objectif est de répondre précisément au sujet posé en évitant tout hors-sujet.</p><h2>1. L&#x27;analyse du sujet</h2><p>La première étape consiste à lire attentivement le sujet afin d&#x27;en déterminer le sens exact et les limites.</p><p>Il faut :</p><ul><li>repérer les mots-clés ;</li><li>définir précisément ces termes ;</li><li>délimiter le sujet en identifiant ce qui en fait partie et ce qui en est exclu ;</li><li>comprendre l&#x27;enjeu juridique du sujet.</li></ul><p>Lorsque le sujet est formulé sous forme de question, la réponse doit apparaître dans la démonstration. Le plan devra ainsi permettre de répondre directement à la question posée.</p><p>Après cette analyse, il convient de rechercher toutes les idées, connaissances, règles, jurisprudences et évolutions du droit relatives au sujet. À ce stade, toutes les idées doivent être notées, même celles qui paraissent secondaires. Le tri sera effectué ultérieurement.</p><p>Enfin, il faut dégager l&#x27;idée générale qui servira de fil conducteur à la démonstration.</p><h2>2. La construction du plan</h2><p>La dissertation juridique repose obligatoirement sur un plan.</p><p>Le plan doit comporter :</p><ul><li>deux parties (I et II) ;</li><li>deux sous-parties dans chaque partie (A et B).</li></ul><p>Chaque partie doit être précédée d&#x27;un chapeau annonçant les deux sous-parties qui suivent.</p><p>Une transition doit relier les deux parties afin d&#x27;assurer la cohérence de la démonstration.</p><p>Les parties doivent être équilibrées. Traditionnellement, les développements les plus importants doivent apparaître dans les parties I.B et II.A.</p><p>Les intitulés doivent être :</p><ul><li>courts ;</li><li>précis ;</li><li>juridiquement pertinents ;</li><li>rédigés sans forme interrogative ;</li><li>sans phrases longues ou titres à rallonge.</li></ul><p>Plusieurs types de plans peuvent être utilisés :</p><h4>Le plan analytique</h4><p>Il consiste à étudier successivement différents aspects du sujet.</p><p>Exemple :</p><ul><li>Les conditions traditionnelles</li><li>Les conditions nouvelles</li></ul><h4>Le plan synthétique</h4><p>Il oppose ou complète deux idées générales.</p><p>Exemple :</p><ul><li>Le principe</li><li>Les exceptions</li></ul><p>ou</p><ul><li>La notion</li><li>Le régime juridique</li></ul><h4>Le plan d&#x27;idées</h4><p>Il est directement construit autour de la problématique du sujet.</p><p>Exemple :</p><ul><li>Une délégation conditionnée</li><li>Une délégation contrôlée</li></ul><h2>3. L&#x27;introduction</h2><p>L&#x27;introduction doit être rédigée après l&#x27;élaboration du plan.</p><p>Elle répond à trois questions :</p><h4>De quoi va-t-on parler ?</h4><ul><li>phrase d&#x27;accroche ;</li><li>présentation du sujet ;</li><li>définition des principaux termes ;</li><li>délimitation du sujet.</li></ul><h4>Pourquoi va-t-on en parler ?</h4><ul><li>intérêt du sujet (historique, juridique, social, politique, philosophique, pratique, etc.) ;</li><li>présentation de la problématique ou de l&#x27;idée générale qui guidera la démonstration.</li></ul><h4>Comment va-t-on en parler ?</h4><ul><li>annonce du plan comprenant les deux parties principales.</li></ul><h2>4. La rédaction</h2><p>Structure générale :</p><blockquote><p>Introduction</p><p>Sans sous-titres apparents.</p><p>I. Titre de la première partie</p><p>Chapeau introductif.</p><p>A. Première sous-partie</p><p>B. Deuxième sous-partie</p><p>Transition.</p><p>II. Titre de la deuxième partie</p><p>Chapeau introductif.</p><p>A. Première sous-partie</p><p>B. Deuxième sous-partie</p></blockquote><p>Une conclusion n&#x27;est pas obligatoire.</p><p>Si elle existe, elle doit ouvrir le sujet sur une réflexion plus large.</p>"];

    var v = line.trim();
    if (!v) return '<div class="course-space"></div>';
    if (/^chapitre\s+\d/i.test(v)) return '<h2 class="course-chapter">' + esc(v) + '</h2>';
    if (/^section\s+\d/i.test(v)) return '<h3 class="course-section">' + esc(v) + '</h3>';
    if (/^§\s*\d/.test(v)) return '<h4 class="course-sub">' + esc(v) + '</h4>';
    return '<div class="course-line">' + esc(line) + '</div>';
  }).join('');
}

var swipe = null, swipeBusy = false, blockClickUntil = 0;
app.addEventListener("pointerdown", function(e) {
  var el = e.target.closest("#fc-drag");
  if (!el || e.pointerType !== "touch" || !e.isPrimary || !S.flipped || swipeBusy || swipe) return;
  var target = el.querySelector(".fcard");
  swipe = {id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,dy:0,active:false,el:el};

function paintSwipe(g) {
  var dx=g.dx, dy=g.dy, el=g.el, stamp=el.querySelector(".fc-stamp");
  el.style.transform="translate3d("+dx+"px,"+(dy*.65)+"px,0) rotate("+Math.max(-12,Math.min(12,dx/18))+"deg)";
  el.classList.toggle("swipe-yes",dx>0); el.classList.toggle("swipe-no",dx<0);
  stamp.className="fc-stamp "+(dx>0?"yes":"no"); stamp.textContent=dx>0?"Je savais":"À revoir"; stamp.style.opacity=Math.min(1,Math.abs(dx)/65);

app.addEventListener("pointermove", function(e) {
  if (!swipe || swipe.id !== e.pointerId) return;
  var g=swipe;
  g.dx=e.clientX-g.x; g.dy=e.clientY-g.y;
  if (!g.active && Math.hypot(g.dx,g.dy)<5) return;

  if(e.cancelable) e.preventDefault();

}, {passive:false});
function endSwipe(e, cancelled) {

  blockClickUntil=Date.now()+350;
  if (!cancelled) { g.dx=e.clientX-g.x; g.dy=e.clientY-g.y; }
  if (!cancelled && Math.abs(g.dx)>=Math.min(85,el.offsetWidth*.22) && Math.abs(g.dx)>Math.abs(g.dy)*.85) {
    swipeBusy=true;
    var ok=g.dx>0, deck=S.deck, ci=S.ci;

    setTimeout(function(){ swipeBusy=false; if(S.view==="card" && S.deck===deck && S.ci===ci && el.isConnected) rate(ok); },matchMedia("(prefers-reduced-motion: reduce)").matches?0:240);
  } else {
    el.style.transform=""; el.classList.remove("swipe-yes","swipe-no"); el.querySelector(".fc-stamp").style.opacity=0;
  }
}
app.addEventListener("pointerup",function(e){endSwipe(e,false);});

function rate(ok) {
  if (S.view !== "card" || !S.flipped || swipeBusy) return;
  S.known[S.ci] = ok;

}
