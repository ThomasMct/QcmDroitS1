t des États-gendarmes ou providence, dans lesquels c’est la loi qui est l’instrument déterminant, la Constitution est alors la norme de référence pour déterminer son existence, puisque c’est la Constitution qui détermine l’entité à laquelle est confiée la souveraineté, en l’occurrence la nation.*\n- *Plus spécifiquement et plus actuellement sans doute, existe aussi ce qu’on appelle l’État de droit, que paradoxalement, tout le monde connaît, et que tout le monde est bien en peine de définir clairement. Là encore, une approche historique s’impose pour comprendre ce que signifie cette notion devenue centrale dans les démocraties occidentales, et cruciale à l’heure contemporaine, à la fois lorsqu’elle est pensée (Section 1) et lorsqu’elle est mise en œuvre (Section 2).*\n\n\n\n\n\n**Section 1 – Les ambivalences de la théorie de l’État de droit **\n\n- La notion d’État de droit apparaît à la fin du XIXe siècle dans la littérature allemande (*Rechtsstaat*) et britannique (*Rule of law*) ; c’est depuis la doctrine d’outre-Rhin que le terme est importé en France, d’où il résulte une certaine différenciation avec la conception anglo-saxonne, sur laquelle nous reviendrons. La théorie est d’abord celle de** Raymond Carré de Malberg** (§1), dont la pensée sera discutée par **Kelsen **(§2) ; d’où une difficulté persistante à concevoir une définition claire et indubitable de ce fameux État de droit (§3).\n\n\n\n**§1 – Raymond Carré de Malberg et la théorie de l’autolimitation de l’État **\n\n- *Professeur strasbourgeois (germanophone), constitutionnaliste étudiant la IIIe République, le régime parlementaire qui s’y déploie, et l’héritage de la pensée révolutionnaire dans les lois constitutionnelles de 1875.*\n- *Penseur libéral, défavorable au despotisme et partisan des libertés individuelles, il est aussi un penseur de la souveraineté de l’État ; l’État n’a donc pas de limite dans l’exercice de son pouvoir, si ce n’est celles qu’il s’impose à lui-même. D’où l’idée d’**autolimitation**.*\n\n*⇒ personnification paroxystique de l’État, dont l’autorité dépend de la **cohérence** de son pouvoir (confusion entre État et corps politique l’incarnant) ; si le pouvoir édicte des règles, il ne peut obtenir des citoyens qu’ils les respectent que si le corps politique s’y soumet lui-même. *\n\n*[argument déployé à propos de la condamnation du RN et de **Marine Le Pen **(mars 2025) // ou lorsque **Bruno Retailleau** critiquait une décision du TA de Melun annulant une OQTF (fév. 2025) en vertu d’une loi qu’il a lui-même défendue et votée quelques mois auparavant]*\n\n\n\n**§2 – Hans Kelsen et la théorie de la hiérarchie des normes **\n\n- ***Kelsen **est un contemporain plus jeune de Carré de Malberg, et il se prévaut d’une Théorie **pure** du droit, c’est-à-dire d’une science du droit qui exclut de son analyse toute dimension extra-juridique – politique, sociologique ou économique : on dit qu’il est **normativiste**, c’est-à-dire qu’il définit exclusivement le droit comme un ensemble de **normes**. À ce titre, il ne peut se satisfaire de la conception strasbourgeoise de Carré de Malberg, non plus qu’il n’emploie le terme de souveraineté, indéfinissable par le seul recours aux normes juridiques.*\n- *Pour **Kelsen**, l’État n’est donc pas une puissance souveraine, mais un **ordre juridique unifié et hiérarchisé** ayant cours sur une zone géographique donnée. L’État est donc fondamentalement **de droit **; les deux notions sont synonymes.*\n\n***⇒ Ou pour résumer rapidement la pensée de Kelsen :  Hiérarchie des normes = État = État de droit***\n\n- *Il en résulte qu’on a un État dès lors que **chaque norme** – expression juridique d’un pouvoir politique – **est adoptée en vertu d’une norme supérieure**, Constitution exceptée. Ainsi entendu, un État de droit est un État dans lequel le pouvoir administratif est soumis à la loi, loi dont on est certain qu’elle est conforme à la Constitution. L’État de droit appelle donc la mise en œuvre de la **justice constitutionnelle**. Ce qui explique d’ailleurs l’apparition simultanée de ces deux phénomènes dans l’histoire récente : après la seconde guerre mondiale, en Europe, se développe partout la culture de l’État de droit en même temps que fleurissent les Cours constitutionnelles.*\n\n ***Il existe encore d’autres définitions par la doctrine d’entre-deux guerres de l’État de droit, notamment celle de Léon Duguit, sur laquelle je ne m’attarde pas. Toutes ont nourri ce qu’on appelle globalement « État de droit » aujourd’hui.***\n\n\n\n**§3 – Principes et limites de l’État de droit **\n\n- ***Principe** : **le pouvoir politique s’exerce dans le respect du droit**, ce qui comporte des garanties sur le fait qu’il ne soit pas despotique, c’est-à-dire attentatoire à la liberté individuelle, puisque la Constitution spécifiquement comporte des garanties dont on est sûr qu’elles seront respectées. On parle aussi de principe de **prééminence du droit **(Conseil de l’Europe).*\n- ***Principe de légitimité** : on peut faire confiance à la décision politique prise en la forme juridique puisqu’elle respecte les valeurs fondamentales identifiées par le Constituant.*\n\n*⇒ Réconciliation entre Carré de Malberg et **Kelsen **puisque l’État s’autolimite en adoptant du droit auquel il se soumet lui-même, en l’inscrivant dans les hautes sphères de la hiérarchie des normes.*\n\n- *La limite conceptuelle est justement celle-ci : tout le pouvoir politique exercé au sein de l’État ne peut pas être soumis au droit, puisque le droit ne tombe pas du ciel (en toute laïcité), mais résulte lui-même **ultimement**, d’une décision politique qui appartient au **pouvoir constituant originaire**, caractérisé par sa souveraineté, c’est-à-dire son absence totale de soumission au droit. Ni l'auto-limitation ni la hiérarchie des normes ne permettent de surmonter cette aporie conceptuelle qu’il n’existe aucune garantie que le droit constitutionnel et donc toute la hiérarchie des normes, soient conformes à des valeurs quelconque. Rien ne permet d’empêcher en théorie que le droit constitutionnel ne consacre un régime dictatorial ou des atteintes aux droits fondamentaux.*\n\n***⇒ Retenez bien que le droit ne comporte aucune vérité absolue, seulement celle (relative) des contingences qui le voient naître ; il reste un produit de la volonté humaine.***\n\n- *Pour faillible ou inachevée qu’elle puisse être, la théorie de l’État de droit a toutefois été prise à bras-le-corps par des pouvoirs constituants au lendemain de la seconde guerre mondiale, ce qui en fait désormais une notion incontournable du droit constitutionnel contemporain.*\n\n\n\n**Section 2 – Les modalités de la mise en œuvre de l’État de droit* ***\n\n- *À partir de 1945, l’État de droit se substitue progressivement à l’**État légal **(**M.-J. Redor-Fichot**), lui-même expression du **légicentrisme** hérité de la Révolution : sacralisation de la loi, dont on présume qu’elle est infaillible puisqu’elle est issue de la représentation nationale depuis 1789. Cela conduit à établir dans le droit constitutionnel un certain nombre de garanties (§1), aujourd’hui remises en cause (§2).*\n\n\n\n**§1 – Les garanties de l’État de droit **\n\n- *Définition aujourd’hui **substantialisée** de l’État de droit, par association à la Rule of law, notamment par le développement du droit européen, qui réconcilie des notions nées dans un contexte national ; à la conception formelle inspirée d’un Kelsen se conjugue désormais une **conception matérielle**, portant un certain nombre de valeurs éthiques et politiques jugées constitutives d’un État de droit et protégées unanimement par la plupart des ordres constitutionnels (A), jusqu’à ce que l’État de droit se confonde presque avec la démocratie (B).*\n\n\n\n**A. Les déclinaisons de l’État de droit **\n\n- *Certains droits constitutionnels énoncent expressément l’attachement de leurs auteurs au respect de l’État de droit, éventuellement démocratique et social : Portugal, Hongrie, Pologne, Roumanie, Rép. tchèque… + Union européenne.*\n- *Qu’elle soit mentionnée ou pas, le concept se développe partout, par les juges ou par la doctrine (Commission de Venise), et elle renvoie toujours à des valeurs et mécanismes communément admis.*\n\n → **Des libertés publiques aux libertés fondamentales**\n\n- *Si le Parlement peut porter atteinte aux droits individuels et opérer des discriminations, la loi ne suffit pas pour protéger les droits de chacun ; **rehaussement** des droits et libertés devenant fondamentaux, bénéficiant d’une protection **constitutionnelle **ou** conventionnelle**.*\n\n***Exemple **→ liberté d’association ou syndicale, principe de non-discrimination, jusqu’à la liberté de l’IVG*\n\n **→ La sécurité juridique**\n\n- *Nul n’est censé ignorer la loi, qui doit en retour être intelligible et prévisible pour ses sujets.*\n- *En sus d’éléments de légistique, la sécurité juridique implique aussi une protection des **droits acquis **et des garanties contre la **rétroactivité de la loi**, spécifiquement en droit pénal (légalité des délits et des peines).*\n\n **→ L’indépendance de la justice**\n\n- *Disposer de droits contre le pouvoir politique, y compris législatif, suppose d’être en mesure de les faire valoir, et d’obtenir réparation s’il y est porté atteinte ; un droit proclamé ne suffit pas, il doit être **subjectif**. D’où le rôle crucial conféré aux juridictions dans un État de droit – État du juge ? – mais qui ne serait d’aucun effet si le pouvoir judiciaire était acoquiné avec le législateur ou n’importe quel pouvoir politique. L’**indépendance** et l’**impartialité** de la justice sont donc les premières garanties du **droit à un procès équitable**, lui-même droit premier des libertés fondamentales.*\n\n **→ La séparation des pouvoirs**\n\n- *L’indépendance de la justice est l’une des modalités de la séparation des pouvoirs, celle-ci étant plus largement un instrument de lutte contre la concentration du pouvoir, donc le despotisme et l’autocratie. Pour que les citoyens soient libres, il faut que le pouvoir soit divisé, ainsi que le préconisent les Constitutions modernes.*\n- *Dans chacune de ces déclinaisons, l’État de droit est un **perfectionnement** de mécanismes inventés en 1789 par le constitutionnalisme ; soumettre l’État au droit consiste simplement à garantir l’effectivité des garanties constitutionnelles pensées par les Révolutionnaires. *\n\n\n\n**B. L’articulation de l’État de droit avec la démocratie **\n\n- *La démocratie se développe avant l’État de droit, et celui-ci peut être envisagé comme un instrument de celle-ci : si la démocratie est l’exercice du pouvoir confié à l’ensemble des citoyens, elle va supposer que ces citoyens disposent de droits politiques (suffrage, expression, association…) **effectifs**, c’est-à-dire protégés contre le législateur.*\n- *La démocratie par l’élection implique que les majorités puissent évoluer, et qu’une élection ne fasse pas l’autre ; on peut donc estimer qu’un régime démocratique est celui qui protège les **droits des minorités**, de façon à ce qu’elles puissent devenir majoritaires. Là encore, le registre des libertés fondamentales dote la démocratie d’une substance, et l’État de droit qui en permet la promotion, en devient l’instrument privilégié.*\n- *Démocratie et État de droit sont ainsi parfois entendues comme synonymes dans le langage journalistique, ce qu’ils ne sont pas exactement ; leurs développements et leur promotion dans les systèmes politiques vont toutefois souvent de pair.*\n\n\n\n**§2 – Les menaces contre l’État de droit**\n\n- ***B. Retailleau**, « L’État de droit n’est ni intangible ni sacré » ; langage performatif : rien qu’en le disant, le ministre de l’Intérieur à l’époque désacralise l’État de droit.*\n- *Et de fait, si l’on peut bien considérer que l’État de droit est **sacré **en ce qu’il est la seule méthode connue de promotion de la démocratie, certes imparfaite (il est donc sacré pour les démocrates…), force est de constater qu’il n’est pas intangible, pas plus que le droit (constitutionnel) ou la démocratie : il est incroyablement facile de lui porter atteinte, dès lors qu’on remet en cause ses éléments constitutifs.*\n- *Remise en cause de l’indépendance de la justice*\n\n*o   Structurellement : Hongrie et Pologne, réforme du mode de nomination*\n\n*o   Rhétoriquement en France, en criant à tort et à travers que les juges sont politiques.*\n\n*[Précision et articulation avec **pouvoir interprétatif** – donc politique – des juges : distinction entre juge constitutionnel (dernier mot, composition, laconisme du texte) et juge administratif ou judiciaire // dire que le juge exerce par un acte de volonté ne signifie pas qu’il n’est pas indépendant du pouvoir politique].*\n\n- *Atteinte à la transparence et à la déontologie politiques*\n- *Problème des décisions politiques prises dans les alcôves du pouvoir, loin de toute audience, favorisant les conflits d’intérêts au détriment de l’intérêt général, remettant en cause la séparation des pouvoirs et usurpant ce faisant la souveraineté nationale censée prévaloir en vertu des dispositions constitutionnelles. *\n\n* *Un « recul » des droits fondamentaux est-il une remise en cause de l’État de droit ?*\n\n***Exemple **→ d’une réforme constitutionnelle qui viendrait abolir un droit régulièrement inscrit*\n\n*Remise en cause de l’avortement Pologne 2020 / États-Unis 2022.*\n\n***= Moins de droits fondamentaux mais respect des formes juridiques : dissociation voire contrariété entre État de droit et démocratie ? Peut-on penser un État de droit illibéral ? Aucun exemple satisfaisant…***\n\n\n\n*⇒ Dénigrer ou saboter l’État de droit est le plus souvent annonciateur d’une attaque masquée contre la démocratie et les droits et libertés individuels, autres enjeux essentiels du droit constitutionnel contemporain.*\n", "html": "<h2>Chapitre 3 – Les déclinaisons de l’État : l’État de droit</h2>\n<ul>\n<li><em>Il est fréquent de voir la notion d’État accolée à un autre nom (nation, gendarme, droit…). Et le but de ce dernier chapitre est de préciser ce que cela implique.</em></li>\n<li><em>Les notions que vous connaissez sans doute le mieux à ce titre sont celles d’État-gendarme et d’État-providence que l’on a tendance à opposer, et qui sont toutes les deux relativement désuètes (respectivement fin XIXe et mi-XXe) ; elles se réfèrent à des modèles idéologiques ou politiques quant au rôle que l’État est réputé assumer :</em></li>\n</ul>\n<p><em>-       <strong>État-gendarme</strong> : il se contente de maintenir l’ordre public en faisant prévaloir la liberté des acteurs ; avec toutefois un poids considérable à la morale publique voire de l’<strong>ordre moral</strong>, qui le distingue du modèle de l’ultra-libéralisme actuel. En vérité, c’est un modèle politique conservateur, qui vise à protéger ceux qui bénéficient des faveurs de la conjoncture.</em></p>\n<p><em>-       <strong>État-providence</strong> : associé le plus souvent à une théorie économique de la relance promue par le modèle keynésien, il consiste à attribuer à l’État un rôle de pourvoyeur d’activité économique, de sécurité sociale, de solidarité entre les citoyens (</em><strong>Welfare state de F. D. Roosevelt</strong>_ à partir de 1933)_</p>\n<ul>\n<li><p><em>Ces modèles sont d’ordre politique et théorique : ils n’ont que peu d’incidence sur la structure juridique de l’État mais davantage sur les politiques publiques qui vont être conduites par les majorités politiques, détenant le pouvoir législatif. (cf. cours d’Institutions administratives au semestre 2)</em></p>\n</li>\n<li><p><em>On a aussi beaucoup parlé du modèle de l’<strong>État-nation</strong>, qui se développe dès le XVIIIe et se généralise aux XXe avec les mouvements de décolonisation : la souveraineté de l’État est placée entre les mains d’une nation, c’est-à-dire d’un ensemble relativement homogène de personnes, partageant des caractéristiques linguistiques, culturelles, religieuses ou ethniques communes.</em></p>\n</li>\n<li><p>Attention<strong>, tous les États ne sont pas, ou plus, des États-nations, dans la mesure où existent des États multinationaux</strong> (Hongrie, Serbie, Roumanie…). Un État-nation peut être aussi bien fédéral (Allemagne) que régional (Italie, Espagne) ou unitaire (France). Contrairement à la plupart des États-gendarmes ou providence, dans lesquels c’est la loi qui est l’instrument déterminant, la Constitution est alors la norme de référence pour déterminer son existence, puisque c’est la Constitution qui détermine l’entité à laquelle est confiée la souveraineté, en l’occurrence la nation.</p>\n</li>\n<li><p><em>Plus spécifiquement et plus actuellement sans doute, existe aussi ce qu’on appelle l’État de droit, que paradoxalement, tout le monde connaît, et que tout le monde est bien en peine de définir clairement. Là encore, une approche historique s’impose pour comprendre ce que signifie cette notion devenue centrale dans les démocraties occidentales, et cruciale à l’heure contemporaine, à la fois lorsqu’elle est pensée (Section 1) et lorsqu’elle est mise en œuvre (Section 2).</em></p>\n</li>\n</ul>\n<h2>Section 1 – Les ambivalences de la théorie de l’État de droit</h2>\n<ul>\n<li>La notion d’État de droit apparaît à la fin du XIXe siècle dans la littérature allemande (<em>Rechtsstaat</em>) et britannique (<em>Rule of law</em>) ; c’est depuis la doctrine d’outre-Rhin que le terme est importé en France, d’où il résulte une certaine différenciation avec la conception anglo-saxonne, sur laquelle nous reviendrons. La théorie est d’abord celle de Raymond Carré de Malberg (§1), dont la pensée sera discutée par Kelsen (§2) ; d’où une difficulté persistante à concevoir une définition claire et indubitable de ce fameux État de droit (§3).</li>\n</ul>\n<h3>§1 – Raymond Carré de Malberg et la théorie de l’autolimitation de l’État</h3>\n<ul>\n<li><em>Professeur strasbourgeois (germanophone), constitutionnaliste étudiant la IIIe République, le régime parlementaire qui s’y déploie, et l’héritage de la pensée révolutionnaire dans les lois constitutionnelles de 1875.</em></li>\n<li><em>Penseur libéral, défavorable au despotisme et partisan des libertés individuelles, il est aussi un penseur de la souveraineté de l’État ; l’État n’a donc pas de limite dans l’exercice de son pouvoir, si ce n’est celles qu’il s’impose à lui-même. D’où l’idée d’<strong>autolimitation</strong>.</em></li>\n</ul>\n<p class=\"lesson-note\">⇒ personnification paroxystique de l’État, dont l’autorité dépend de la <strong>cohérence</strong> de son pouvoir (confusion entre État et corps politique l’incarnant) ; si le pouvoir édicte des règles, il ne peut obtenir des citoyens qu’ils les respectent que si le corps politique s’y soumet lui-même. *</p>\n<p><em>[argument déployé à propos de la condamnation du RN et de <strong>Marine Le Pen (mars 2025) // ou lorsque Bruno Retailleau</strong> critiquait une décision du TA de Melun annulant une OQTF (fév. 2025) en vertu d’une loi qu’il a lui-même défendue et votée quelques mois auparavant]</em></p>\n<h3>§2 – Hans Kelsen et la théorie de la hiérarchie des normes</h3>\n<ul>\n<li>Kelsen <strong>est un contemporain plus jeune de Carré de Malberg, et il se prévaut d’une Théorie pure</strong> du droit, c’est-à-dire d’une science du droit qui exclut de son analyse toute dimension extra-juridique – politique, sociologique ou économique : on dit qu’il est <strong>normativiste</strong>, c’est-à-dire qu’il définit exclusivement le droit comme un ensemble de <strong>normes</strong>. À ce titre, il ne peut se satisfaire de la conception strasbourgeoise de Carré de Malberg, non plus qu’il n’emploie le terme de souveraineté, indéfinissable par le seul recours aux normes juridiques.</li>\n<li><em>Pour <strong>Kelsen</strong>, l’État n’est donc pas une puissance souveraine, mais un <strong>ordre juridique unifié et hiérarchisé</strong> ayant cours sur une zone géographique donnée. L’État est donc fondamentalement de droit ; les deux notions sont synonymes.</em></li>\n</ul>\n<p class=\"lesson-note\"><em><strong>⇒ Ou pour résumer rapidement la pensée de Kelsen :  Hiérarchie des normes = État = État de droit</strong></em></p>\n<ul>\n<li><em>Il en résulte qu’on a un État dès lors que <strong>chaque norme</strong> – expression juridique d’un pouvoir politique – <strong>est adoptée en vertu d’une norme supérieure</strong>, Constitution exceptée. Ainsi entendu, un État de droit est un État dans lequel le pouvoir administratif est soumis à la loi, loi dont on est certain qu’elle est conforme à la Constitution. L’État de droit appelle donc la mise en œuvre de la <strong>justice constitutionnelle</strong>. Ce qui explique d’ailleurs l’apparition simultanée de ces deux phénomènes dans l’histoire récente : après la seconde guerre mondiale, en Europe, se développe partout la culture de l’État de droit en même temps que fleurissent les Cours constitutionnelles.</em></li>\n</ul>\n<p> <em><strong>Il existe encore d’autres définitions par la doctrine d’entre-deux guerres de l’État de droit, notamment celle de Léon Duguit, sur laquelle je ne m’attarde pas. Toutes ont nourri ce qu’on appelle globalement « État de droit » aujourd’hui.</strong></em></p>\n<h3>§3 – Principes et limites de l’État de droit</h3>\n<ul>\n<li>Principe : <strong>le pouvoir politique s’exerce dans le respect du droit</strong>, ce qui comporte des garanties sur le fait qu’il ne soit pas despotique, c’est-à-dire attentatoire à la liberté individuelle, puisque la Constitution spécifiquement comporte des garanties dont on est sûr qu’elles seront respectées. On parle aussi de principe de prééminence du droit (Conseil de l’Europe).</li>\n<li>Principe de légitimité : on peut faire confiance à la décision politique prise en la forme juridique puisqu’elle respecte les valeurs fondamentales identifiées par le Constituant.</li>\n</ul>\n<p class=\"lesson-note\"><em>⇒ Réconciliation entre Carré de Malberg et Kelsen puisque l’État s’autolimite en adoptant du droit auquel il se soumet lui-même, en l’inscrivant dans les hautes sphères de la hiérarchie des normes.</em></p>\n<ul>\n<li><em>La limite conceptuelle est justement celle-ci : tout le pouvoir politique exercé au sein de l’État ne peut pas être soumis au droit, puisque le droit ne tombe pas du ciel (en toute laïcité), mais résulte lui-même <strong>ultimement</strong>, d’une décision politique qui appartient au <strong>pouvoir constituant originaire</strong>, caractérisé par sa souveraineté, c’est-à-dire son absence totale de soumission au droit. Ni l'auto-limitation ni la hiérarchie des normes ne permettent de surmonter cette aporie conceptuelle qu’il n’existe aucune garantie que le droit constitutionnel et donc toute la hiérarchie des normes, soient conformes à des valeurs quelconque. Rien ne permet d’empêcher en théorie que le droit constitutionnel ne consacre un régime dictatorial ou des atteintes aux droits fondamentaux.</em></li>\n</ul>\n<p class=\"lesson-note\"><em><strong>⇒ Retenez bien que le droit ne comporte aucune vérité absolue, seulement celle (relative) des contingences qui le voient naître ; il reste un produit de la volonté humaine.</strong></em></p>\n<ul>\n<li><em>Pour faillible ou inachevée qu’elle puisse être, la théorie de l’État de droit a toutefois été prise à bras-le-corps par des pouvoirs constituants au lendemain de la seconde guerre mondiale, ce qui en fait désormais une notion incontournable du droit constitutionnel contemporain.</em></li>\n</ul>\n<h2>Section 2 – Les modalités de la mise en œuvre de l’État de droit</h2>\n<ul>\n<li><em>À partir de 1945, l’État de droit se substitue progressivement à l’<strong>État légal (</strong>M.-J. Redor-Fichot<strong>), lui-même expression du légicentrisme</strong> hérité de la Révolution : sacralisation de la loi, dont on présume qu’elle est infaillible puisqu’elle est issue de la représentation nationale depuis 1789. Cela conduit à établir dans le droit constitutionnel un certain nombre de garanties (§1), aujourd’hui remises en cause (§2).</em></li>\n</ul>\n<h3>§1 – Les garanties de l’État de droit</h3>\n<ul>\n<li><em>Définition aujourd’hui <strong>substantialisée</strong> de l’État de droit, par association à la Rule of law, notamment par le développement du droit européen, qui réconcilie des notions nées dans un contexte national ; à la conception formelle inspirée d’un Kelsen se conjugue désormais une <strong>conception matérielle</strong>, portant un certain nombre de valeurs éthiques et politiques jugées constitutives d’un État de droit et protégées unanimement par la plupart des ordres constitutionnels (A), jusqu’à ce que l’État de droit se confonde presque avec la démocratie (B).</em></li>\n</ul>\n<h4>A. Les déclinaisons de l’État de droit</h4>\n<ul>\n<li><em>Certains droits constitutionnels énoncent expressément l’attachement de leurs auteurs au respect de l’État de droit, éventuellement démocratique et social : Portugal, Hongrie, Pologne, Roumanie, Rép. tchèque… + Union européenne.</em></li>\n<li><em>Qu’elle soit mentionnée ou pas, le concept se développe partout, par les juges ou par la doctrine (Commission de Venise), et elle renvoie toujours à des valeurs et mécanismes communément admis.</em></li>\n</ul>\n<p> → <strong>Des libertés publiques aux libertés fondamentales</strong></p>\n<ul>\n<li><em>Si le Parlement peut porter atteinte aux droits individuels et opérer des discriminations, la loi ne suffit pas pour protéger les droits de chacun ; <strong>rehaussement</strong> des droits et libertés devenant fondamentaux, bénéficiant d’une protection <strong>constitutionnelle ou</strong> conventionnelle.</em></li>\n</ul>\n<p class=\"lesson-note\">Exemple → liberté d’association ou syndicale, principe de non-discrimination, jusqu’à la liberté de l’IVG</p>\n<p> <strong>→ La sécurité juridique</strong></p>\n<ul>\n<li><em>Nul n’est censé ignorer la loi, qui doit en retour être intelligible et prévisible pour ses sujets.</em></li>\n<li><em>En sus d’éléments de légistique, la sécurité juridique implique aussi une protection des <strong>droits acquis et des garanties contre la rétroactivité de la loi</strong>, spécifiquement en droit pénal (légalité des délits et des peines).</em></li>\n</ul>\n<p> <strong>→ L’indépendance de la justice</strong></p>\n<ul>\n<li><em>Disposer de droits contre le pouvoir politique, y compris législatif, suppose d’être en mesure de les faire valoir, et d’obtenir réparation s’il y est porté atteinte ; un droit proclamé ne suffit pas, il doit être <strong>subjectif</strong>. D’où le rôle crucial conféré aux juridictions dans un État de droit – État du juge ? – mais qui ne serait d’aucun effet si le pouvoir judiciaire était acoquiné avec le législateur ou n’importe quel pouvoir politique. L’<strong>indépendance</strong> et l’<strong>impartialité</strong> de la justice sont donc les premières garanties du <strong>droit à un procès équitable</strong>, lui-même droit premier des libertés fondamentales.</em></li>\n</ul>\n<p> <strong>→ La séparation des pouvoirs</strong></p>\n<ul>\n<li><em>L’indépendance de la justice est l’une des modalités de la séparation des pouvoirs, celle-ci étant plus largement un instrument de lutte contre la concentration du pouvoir, donc le despotisme et l’autocratie. Pour que les citoyens soient libres, il faut que le pouvoir soit divisé, ainsi que le préconisent les Constitutions modernes.</em></li>\n<li>Dans chacune de ces déclinaisons, l’État de droit est un <strong>perfectionnement</strong> de mécanismes inventés en 1789 par le constitutionnalisme ; soumettre l’État au droit consiste simplement à garantir l’effectivité des garanties constitutionnelles pensées par les Révolutionnaires. *</li>\n</ul>\n<h4>B. L’articulation de l’État de droit avec la démocratie</h4>\n<ul>\n<li><em>La démocratie se développe avant l’État de droit, et celui-ci peut être envisagé comme un instrument de celle-ci : si la démocratie est l’exercice du pouvoir confié à function formatCourse(text) {
  return text.split(/\n/).map(function(line) {
    var v = line.trim();
    if (!v) return '<div class="course-space"></div>';
    if (/^chapitre\s+\d/i.test(v)) return '<h2 class="course-chapter">' + esc(v) + '</h2>';
    if (/^section\s+\d/i.test(v)) return '<h3 class="course-section">' + esc(v) + '</h3>';
    if (/^§\s*\d/.test(v)) return '<h4 class="course-sub">' + esc(v) + '</h4>';
    return '<div class="course-line">' + esc(line) + '</div>';
  }).join('');
}
function courseView() {
  var s = findSubject(S.subject), c = (COURSES[s.id] || [])[S.courseIndex];
  if (!c) return coursesView();
  return '<button class="back" data-act="mode-cours">← Tous les cours</button><div style="--c:var(' + s.color + ')"><p class="brand">Cours</p><h1 tabindex="-1" id="focus">' + esc(c.title) + '</h1><article class="rev' + (c.html ? " course-markdown" : "") + (s.id === "constitutionnel" ? " const-lesson" : "") + '" style="margin-top:20px;overflow-wrap:anywhere">' + (c.html || formatCourse(c.text)) + '</article></div>';
}

function decksView() {
  var s = findSubject(S.subject), decks = decksOf(s), body;
  if (!decks.length) {
    body = '<div class="empty">Cette matière n\'a pas encore de cartes. Elles sont créées automatiquement à partir de tes QCM.</div>';
  } else {
    body = '<div class="switches">' + switchBtn("sw-c", "shuffleC", "🔀", "Mélanger les cartes", "Ordre aléatoire", "Ordre du cours") + "</div>" +
      '<div class="list">' + decks.map(function (d) {
        return '<button class="row" data-act="deck-start" data-id="' + d.id + '"><span class="rt"><strong>' + esc(d.title) + '</strong><span class="meta">' +
          plural(d.cards.length, "carte", "cartes") + '</span></span><span class="go">Commencer</span></button>';
      }).join("") + "</div>";
  }
  return '<button class="back" data-act="modes">← Modes de révision</button>' +
    '<div style="--c:var(' + s.color + ')"><p class="brand">Flashcards</p><div class="title-row"><span class="emo" aria-hidden="true">' + s.emoji + '</span><h1 tabindex="-1" id="focus" style="color:var(--c)">' + esc(s.name) + "</h1></div></div>" +
    '<div style="--c:var(' + s.color + ');margin-top:20px">' + body + "</div>";
}

function cardView() {
  var s = findSubject(S.subject), d = S.deck, total = S.cards.length;
  var c = d.cards[S.cards[S.ci]], fl = S.flipped;
  var knownN = S.known.filter(Boolean).length;
  var front = '<span class="fc-face fc-question" aria-hidden="' + fl + '"><span class="side">Question</span><span class="txt">' + esc(c.q) + '</span><span class="hint">Touche la carte pour la retourner</span></span>';
  var back = '<span class="fc-face fc-answer" aria-hidden="' + !fl + '"><span class="side">Réponse</span><span class="txt">' + esc(c.a) + '</span><span class="hint">' + esc(c.q) + '</span></span>';
  return '<div style="--c:var(' + s.color + ')">' +
    '<button class="back" data-act="decks">← Quitter ce paquet</button>' +
    '<div class="qhead"><span><strong>Carte ' + (S.ci + 1) + "</strong> sur " + total + "</span><span>" + esc(d.title) + " · " + knownN + " sue" + (knownN > 1 ? "s" : "") + "</span></div>" +
    '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + total + '" aria-valuenow="' + S.ci + '"><i style="width:' + ((S.ci / total) * 100) + '%"></i></div>' +
    '<div class="fc-stage"><div class="fc-drag' + (fl ? ' can-swipe' : '') + '" id="fc-drag"><span class="fc-stamp" id="fc-stamp" aria-hidden="true"></span><button class="fcard' + (fl ? ' is-flipped' : '') + '" id="flip-card" data-act="flip" aria-label="Retourner la carte">' + front + back + '</button></div></div>' +
    '<div class="actions" id="fc-actions">' + cardActions() + '</div>' +
    '<div id="fc-help">' + cardHelp() + '</div></div>';

}

function cardActions() {
  return S.flipped ? '<button class="btn redo" data-act="redo">À revoir</button><button class="btn know" data-act="know">Je savais</button>' : '<button class="btn" data-act="flip">Retourner la carte</button>';
}
function cardHelp() {
  return S.flipped ? '<p class="meta fc-desktop" style="margin:12px 0 0">Raccourcis : ← À revoir · → Je savais</p><div class="fc-mobile"><span style="color:var(--bad)">← À revoir</span><span style="color:var(--good)">Je savais →</span></div>' : '<p class="meta fc-mobile">Retourne la carte avant de la glisser.</p>';
}
function flipCard() {
  if (S.view !== "card" || swipeBusy) return;
  S.flipped = !S.flipped;
  var el = document.getElementById("flip-card");
  el.classList.toggle("is-flipped", S.flipped);
  document.getElementById("fc-drag").classList.toggle("can-swipe", S.flipped);
  el.querySelector(".fc-question").setAttribute("aria-hidden", String(S.flipped));
  el.querySelector(".fc-answer").setAttribute("aria-hidden", String(!S.flipped));
  document.getElementById("fc-actions").innerHTML = cardActions();
  document.getElementById("fc-help").innerHTML = cardHelp();
  el.focus({preventScroll:true});
}
var swipe = null, swipeBusy = false, blockClickUntil = 0;
app.addEventListener("pointerdown", function(e) {
  var el = e.target.closest("#fc-drag");
  if (!el || e.pointerType !== "touch" || !e.isPrimary || !S.flipped || swipeBusy || swipe) return;
  var target = el.querySelector(".fcard");
  swipe = {id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,dy:0,active:false,el:el};
  // Capture dès le contact, même si le doigt quitte la carte.
  try { target.setPointerCapture(e.pointerId); } catch (_) {}
  el.classList.add("dragging");
});
function paintSwipe(g) {
  var dx=g.dx, dy=g.dy, el=g.el, stamp=el.querySelector(".fc-stamp");
  el.style.transform="translate3d("+dx+"px,"+(dy*.65)+"px,0) rotate("+Math.max(-12,Math.min(12,dx/18))+"deg)";
  el.classList.toggle("swipe-yes",dx>0); el.classList.toggle("swipe-no",dx<0);
  stamp.className="fc-stamp "+(dx>0?"yes":"no"); stamp.textContent=dx>0?"Je savais":"À revoir"; stamp.style.opacity=Math.min(1,Math.abs(dx)/65);
}
app.addEventListener("pointermove", function(e) {
  if (!swipe || swipe.id !== e.pointerId) return;
  var g=swipe;
  g.dx=e.clientX-g.x; g.dy=e.clientY-g.y;
  if (!g.active && Math.hypot(g.dx,g.dy)<5) return;
  g.active=true;
  if(e.cancelable) e.preventDefault();
  paintSwipe(g);
}, {passive:false});
function endSwipe(e, cancelled) {
  if (!swipe || swipe.id !== e.pointerId) return;
  var g=swipe; swipe=null;
  var el=g.el;
  el.classList.remove("dragging");
  if (!g.active) return;
  blockClickUntil=Date.now()+350;
  if (!cancelled) { g.dx=e.clientX-g.x; g.dy=e.clientY-g.y; }
  if (!cancelled && Math.abs(g.dx)>=Math.min(85,el.offsetWidth*.22) && Math.abs(g.dx)>Math.abs(g.dy)*.85) {
    swipeBusy=true;
    var ok=g.dx>0, deck=S.deck, ci=S.ci;
    el.style.transform="translate3d("+(ok?1:-1)*(window.innerWidth+el.offsetWidth)+"px,"+(g.dy*.65)+"px,0) rotate("+(ok?18:-18)+"deg)"; el.style.opacity="0";
    setTimeout(function(){ swipeBusy=false; if(S.view==="card" && S.deck===deck && S.ci===ci && el.isConnected) rate(ok); },matchMedia("(prefers-reduced-motion: reduce)").matches?0:240);
  } else {
    el.style.transform=""; el.classList.remove("swipe-yes","swipe-no"); el.querySelector(".fc-stamp").style.opacity=0;
  }
}
app.addEventListener("pointerup",function(e){endSwipe(e,false);});
app.addEventListener("pointercancel",function(e){endSwipe(e,true);});
app.addEventListener("lostpointercapture",function(e){endSwipe(e,true);});

function cardResultView() {
  var s = findSubject(S.subject), d = S.deck, total = S.cards.length;
  var known = S.known.filter(Boolean).length, missed = S.missed;
  var pct = Math.round((known / total) * 100);
  var verdict = pct >= 80 ? "Très bien mémorisé." : pct >= 60 ? "Presque : reprends les cartes à revoir." : "À retravailler : refais les cartes à revoir.";
  var review = "";
  if (missed.length) {
    review = '<div class="review"><h2>À revoir (' + missed.length + ")</h2>" + missed.map(function (ci) {
      var c = d.cards[ci];
      return '<div class="rev"><p>' + esc(c.q) + '</p><div class="a yes"><b>Réponse :</b> ' + esc(c.a) + "</div></div>";
    }).join("") + "</div>";
  }
  var again = '<button class="btn" data-act="deck-retry">Refaire le paquet</button>' +
    (missed.length ? '<button class="btn ghost" data-act="deck-retry-missed">Refaire les cartes à revoir</button>' : "") +
    '<button class="btn ghost" data-act="decks">Retour aux paquets</button>';
  return '<div style="--c:var(' + s.color + ')"><p class="brand">' + esc(s.name) + " · Flashcards</p>" +
    '<h1 tabindex="-1" id="focus">' + esc(d.title) + "</h1>" +
    '<div class="score">' + known + "<small>/" + total + "</small></div>" +
    '<p class="verdict">' + pct + " % de cartes sues. " + verdict + "</p>" +
    '<div class="actions">' + again + "</div>" + review + "</div>";
}

function startDeck(id, only) {
  var s = findSubject(S.subject), d = decksOf(s).filter(function (x) { return x.id === id; })[0];
  var idx = d.cards.map(function (_, k) { return k; });
  if (only) idx = idx.filter(function (k) { return only.indexOf(k) !== -1; });
  if (S.shuffleC) idx = shuffleArr(idx);
  S.deck = d; S.cards = idx; S.ci = 0; S.flipped = false; S.known = []; S.missed = []; S.view = "card";
  render("flip-card");
}

function rate(ok) {
  if (S.view !== "card" || !S.flipped || swipeBusy) return;
  S.known[S.ci] = ok;
  if (S.ci === S.cards.length - 1) {
    S.missed = S.cards.filter(function (ci, pos) { return !S.known[pos]; });
    S.view = "cardresult";
    render();
  } else {
    S.ci++; S.flipped = false;
    render("flip-card");
  }
}

var VIEWS = { home: homeView, mode: modeView, courses: coursesView, course: courseView, subject: subjectView, decks: decksView, quiz: quizView, result: resultView, card: cardView, cardresult: cardResultView };

/* ---------- Rendu et actions ---------- */
function render(focusId) {
  swipe = null;
  app.innerHTML = VIEWS[S.view]();
  var el = document.getElementById(focusId || "focus");
  if (el) { try { el.focus({ preventScroll: !!focusId }); } catch (e) {} }
  if (!focusId) window.scrollTo(0, 0);
}

function start(qcmId, onlyIds) {
  var s = findSubject(S.subject), q = findQcm(s, qcmId);
  var ids = q.questions.map(function (_, k) { return k; });
  if (onlyIds) ids = ids.filter(function (k) { return onlyIds.indexOf(k) !== -1; });
  if (S.shuffleQ) ids = shuffleArr(ids);
  S.qcm = q; S.partial = !!onlyIds;
  S.items = ids.map(function (qi) {
    var n = q.questions[qi][1].length, order = [];
    for (var k = 0; k < n; k++) order.push(k);
    return { qi: qi, map: S.shuffleA ? shuffleArr(order) : order };
  });
  S.i = 0; S.picks = []; S.view = "quiz";
  render();
}

function finish() {
  var q = S.qcm, score = 0, wrongIds = [];
  S.items.forEach(function (it, pos) {
    if (S.picks[pos] === correctPos(it)) score++; else wrongIds.push(it.qi);
  });
  S.last = { wrongIds: wrongIds };
  if (!S.partial) {
    var stats = loadStats(), prev = stats[q.id];
    stats[q.id] = { last: score, best: prev ? Math.max(prev.best, score) : score };
    saveStats(stats);
  }
  S.view = "result";
  render();
}

function advance() {
  if (S.i === S.items.length - 1) finish(); else { S.i++; render(); }
}

app.addEventListener("click", function (e) {
  var t = e.target.closest("[data-act]");
  if (!t) return;
  var act = t.getAttribute("data-act");
  if (act === "flip" && t.id === "flip-card" && Date.now() < blockClickUntil) return;
  if (swipeBusy && (act === "flip" || act === "know" || act === "redo")) return;
  if (act === "home") { S.view = "home"; render(); }
  else if (act === "subject") { S.subject = t.getAttribute("data-id"); S.view = "mode"; render(); }
  else if (act === "modes") { S.view = "mode"; render(); }
  else if (act === "mode-cours") { S.view = "courses"; render(); }
  else if (act === "course-open") { S.courseIndex = Number(t.getAttribute("data-i")); S.view = "course"; render(); }
  else if (act === "mode-qcm") { S.view = "subject"; render(); }
  else if (act === "mode-cards" || act === "decks") { S.view = "decks"; render(); }
  else if (act === "deck-start") { startDeck(t.getAttribute("data-id"), null); }
  else if (act === "flip") { flipCard(); }
  else if (act === "know") { rate(true); }
  else if (act === "redo") { rate(false); }
  else if (act === "deck-retry") { startDeck(S.deck.id, null); }
  else if (act === "deck-retry-missed") { startDeck(S.deck.id, S.missed); }
  else if (act === "toggle") { var key = t.getAttribute("data-k"); S[key] = !S[key]; render(t.id); }
  else if (act === "start") { start(t.getAttribute("data-id"), null); }
  else if (act === "quit") { S.view = "subject"; render(); }
  else if (act === "pick") {
    if (S.picks[S.i] !== undefined && S.picks[S.i] !== null) return;
    S.picks[S.i] = parseInt(t.getAttribute("data-i"), 10);
    render("next");
  }
  else if (act === "next") { advance(); }
  else if (act === "retry") { start(S.qcm.id, null); }
  else if (act === "retry-wrong") { start(S.qcm.id, S.last.wrongIds); }
});

document.addEventListener("keydown", function (e) {
  if (S.view === "card" && S.flipped && !e.ctrlKey && !e.metaKey && !e.altKey) {
    if (e.key === "ArrowLeft" || e.key === "1") { e.preventDefault(); rate(false); }
    else if (e.key === "ArrowRight" || e.key === "2") { e.preventDefault(); rate(true); }
    return;
  }
  if (S.view !== "quiz" || e.ctrlKey || e.metaKey || e.altKey) return;
  var locked = S.picks[S.i] !== undefined && S.picks[S.i] !== null;
  var k = e.key.toLowerCase(), idx = k.length === 1 ? "abcd".indexOf(k) : -1;
  if (idx === -1 && k.length === 1 && "1234".indexOf(k) !== -1) idx = parseInt(k, 10) - 1;
  if (idx !== -1 && !locked) {
    if (idx < S.items[S.i].map.length) { S.picks[S.i] = idx; render("next"); }
  } else if (locked && (e.key === "ArrowRight" || e.key === "Enter") && document.activeElement && document.activeElement.id !== "next") {
    e.preventDefault();
    advance();
  }
});

render();
</script>

</body></html>
