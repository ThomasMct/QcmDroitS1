 **propriété**, mais plutôt sa **juridiction**, c’est-à-dire la zone territoriale placée sous son autorité (la propriété publique est d’ailleurs soumise à des règles très strictes, l’État n’est pas un propriétaire comme un autre quand il l’est).*\n\n\n\n**§2 – La citoyenneté **\n\n- *La citoyenneté est en principe le **lien d’allégeance exclusive** qui lie depuis l’ère moderne un individu personne physique à un État (dimension patriotique : on est membre d’un ensemble national). On parlait autrefois des **sujets du roi**¸ pour désigner ceux qui étaient assujettis à son pouvoir de commandement – à dissocier toutefois des serfs, propriétés de leurs seigneurs. Aujourd’hui, nous ne sommes les sujets de personne, sinon de l’État lui-même, ou **sujets de droit**.*\n- *La citoyenneté correspond peu ou prou à cette notion de sujet de droit, quoique le plus souvent on identifie aussi des droits de la citoyenneté : droit de vote, droit à l’ordre public, voire catalogue des droits et libertés.*\n- *Le droit constitutionnel joue ici un rôle crucial, même s’il est complété nécessairement par la loi (droit du sol à Mayotte, mai 2025). Il va notamment **définir les conditions de la citoyenneté**, et apporter des garanties quant à **l’exercice des droits de citoyenneté**.*\n- ***Article 3 al. 3 et 4 de la Constitution** : Le suffrage peut être direct ou indirect dans les conditions prévues par la Constitution. Il est toujours universel, égal et secret. // Sont électeurs, dans les conditions déterminées par la loi, tous les nationaux français majeurs des deux sexes, jouissant de leurs droits civils et politiques.*\n- *On considère que l’ensemble des citoyens forme le **peuple** et non pas tant une **nation** ; notion également plus restreinte que celle de population ou ressortissants (incluant les mineurs), et que celle d’habitants (étrangers).*\n- *Si l’État est une forme structurée d’exercice du pouvoir politique, il doit avoir une population à l’égard de laquelle il peut exercer son autorité (l’autorité s’exerce toujours sur des personnes, jamais sur des biens). C’est finalement assez logique.*\n\n\n\n**§3 – La reconnaissance **\n\n- *Territoire et population sont nécessaires à un État, ils ne sont pas suffisants ; le droit constitutionnel est en tant que tel impuissant en la matière, car s’il donne une structure institutionnelle et une figure à l’État, il ne permet pas de le créer, seuls les autres États le peuvent.*\n- *C’est par la **reconnaissance internationale** par ses pairs qu’un État voit ses frontières reconnues et leur intégrité protégée au titre du droit international ; que des relations internationales se déploient ; que l’autorité du droit national n’est pas concurrencée par celle d’un autre État.*\n\n*⇒ Débat de la **décolonisation**, jusqu’à la Palestine aujourd’hui ; ou de la **sécession** (Nouvelle-Calédonie ? Ecosse, Catalogne, Corse, Vénétie / Kosovo reconnu depuis 2008 par une petite moitié des 193 membres de l’ONU…)*\n\n- *Bien qu’on l’évoque plus rarement en droit, la reconnaissance déterminante pour l’existence d’un État est aussi interne, par les citoyens qui admettent de se soumettre au pouvoir de commandement de la puissance publique.*\n\n\n\n\n\n**Section 2 – Les conséquences de l’existence d’un État : la souveraineté **\n\n- ***Souveraineté** : caractère d’un pouvoir politique ; **exercer un pouvoir supposant une volonté**, seule une personne réelle ou fictive peut être **souveraine**. (La Constitution ne saurait donc l’être !!)*\n- *La souveraineté de l’État qualifie donc le pouvoir que celui-ci exerce sur un territoire et une population. Mais tout ceci n’est pas une définition.*\n\n* *La souveraineté de l’État peut se définir (**Georg Jellinek**) comme la compétence de la compétence : l’État est souverain parce qu’il décide lui-même dans quel domaine il est compétent, dans quel champ il va pouvoir agir, quels domaines de la vie il va régenter, par l’exercice de sa puissance. **La souveraineté de l’État** correspond donc **à sa** **liberté, à son indépendance**.*\n* *Ce statut n’a pas toujours existé dans l’histoire mondiale, et on considère aujourd’hui que la souveraineté **est **ce qui caractérise **l’État comme forme moderne du pouvoir politique** : on invente les termes à peu près en même temps (§2) et ils apparaissent pour identifier un phénomène historiquement situé (§1) ; ce qui tend à prouver que, frappé d’historicité, l’État est également susceptible d’être marqué par la désuétude (§3).*\n\n\n\n**§1 – L’apparition de l’État **\n\n*L’État apparaît historiquement en émergeant face à deux formes de domination antérieures, la féodalité et l’empire (haut moyen-âge).*\n\n- ***Féodalité** : lien personnel entre des vassaux et des seigneurs, voire des suzerains (et non des souverains) ; chaque seigneur a droit de faire régner la justice et d’édicter sa loi sur sa terre ; la puissance (politique) vient de la puissance militaire, et de la puissance économique (possession de la terre et de la force de travail par le servage).*\n- ***Empire **: Saint-Empire romain germanique (temporel) et Saint-Siège (spirituel), qui revendiquent l’héritage romain ; le droit mis en œuvre est le fruit de coutumes confusément interprétées et les deux puissances militaires dominent les « rois » en cherchant à les soumettre, par la force.*\n\n*Dans ce contexte, l’État apparaît au tournant des XIIIe et XIVe siècles, lorsqu’il opère une double rupture qui va permettre de **substituer la souveraineté à la suzeraineté**.*\n\n- ***Centralisation **entre les mains du roi,** des attributs du pouvoir politique** : le roi devient le suzerain d’un plus grand nombre de seigneurs, et il leur confisque le droit de rendre la justice (donc de dire le droit et finalement de faire la loi). Saint-Louis sous son chêne…*\n- ***Émancipation du pouvoir politique à l’égard de la puissance économique et militaire **: la légitimité à exercer le pouvoir ultime et incontesté ne naît pas de la propriété ou du nombre de soldats (remise en cause et de la vassalité et de l'impérialisme) ; l’imperium se dissocie du dominium (ce qui libère en retour la puissance économique, détachée de la terre).*\n- ***Affranchissement de la domination impériale** : bataille de Bouvines (1214) conduite par **Philippe-Auguste** contre les imprécations du pape essayant d’arbitrer ses rapports avec Jean sans Terre / menace d’excommunication de **Philippe le Bel **(**Guillaume de Nogaret,** pape emmené à Avignon 1303). ⇒ indépendance du pouvoir étatique à l’égard des puissances extérieures.*\n\n* **ATTENTION** ! Cela implique donc que l’État n’apparaît pas, dans le cas français, en 1789 ! L’État préexiste à la Révolution de plusieurs siècles, et c’est seulement le régime politique qui va changer à la fin du XVIIIe, au sein d’un cadre – l’État – qui reste lui inchangé (à la limite, État-nation, et encore…).*\n\n\n\n**§2 – Définition et conceptualisation de la souveraineté de l’État **\n\n**A. La conceptualisation au XVIe siècle **\n\n- *On estime que la souveraineté, qui caractérise l’État, n’a pas toujours existé mais s’est construite, sous les efforts conjugués de différents rois, sur le point de devenir souverains. C’est seulement au XVIe siècle que les penseurs européens vont **nommer** ce phénomène politique inédit.*\n- *Importance des mots pour penser : bleu en russe // Mots interdits par **D. Trump // O. Beaud.***\n\n* **Nicolas Machiavel** (1469-1527) : penseur politique et philosophique florentin, attaché aux services de Laurent II de Médicis. Il lui dédie en 1513 son ouvrage le plus célèbre, *Le Prince*, dans lequel il tente d’analyser la meilleure façon d’exercer le pouvoir.\n* C’est dans cet ouvrage qu’il utilise le mot *stato*, l’état, en lui ajoutant à dessein une majuscule, pour distinguer cet état des autres. On considère que c’est lui qui invente le mot, et vous voudrez donc bien, lorsque vous évoquez l’État comme forme politique moderne, lui attribuer la majuscule que Machiavel a inventée.\n\n- **Jean Bodin** (1529-1596) : jurisconsulte en France, il conseille différents rois et publie un ouvrage majeur, *Les Six Livres de la République *en 1576. On y trouve notamment cette phrase : « *République est un droit gouvernement de plusieurs ménages, et de ce qui leur est commun, avec puissance souveraine* ». Si on associe l’idée de République et d’État, on voit donc bien que c’est Bodin le premier qui a associé la souveraineté à l’État, qui en a fait sa caractéristique majeure.\n\n\n\n**B. La définition de la souveraineté de l’État **\n\n- Liberté et indépendance, *double facette d’une **même** pièce*.\n- On a coutume d’opposer volet interne et volet externe, ils sont en vérité la même chose.\n\n\\-       **Suprématie** : centralisation du pouvoir, ***effectif***, incontesté (monopole de la violence légitime : instrument de l’efficacité du pouvoir de commandement)\n\n\\-       **Indépendance** : pas de domination extérieure, pas de contestation de la légitimité du pouvoir de commandement.\n\no   D’où il résulte que l’État est puissant sur le plan interne mais ***égal à ses pairs*** sur le plan externe (enjeu de la reconnaissance par les autres États) ; discours souverainiste distinct d’un discours impérialiste…\n\n\\= liberté, indissociabilité des deux aspects // **indivisibilité de la souveraineté **– caractère **absolu**\n\n- Pour savoir si un État est ou non souverain, on s’intéresse aux **attributs de la souveraineté** ou **pouvoirs régaliens** (étymologiquement, du roi) : prélever l’impôt, lever une armée, entretenir des relations diplomatiques, battre monnaie, rendre la justice… Ce sont les caractéristiques d’un État souverain.\n- Est-ce à dire que la souveraineté est ***divisible*** ? Un État qui ne bat pas monnaie est-il toujours un État ? (ex. Salvador adoptant récemment le bitcoin comme seule monnaie nationale) Les attributs de la souveraineté sont en vérité **non des critères, mais des indices de la souveraineté de l’État**, les instruments de son indépendance et de sa suprématie.\n\n⇒ S’il dispose de la ***compétence de la compétence***, s’il est tout à fait indépendant, il décide librement des pouvoirs régaliens qu’il entend exercer, dont il a besoin pour préserver sa souveraineté.\n\n\n\n**C. Les implications de la souveraineté de l’État **\n\n- Regarder l’État comme souverain va produire un certain nombre d’implications sur le plan conceptuel et juridique.\n\n**1. Le développement des relations internationales **\n\n- ***Traités de Westphalie de 1648 **: établissement des règles des traités internationaux, sortes de contrats entre États. Le concept conventionnel naît de : *\n\n* *l’autonomie des États : s’ils sont indépendants, ils sont libres de **s’engager **; d’où la règle fondamentale du droit international public du Pacta sunt servanda : les États ont l’obligation de respecter leurs engagements internationaux.*\n* *l’égalité entre les États : le traité se substitue à la force brute, car il suppose que les États admettent de ne pas s’ingérer dans les affaires internes des autres États.*\n\n- *Beaucoup plus tard, par nécessité historique notamment (cf. semestre 2), les traités internationaux vont conduire à la création d’organisations internationales qui favorisent davantage encore la collaboration.*\n- *Vous noterez que, de ce point de vue, la modernité juridique implique le développement de relations internationales **juridicisées**, en substitution à des rapports de force militaires ou économiques. *\n- *La question séculaire est celle de la vérité factuelle d’une telle représentation conceptuelle : la force existe encore aujourd’hui, et elle concurrence d’ailleurs de façon évidente les normes juridiques censées s’appliquer (Ukraine, Gaza, Iran voire Irak). Elle est d’ailleurs la preuve d’une persistance de l’**impérialisme** féodal, sous d’autres formes.*\n\n**2. La personnification de l’État **\n\n- *La souveraineté étant un **pouvoir**, une puissance, elle est aussi une **volonté** (dont est particulièrement probante la définition de la convention internationale, construite sur l’idée d’un contrat). Elle est donc éminemment **politique**, quoique définie et déclinée par le droit.*\n- *Si l’État est souverain, cela signifie qu’il peut **vouloir** (contrairement à la Constitution !!) et qu’il doit donc être regardé comme une **personne morale** **de droit public**, caractérisé donc par l’omnipotence.*\n- *Si cette personnalisation est évidemment fictive, elle implique qu’une volonté réelle soit **imputée** à l’État, aux moyens du droit.*\n\n* *Sous l’ancien régime, les choses étaient assez faciles, dans la mesure où **l’exercice de la souveraineté de l’État était confié au roi seul** [L’État, c’est moi ! restant un abus de langage, guère probable dans la bouche de Louis XIV].*\n* *Tout l’enjeu du droit constitutionnel, de l’ingénierie constitutionnelle à partir du XVIIIe siècle est d’établir des mécanismes institutionnels par lesquels le soin d’exprimer la volonté de l’État va être confisqué au roi et confié aux représentants de la Nation : **transfert** de la souveraineté, nouveau lien d’imputation mais l’État reste la même coquille qui abrite le pouvoir souverain.*\n\n\n\n- ***Par conséquent** : la souveraineté de l’État, notion **absolue**, caractéristique d’un **pouvoir** **suprême **n’est pas pour autant le signe d’une oppression ou d’un totalitarisme ; c’est une notion **neutre** du point de vue des valeurs morales ou politiques. Un État souverain n’est pas forcément dictatorial, non plus que seuls les États souverains permettent le totalitarisme (réponse de **Michel Troper** aux détracteurs de Kelsen : le IIIe Reich n’était pas un État au sens strict). Tout dépend de la façon dont est exercée la souveraineté (ce que détermine le droit constitutionnel, cf. infra 2nde partie). *\n\n\n\n**§3 – La disparition de la souveraineté et de l’État ?**\n\n*État produit d’une histoire pluriséculaire, condamné au dépassement ?*\n\n- *Thèse de l’**État post-moderne **de **Jacques Chevallier** : l’État est le produit d’une philosophie politique dont les prémisses sont débordées ou oubliées :*\n\n*-       l’individualisme a succédé à l’humanisme*\n\n*-       le pouvoir privé financier s’est substitué au pouvoir public d’intérêt général*\n\n*-       la « gouvernance » a succédé à la souveraineté.*\n\n- *On peut aussi identifier les apories ou les impuissances d’un modèle qu’on pensait indémodable, et qui est partout remis en cause : il n’y a qu’à voir les reculs des acquis libéraux sur les droits individuels, ou les crimes de guerre qui sont dénoncés partout, sans remettre en cause l’impunité de leurs auteurs (impuissance du droit international à empêcher même la guerre en Irak en 2003). Ou l’homme le plus riche du monde qui salue la foule avec un geste évidemment nazi…*\n- *Délitement de l’État comme forme politique reconnue, qui laisse potentiellement augurer d’une symétrie de l’histoire **(A. Viala)** ?*\n\n*-       Retour à la vassalité par les liens étroits entre possession économique et pouvoir politique (+ voir **Yánis Varoufákis**, ancien ministre grec des Finances en 2015, qui évoque la féodalité numérique)*\n\n*-       Retour à l’impérialisme par un usage immodéré de la force, économique longtemps, militaire désormais, qui ronge l’indépendance des États et vide de leur sens les stipulations du droit international.*\n\n- *Aujourd’hui toutefois, même si on est dans une dynamique de dépassement, ou à cause de cela justement, on est obligé de penser à l'État et la souveraineté qui restent encore le modèle promu par le droit (constitutionnel) positif. Dans une certaine mesure évidemment, le droit reste idéal et ne dit pas tout des rapports de forces politiques et sociaux qui sont effectivement à l’œuvre ; il faut donc vous garder de toute naïveté à ce sujet.  *\n", "html": "<h2>Chapitre 1 – La définition de l’État</h2>\n<ul>\n<li>Le mot État prend toujours une majuscule, pour distinguer la forme politique ainsi désignée (synonyme approximatif de pays, plus vague et moins juridique) du mot commun désignant une situation ou une condition de fait (état de fait, état des lieux, remise en l’état…). C’est d’ailleurs comme cela qu’il a été inventé : par l’attribution d’une majuscule de nature à souligner un état de fait politique.</li>\n<li><em>Car l’État comme je vais vous le définir n’a pas toujours existé, il correspond à la <strong>forme moderne de la politique</strong> (<strong>S. Goyard-Fabre</strong>), par référence à la <strong>modernité philosophique et juridique : tournant renaissant et humaniste des XVe et XVIe siècles, qui place l’homme au cœur de toute chose (subjectivisme), qui fait du droit l’expression d’une volonté (et non de la nature) et qui valorise la Raison</strong> (René Descartes 1596-1650).</em></li>\n<li><em>L’État aujourd’hui correspond encore fondamentalement au modèle politique émergent à cette période, spécifiquement en France (mais aussi en Angleterre ou en Espagne). Et le droit constitutionnel s’en est saisi, au moment de son avènement, comme d’un objet politique qu’il prétendait discipliner. C’est la Constitution qui participe à déterminer les composantes de l’État (Section 1), qui elles-mêmes permettent à la souveraineté de se manifester (Section 2).</em></li>\n</ul>\n<h2>Section 1 – Les conditions de l’existence d’un État</h2>\n<ul>\n<li><em>On a coutume en droit international de définir l’État comme la réunion de trois éléments que sont un territoire, une population et une puissance publique effective exercée à leur endroit. Le droit constitutionnel participe à la définition de chacun de ces éléments, quoiqu’ils supposent également une reconnaissance sur le plan international.</em></li>\n</ul>\n<h3>§1 – Le territoire</h3>\n<p class=\"lesson-note\"><em>⇒ Zone géographique délimitée par des frontières ; peut contenir des enclaves ou ne pas être d’un seul tenant. Se définit comme la surface sur laquelle va s’exercer l’autorité de la puissance publique.</em></p>\n<ul>\n<li><p>* Le territoire ne comprend pas seulement la terre, mais également l’espace aérien et maritime [mer territoriale (12 milles donc 22 km) : souveraineté totale, sol et sous-sol compris // zone contiguë (24 milles donc 44,5 km) : droits de douane et de police // zone économique exclusive (200 milles donc 370 km) : exclusivité économique].</p>\n</li>\n<li><p><em>Tout le territoire est rattaché à un État parce que celui-ci le <strong>revendique</strong> mais également parce que les autres États – par le droit international – lui en reconnaissent la jouissance ; toutes les frontières ne sont valables que par convention, de même qu’il est décidé au niveau international de l’ampleur de la ZEE par exemple.</em></p>\n</li>\n<li><p><em>Le <strong>droit constitutionnel</strong> établit toutefois en général certaines règles à propos du territoire national ; ainsi en France, le Président est « garant de l’intégrité du territoire », une loi est nécessaire pour ratifier les traités internationaux procédant à une cession ou une adjonction territoriale (art. 53), de même que « Nulle cession, nul échange, nulle adjonction de territoire n'est valable sans le consentement des populations intéressées » (art. 53 al. 3).</em></p>\n</li>\n<li class=\"lesson-note\"><p><em>Attention ! Le territoire de l’État n’est pas (forcément) sa <strong>propriété</strong>, mais plutôt sa <strong>juridiction</strong>, c’est-à-dire la zone territoriale placée sous son autorité (la propriété publique est d’ailleurs soumise à des règles très strictes, l’État n’est pas un propriétaire comme un autre quand il l’est).</em></p>\n</li>\n</ul>\n<h3>§2 – La citoyenneté</h3>\n<ul>\n<li><em>La citoyenneté est en principe le <strong>lien d’allégeance exclusive</strong> qui lie depuis l’ère moderne un individu personne physique à un État (dimension patriotique : on est membre d’un ensemble national). On parlait autrefois des <strong>sujets du roi</strong>¸ pour désigner ceux qui étaient assujettis à son pouvoir de commandement – à dissocier toutefois des serfs, propriétés de leurs seigneurs. Aujourd’hui, nous ne sommes les sujets de personne, sinon de l’État lui-même, ou <strong>sujets de droit</strong>.</em></li>\n<li><em>La citoyenneté correspond peu ou prou à cette notion de sujet de droit, quoique le plus souvent on identifie aussi des droits de la citoyenneté : droit de vote, droit à l’ordre public, voire catalogue des droits et libertés.</em></li>\n<li><em>Le droit constitutionnel joue ici un rôle crucial, même s’il est complété nécessairement par la loi (droit du sol à Mayotte, mai 2025). Il va notamment <strong>définir les conditions de la citoyenneté</strong>, et apporter des garanties quant à <strong>l’exercice des droits de citoyenneté</strong>.</em></li>\n<li>Article 3 al. 3 et 4 de la Constitution : Le suffrage peut être direct ou indirect dans les conditions prévues par la Constitution. Il est toujours universel, égal et secret. // Sont électeurs, dans les conditions déterminées par la loi, tous les nationaux français majeurs des deux sexes, jouissant de leurs droits civils et politiques.</li>\n<li><em>On considère que l’ensemble des citoyens forme le <strong>peuple</strong> et non pas tant une <strong>nation</strong> ; notion également plus restreinte que celle de population ou ressortissants (incluant les mineurs), et que celle d’habitants (étrangers).</em></li>\n<li><em>Si l’État est une forme structurée d’exercice du pouvoir politique, il doit avoir une population à l’égard de laquelle il peut exercer son autorité (l’autorité s’exerce toujours sur des personnes, jamais sur des biens). C’est finalement assez logique.</em></li>\n</ul>\n<h3>§3 – La reconnaissance</h3>\n<ul>\n<li><em>Territoire et population sont nécessaires à un État, ils ne sont pas suffisants ; le droit constitutionnel est en tant que tel impuissant en la matière, car s’il donne une structure institutionnelle et une figure à l’État, il ne permet pas de le créer, seuls les autres États le peuvent.</em></li>\n<li><em>C’est par la <strong>reconnaissance internationale</strong> par ses pairs qu’un État voit ses frontières reconnues et leur intégrité protégée au titre du droit international ; que des relations internationales se déploient ; que l’autorité du droit national n’est pas concurrencée par celle d’un autre État.</em></li>\n</ul>\n<p class=\"lesson-note\"><em>⇒ Débat de la <strong>décolonisation</strong>, jusqu’à la Palestine aujourd’hui ; ou de la <strong>sécession</strong> (Nouvelle-Calédonie ? Ecosse, Catalogne, Corse, Vénétie / Kosovo reconnu depuis 2008 par une petite moitié des 193 membres de l’ONU…)</em></p>\n<ul>\n<li><em>Bien qu’on l’évoque plus rarement en droit, la reconnaissance déterminante pour l’existence d’un État est aussi interne, par les citoyens qui admettent de se soumettre au pouvoir de commandement de la puissance publique.</em></li>\n</ul>\n<h2>Section 2 – Les conséquences de l’existence d’un État : la souveraineté</h2>\n<ul>\n<li>Souveraineté : caractère d’un pouvoir politique ; <strong>exercer un pouvoir supposant une volonté</strong>, seule une personne réelle ou fictive peut être <strong>souveraine</strong>. (La Constitution ne saurait donc l’être !!)</li>\n<li><em>La souveraineté de l’État qualifie donc le pouvoir que celui-ci exerce sur un territoire et une population. Mais tout ceci n’est pas une définition.</em></li>\n</ul>\n<ul>\n<li><em>La souveraineté de l’État peut se définir (<strong>Georg Jellinek</strong>) comme la compétence de la compétence : l’État est souverain parce qu’il décide lui-même dans quel domaine il est compétent, dans quel champ il va pouvoir agir, quels domaines de la vie il va régenter, par l’exercice de sa puissance. <strong>La souveraineté de l’État</strong> correspond donc <strong>à sa</strong> <strong>liberté, à son indépendance</strong>.</em></li>\n<li><em>Ce statut n’a pas toujours existé dans l’histoire mondiale, et on considère aujourd’hui que la souveraineté <strong>est ce qui caractérise l’État comme forme moderne du pouvoir politique</strong> : on invente les termes à peu près en même temps (§2) et ils apparaissent pour identifier un phénomène historiquement situé (§1) ; ce qui tend à prouver que, frappé d’historicité, l’État est également susceptible d’être marqué par la désuétude (§3).</em></li>\n</ul>\n<h3>§1 – L’apparition de l’État</h3>\n<p><em>L’État apparaît historiquement en émergeant face à deux formes de domination antérieures, la féodalité et l’empire (haut moyen-âge).</em></p>\n<ul>\n<li>Féodalité : lien personnel entre des vassaux et des seigneurs, voire des suzerains (et non des souverains) ; chaque seigneur a droit de faire régner la justice et d’édicter sa loi sur sa terre ; la puissance (politique) vient de la puissance militaire, et de la puissance économique (possession de la terre et de la force de travail par le servage).</li>\n<li>Empire : Saint-Empire romain germanique (temporel) et Saint-Siège (spirituel), qui revendiquent l’héritage romain ; le droit mis en œuvre est le fruit de coutumes confusément interprétées et les deux puissances militaires dominent les « rois » en cherchant à les soumettre, par la force.</li>\n</ul>\n<p><em>Dans ce contexte, l’État apparaît au tournant des XIIIe et XIVe siècles, lorsqu’il opère une double rupture qui va permettre de <strong>substituer la souveraineté à la suzeraineté</strong>.</em></p>\n<ul>\n<li>Centralisation <strong>entre les mains du roi,</strong> des attributs du pouvoir politique : le roi devient le suzerain d’un plus grand nombre de seigneurs, et il leur confisque le droit de rendre la justice (donc de dire le droit et finalement de faire la loi). Saint-Louis sous son chêne…</li>\n<li>Émancipation du pouvoir politique à l’égard de la puissance économique et militaire : la légitimité à exercer le pouvoir ultime et incontesté ne naît pas de la propriété ou du nombre de soldats (remise en cause et de la vassalité et de l'impérialisme) ; l’imperium se dissocie du dominium (ce qui libère en retour la puissance économique, détachée de la terre).</li>\n<li>Affranchissement de la domination impériale : bataille de Bouvines (1214) conduite par <strong>Philippe-Auguste</strong> contre les imprécations du pape essayant d’arbitrer ses rapports avec Jean sans Terre / menace d’excommunication de <strong>Philippe le Bel (</strong>Guillaume de Nogaret, pape emmené à Avignon 1303). ⇒ indépendance du pouvoir étatique à l’égard des puissances extérieures.</li>\n</ul>\n<p class=\"lesson-note\">* <strong>ATTENTION</strong> ! Cela implique donc que l’État n’apparaît pas, dans le cas français, en 1789 ! L’État préexiste à la Révolution de plusieurs siècles, et c’est seulement le régime politique qui va changer à la fin du XVIIIe, au sein d’un cadre – l’État – qui reste lui inchangé (à la limite, État-nation, et encore…).</p>\n<h3>§2 – Définition et conceptualisation de la souveraineté de l’État</h3>\n<h4>A. La conceptualisation au XVIe siècle</h4>\n<ul>\n<li><em>On estime que la souveraineté, qui caractérise l’État, n’a pas toujours existé mais s’est construite, sous les efforts conjugués de différents rois, sur le point de devenir souverains. C’est seulement au XVIe siècle que les penseurs européens vont <strong>nommer</strong> ce phénomène politique inédit.</em></li>\n<li>Importance des mots pour penser : bleu en russe // Mots interdits par D. Trump // O. Beaud.</li>\n</ul>\n<ul>\n<li><strong>Nicolas Machiavel</strong> (1469-1527) : penseur politique et philosophique florentin, attaché aux services de Laurent II de Médicis. Il lui dédie en 1513 son ouvrage le plus célèbre, <em>Le Prince</em>, dans lequel il tente d’analyser la meilleure façon d’exercer le pouvoir.</li>\n<li>C’est dans cet ouvrage qu’il utilise le mot <em>stato</em>, l’état, en lui ajoutant à dessein une majuscule, pour distinguer cet état des autres. On considère que c’est lui qui invente le mot, et vous voudrez donc bien, lorsque vous évoquez l’État comme forme politique moderne, lui attribuer la majuscule que Machiavel a inventée.</li>\n</ul>\n<ul>\n<li><strong>Jean Bodin</strong> (1529-1596) : jurisconsulte en France, il conseille différents rois et publie un ouvrage majeur, <em>Les Six Livres de la République en 1576. On y trouve notamment cette phrase : « République est un droit gouvernement de plusieurs ménages, et de ce qui leur est commun, avec puissance souveraine</em> ». Si on associe l’idée de République et d’État, on voit donc bien que c’est Bodin le premier qui a associé la souveraineté à l’État, qui en a fait sa caractéristique majeure.</li>\n</ul>\n<h4>B. La définition de la souveraineté de l’État</h4>\n<ul>\n<li>Liberté et indépendance, <em>double facette d’une <strong>même</strong> pièce</em>.</li>\n<li>On a coutume d’opposer volet interne et volet externe, ils sont en vérité la même chose.</li>\n</ul>\n<p>-       <strong>Suprématie</strong> : centralisation du pouvoir, <em><strong>effectif</strong></em>, incontesté (monopole de la violence légitime : instrument de l’efficacité du pouvoir de commandement)</p>\n<p>-       <strong>Indépendance</strong> : pas de domination extérieure, pas de contestation de la légitimité du pouvoir de commandement.</p>\n<p>o   D’où il résulte que l’État est puissant sur le plan interne mais <em><strong>égal à ses pairs</strong></em> sur le plan externe (enjeu de la reconnaissance par les autres États) ; discours souverainiste distinct d’un discours impérialiste…</p>\n<p>= liberté, indissociabilité des deux aspects // <strong>indivisibilité de la souveraineté – caractère absolu</strong></p>\n<ul>\n<li>Pour savoir si un État est ou non souverain, on s’intéresse aux <strong>attributs de la souveraineté</strong> ou <strong>pouvoirs régaliens</strong> (étymologiquement, du roi) : prélever l’impôt, lever une armée, entretenir des relations diplomatiques, battre monnaie, rendre la justice… Ce sont les caractéristiques d’un État souverain.</li>\n<li>Est-ce à dire que la souveraineté est <em><strong>divisible</strong></em> ? Un État qui ne bat pas monnaie est-il toujours un État ? (ex. Salvador adoptant récemment le bitcoin comme seule monnaie nationale) Les attributs de la souveraineté sont en vérité <strong>non des critères, mais des indices de la souveraineté de l’État</strong>, les instruments de son indépendance et de sa suprématie.</li>\n</ul>\n<p class=\"lesson-note\">⇒ S’il dispose de la <em><strong>compétence de la compétence</strong></em>, s’il est tout à fait indépendant, il décide librement des pouvoirs régaliens qu’il entend exercer, dont il a besoin pour préserver sa souveraineté.</p>\n<h4>C. Les implications de la souveraineté de l’État</h4>\n<ul>\n<li>Regarder l’État comme souverain va produire un certain nombre d’implications sur le plan conceptuel et juridique.</li>\n</ul>\n<h5>1. Le développement des relations internationales</h5>\n<ul>\n<li>Traités de Westphalie de 1648 : établissement des règles des traités internationaux, sortes de contrats entre États. Le concept conventionnel naît de : *</li>\n</ul>\n<ul>\n<li><em>l’autonomie des États : s’ils sont indépendants, ils sont libres de s’engager ; d’où la règle fondamentale du droit international public du Pacta sunt servanda : les États ont l’obligation de respecter leurs engagements internationaux.</em></li>\n<li><em>l’égalité entre les États : le traité se substitue à la force brute, car il suppose que les États admettent de ne pas s’ingérer dans les affaires internes des autres États.</em></li>\n</ul>\n<ul>\n<li><em>Beaucoup plus tard, par nécessité historique notamment (cf. semestre 2), les traités internationaux vont conduire à la création d’organisations internationales qui favorisent davantage encore la collaboration.</em></li>\n<li>Vous noterez que, de ce point de vue, la modernité juridique implique le développement de relations internationales <strong>juridicisées</strong>, en substitution à des rapports de force militaires ou économiques. *</li>\n<li><em>La question séculaire est celle de la vérité factuelle d’une telle représentation conceptuelle : la force existe encore aujourd’hui, et elle concurrence d’ailleurs de façon évidente les normes juridiques censées s’appliquer (Ukraine, Gaza, Iran voire Irak). Elle est d’ailleurs la preuve d’une persistance de l’<strong>impérialisme</strong> féodal, sous d’autres formes.</em></li>\n</ul>\n<h5>2. La personnification de l’État</h5>\n<ul>\n<li><em>La souveraineté étant un <strong>pouvoir</strong>, une puissance, elle est aussi une <strong>volonté</strong> (dont est particulièrement probante la définition de la convention internationale, construite sur l’idée d’un contrat). Elle est donc éminemment <strong>politique</strong>, quoique définie et déclinée par le droit.</em></li>\n<li><em>Si l’État est souverain, cela signifie qu’il peut <strong>vouloir</strong> (contrairement à la Constitution !!) et qu’il doit donc être regardé comme une <strong>personne morale</strong> <strong>de droit public</strong>, caractérisé donc par l’omnipotence.</em></li>\n<li><em>Si cette personnalisation est évidemment fictive, elle implique qu’une volonté réelle soit <strong>imputée</strong> à l’État, aux moyens du droit.</em></li>\n</ul>\n<ul>\n<li><em>Sous l’ancien régime, les choses étaient assez faciles, dans la mesure où <strong>l’exercice de la souveraineté de l’État était confié au roi seul</strong> [L’État, c’est moi ! restant un abus de langage, guère probable dans la bouche de Louis XIV].</em></li>\n<li><em>Tout l’enjeu du droit constitutionnel, de l’ingénierie constitutionnelle à partir du XVIIIe siècle est d’établir des mécanismes institutionnels par lesquels le soin d’exprimer la volonté de l’État va être confisqué au roi et confié aux représentants de la Nation : <strong>transfert</strong> de la souveraineté, nouveau lien d’imputation mais l’État reste la même coquille qui abrite le pouvoir souverain.</em></li>\n</ul>\n<ul>\n<li>Par conséquent : la souveraineté de l’État, notion <strong>absolue</strong>, caractéristique d’un <strong>pouvoir</strong> <strong>suprême n’est pas pour autant le signe d’une oppression ou d’un totalitarisme ; c’est une notion neutre</strong> du point de vue des valeurs morales ou politiques. Un État souverain n’est pas forcément dictatorial, non plus que seuls les États souverains permettent le totalitarisme (réponse de <strong>Michel Troper</strong> aux détracteurs de Kelsen : le IIIe Reich n’était pas un État au sens strict). Tout dépend de la façon dont est exercée la souveraineté (ce que détermine le droit constitutionnel, cf. infra 2nde partie). *</li>\n</ul>\n<h3>§3 – La disparition de la souveraineté et de l’État ?</h3>\n<p><em>État produit d’une histoire pluriséculaire, condamné au dépassement ?</em></p>\n<ul>\n<li><em>Thèse de l’<strong>État post-moderne de Jacques Chevallier</strong> : l’État est le produit d’une philosophie politique dont les prémisses sont débordées ou oubliées :</em></li>\n</ul>\n<p><em>-       l’individualisme a succédé à l’humanisme</em></p>\n<p><em>-       le pouvoir privé financier s’est substitué au pouvoir public d’intérêt général</em></p>\n<p><em>-       la « gouvernance » a succédé à la souveraineté.</em></p>\n<ul>\n<li><em>On peut aussi identifier les apories ou les impuissances d’un modèle qu’on pensait indémodable, et qui est partout remis en cause : il n’y a qu’à voir les reculs des acquis libéraux sur les droits individuels, ou les crimes de guerre qui sont dénoncés partout, sans remettre en cause l’impunité de leurs auteurs (impuissance du droit international à empêcher même la guerre en Irak en 2003). Ou l’homme le plus riche du monde qui salue la foule avec un geste évidemment nazi…</em></li>\n<li><em>Délitement de l’État comme forme politique reconnue, qui laisse potentiellement augurer d’une symétrie de l’histoire <strong>(A. Viala)</strong> ?</em></li>\n</ul>\n<p><em>-       Retour à la vassalité par les liens étroits entre possession économique et pouvoir politique (+ voir <strong>Yánis Varoufákis</strong>, ancien ministre grec des Finances en 2015, qui évoque la féodalité numérique)</em></p>\n<p><em>-       Retour à l’impérialisme par un usage immodéré de la force, économique longtemps, militaire désormais, qui ronge l’indépendance des États et vide de leur sens les stipulations du droit international.</em></p>\n<ul>\n<li>Aujourd’hui toutefois, même si on est dans une dynamique de dépassement, ou à cause de cela justement, on est obligé de penser à l'État et la souveraineté qui restent encore le modèle promu par le droit (constitutionnel) positif. Dans une certaine mesure évidemment, le droit reste idéal et ne dit pas tout des rapports de forces politiques et sociaux qui sont effectivement à l’œuvre ; il faut donc vous garder de toute naïveté à ce sujet.  *</li>\n</ul>\n", "nested": true}, {"title": "Chapitre 2 – Les formes d’État", "text": "**Chapitre 2 – Les formes d’État **\n\n- *L’identification de l’État comme le cadre de la puissance publique et le rattachement de cette puissance à l’exercice de la souveraineté ne doit pas conduire à faire abstraction du fait que tous les États ne sont pas organisés de la même manière. Le droit constitutionnel joue à ce titre un rôle déterminant pour structurer l’État et décider d’éventuelles composantes au sein de l’État.*\n- *Il faut donc distinguer – sur le fondement du droit constitutionnel – l’État dit unitaire, qui correspond à la forme la plus classique de l’État souverain (Section 1) de l’État fédéral, reposant sur la superposition de niveaux de décision politique (Section 2). Il nous faudra également voir une forme d’État intermédiaire, dit régional ou autonomique (Section 3).*\n\n\n\n**Section 1 – L’État unitaire (France) **\n\n- *L’État unitaire est la forme première de l’État souverain ; il correspond parfaitement à ce que nous avons vu jusque-là sur l’État. Il est unitaire en ce qu’il repose par principe sur la centralisation du pouvoir (§1). Il est toutefois susceptible de connaître des adaptations, qui ne remettent pas en cause a priori, le caractère unitaire ou souverain de l’État (§2).*\n\n**§1 – Le principe de la centralisation du pouvoir **\n\n- *Le principe de l’État unitaire est celui de la centralisation du pouvoir ; pour le dire autrement, le pouvoir politique ne connaît qu’une source, qu’une organisation institutionnelle. Les citoyens n’ont de rapport avec la puissance publique qu’à travers l’État : la **citoyenneté** est un lien d’allégeance **exclusif** qui associe les individus à une seule personne publique, sans intermédiaire ou concurrent.*\n- *Cette unité du pouvoir se traduit, dans l’État unitaire, par **l’unicité **de certaines caractéristiques et notamment le fait qu’il n’existe qu’une seule Constitution et un seul pouvoir législatif (même si plusieurs institutions peuvent s’en partager l’exercice). Le principe de **souveraineté** permet de traduire cet état de fait : la justice est rendue au nom de l’État, de même que la loi est toujours celle de l’État.*\n- *En France, l’unité de l’État a longtemps été envisagée comme l’héritage de la pensée révolutionnaire jacobine, parce qu’elle serait un instrument de l’égalité absolue entre tous les citoyens composant la nation, assujettis au même pouvoir politique et à la même loi, d’un bout à l’autre du territoire national.*\n- *L’État unitaire est donc celui dans lequel n’existe qu’un **centre de décision** politique. Mais le pouvoir peut toutefois être **déconcentré**, sans que cela ne soit contradictoire.*\n- *Le principe de la **déconcentration** est celui selon lequel l’exercice de certaines compétences sont **déléguées** à des autorités **déconcentrées**¸ mais soumises au pouvoir central par un principe hiérarchique. C’est le moyen pour le pouvoir central d’exercer ses prérogatives de façon la plus adaptée possible sur l’ensemble de son territoire. L’unicité de ce pouvoir n’est toutefois pas remise en cause. *\n\n* *Principe de la **délégation de compétences** : contrôlée, temporaire et révocable*\n\n- *Principe de **l’absence de personnalité juridique distincte** : les autorités déconcentrées agissent toujours au nom de l’État, elles le représentent éventuellement (en justice) et leurs actions sont imputées à l’État*\n\n***Exemple **→ préfets ou recteurs d’académie, toujours assujettis aux décisions de leurs ministres respectifs (ou exemple plus ancien des Intendants de** Louis XIV)***\n\n- Citation d’**Odilon Barrot** (Psdt du Conseil en 1848) : « *C’est le même marteau qui frappe mais on en a raccourci le manche* ».\n\n\n\n**§2 – Les aménagements de la centralisation du pouvoir **\n\n- *La plupart des États unitaires ont, à l’époque moderne voire contemporaine, initié des processus de **décentralisation** du pouvoir. Et c’est là que notre analyse se complique un peu, puisque la décentralisation ne doit absolument pas être confondue avec la déconcentration.*\n- *La décentralisation est une forme de remise en cause de l’État unitaire, sauf que son ampleur est limitée de telle sorte qu’elle ne nuit pas à la souveraineté de l’État ou au principe de l’unicité de la citoyenneté de tous les membres de la nation.*\n- *L’idée de la décentralisation est celle de **transferts de compétences administratives **opérés par l’État vers** d’autres personnes publiques** qui se voient ainsi reconnaître une autonomie. Il faut ici faire plusieurs remarques :*\n\n* ***Transfert de compétences** : irrévocable, insusceptible de contrôle (pas de rapport hiérarchique), définitif.*\n* ***Compétences seulement administratives **: les autorités décentralisées ne peuvent pas faire la loi, ni disposer de leur propre organisation juridictionnelle ; elles restent soumises à la loi et d’ailleurs à la Constitution (par le contrôle opéré par le juge administratif en France).*\n* ***Créations d’autres personnes publiques **: les autorités décentralisées disposent de **la personnalité juridique** ; elles peuvent donc se voir reconnaître des droits et des obligations en toute autonomie. Leur responsabilité peut par exemple être engagée par un administré, en leur nom propre. Elles disposent aussi de ressources propres (fiscalité territoriale).*\n\n- *La décentralisation peut résulter de la Constitution elle-même ou d’une simple loi, instaurant les autorités décentralisées. En France, la mise en place de la décentralisation s’est opérée par ces deux moyens successivement : **les lois Defferre **de 1982 et 1983 mettent en place les communes, départements et régions comme collectivités **locales**. La révision constitutionnelle du 28 mars 2003 élargit les compétences attribuées aux collectivités **territoriales** et consacre à l’article 1er le principe de la République « décentralisée ».*\n- *La décentralisation ne remet donc pas en cause le modèle de l’État unitaire et souverain : la souveraineté est toujours présente, caractérisée par l’existence d’une unique Constitution et d’un seul pouvoir législatif. Mais il existe toutefois, au sein d’un même État, de plusieurs centres de décision administrative, tous assujettis à la même loi.*\n\n\n\n**Section 2 – L’État fédéral (États-Unis, Allemagne, Belgique)* ***\n\n- *L’État fédéral est une alternative à l’État unitaire ; il s’en distingue donc radicalement. Il est même de nombreux auteurs qui considèrent que l’on ne peut pas effectivement parler  d’« État » mais qu’il faut se contenter d’évoquer la Fédération, car l’État est caractérisé par la souveraineté, qui n’existe plus dans le modèle fédéral.*\n- *Par facilité, vous êtes toutefois autorisés à employer cette expression, en gardant bien à l’esprit que la Fédération va bien au-delà de la décentralisation que nous venons de voir : l’organisation du pouvoir politique n’est pas seulement aménagée sur le plan administratif, il existe au sein de la Fédération des entités fédérées ou des États fédérés. L’État fédéral est donc un État composite, composé de l’association d’autres États qui continuent d’exister comme États bien après leur intégration.*\n- *C’est l’une des caractéristiques du fédéralisme (§1) qui repose sur deux principes cardinaux que nous verrons ensuite (§2).*\n\n\n\n**§1 – La logique du fédéralisme **\n\n- *La logique du fédéralisme peut être résumée par la devise des États-Unis, première Fédération de l’histoire : **e pluribus unum** (un seul à partir de plusieurs). Il est d’ailleurs révélateur à ce titre que les États-Unis n’ont d’autre nom que leur référence au fédéralisme et au continent américain.*\n- *Le fédéralisme se caractérise ainsi, par la pluralité politique (A) qui se poursuit malgré l’intégration au sein d’une structure politique unique et supérieure (B).*\n\n\n\n**A. Le pluralisme **\n\n- *La pluralité est la caractéristique principale du fédéralisme, et ce qui le distingue remarquablement de l’État unitaire. Elle résulte le plus souvent de l’histoire des États fédéraux. La plupart d’entre eux se forment en effet par **agrégation **: il existe différents États qui décident de s’associer dans une structure collective afin de mettre en commun leurs intérêts sur le plan international ou de promouvoir leur appartenance nationale commune.*\n\n***Exemple **→ États-Unis, indépendance des treize colonies britanniques en 1776 qui se fédéralisent en 1787 // Allemagne, fédéralisation des principautés et duchés en 1871*\n\n- *Plus rarement, le fédéralisme peut être instauré par **désagrégation**, lorsqu’un État jusque-là unitaire décide de reconnaître en son sein des entités politiques autonomes dont il souhaite cependant garantir l’unité.*\n\n***Exemple **→ Belgique, fédéralisée en 1993, pour conférer notamment aux communautés flamande et wallonne un sursaut d’autonomie.*\n\n- *En tout état de cause, dans un État fédéral, deux niveaux de décision politique coexistent, le niveau central ou fédéral (Washington DC, Berlin, Bruxelles) et le niveau fédéré. Cela implique des conséquences très simples pour identifier un État fédéral :*\n\n*-       Un même territoire est régi par deux Constitutions*\n\n*-       Un même territoire est assujetti à deux systèmes de gouvernement (pouvoir exécutif, mais aussi législatif et judiciaire)*\n\n*-       Un individu dispose d’une double citoyenneté*\n\n- *Vous noterez que ces différentes caractéristiques rendent impossible l’idée du maintien de la souveraineté ; aucun niveau de décision, fédéral ou fédéré, ne dispose de la compétence de sa compétence, ou d’un plein pouvoir à l’égard de sa population. Les deux niveaux politiques s’empêchent mutuellement d’être souverains.*\n- *Cette pluralité doit cependant être organisée, pour que l’on puisse parler de Fédération ; elle nécessite une forme d’unification, conférée par l’intégration.*\n\n\n\n**B. L’intégration **\n\n- *L’intégration est notamment le résultat de la Constitution fédérale, adoptée par l’ensemble des entités fédérées. C’est elle qui articule les deux niveaux de décision politique dans un tout pérenne*.\n\n **Répartition des compétences**\n\n- *La Constitution fédérale est notamment nécessaire pour répartir les compétences entre le niveau fédéral et les niveaux fédérés : chaque niveau peut faire des lois et rendre la justice sur la base de ces lois, mais comment s’assurer qu’ils n’adopteront pas des lois proprement contradictoires ?*\n- *La répartition des compétences permet de lister, dans la Constitution, les champs relevant des compétences respectives. Souvent reviendront à l’État fédéral toutes les compétences liées aux relations internationales (guerre ou paix, armée, traités internationaux…), à la politique monétaire et au commerce international. Mais chaque Constitution est libre de ce qu’elle prévoit, bien entendu.*\n- *Le plus souvent, la Constitution énumère la liste des compétences de la Fédération et prévoit, a contrario, que toutes les compétences non énumérées reviennent aux États fédérés. C’est ce qu’on appelle, du point de vue de la Fédération, une **compétence d’attribution**, par opposition à la **compétence de principe** détenue par les États fédérés. La Fédération (et c’est logique) n’est donc compétente que dans les champs qui lui ont été expressément attribués par les États, à travers la Constitution.*\n\n**Hiérarchie**\n\n- *La répartition des compétences et l’organisation fédérale en général sont le plus souvent protégées par le principe de la hiérarchie ; en plus d’une hiérarchie des normes très classique, à la fois au niveau fédéral et au niveau fédéré (entre lois et Constitutions) existe aussi une hiérarchie entre ordre juridique fédéral et ordre juridique fédéré, de telle sorte qu’il y a ait une harmonisation de l’OJ sur le territoire national.*\n- *En principe, c’est souvent le droit fédéré qui est censé primer (Allemagne) sauf qu’en pratique, la nécessité que la Constitution fédérale soit appliquée partout de la même manière conduit les juges fédéraux à la faire primer (CS États-Unis).*\n\n **Unité sur le plan international**\n\n- *Du point de vue du droit international, parce que les compétences qui y ont trait sous le plus souvent confiées à la Fédération, tout se passe comme s’il n’y avait qu’un État, en apparence unitaire : la France traite avec les États-Unis, non avec la Californie ou le Texas.*\n- *Dans la Fédération, les entités fédérées ont en fait renoncé à leur participation en matière internationale ; elles n’agissent plus que par le truchement de la Fédération. C’est ce qui permet de distinguer l’État fédéral de la **Confédération**. Dans la Confédération – autre nom d’une organisation internationale – les États mettent en commun certaines de leurs compétences (**Exemple** : ONU, faire la guerre) mais continuent d’exister indépendamment de la structure confédérale sur le plan international. Ils n’abdiquent pas leur souveraineté à son profit, contrairement à ce qu’il se passe dans le cadre fédéral.*\n\n\n\n\n\n\n\n**§2 – Les principes du fédéralisme **\n\n- *Afin de fonctionner efficacement, le fédéralisme repose sur la conjugaison de deux principes que nous allons voir l’un après l’autre. C’est souvent parce que ces deux principes sont mis en œuvre dans la Constitution que l’on peut établir qu’elle met en place un État fédéral. Il s’agit du principe de l’autonomie (A) et celui de la participation des entités fédérées (B).*\n\n\n\n**A. Le principe d’autonomie **\n\n- *C’est ici l’autonomie des États fédérés qui est en cause. L’idée est que la Fédération n’a pas à fixer elle-même l’organisation politique au sein des entités fédérées, elles sont libres d’en décider elles-mêmes. En se fédéralisant, l’État fédéré renonce à son indépendance et à sa souveraineté, mais pas à son autonomie ; il n’est pas placé sous la tutelle de la Fédération.*\n- *C’est dans cette perspective qu’elles se dotent d’une Constitution, qui va – comme toute constitution – déterminer les institutions chargées d’exercer le pouvoir politique, garantir des droits pour les citoyens, et donc protéger l’autonomie de l’État fédéré.*\n- *À la limite la Constitution fédérale peut-elle imposer un cadre à cette autonomie (ex. Forme républicaine imposée aux États-Unis / État de droit républicain, démocratie et social en Allemagne). Mais elle n’impose pas l’organisation institutionnelle que devra adopter l’État fédéré. C’est là une différence majeure avec certaines formes d’État unitaires (décentralisés ou régionaux, comme nous le verrons).*\n- *Les États fédérés décident donc librement des conditions dans lesquelles seront exercées en leur sein les compétences qu’ils n’ont pas transférées à la Fédération.*\n\n\n\n**B. Le principe de participation **\n\n- *L’idée ici est que les États fédérés participent, en tant qu’États fédérés, au pouvoir politique exercé au niveau fédéral. Le plus souvent, cela se traduit par l’instauration d’une chambre parlementaire fédérale chargée de représenter les entités fédérées et ainsi de leur offrir le moyen de participer au pouvoir législatif fédéral.*\n\n***Exemple **→ Allemagne, le Parlement est composé du Bundestag et du Bundesrat, composé de représentants désignés par les gouvernements des Länder. // États-Unis, le Congrès qui vote la loi est composé de la Chambre des représentants (représentant l’ensemble des citoyens) et du Sénat (composé de deux sénateurs par État, selon le principe d’égalité entre tous les États, quelle que soit leur importance démographique).*\n\n- *Cette représentation au Parlement garantit, dans les deux cas, la participation des entités fédérées à la confection de la loi. En outre, les États fédérés participent directement à la **révision de la Constitution**. Ils peuvent même être mobilisés pour **la ratification des traités internationaux** (ex. Sénat États-Unis // ratification par les Communautés ou les Régions lorsque le traité s’inscrit dans leur compétence en Belgique).*\n\n*⇒ Enjeu crucial du fédéralisme, qui correspond de plus en plus à ce qu’est devenue **l’Union européenne**. L’ambition de transposer ce modèle à l’échelle européenne animait déjà les pères fondateurs des Communautés économiques au début des années 1950 et l’histoire a donné corps à cette idée. Vous entendrez parfois le Président Macron évoquer la souveraineté européenne ou la fédération européenne, ce qui implique des changements drastiques pour les États membres.*\n\n\n\n**Section 3 – L’État régional ou autonomique (Italie, Espagne, Royaume-Uni)* ***\n\n- *Il existe un troisième type d’État, qu’il est difficile de classer dans les deux catégories précédemment évoquées. Pour certains auteurs (dont moi), il relève encore de l’État unitaire tandis que pour d’autres, il a déjà basculé vers le fédéralisme. C’est une espèce un peu indéterminée que j’ai donc choisi de considérer séparément, pour clarifier les enjeux de la catégorisation. Il s’agit de ce qu’on appelle l’État régional ou autonomique, dont les modèles de référence sont constitués par l’Italie et l’Espagne.*\n- *On évoque en général les régions italiennes et les autonomies / communautés espagnoles. D’autres États sont concernés par ce modèle (Royaume-Uni par exemple).*\n\n**Ce qui le distingue de l’État décentralisé :**\n\n\\- *      Pouvoir des Régions d’adopter des lois (pas de seul transfert de compétences administratives)*\n\n*-       Pouvoir des Régions d’adopter leur propre statut (même s’il doit ensuite être approuvé par le Parlement national, par exemple en Italie ou en Espagne)*\n\n*-       Inégalité entre les Régions qui ne disposent pas des mêmes prérogatives (autonomie plus poussée en Catalogne ou au Pays Basque espagnol qu’en Andalousie // différence entre l’Écosse et le Pays de Galles qui ne disposent pas des mêmes compétences // 5 régions à statut particulier contre 15 à statut ordinaire en Italie)*\n\n**Ce qui le distingue de l’État fédéral :**\n\n*-       Absence d’ordre juridictionnel propre*\n\n*-       Absence d’autonomie constitutionnelle ou même institutionnelle : en Italie, la Constitution nationale détermine les organes de chacune des Régions ou des provinces.*\n\n*-       Absence de participation : les Régions ne sont pas représentées en tant que telles au sein des institutions centrales.*\n\n\n\n*La question qui se pose est celle du caractère transitoire de l’État régional : serait-il une étape vers le fédéralisme ?*\n\n- *La question s’est posée avec d’autant plus de vigueur que des Régions appellent régulièrement à davantage d’autonomie et certaines d’entre elles ont d’ailleurs exprimé leur volonté de proclamer leur indépendance (Catalogne bien sûr en 2017 mais aussi Vénétie et Lombardie la même année / Écosse en 2014 et peut-être dans les mois à venir). Dans la plupart des cas (à l’exception de l’Écosse en 2014), les autorités centrales déclarent le référendum contraire à la Constitution et ne lui accordent donc aucune valeur.*\n- *On est donc dans une lutte incessante – mais exacerbée ces dernières années – entre l’aspiration à l’indépendance et le rappel de principes centralisateurs, tension qui se traduit fréquemment par une extension de l’autonomie des régions concernées.*\n- *En réalité, ce statu quo n’est pas nécessairement temporaire ou transitoire ; il est plus certainement inscrit dans l’ADN des États en cause, qui sont construits autour de l’autonomie régionale. Il serait en revanche intéressant de se demander si la France, qui est en fait l’un des dernières États unitaires bien que décentralisée, n’est pas susceptible d’adopter à terme ce modèle régional ou autonomique, et de concrétiser ainsi l’ambition de certaines régions (Corse notamment). *\n\n\n", "html": "<h2>Chapitre 2 – Les formes d’État</h2>\n<ul>\n<li><em>L’identification de l’État comme le cadre de la puissance publique et le rattachement de cette puissance à l’exercice de la souveraineté ne doit pas conduire à faire abstraction du fait que tous les États ne sont pas organisés de la même manière. Le droit constitutionnel joue à ce titre un rôle déterminant pour structurer l’État et décider d’éventuelles composantes au sein de l’État.</em></li>\n<li><em>Il faut donc distinguer – sur le fondement du droit constitutionnel – l’État dit unitaire, qui correspond à la forme la plus classique de l’État souverain (Section 1) de l’État fédéral, reposant sur la superposition de niveaux de décision politique (Section 2). Il nous faudra également voir une forme d’État intermédiaire, dit régional ou autonomique (Section 3).</em></li>\n</ul>\n<h2>Section 1 – L’État unitaire (France)</h2>\n<ul>\n<li><em>L’État unitaire est la forme première de l’État souverain ; il correspond parfaitement à ce que nous avons vu jusque-là sur l’État. Il est unitaire en ce qu’il repose par principe sur la centralisation du pouvoir (§1). Il est toutefois susceptible de connaître des adaptations, qui ne remettent pas en cause a priori, le caractère unitaire ou souverain de l’État (§2).</em></li>\n</ul>\n<h3>§1 – Le principe de la centralisation du pouvoir</h3>\n<ul>\n<li><em>Le principe de l’État unitaire est celui de la centralisation du pouvoir ; pour le dire autrement, le pouvoir politique ne connaît qu’une source, qu’une organisation institutionnelle. Les citoyens n’ont de rapport avec la puissance publique qu’à travers l’État : la <strong>citoyenneté</strong> est un lien d’allégeance <strong>exclusif</strong> qui associe les individus à une seule personne publique, sans intermédiaire ou concurrent.</em></li>\n<li><em>Cette unité du pouvoir se traduit, dans l’État unitaire, par <strong>l’unicité de certaines caractéristiques et notamment le fait qu’il n’existe qu’une seule Constitution et un seul pouvoir législatif (même si plusieurs institutions peuvent s’en partager l’exercice). Le principe de souveraineté</strong> permet de traduire cet état de fait : la justice est rendue au nom de l’État, de même que la loi est toujours celle de l’État.</em></li>\n<li><em>En France, l’unité de l’État a longtemps été envisagée comme l’héritage de la pensée révolutionnaire jacobine, parce qu’elle serait un instrument de l’égalité absolue entre tous les citoyens composant la nation, assujettis au même pouvoir politique et à la même loi, d’un bout à l’autre du territoire national.</em></li>\n<li><em>L’État unitaire est donc celui dans lequel n’existe qu’un <strong>centre de décision</strong> politique. Mais le pouvoir peut toutefois être <strong>déconcentré</strong>, sans que cela ne soit contradictoire.</em></li>\n<li>Le principe de la <strong>déconcentration</strong> est celui selon lequel l’exercice de certaines compétences sont <strong>déléguées</strong> à des autorités <strong>déconcentrées</strong>¸ mais soumises au pouvoir central par un principe hiérarchique. C’est le moyen pour le pouvoir central d’exercer ses prérogatives de façon la plus adaptée possible sur l’ensemble de son territoire. L’unicité de ce pouvoir n’est toutefois pas remise en cause. *</li>\n</ul>\n<ul>\n<li><em>Principe de la <strong>délégation de compétences</strong> : contrôlée, temporaire et révocable</em></li>\n</ul>\n<ul>\n<li><em>Principe de <strong>l’absence de personnalité juridique distincte</strong> : les autorités déconcentrées agissent toujours au nom de l’État, elles le représentent éventuellement (en justice) et leurs actions sont imputées à l’État</em></li>\n</ul>\n<p class=\"lesson-note\"><em><strong>Exemple → préfets ou recteurs d’académie, toujours assujettis aux décisions de leurs ministres respectifs (ou exemple plus ancien des Intendants de Louis XIV)</strong></em></p>\n<ul>\n<li>Citation d’<strong>Odilon Barrot</strong> (Psdt du Conseil en 1848) : « <em>C’est le même marteau qui frappe mais on en a raccourci le manche</em> ».</li>\n</ul>\n<h3>§2 – Les aménagements de la centralisation du pouvoir</h3>\n<ul>\n<li><em>La plupart des États unitaires ont, à l’époque moderne voire contemporaine, initié des processus de <strong>décentralisation</strong> du pouvoir. Et c’est là que notre analyse se complique un peu, puisque la décentralisation ne doit absolument pas être confondue avec la déconcentration.</em></li>\n<li><em>La décentralisation est une forme de remise en cause de l’État unitaire, sauf que son ampleur est limitée de telle sorte qu’elle ne nuit pas à la souveraineté de l’État ou au principe de l’unicité de la citoyenneté de tous les membres de la nation.</em></li>\n<li><em>L’idée de la décentralisation est celle de <strong>transferts de compétences administratives opérés par l’État vers</strong> d’autres personnes publiques qui se voient ainsi reconnaître une autonomie. Il faut ici faire plusieurs remarques :</em></li>\n</ul>\n<ul>\n<li>Transfert de compétences : irrévocable, insusceptible de contrôle (pas de rapport hiérarchique), définitif.</li>\n<li>Compétences seulement administratives : les autorités décentralisées ne peuvent pas faire la loi, ni disposer de leur propre organisation juridictionnelle ; elles restent soumises à la loi et d’ailleurs à la Constitution (par le contrôle opéré par le juge administratif en France).</li>\n<li>Créations d’autres personnes publiques <strong>: les autorités décentralisées disposent de la personnalité juridique</strong> ; elles peuvent donc se voir reconnaître des droits et des obligations en toute autonomie. Leur responsabilité peut par exemple être engagée par un administré, en leur nom propre. Elles disposent aussi de ressources propres (fiscalité territoriale).</li>\n</ul>\n<ul>\n<li><em>La décentralisation peut résulter de la Constitution elle-même ou d’une simple loi, instaurant les autorités décentralisées. En France, la mise en place de la décentralisation s’est opérée par ces deux moyens successivement : <strong>les lois Defferre de 1982 et 1983 mettent en place les communes, départements et régions comme collectivités locales</strong>. La révision constitutionnelle du 28 mars 2003 élargit les compétences attribuées aux collectivités <strong>territoriales</strong> et consacre à l’article 1er le principe de la République « décentralisée ».</em></li>\n<li><em>La décentralisation ne remet donc pas en cause le modèle de l’État unitaire et souverain : la souveraineté est toujours présente, caractérisée par l’existence d’une unique Constitution et d’un seul pouvoir législatif. Mais il existe toutefois, au sein d’un même État, de plusieurs centres de décision administrative, tous assujettis à la même loi.</em></li>\n</ul>\n<h2>Section 2 – L’État fédéral (États-Unis, Allemagne, Belgique)</h2>\n<ul>\n<li><em>L’État fédéral est une alternative à l’État unitaire ; il s’en distingue donc radicalement. Il est même de nombreux auteurs qui considèrent que l’on ne peut pas effectivement parler  d’« État » mais qu’il faut se contenter d’évoquer la Fédération, car l’État est caractérisé par la souveraineté, qui n’existe plus dans le modèle fédéral.</em></li>\n<li><em>Par facilité, vous êtes toutefois autorisés à employer cette expression, en gardant bien à l’esprit que la Fédération va bien au-delà de la décentralisation que nous venons de voir : l’organisation du pouvoir politique n’est pas seulement aménagée sur le plan administratif, il existe au sein de la Fédération des entités fédérées ou des États fédérés. L’État fédéral est donc un État composite, composé de l’association d’autres États qui continuent d’exister comme États bien après leur intégration.</em></li>\n<li><em>C’est l’une des caractéristiques du fédéralisme (§1) qui repose sur deux principes cardinaux que nous verrons ensuite (§2).</em></li>\n</ul>\n<h3>§1 – La logique du fédéralisme</h3>\n<ul>\n<li><em>La logique du fédéralisme peut être résumée par la devise des États-Unis, première Fédération de l’histoire : <strong>e pluribus unum</strong> (un seul à partir de plusieurs). Il est d’ailleurs révélateur à ce titre que les États-Unis n’ont d’autre nom que leur référence au fédéralisme et au continent américain.</em></li>\n<li><em>Le fédéralisme se caractérise ainsi, par la pluralité politique (A) qui se poursuit malgré l’intégration au sein d’une structure politique unique et supérieure (B).</em></li>\n</ul>\n<h4>A. Le pluralisme</h4>\n<ul>\n<li><em>La pluralité est la caractéristique principale du fédéralisme, et ce qui le distingue remarquablement de l’État unitaire. Elle résulte le plus souvent de l’histoire des États fédéraux. La plupart d’entre eux se forment en effet par agrégation : il existe différents États qui décident de s’associer dans une structure collective afin de mettre en commun leurs intérêts sur le plan international ou de promouvoir leur appartenance nationale commune.</em></li>\n</ul>\n<p class=\"lesson-note\">Exemple → États-Unis, indépendance des treize colonies britanniques en 1776 qui se fédéralisent en 1787 // Allemagne, fédéralisation des principautés et duchés en 1871</p>\n<ul>\n<li><em>Plus rarement, le fédéralisme peut être instauré par <strong>désagrégation</strong>, lorsqu’un État jusque-là unitaire décide de reconnaître en son sein des entités politiques autonomes dont il souhaite cependant garantir l’unité.</em></li>\n</ul>\n<p class=\"lesson-note\">Exemple → Belgique, fédéralisée en 1993, pour conférer notamment aux communautés flamande et wallonne un sursaut d’autonomie.</p>\n<ul>\n<li><em>En tout état de cause, dans un État fédéral, deux niveaux de décision politique coexistent, le niveau central ou fédéral (Washington DC, Berlin, Bruxelles) et le niveau fédéré. Cela implique des conséquences très simples pour identifier un État fédéral :</em></li>\n</ul>\n<p><em>-       Un même territoire est régi par deux Constitutions</em></p>\n<p><em>-       Un même territoire est assujetti à deux systèmes de gouvernement (pouvoir exécutif, mais aussi législatif et judiciaire)</em></p>\n<p><em>-       Un individu dispose d’une double citoyenneté</em></p>\n<ul>\n<li><em>Vous noterez que ces différentes caractéristiques rendent impossible l’idée du maintien de la souveraineté ; aucun niveau de décision, fédéral ou fédéré, ne dispose de la compétence de sa compétence, ou d’un plein pouvoir à l’égard de sa population. Les deux niveaux politiques s’empêchent mutuellement d’être souverains.</em></li>\n<li><em>Cette pluralité doit cependant être organisée, pour que l’on puisse parler de Fédération ; elle nécessite une forme d’unification, conférée par l’intégration.</em></li>\n</ul>\n<h4>B. L’intégration</h4>\n<ul>\n<li><em>L’intégration est notamment le résultat de la Constitution fédérale, adoptée par l’ensemble des entités fédérées. C’est elle qui articule les deux niveaux de décision politique dans un tout pérenne</em>.</li>\n</ul>\n<p> <strong>Répartition des compétences</strong></p>\n<ul>\n<li><em>La Constitution fédérale est notamment nécessaire pour répartir les compétences entre le niveau fédéral et les niveaux fédérés : chaque niveau peut faire des lois et rendre la justice sur la base de ces lois, mais comment s’assurer qu’ils n’adopteront pas des lois proprement contradictoires ?</em></li>\n<li><em>La répartition des compétences permet de lister, dans la Constitution, les champs relevant des compétences respectives. Souvent reviendront à l’État fédéral toutes les compétences liées aux relations internationales (guerre ou paix, armée, traités internationaux…), à la politique monétaire et au commerce international. Mais chaque Constitution est libre de ce qu’elle prévoit, bien entendu.</em></li>\n<li><em>Le plus souvent, la Constitution énumère la liste des compétences de la Fédération et prévoit, a contrario, que toutes les compétences non énumérées reviennent aux États fédérés. C’est ce qu’on appelle, du point de vue de la Fédération, une <strong>compétence d’attribution</strong>, par opposition à la <strong>compétence de principe</strong> détenue par les États fédérés. La Fédération (et c’est logique) n’est donc compétente que dans les champs qui lui ont été expressément attribués par les États, à travers la Constitution.</em></li>\n</ul>\n<p><strong>Hiérarchie</strong></p>\n<ul>\n<li><em>La répartition des compétences et l’organisation fédérale en général sont le plus souvent protégées par le principe de la hiérarchie ; en plus d’une hiérarchie des normes très classique, à la fois au niveau fédéral et au niveau fédéré (entre lois et Constitutions) existe aussi une hiérarchie entre ordre juridique fédéral et ordre juridique fédéré, de telle sorte qu’il y a ait une harmonisation de l’OJ sur le territoire national.</em></li>\n<li><em>En principe, c’est souvent le droit fédéré qui est censé primer (Allemagne) sauf qu’en pratique, la nécessité que la Constitution fédérale soit appliquée partout de la même manière conduit les juges fédéraux à la faire primer (CS États-Unis).</em></li>\n</ul>\n<p> <strong>Unité sur le plan international</strong></p>\n<ul>\n<li><em>Du point de vue du droit international, parce que les compétences qui y ont trait sous le plus souvent confiées à la Fédération, tout se passe comme s’il n’y avait qu’un État, en apparence unitaire : la France traite avec les États-Unis, non avec la Californie ou le Texas.</em></li>\n<li><em>Dans la Fédération, les entités fédérées ont en fait renoncé à leur participation en matière internationale ; elles n’agissent plus que par le truchement de la Fédération. C’est ce qui permet de distinguer l’État fédéral de la <strong>Confédération</strong>. Dans la Confédération – autre nom d’une organisation internationale – les États mettent en commun certaines de leurs compétences (<strong>Exemple</strong> : ONU, faire la guerre) mais continuent d’exister indépendamment de la structure confédérale sur le plan international. Ils n’abdiquent pas leur souveraineté à son profit, contrairement à ce qu’il se passe dans le cadre fédéral.</em></li>\n</ul>\n<h3>§2 – Les principes du fédéralisme</h3>\n<ul>\n<li><em>Afin de fonctionner efficacement, le fédéralisme repose sur la conjugaison de deux principes que nous allons voir l’un après l’autre. C’est souvent parce que ces deux principes sont mis en œuvre dans la Constitution que l’on peut établir qu’elle met en place un État fédéral. Il s’agit du principe de l’autonomie (A) et celui de la participation des entités fédérées (B).</em></li>\n</ul>\n<h4>A. Le principe d’autonomie</h4>\n<ul>\n<li><em>C’est ici l’autonomie des États fédérés qui est en cause. L’idée est que la Fédération n’a pas à fixer elle-même l’organisation politique au sein des entités fédérées, elles sont libres d’en décider elles-mêmes. En se fédéralisant, l’État fédéré renonce à son indépendance et à sa souveraineté, mais pas à son autonomie ; il n’est pas placé sous la tutelle de la Fédération.</em></li>\n<li><em>C’est dans cette perspective qu’elles se dotent d’une Constitution, qui va – comme toute constitution – déterminer les institutions chargées d’exercer le pouvoir politique, garantir des droits pour les citoyens, et donc protéger l’autonomie de l’État fédéré.</em></li>\n<li><em>À la limite la Constitution fédérale peut-elle imposer un cadre à cette autonomie (ex. Forme républicaine imposée aux États-Unis / État de droit républicain, démocratie et social en Allemagne). Mais elle n’impose pas l’organisation institutionnelle que devra adopter l’État fédéré. C’est là une différence majeure avec certaines formes d’État unitaires (décentralisés ou régionaux, comme nous le verrons).</em></li>\n<li><em>Les États fédérés décident donc librement des conditions dans lesquelles seront exercées en leur sein les compétences qu’ils n’ont pas transférées à la Fédération.</em></li>\n</ul>\n<h4>B. Le principe de participation</h4>\n<ul>\n<li><em>L’idée ici est que les États fédérés participent, en tant qu’États fédérés, au pouvoir politique exercé au niveau fédéral. Le plus souvent, cela se traduit par l’instauration d’une chambre parlementaire fédérale chargée de représenter les entités fédérées et ainsi de leur offrir le moyen de participer au pouvoir législatif fédéral.</em></li>\n</ul>\n<p class=\"lesson-note\">Exemple → Allemagne, le Parlement est composé du Bundestag et du Bundesrat, composé de représentants désignés par les gouvernements des Länder. // États-Unis, le Congrès qui vote la loi est composé de la Chambre des représentants (représentant l’ensemble des citoyens) et du Sénat (composé de deux sénateurs par État, selon le principe d’égalité entre tous les États, quelle que soit leur importance démographique).</p>\n<ul>\n<li><em>Cette représentation au Parlement garantit, dans les deux cas, la participation des entités fédérées à la confection de la loi. En outre, les États fédérés participent directement à la <strong>révision de la Constitution</strong>. Ils peuvent même être mobilisés pour <strong>la ratification des traités internationaux</strong> (ex. Sénat États-Unis // ratification par les Communautés ou les Régions lorsque le traité s’inscrit dans leur compétence en Belgique).</em></li>\n</ul>\n<p class=\"lesson-note\"><em>⇒ Enjeu crucial du fédéralisme, qui correspond de plus en plus à ce qu’est devenue <strong>l’Union européenne</strong>. L’ambition de transposer ce modèle à l’échelle européenne animait déjà les pères fondateurs des Communautés économiques au début des années 1950 et l’histoire a donné corps à cette idée. Vous entendrez parfois le Président Macron évoquer la souveraineté européenne ou la fédération européenne, ce qui implique des changements drastiques pour les États membres.</em></p>\n<h2>Section 3 – L’État régional ou autonomique (Italie, Espagne, Royaume-Uni)</h2>\n<ul>\n<li><em>Il existe un troisième type d’État, qu’il est difficile de classer dans les deux catégories précédemment évoquées. Pour certains auteurs (dont moi), il relève encore de l’État unitaire tandis que pour d’autres, il a déjà basculé vers le fédéralisme. C’est une espèce un peu indéterminée que j’ai donc choisi de considérer séparément, pour clarifier les enjeux de la catégorisation. Il s’agit de ce qu’on appelle l’État régional ou autonomique, dont les modèles de référence sont constitués par l’Italie et l’Espagne.</em></li>\n<li><em>On évoque en général les régions italiennes et les autonomies / communautés espagnoles. D’autres États sont concernés par ce modèle (Royaume-Uni par exemple).</em></li>\n</ul>\n<p><strong>Ce qui le distingue de l’État décentralisé :</strong></p>\n<p>- *      Pouvoir des Régions d’adopter des lois (pas de seul transfert de compétences administratives)</p>\n<p><em>-       Pouvoir des Régions d’adopter leur propre statut (même s’il doit ensuite être approuvé par le Parlement national, par exemple en Italie ou en Espagne)</em></p>\n<p><em>-       Inégalité entre les Régions qui ne disposent pas des mêmes prérogatives (autonomie plus poussée en Catalogne ou au Pays Basque espagnol qu’en Andalousie // différence entre l’Écosse et le Pays de Galles qui ne disposent pas des mêmes compétences // 5 régions à statut particulier contre 15 à statut ordinaire en Italie)</em></p>\n<p><strong>Ce qui le distingue de l’État fédéral :</strong></p>\n<p><em>-       Absence d’ordre juridictionnel propre</em></p>\n<p><em>-       Absence d’autonomie constitutionnelle ou même institutionnelle : en Italie, la Constitution nationale détermine les organes de chacune des Régions ou des provinces.</em></p>\n<p><em>-       Absence de participation : les Régions ne sont pas représentées en tant que telles au sein des institutions centrales.</em></p>\n<p><em>La question qui se pose est celle du caractère transitoire de l’État régional : serait-il une étape vers le fédéralisme ?</em></p>\n<ul>\n<li><em>La question s’est posée avec d’autant plus de vigueur que des Régions appellent régulièrement à davantage d’autonomie et certaines d’entre elles ont d’ailleurs exprimé leur volonté de proclamer leur indépendance (Catalogne bien sûr en 2017 mais aussi Vénétie et Lombardie la même année / Écosse en 2014 et peut-être dans les mois à venir). Dans la plupart des cas (à l’exception de l’Écosse en 2014), les autorités centrales déclarent le référendum contraire à la Constitution et ne lui accordent donc aucune valeur.</em></li>\n<li><em>On est donc dans une lutte incessante – mais exacerbée ces dernières années – entre l’aspiration à l’indépendance et le rappel de principes centralisateurs, tension qui se traduit fréquemment par une extension de l’autonomie des régions concernées.</em></li>\n<li>En réalité, ce statu quo n’est pas nécessairement temporaire ou transitoire ; il est plus certainement inscrit dans l’ADN des États en cause, qui sont construits autour de l’autonomie régionale. Il serait en revanche intéressant de se demander si la France, qui est en fait l’un des dernières États unitaires bien que décentralisée, n’est pas susceptible d’adopter à terme ce modèle régional ou autonomique, et de concrétiser ainsi l’ambition de certaines régions (Corse notamment). *</li>\n</ul>\n", "nested": true}, {"title": "Chapitre 3 – Les déclinaisons de l’État : l’État de droit", "text": "** Chapitre 3 – Les déclinaisons de l’État : l’État de droit* ***\n\n- *Il est fréquent de voir la notion d’État accolée à un autre nom (nation, gendarme, droit…). Et le but de ce dernier chapitre est de préciser ce que cela implique.*\n- *Les notions que vous connaissez sans doute le mieux à ce titre sont celles d’État-gendarme et d’État-providence que l’on a tendance à opposer, et qui sont toutes les deux relativement désuètes (respectivement fin XIXe et mi-XXe) ; elles se réfèrent à des modèles idéologiques ou politiques quant au rôle que l’État est réputé assumer :*\n\n*-       **État-gendarme** : il se contente de maintenir l’ordre public en faisant prévaloir la liberté des acteurs ; avec toutefois un poids considérable à la morale publique voire de l’**ordre moral**, qui le distingue du modèle de l’ultra-libéralisme actuel. En vérité, c’est un modèle politique conservateur, qui vise à protéger ceux qui bénéficient des faveurs de la conjoncture.*\n\n_-       **État-providence** : associé le plus souvent à une théorie économique de la relance promue par le modèle keynésien, il consiste à attribuer à l’État un rôle de pourvoyeur d’activité économique, de sécurité sociale, de solidarité entre les citoyens (_**Welfare state de F. D. Roosevelt**_ à partir de 1933)_\n\n- *Ces modèles sont d’ordre politique et théorique : ils n’ont que peu d’incidence sur la structure juridique de l’État mais davantage sur les politiques publiques qui vont être conduites par les majorités politiques, détenant le pouvoir législatif. (cf. cours d’Institutions administratives au semestre 2)*\n- *On a aussi beaucoup parlé du modèle de l’**État-nation**, qui se développe dès le XVIIIe et se généralise aux XXe avec les mouvements de décolonisation : la souveraineté de l’État est placée entre les mains d’une nation, c’est-à-dire d’un ensemble relativement homogène de personnes, partageant des caractéristiques linguistiques, culturelles, religieuses ou ethniques communes.*\n\n\n\n- ***Attention**, tous les États ne sont pas, ou plus, des États-nations, dans la mesure où existent des États **multinationaux** (Hongrie, Serbie, Roumanie…). Un État-nation peut être aussi bien fédéral (Allemagne) que régional (Italie, Espagne) ou unitaire (France). Contrairement à la plupar
