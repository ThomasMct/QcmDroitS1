é reconnue comme incurable au moment du diagnostic ». (2)\n  - **l’IPG (= interruption partielle de grossesse multiple)&#x20;**&#x71;ui permet d’interrompre la vie d’un ou plusieurs embryons (**exemple**: on interrompt la vie d’un jumeaux sur deux) pour permettre aux autres embryons de poursuivre leur développement. Contrairement à l’IMG cette méthode à un délai de 12 semaines soit 14 semaines d’absence de règle.\n\n* *l’embryon **in vitro&#x20;**(= conçu de manière artificielle): la protection des embryons in vitro a diminué avec le temps, elle s’est atténuée. La conception d’un embryon in vitro se met en place avec l’intervention d’une PMA. L’article L2141-1 du Code de la Santé Publique met en avant l’Assistance Médicale à la Procréation. Le droit positif prohibe la création d’embryon humain par clonage **(article 16-4 du Code Civil).** Selon le Code Pénal, le clonage reproductif est un crime. Le clonage thérapeutique est un délit, il est moins sanctionné que le clonage reproductif. La création d’embryon chimérique et transgénique (= embryon dont le génome a été partiellement modifié par « l’injection » d’ADN différent) a été interdite en France suite à **une loi en 2011 (article 16-4 du Code Civil)**. Pour recourir à la PMA, certaines conditions s’imposent: il faut être vivant, avoir l’âge de procréer et être consentant au transfert d’embryon. Avant, la fertilité était une des conditions à la PMA. Les prélèvement peuvent être fait jusqu’au 43 ans de la femme et les 60 ans de l’homme. Il est possible de faire congeler ses gamètes en vue d'une prochaine grossesse. Dans le Code de la Santé Publique se trouvent les conditions nécessaires à la PMA. Jusqu’à 2021, beaucoup de donneurs le faisaient anonymement. Hors cette condition va être levée si le donneurs est consentant afin d’établir une relation avec l’enfant **(article 16-8-1).** Même si le donneur est le père biologique, il n’a en aucun cas le droit d’être le père légal de l’enfant. Il y a une interdiction de procréation post-mortem, les deux personnes du couple doivent être vivantes, le décès d’un des membres du couple fait obstacle. Sur la destruction des embryons **in vitro**, tout une procédure doit être mise en place selon le Code de la Santé Publique. Chaque année la PMA contacte le couple afin d’être sûr que le projet est maintenu, au bout de 5 ans les embryons sont détruits. Depuis 2013, le recherche sur l’embryon est autorisé SOUS CONDITIONS, selon le Code de la Santé Publique (la recherche doit être pertinente scientifiquement (1), doit s’inscrire dans un finalité médicale (2), un médecin doit attester qu’elle recourt à des embryons pour la recherche  (3), doit respecter les principes éthiques sur l’embryon (4))*\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n**CHAPITRE 2 : La fin de la personnalité juridique Mort civile/Mort biologique**\n\n*En droit privé, il existe un distinction entre la mort civile et la mort biologique:*\n\n- *La mort civile était une sanction juridique ancienne: elle mettait fin à la personnalité juridique d’un individu, comme s’il était décédé. La personne concernée perdait ses droits civique et politiques, et son mariage était automatiquement dissous. Cependant, elle conservait la possibilité de travailler, de gagner de l’argent, de passer des contrats et de posséder des biens (acheter ou vendre). Cette institution a disparu depuis 1854*\n- *la mort biologique, quant à elle, correspond à la réalité physique du décès: elle met fin à la personnalité juridique parce que le corps humain vivant devient un cadavre*\n\n\n\n**Section 1. La certitude de la mort biologique&#xA0;**\n\n**§1 : La définition et les effets juridiques de la mort&#xA0;**\n\n- *Pour les juristes, la mort est considérée comme un fait juridique. Il s’agit d’un événement, volontaire ou involontaire, qui produit des effets juridiques fixés par la loi, indépendamment de la volonté des individus. La mort est donc à la fois un fait biologique, constaté médicalement, et un fait juridique.*\n- *Cependant, la définition de la mort biologique est devenue plus complexe avec les progrès scientifiques et médicaux. Il peut arriver que le cerveau soit totalement détruit alors que le cœur continue de battre, ou au contraire, que le cœur soit maintenue artificiellement en fonctionnement alors que l’activité cérébrale a cessé. Ces situations soulèvent des interrogations: peut-on encore considérer l’individu comme vivant ou doit-on constater sa mort ?*\n- *En droit la mort est définie comme la mort du cerveau. On distingue ainsi 2 cas de mort biologique:*\n  - *La première est la mort cérébrale, qui correspond à l’abolition irréversible de toutes les fonctions cérébrales, alors même qu’une activité cardiaque peut persister grâce à une assistance artificielle. 3 critères médicaux permettent de constater la mort cérébrale:&#xA0;*\n    - *l'absence totale de conscience*\n    - *l’abolition des réflexes du tronc cérébral*\n    - *l’absence de ventilation spontanée*\n\n\n\n- *Le deuxième cas est l’état végétatif chronique. Il correspond à une altération des hémisphères cérébraux, alors que le tronc cérébral n’est pas totalement atteint. La personne se trouve dans un état de veille: elle respire spontanément, peut parfois avoir les yeux ouverts mais retse incapable de communiquer avec autrui. Le problème majeur tient à l’incertitude: on ne sait pas si la personne conserve un degré de conscience et si elle souffre.*\n\n* *Sur le plan juridique, la question du préjudice s’est posée. Dans un arrêt de la Deuxième chambre civile de la cour de Cassation, rendu le 22 février 1995, la cour a affirmé que « L’état vegetatif chronique d’une personne humaine n’excluant aucun chef d’indemnisation, son préjudice doit être réparé en tous ses éléments ». Ici la Cour adopte une conception objective du préjudice: il doit être réparé indépendamment de la conscience qu’en a le victime. Mais dans un arrêt de la Chambre criminelle de la Cour de Cassation, en date du 5 octobre 2010, la Cour a plutôt retenu une conception subjective du préjudice: il ne peut être indemnisé que si la victime a conscience de le subir. —> On constate donc une hésitation jurisprudentielle entre une approche objective (réparation systématique) et une approche subjective (réparation liée à la conscience de la victime.*\n* *Comme pour la naissance, le décès doit être déclaré auprès de l’officier de l’état civil de la commune où il est survenu, et ce dans un délai de 24 heures. La déclaration doit être accompagnée d’un certificat médical de décès.&#xA0;*\n* *Le Code civil encadre cette formalité **aux articles 78 et suivants**. Cette déclaration a pour but d’assurer une mesure de publicité à l’égard des tiers, car la mort met fin à la personnalité juridique. D’autres articles du Code Civil prévoient les conséquences juridiques liées au décès:*\n  - ***article 227**: il précise les effets du décès sur les obligations personnelles*\n  - ***article 711:** il règle la question de la transmission des biens (par succession)*\n  - ***article 895:** définit le legs comme une disposition testamentaire par laquelle une personne, le testateur, transmet tout ou une partie de ses bien pour les temps où elle n’existera plus*\n\n\n\n- *Lorsqu’un être humain meurt, il devient juridiquement un cadavre, c'est-à-dire une chose au regard du droit. Cependant il est possible de prélever des organes sur un cadavre dans 2 cas:*\n  - *à des fins scientifiques: pour la recherche ou l’enseignement médical*\n  - *à des fins thérapeutiques: pour des greffes ou des interventions médicales destinées à sauver ou améliorer la vie d’autrui*\n\n\n\n- *Le cadavre est une chose particulière au regard du droit. Il doit faire objet d’un respect particulier, et il est obligatoire de respecter la dépouille du défunt **(article 16-1-1 du Code Civil:&#x20;**&#x70;rotection du corps humain vivant et décédé)*\n- *Le législateur impose le respect du choix du mode de sépulture de la personne décédée. Chaque individu peut déterminer lui-même le mode de sépulture, mais ce choix reste limité aux 2 options prévues par la loi: l’inhumation ou la crémation. Si la personne n’a pas pu s’exprimer de son vivant son choix concernant le mode de sépulture, il faut d’abord chercher par tous les moyens à connaître sa volonté. Si cette volonté ne peut pas être déterminée, la loi prévoit que sera désignée la personne la mieux qualifiée pour décider des modalités de funérailles.*\n- *Par ailleurs, certaines pratiques sont interdites comme la congélation du cadavres, qui n’est pas autorisée par la législation. Depuis 2008, une loi interdit, en matière de crémation, le partage des cendres entre les membres de la famille du défunt. Cette disposition est prévue à l’article L2213-18-2 du CGCT (Code Général des Collectivités Territoriales)*\n- *Le droit encadre strictement les utilisations scientifiques et thérapeutiques du cadavre. Concernant le prélèvement d’organes, il est obligatoire que le défunt ne soit pas opposé à ces prélèvements de son vivant. Le moyen principal de preuve du refus de don d’organes est un registre national automatisé qui recense tous les refus exprimés par les individus.*\n- *Le droit prévoit une interdiction de l’utilisation exclusivement commerciale du cadavre. Cette règle est inscrite &#xE0;**&#x20;l’article 16-1-1 du Code Civil,&#x20;**&#x71;ui protège le corps humain et sa dignité, que ce soit vivant ou pour un défunt.*\n- *Dans un arrêt rendu par la Première chambre civile de la Cour de cassation le 29 octobre 2014, la Cour a interdit l’ouverture de cadavres chinois à des fins d'étude dans un musée. Cette décision illustre le principe selon lequel le cadavre doit être respecté, et que toute utilisation non autorisée à des fins scientifiques, commerciales ou culturelles peut être interdite par la loi.&#xA0;*\n\n\n\n**§2 : Le cas de la mort causée par un tiers (suicide assisté)&#xA0;**\n\n- *Le Code pénal encadre certaines situations:*\n  - ***article 223-13:&#x20;**&#x6E;on-assistance à personne en danger —> Toute personne qui peut intervenir pour sauver quelqu’un en danger sans risque pour elle-même à l’obligation d’agir, sous peine de sanctions pénales*\n  - ***article 223-6:** les actes causant la mort d’autrui sont punissables, sauf exceptions causées par le loi&#xA0;*\n\n\n\n- *En parallèle, la liberté de se suicider soi-même est reconnue: chacun a le droit de mettre fin à sa vie sans que cela constitue un crime, à condition de na pas impliquer directement autrui dans cet acte.*\n- *L’euthanasie est autorisée dans plusieurs Etats:*\n  - *en Suisse depuis 1937*\n  - *aux Pays-Bas depuis 2001*\n  - *en Belgique depuis 2002*\n  - *au Luxembourg depuis 2009*\n  - *en Espagne depuis 2021*\n  - *au Portugal depuis 2023*\n\n\n\n- *En France, la question fait toujours débat. Le gouvernement a mis en place depuis décembre 2022 une Convention citoyenne sur la fin de vie, composée de 185 personnes, qui a rendu son rapport le 2 avril 2023. A la suite de ce rapport, un projet de loi sur l’euthanasie et l’aide à mourir a été déposé en avril 2024. Ce texte prévoit notamment la création de maisons d’accompagnement, structures intermédiaires entre le domicile et l'hôpital, destinées aux personnes en fin de vie ne pouvant retourner chez elles. Le projet prévoit aussi de mettre à disposition des patients une substance létale qu’ils pourraient s'administrer eux-mêmes, ou, s’ils n’en sont pas capables, par l’intermédiaire d’un médecin, d’un infirmier, d’un proche ou de toute personne volontaire de leur choix.&#xA0;*\n- *L’accès à l’aide à mourir sera possible uniquement si certaines conditions sont réunies:*\n  - *la personne devra être majeure, de nationalité française ou étrangère mais résidant régulièrement en France*\n  - *elle devra être capable d’exprimer une volonté libre et éclairée, ce qui exclut les personnes placées sous tutelle ou privées de leur facultés mentales*\n  - *l’accès sera réservé aux malades atteints d’une maladie grave ou incurable, avec un pronostic vital engagé à court terme (heures ou jours) ou à moyen terme (semaines ou mois)*\n  - *la personnes devra souffrir de douleurs réfractaires, c’est à dire impossible à soulager*\n\n\n\n- *Le 27 mai 2025, l’Assemblée Nationale a adopté la proposition de loi sur l'aide à mourir. Le Sénat doit examiner le texte à l'automne 2025.*\n\n\n\n**Section 2. L’incertitude de la mort biologique&#xA0;**\n\n- *Dans certaines situations, il est difficile de déterminer si la personne est morte lorsqu’on ne l’a plus vue depuis très longtemps à son domicile (elle ne donne plus de signes de vie). Dans le cas de l’absence, on ne sait pas si la personne est vivante ou décédée. Dans d'autres cas, il est plus probable que la personne soit décédée, en raison d’indices ou des circonstances : c’est le cas de la disparition.*\n\n\n\n**§1 : Le cas de l’absence&#xA0;**\n\n*⇒ la personne est peut-être morte mais on n’en est pas totalement sûr. &#xA0;*\n\n\n\n- *Dans le Code civil de 1804, l’absence juridiquement partait du principe que l'absent pouvait toujours revenir :&#xA0;*\n\n*⇒ système tourné vers la protection de l'absent, donc au détriment du conjoint et de ses héritiers qui restaient pendant longtemps dans un état d’incertitude. &#xA0;*\n\n\n\n- *Puis une loi a été adoptée le 28 décembre 1977 créant deux périodes différentes :&#xA0;*\n\n* *la présomption d'absence (présomption de vie)&#xA0;*\n* *puis la déclaration d'absence (présomption de mort)*\n\n**A) La présomption d’absence&#xA0;**\n\n*La présomption d'absence : une présomption de vie&#xA0;*\n\n\n\n- ***Conditions** : Deux conditions cumulatives sont requises pour constater l’absence de la personne :&#xA0;*\n\n* *elle doit avoir cessé de paraître au lieu de son domicile ou de sa résidence*\n* *on ne doit plus en avoir de nouvelles (**C. civ., art. 112**).*\n\n\n\n*⇒ c’est le juge des tutelles qui constate la présomption d'absence à la demande de toute personne intéressée ou du ministère public sans condition de délai (NB : pour la personne restée absente pendant plus de 20 ans, c’est la seconde phase qui prend le relai : **C. civ., art. 122**).&#xA0;*\n\n\n\n- ***Effets** : Pendant la période de présomption d'absence, la personne est présumée vivante : pas de dissolution de son mariage, pas de transmission de son patrimoine par voie de succession, etc.&#xA0;*\n\n*⇒ but de préservation des intérêts patrimoniaux de l'absent donc nomination possible par le juge d’un représentant pour administrer tout ou partie des biens du présumé absent (**C. civ., art. 113**). A défaut d’une telle nomination, c’est le conjoint du présumé absent qui administre ses biens (**C. civ., art. 121**).&#xA0;*\n\n\n\n- ***Cessation de la présomption d'absence** : La période de la présomption d'absence peut prendre fin de trois façons :*\n\n* *l'absent réapparaît. À sa demande, il retrouve la faculté d’administrer seul ses biens (**C. civ., art. 118**)*\n* *l'absent meurt, sa mort est constatée de manière certaine (on retrouve son cadavre)*\n* *la déclaration d'absence est prononcée, si pendant 10 ans aucun événement nouveau n'est advenu*\n\n\n\n**B) La déclaration d’absence&#xA0;**\n\n*La déclaration d'absence : une présomption de mort&#xA0;*\n\n\n\n- ***Prononcé de la déclaration d'absence** : En cas de jugement constatant la présomption d'absence, la déclaration judiciaire d'absence peut être prononcée après un délai de 10 ans (**C. civ., art. 122**). En l'absence d'un tel jugement, « le jugement de déclaration d'absence ne peut intervenir que si la personne ne s'est pas présentée à son domicile et n'a pas donné de signes de vie pendant plus de 20 ans. Il est rendu non plus par un juge mais par le tribunal judiciaire. La requête aux fins de déclaration d'absence doit faire l'objet d'une publicité et le tribunal ne peut rendre sa décision qu'un an après cette publication » (**Astrid Marais**).&#xA0;*\n\n\n\n- ***Effets de la déclaration** : La déclaration d'absence engendre une présomption de décès et le « jugement déclaratif d'absence, une fois qu'il a été transcrit sur les registres de décès, produit tous les effets du décès, il ouvre la succession et dissout le mariage. De tels effets sont subordonnés au respect de mesures de publicité du jugement déclaratif d'absence lui-même » (**Astrid Marais)**.&#xA0;*\n\n\n\n- ***Retour de l'absent** : Il peut encore arriver que l’absent revienne. Si cela arrive, le Procureur de la république ou toute partie intéressée peut demander l'annulation du jugement déclaratif d'absence, avec publication du jugement. Selo&#x6E;**&#x20;l’article 130 du Code civil,** l'absent qui revient recouvre ses biens dans l'état où ils se trouvent. L'annulation du jugement déclaratif d'absence ne remet pas en cause la dissolution du mariage.*\n\n\n\n**§2 : Le cas de la disparition&#xA0;**\n\n\n\n***Conditions** : **Articles 88 à 92 du Code civil.**&#xA0;*\n\n- *Si une personne disparaît « dans des circonstances de nature à mettre sa vie en danger » (ex : naufrage, guerre, etc) et que « son corps n'a pu être retrouvé » (**art. 88 al. 1er**), son décès peut être judiciairement déclaré. La procédure s'applique également lorsque le décès est certain mais que le corps n'a pu être retrouvé (**art. 88 al. 3**),&#xA0;*\n\n***Exemple** : l’explosion en plein vol d'un avion.&#xA0;*\n\n- ***Prononcé** : Le jugement déclaratif de décès => prononcé par le tribunal judiciaire sur saisine soit du procureur, soit des personnes intéressées. « Si le tribunal considère que le décès n'est pas suffisamment établi, il peut ordonner des mesures d'information supplémentaires sur les circonstances de la disparition » (**Astrid Marais**).&#xA0;*\n\n* ***Effets** : Le jugement déclaratif de décès sera un acte de décès à l’égard de tous. Ce sera au juge de fixer la date de la mort du défunt en se fondant sur des présomptions tirées des circonstances, et à défaut, la mort sera fixée au jour de la disparition.&#xA0;*\n* ***Annulation** : Il peut encore arriver que la personne introuvable revienne. Si c’est le cas, l'annulation du jugement déclaratif de décès peut être demandée par le procureur ou tout intéressé. L’annulation du jugement déclaratif de décès produira les mêmes effets que celle du jugement déclaratif d'absence.*\n", "html": "<h2>TITRE 1 : L’existence des personnes physiques<\/h2>\n<p>*(SÉANCE de TD numéro 2) *<\/p>\n<h2>CHAPITRE 1 : Le début de la personnalité juridique<\/h2>\n<h3>Section 1. Le principe : la naissance<\/h3>\n<ul>\n<li><em>La personnalité juridique commence à la naissance<\/em><\/li>\n<\/ul>\n<h3>§1 : L’acquisition de la personnalité juridique par la naissance<\/h3>\n<h4>A) Condition nécessaire à l’acquisition de la personnalité juridique<\/h4>\n<ul>\n<li><em>Avant la naissance (embryon et foetus), l’enfant n’a pas de personnalité distincte de sa mère, il se confond avec elle, les deux ne font qu’un. Ce n’est que lors de l'accouchement que l’enfant devient une personne à part entière et peut acquérir la personnalité juridique<\/em><\/li>\n<\/ul>\n<ul>\n<li>—&gt; tout être humain une fois né obtient la personnalité juridique. *<\/li>\n<\/ul>\n<ul>\n<li>*Or, les esclaves n’avaient pas la personnalité juridique. **Aristote **les qualifiait comme objet de droit. En 1848, **Schoelcher **a aboli l’esclavage en France. Depuis 2001, l’esclavage et la traite d’êtres humains sont des crimes contre l’humanité. *<\/li>\n<\/ul>\n<p><em>—&gt; La naissance n’est donc pas suffisante pour acquérir la personnalité juridique<\/em><\/p>\n<h4>B) Condition insuffisante à l’acquisition de la personnalité juridique<\/h4>\n<h5>1) Deux conditions cumulatives : • Né vivant • Né viable<\/h5>\n<ul>\n<li><em>Il faut un enfant qui soit** né vivant et viable<strong>. Ces 2 conditions sont indispensables **pour obtenir la personnalité juridique<\/strong>. Ces conditions sont déduites de certains articles du Code Civil (ex: <strong>art. 318; art. 725; art. 906<\/strong>).<\/em><\/li>\n<li>*L’enfant est né vivant s’il respire. L’enfant est né viable lorsqu’il est apte à la vie.** Il existe 2 types de viabilité:***<ul>\n<li>***la viabilité in utero**: aptitude à poursuivre son développement dans le corps de sa mère*<\/li>\n<li>***la viabilité ex utero:** aptitude à vivre en dehors du corps maternel*<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<ul>\n<li>*C’est la viabilité ex utero qui est retenue par le droit, elle relève de l’appréciation des médecins. <strong>L’OMS **a donné une définition de la viabilité en 1977: elle est reconnue aux enfants nés après **22 semaines d’aménoré<\/strong> (= absence de règles), il doit <strong>atteindre le poids de 500 grammes minimum<\/strong> car on présume qu’un foetus nés après **22 semaines d’aménoré et de plus de 500 grammes peut vivre hors du corps de sa mère. ***<\/li>\n<li>*En résumé, un enfant né vivant et viable peut avoir la personnalité juridique. Or, selon** l’art 55 du Code Civil,** les déclarations de naissance doivent se faire dans les 5 jours après l’accouchement (attribution d’un prénom et nom de famille, inscription sur le livret de famille…). Un enfant né vivant et viable peut succéder même s’il meurt peu de temps après sa naissance. Mais il peut mourir avant sa déclaration de naissance et dans ce cas là, l’officier de l'État civil va établir un acte de naissance suivi d’un acte de décès avec la fourniture d’un certificat médical (**art 79-1 du Code Civil)***<\/li>\n<\/ul>\n<h5>2) Cas de l’absence d’une des deux conditions (enfants sans vie ou non viable)<\/h5>\n<ul>\n<li>*Dans ce cas on peut parler d’enfant** « mort né »** ou d’enfant <strong>« né vivant mais non-viable ».<\/strong> L’officier de l'État civil peut produire un acte d’enfant sans vie (= permet aux parents de donner à l’enfant un prénom qui sera mentionné sur les registres de l'État civil et sur le livret de famille, il permet aussi d’organiser des obsèques, d’obtenir certains droits sociaux comme la prime de naissance, les congés maternité/paternité…) avec des conditions juridiques plus limitées qu’un enfant né vivant et viable. Face à l’absence de ces 2 conditions, une question se pose: est ce que la délivrance d’un acte d’enfant sans vie doit être accordé qu'aux enfants qui respectent une de ces 2 conditions ou doit-on étendre cette délivrance à toutes les conditions (ex: enfants mort né non viable) ? *<\/li>\n<li><em>La circulaire du 30 novembre 2001 avait retenu qu’il fallait une des 2 conditions, elle reprenait la définition de <strong>l’OMS **sur la viabilité. Cependant la cour de cassation a fini par réagir, elle refuse l’application de la circulaire de 2001 car selon la cour elle rajoutait des conditions à la loi. Plusieurs décisions de justice ont été rendues de 6 février 2008. Selon la cour,<\/strong> l’art 79-1 du Code Civil **ne subordonné l’établissement d’un acte d’enfant sans vie ni au poids du foetus ni à la durée de la grossesse: autrement dit, tout foetus né sans vie peut être inscrit dans les registres civils peu importe son niveau de développement. Des décrets ont été adoptés le 20 août 2008 qui ont subordonné l’acte d’enfant sans vie à la délivrance d’un certificat médical d’accouchement. Or, les textes excluent les IVG, les fausses couches précoces, les embryons morts nés avant la 12ème semaine de grossesse… Il y a donc un élargissement de la catégorie des enfants sans vie.<\/em><\/li>\n<\/ul>\n<h3>§2 : La responsabilité liée à une naissance<\/h3>\n<h4>A) La naissance d’un enfant non désiré<\/h4>\n<ul>\n<li><em>La naissance d’un enfant ne peut pas être perçue comme un préjudice par le droit. Une loi le rappelle, c’est celle du 4 mars 2002 sur le droit des malades (art. L114-5 du Code de l’action sociale et des familles: nul ne peut se prévaloir d’un préjudice du seul fait de sa naissance.). Si cet enfant non-désiré résulte d’un viol, peut agir en réparation d’un préjudice moral de son géniteur envers sa mère, c’est à dire que l’enfant va expliquer devant un juge que, par exemple, il souffre psychologiquement d’être né d’un viol<\/em><\/li>\n<\/ul>\n<h4>B) La naissance d’un enfant avec un handicap<\/h4>\n<ul>\n<li><em>On va distinguer 2 cas:<\/em><\/li>\n<\/ul>\n<p>-<strong>la faut commise avant la naissance<\/strong>:<\/p>\n<ul>\n<li>*la faute qui cause le handicap de l’enfant qui va naître: le droit prévoit que l’auteur de cette faute doit être condamné à réparer le préjudice corporel causé ou aggravé à l’enfant selon les règles classiques de la responsabilité, ou si l’intervention médicale n’a pas permis d’atténuer le handicap (art. L114-5 du Code de l’action sociale et des familles).  *<\/li>\n<li><em>La faute du tiers n’a pas provoqué directement le handicap mais n’a pas permis aux parents de détecter ce handicap car dans le cas caite la mère aurait pu recourir à une intervention médicale pour stopper la grossesse<\/em><\/li>\n<li>*Dans certains cas, le médecin n’a pas causé de handicap. Ici, le juge judiciaire admettait que les parents et l’enfant agissent contre le médecin responsable. Les juges administratifs refusaient à l’enfant la réparation de son préjudice  mais ils admettaient le réparation du préjudice des parents (préjudice moral, la souffrance de savoir qu’ils auront un enfant handicapé). Il faut que la faute du médecin soit prouvée pour pouvoir arrêter la grossesse. Depuis** la loi du 4 mars 2002,** les règles ont changé: la réparation du préjudice de l’enfant et des parents relèvent de la solidarité nationale. *<\/li>\n<\/ul>\n<p>-<strong>la faute commise après la naissance<\/strong>:<\/p>\n<ul>\n<li><em>Il y a des situations dans lesquelles les médecins ont rendu la vie des enfants nés en état de mort apparente. Il arrive que les médecins réaniment un enfant à la naissance mais les laissent avec des séquelles physiques et des troubles mentaux (ex: le cordon ombilical est entouré autour du bébé et l’étrangle). Le 2 juin 2009 le tribunal administratif de Nîmes admet que les médecins sont fautifs car ils estiment que les médecins doivent connaître les séquelles que la réanimation causera à l’enfant. Le 12 mars 2015, la cour administrative de Marseille a annulé cette accusation.<\/em><\/li>\n<\/ul>\n<h3>Section 2. L’exception : la conception<\/h3>\n<h4>A) La nature juridique de l’embryon : une chose<\/h4>\n<ul>\n<li><em>L’embryon est une chose juridique. C’est à la naissance qu’il devient une personne. L’embryon est une <strong>« chose humaine »<\/strong>, c’est une personne en développement.<\/em><\/li>\n<li>*Il y a un développement des méthodes médicales qui permettent** la fécondation in vitro,** et de la **PMA **dans les années 1980. La loi appréhende la nature juridique de l’embryon comme une chose, donc la nature juridique de chose s’applique avant la naissance de tout être humain. Il n’y a pas de différence en fonction des différentes méthodes de grossesse. A sa naissance, l’embryon deviendra une personne s’il est vivant et viable. *<\/li>\n<li>*Pourquoi l’embryon n’est pas une personne ? —&gt; car s’il l’était l’IVG serait un meurtre, ce qui n’est pas le cas depuis** la loi Veil de 1975. ***<\/li>\n<li>***L’art 16** dit que la loi garantit le respect de l’être humain dès le commencement de sa vie. Mais quand la vie commence-t-elle ? Si l’être humain en devenir n’est pas une personne, il est impossible de commettre un homicide/un meurtre sur l’embryon. La Cour de Cassation a refusé de reconnaître coupable d’homicide une personne qui provoque la mort d’un foetus. Un homicide/meurtre c’est tuer une personne, l’embryon étant une chose on ne peut pas commettre un homicide sur une chose. L’homicide sera retenu uniquement si le foetus naît vivant et meurt à la naissance à cause de la faute d’un tiers. L’auteur de la mort d’un foetus engagera sa responsabilité civile mais pas sa responsabilité pénale. Si une mère veut avoir recours à l’IVG, elle n’est pas dans l’obligation d’avoir une raison particulière. Au-delà du délai déterminé, cet acte devient illégal. Dans certains des cas, une intervention médicale peut être possible. Selon le Conseil Constitutionnel en 1994, affirme que le législateur a estimé que ce principe de respect de l’être commencement de sa vie n’est pas applicable à l’embryon in vitro, c’est à dire conçu artificiellement. En revanche, l’autre principe concernant le respect de la dignité de l’être humain, le Conseil Constitutionnel a reconnu en 2013 que la dignité humaine s’applique à l’embryon in vitro. L’embryon humain est une chose particulière qui mérite d’être protégé et qui deviendra PEUT ÊTRE une personne à part entière dans le futur.*<\/li>\n<\/ul>\n<h4>B) L’embryon : une personne en devenir<\/h4>\n<ul>\n<li>*Dans certains cas, le droit a recours à une fiction juridique, il fait comme si. Dans certains cas, le droit traite l’embryon comme une personne via la fiction juridique.** « Infans conceptus pro nato habetur quoties de commodis ejus agitur »** l’enfant conçu est considéré comme né chaque fois qu’il va de son intérêt. Ici, l’enfant n’est pas né et pourtant pendant sa conception on estime qu’il peut acquérir des droits. <strong>L’art 725<\/strong> dit que « pour succéder, il faut exister à l’instant de l’ouverture de la succession ou, ayant déjà été conçu, naître viable »<strong>. L’art 906 **dit que « Pour être capable de recevoir entre vifs, il suffit d’être conçu au moment de la donation. Pour être capable de recevoir par testament, il suffit d’être conçu à l’époque du décès du testateur. Néanmoins, la donation ou le testament n’auront leur effet qu’autant que l’enfant sera né viable ». L’art L132-8 du Code des Assurance dit que les enfants nés ou à naître peuvent bénéficier d’une assurance UNIQUEMENT si leur parents sont titulaires d’une assurance eux aussi et si la grossesse va à terme.<\/strong> L’art 311 du Code Civil **concerne la notion de conception: la loi instaure une présomption de période pendant laquelle l’enfant à été conçu avant la date de la naissance. Il est possible de faire appelle à ses droits après la naissance si les évènements se sont déroulés pendant la période de conception de l’enfant. *<\/li>\n<\/ul>\n<p>Mais alors quel est le régime juridique applicable à l’embryon ?<\/p>\n<ul>\n<li>l’embryon **in utero **(= dans le ventre de sa mère): en principe, un tiers ne peut pas porter atteinte à l’être humain, seule la loi peut par exception définir les cas dans lesquels une atteinte à l'être humain peut être possible. La loi réglemente le droit à l’interruption de grossesse. Il y a 3 types:<ul>\n<li><strong>l’IVG praticable avant la fin de la 14ème semaine de grossesse<\/strong>, ce qui équivaut à 16 semaines d’absences de règles (1). La loi fait prévaloir à la femme le droit de disposer de son corps pendant les 14/16 semaines de délai. Au-delà, la loi protège le foetus contre sa mère, l’IVG n’est plus autorisé** (article L2222-2 du Code Civil)** et peut-être condamné pénalement.<\/li>\n<li>**l’IMG (=interruption médicale de grossesse) **praticable à tout moment de la grossesse avec un motif médical valable. L’article L2213-1 du Code de la Santé Publique réglemente le type d’interruption de grossesse.  Selon cet article, l’IMG exige que la poursuite de la grossesse mette en péril la vie de la mère ou s’il existe une forte probabilité que l’enfant à naître soit atteint d’un affection, d’une particulière gravité reconnue comme incurable au moment du diagnostic ». (2)<\/li>\n<li><strong>l’IPG (= interruption partielle de grossesse multiple) **qui permet d’interrompre la vie d’un ou plusieurs embryons (<\/strong>exemple**: on interrompt la vie d’un jumeaux sur deux) pour permettre aux autres embryons de poursuivre leur développement. Contrairement à l’IMG cette méthode à un délai de 12 semaines soit 14 semaines d’absence de règle.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<ul>\n<li><em>l’embryon <strong>in vitro **(= conçu de manière artificielle): la protection des embryons in vitro a diminué avec le temps, elle s’est atténuée. La conception d’un embryon in vitro se met en place avec l’intervention d’une PMA. L’article L2141-1 du Code de la Santé Publique met en avant l’Assistance Médicale à la Procréation. Le droit positif prohibe la création d’embryon humain par clonage **(article 16-4 du Code Civil).<\/strong> Selon le Code Pénal, le clonage reproductif est un crime. Le clonage thérapeutique est un délit, il est moins sanctionné que le clonage reproductif. La création d’embryon chimérique et transgénique (= embryon dont le génome a été partiellement modifié par « l’injection » d’ADN différent) a été interdite en France suite à <strong>une loi en 2011 (article 16-4 du Code Civil)<\/strong>. Pour recourir à la PMA, certaines conditions s’imposent: il faut être vivant, avoir l’âge de procréer et être consentant au transfert d’embryon. Avant, la fertilité était une des conditions à la PMA. Les prélèvement peuvent être fait jusqu’au 43 ans de la femme et les 60 ans de l’homme. Il est possible de faire congeler ses gamètes en vue d'une prochaine grossesse. Dans le Code de la Santé Publique se trouvent les conditions nécessaires à la PMA. Jusqu’à 2021, beaucoup de donneurs le faisaient anonymement. Hors cette condition va être levée si le donneurs est consentant afin d’établir une relation avec l’enfant <strong>(article 16-8-1).<\/strong> Même si le donneur est le père biologique, il n’a en aucun cas le droit d’être le père légal de l’enfant. Il y a une interdiction de procréation post-mortem, les deux personnes du couple doivent être vivantes, le décès d’un des membres du couple fait obstacle. Sur la destruction des embryons <strong>in vitro<\/strong>, tout une procédure doit être mise en place selon le Code de la Santé Publique. Chaque année la PMA contacte le couple afin d’être sûr que le projet est maintenu, au bout de 5 ans les embryons sont détruits. Depuis 2013, le recherche sur l’embryon est autorisé SOUS CONDITIONS, selon le Code de la Santé Publique (la recherche doit être pertinente scientifiquement (1), doit s’inscrire dans un finalité médicale (2), un médecin doit attester qu’elle recourt à des embryons pour la recherche  (3), doit respecter les principes éthiques sur l’embryon (4))<\/em><\/li>\n<\/ul>\n<h2>CHAPITRE 2 : La fin de la personnalité juridique Mort civile/Mort biologique<\/h2>\n<p><em>En droit privé, il existe un distinction entre la mort civile et la mort biologique:<\/em><\/p>\n<ul>\n<li><em>La mort civile était une sanction juridique ancienne: elle mettait fin à la personnalité juridique d’un individu, comme s’il était décédé. La personne concernée perdait ses droits civique et politiques, et son mariage était automatiquement dissous. Cependant, elle conservait la possibilité de travailler, de gagner de l’argent, de passer des contrats et de posséder des biens (acheter ou vendre). Cette institution a disparu depuis 1854<\/em><\/li>\n<li><em>la mort biologique, quant à elle, correspond à la réalité physique du décès: elle met fin à la personnalité juridique parce que le corps humain vivant devient un cadavre<\/em><\/li>\n<\/ul>\n<h3>Section 1. La certitude de la mort biologique<\/h3>\n<h3>§1 : La définition et les effets juridiques de la mort<\/h3>\n<ul>\n<li><p><em>Pour les juristes, la mort est considérée comme un fait juridique. Il s’agit d’un événement, volontaire ou involontaire, qui produit des effets juridiques fixés par la loi, indépendamment de la volonté des individus. La mort est donc à la fois un fait biologique, constaté médicalement, et un fait juridique.<\/em><\/p>\n<\/li>\n<li><p><em>Cependant, la définition de la mort biologique est devenue plus complexe avec les progrès scientifiques et médicaux. Il peut arriver que le cerveau soit totalement détruit alors que le cœur continue de battre, ou au contraire, que le cœur soit maintenue artificiellement en fonctionnement alors que l’activité cérébrale a cessé. Ces situations soulèvent des interrogations: peut-on encore considérer l’individu comme vivant ou doit-on constater sa mort ?<\/em><\/p>\n<\/li>\n<li><p><em>En droit la mort est définie comme la mort du cerveau. On distingue ainsi 2 cas de mort biologique:<\/em><\/p>\n<ul>\n<li>*La première est la mort cérébrale, qui correspond à l’abolition irréversible de toutes les fonctions cérébrales, alors même qu’une activité cardiaque peut persister grâce à une assistance artificielle. 3 critères médicaux permettent de constater la mort cérébrale: *<ul>\n<li><em>l'absence totale de conscience<\/em><\/li>\n<li><em>l’abolition des réflexes du tronc cérébral<\/em><\/li>\n<li><em>l’absence de ventilation spontanée<\/em><\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/li>\n<li><p><em>Le deuxième cas est l’état végétatif chronique. Il correspond à une altération des hémisphères cérébraux, alors que le tronc cérébral n’est pas totalement atteint. La personne se trouve dans un état de veille: elle respire spontanément, peut parfois avoir les yeux ouverts mais retse incapable de communiquer avec autrui. Le problème majeur tient à l’incertitude: on ne sait pas si la personne conserve un degré de conscience et si elle souffre.<\/em><\/p>\n<\/li>\n<\/ul>\n<ul>\n<li><em>Sur le plan juridique, la question du préjudice s’est posée. Dans un arrêt de la Deuxième chambre civile de la cour de Cassation, rendu le 22 février 1995, la cour a affirmé que « L’état vegetatif chronique d’une personne humaine n’excluant aucun chef d’indemnisation, son préjudice doit être réparé en tous ses éléments ». Ici la Cour adopte une conception objective du préjudice: il doit être réparé indépendamment de la conscience qu’en a le victime. Mais dans un arrêt de la Chambre criminelle de la Cour de Cassation, en date du 5 octobre 2010, la Cour a plutôt retenu une conception subjective du préjudice: il ne peut être indemnisé que si la victime a conscience de le subir. —&gt; On constate donc une hésitation jurisprudentielle entre une approche objective (réparation systématique) et une approche subjective (réparation liée à la conscience de la victime.<\/em><\/li>\n<li>*Comme pour la naissance, le décès doit être déclaré auprès de l’officier de l’état civil de la commune où il est survenu, et ce dans un délai de 24 heures. La déclaration doit être accompagnée d’un certificat médical de décès. *<\/li>\n<li><em>Le Code civil encadre cette formalité <strong>aux articles 78 et suivants<\/strong>. Cette déclaration a pour but d’assurer une mesure de publicité à l’égard des tiers, car la mort met fin à la personnalité juridique. D’autres articles du Code Civil prévoient les conséquences juridiques liées au décès:<\/em><ul>\n<li>***article 227**: il précise les effets du décès sur les obligations personnelles*<\/li>\n<li>***article 711:** il règle la question de la transmission des biens (par succession)*<\/li>\n<li>***article 895:** définit le legs comme une disposition testamentaire par laquelle une personne, le testateur, transmet tout ou une partie de ses bien pour les temps où elle n’existera plus*<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<ul>\n<li><p><em>Lorsqu’un être humain meurt, il devient juridiquement un cadavre, c'est-à-dire une chose au regard du droit. Cependant il est possible de prélever des organes sur un cadavre dans 2 cas:<\/em><\/p>\n<ul>\n<li><em>à des fins scientifiques: pour la recherche ou l’enseignement médical<\/em><\/li>\n<li><em>à des fins thérapeutiques: pour des greffes ou des interventions médicales destinées à sauver ou améliorer la vie d’autrui<\/em><\/li>\n<\/ul>\n<\/li>\n<li><p><em>Le cadavre est une chose particulière au regard du droit. Il doit faire objet d’un respect particulier, et il est obligatoire de respecter la dépouille du défunt **(article 16-1-1 du Code Civil: **protection du corps humain vivant et décédé)<\/em><\/p>\n<\/li>\n<li><p><em>Le législateur impose le respect du choix du mode de sépulture de la personne décédée. Chaque individu peut déterminer lui-même le mode de sépulture, mais ce choix reste limité aux 2 options prévues par la loi: l’inhumation ou la crémation. Si la personne n’a pas pu s’exprimer de son vivant son choix concernant le mode de sépulture, il faut d’abord chercher par tous les moyens à connaître sa volonté. Si cette volonté ne peut pas être déterminée, la loi prévoit que sera désignée la personne la mieux qualifiée pour décider des modalités de funérailles.<\/em><\/p>\n<\/li>\n<li><p><em>Par ailleurs, certaines pratiques sont interdites comme la congélation du cadavres, qui n’est pas autorisée par la législation. Depuis 2008, une loi interdit, en matière de crémation, le partage des cendres entre les membres de la famille du défunt. Cette disposition est prévue à l’article L2213-18-2 du CGCT (Code Général des Collectivités Territoriales)<\/em><\/p>\n<\/li>\n<li><p><em>Le droit encadre strictement les utilisations scientifiques et thérapeutiques du cadavre. Concernant le prélèvement d’organes, il est obligatoire que le défunt ne soit pas opposé à ces prélèvements de son vivant. Le moyen principal de preuve du refus de don d’organes est un registre national automatisé qui recense tous les refus exprimés par les individus.<\/em><\/p>\n<\/li>\n<li><p><em>Le droit prévoit une interdiction de l’utilisation exclusivement commerciale du cadavre. Cette règle est inscrite à** l’article 16-1-1 du Code Civil, **qui protège le corps humain et sa dignité, que ce soit vivant ou pour un défunt.<\/em><\/p>\n<\/li>\n<li><p>*Dans un arrêt rendu par la Première chambre civile de la Cour de cassation le 29 octobre 2014, la Cour a interdit l’ouverture de cadavres chinois à des fins d'étude dans un musée. Cette décision illustre le principe selon lequel le cadavre doit être respecté, et que toute utilisation non autorisée à des fins scientifiques, commerciales ou culturelles peut être interdite par la loi. *<\/p>\n<\/li>\n<\/ul>\n<h3>§2 : Le cas de la mort causée par un tiers (suicide assisté)<\/h3>\n<ul>\n<li><p><em>Le Code pénal encadre certaines situations:<\/em><\/p>\n<ul>\n<li>***article 223-13: **non-assistance à personne en danger —&gt; Toute personne qui peut intervenir pour sauver quelqu’un en danger sans risque pour elle-même à l’obligation d’agir, sous peine de sanctions pénales*<\/li>\n<li>***article 223-6:** les actes causant la mort d’autrui sont punissables, sauf exceptions causées par le loi *<\/li>\n<\/ul>\n<\/li>\n<li><p><em>En parallèle, la liberté de se suicider soi-même est reconnue: chacun a le droit de mettre fin à sa vie sans que cela constitue un crime, à condition de na pas impliquer directement autrui dans cet acte.<\/em><\/p>\n<\/li>\n<li><p><em>L’euthanasie est autorisée dans plusieurs Etats:<\/em><\/p>\n<ul>\n<li><em>en Suisse depuis 1937<\/em><\/li>\n<li><em>aux Pays-Bas depuis 2001<\/em><\/li>\n<li><em>en Belgique depuis 2002<\/em><\/li>\n<li><em>au Luxembourg depuis 2009<\/em><\/li>\n<li><em>en Espagne depuis 2021<\/em><\/li>\n<li><em>au Portugal depuis 2023<\/em><\/li>\n<\/ul>\n<\/li>\n<li><p>*En France, la question fait toujours débat. Le gouvernement a mis en place depuis décembre 2022 une Convention citoyenne sur la fin de vie, composée de 185 personnes, qui a rendu son rapport le 2 avril 2023. A la suite de ce rapport, un projet de loi sur l’euthanasie et l’aide à mourir a été déposé en avril 2024. Ce texte prévoit notamment la création de maisons d’accompagnement, structures intermédiaires entre le domicile et l'hôpital, destinées aux personnes en fin de vie ne pouvant retourner chez elles. Le projet prévoit aussi de mettre à disposition des patients une substance létale qu’ils pourraient s'administrer eux-mêmes, ou, s’ils n’en sont pas capables, par l’intermédiaire d’un médecin, d’un infirmier, d’un proche ou de toute personne volontaire de leur choix. *<\/p>\n<\/li>\n<li><p><em>L’accès à l’aide à mourir sera possible uniquement si certaines conditions sont réunies:<\/em><\/p>\n<ul>\n<li><em>la personne devra être majeure, de nationalité française ou étrangère mais résidant régulièrement en France<\/em><\/li>\n<li><em>elle devra être capable d’exprimer une volonté libre et éclairée, ce qui exclut les personnes placées sous tutelle ou privées de leur facultés mentales<\/em><\/li>\n<li><em>l’accès sera réservé aux malades atteints d’une maladie grave ou incurable, avec un pronostic vital engagé à court terme (heures ou jours) ou à moyen terme (semaines ou mois)<\/em><\/li>\n<li><em>la personnes devra souffrir de douleurs réfractaires, c’est à dire impossible à soulager<\/em><\/li>\n<\/ul>\n<\/li>\n<li><p><em>Le 27 mai 2025, l’Assemblée Nationale a adopté la proposition de loi sur l'aide à mourir. Le Sénat doit examiner le texte à l'automne 2025.<\/em><\/p>\n<\/li>\n<\/ul>\n<h3>Section 2. L’incertitude de la mort biologique<\/h3>\n<ul>\n<li><em>Dans certaines situations, il est difficile de déterminer si la personne est morte lorsqu’on ne l’a plus vue depuis très longtemps à son domicile (elle ne donne plus de signes de vie). Dans le cas de l’absence, on ne sait pas si la personne est vivante ou décédée. Dans d'autres cas, il est plus probable que la personne soit décédée, en raison d’indices ou des circonstances : c’est le cas de la disparition.<\/em><\/li>\n<\/ul>\n<h3>§1 : Le cas de l’absence<\/h3>\n<p>*⇒ la personne est peut-être morte mais on n’en est pas totalement sûr.  *<\/p>\n<ul>\n<li>*Dans le Code civil de 1804, l’absence juridiquement partait du principe que l'absent pouvait toujours revenir : *<\/li>\n<\/ul>\n<p>*⇒ système tourné vers la protection de l'absent, donc au détriment du conjoint et de ses héritiers qui restaient pendant longtemps dans un état d’incertitude.  *<\/p>\n<ul>\n<li>*Puis une loi a été adoptée le 28 décembre 1977 créant deux périodes différentes : *<\/li>\n<\/ul>\n<ul>\n<li>*la présomption d'absence (présomption de vie) *<\/li>\n<li><em>puis la déclaration d'absence (présomption de mort)<\/em><\/li>\n<\/ul>\n<h4>A) La présomption d’absence<\/h4>\n<p>*La présomption d'absence : une présomption de vie *<\/p>\n<ul>\n<li>***Conditions** : Deux conditions cumulatives sont requises pour constater l’absence de la personne : *<\/li>\n<\/ul>\n<ul>\n<li><em>elle doit avoir cessé de paraître au lieu de son domicile ou de sa résidence<\/em><\/li>\n<li><em>on ne doit plus en avoir de nouvelles (<strong>C. civ., art. 112<\/strong>).<\/em><\/li>\n<\/ul>\n<p>*⇒ c’est le juge des tutelles qui constate la présomption d'absence à la demande de toute personne intéressée ou du ministère public sans condition de délai (NB : pour la personne restée absente pendant plus de 20 ans, c’est la seconde phase qui prend le relai : <strong>C. civ., art. 122<\/strong>). *<\/p>\n<ul>\n<li>***Effets** : Pendant la période de présomption d'absence, la personne est présumée vivante : pas de dissolution de son mariage, pas de transmission de son patrimoine par voie de succession, etc. *<\/li>\n<\/ul>\n<p>*⇒ but de préservation des intérêts patrimoniaux de l'absent donc nomination possible par le juge d’un représentant pour administrer tout ou partie des biens du présumé absent (<strong>C. civ., art. 113<\/strong>). A défaut d’une telle nomination, c’est le conjoint du présumé absent qui administre ses biens (<strong>C. civ., art. 121<\/strong>). *<\/p>\n<ul>\n<li>***Cessation de la présomption d'absence** : La période de la présomption d'absence peut prendre fin de trois façons :*<\/li>\n<\/ul>\n<ul>\n<li><em>l'absent réapparaît. À sa demande, il retrouve la faculté d’administrer seul ses biens (<strong>C. civ., art. 118<\/strong>)<\/em><\/li>\n<li><em>l'absent meurt, sa mort est constatée de manière certaine (on retrouve son cadavre)<\/em><\/li>\n<li><em>la déclaration d'absence est prononcée, si pendant 10 ans aucun événement nouveau n'est advenu<\/em><\/li>\n<\/ul>\n<h4>B) La déclaration d’absence<\/h4>\n<p>*La déclaration d'absence : une présomption de mort *<\/p>\n<ul>\n<li><p>***Prononcé de la déclaration d'absence** : En cas de jugement constatant la présomption d'absence, la déclaration judiciaire d'absence peut être prononcée après un délai de 10 ans (<strong>C. civ., art. 122<\/strong>). En l'absence d'un tel jugement, « le jugement de déclaration d'absence ne peut intervenir que si la personne ne s'est pas présentée à son domicile et n'a pas donné de signes de vie pendant plus de 20 ans. Il est rendu non plus par un juge mais par le tribunal judiciaire. La requête aux fins de déclaration d'absence doit faire l'objet d'une publicité et le tribunal ne peut rendre sa décision qu'un an après cette publication » (<strong>Astrid Marais<\/strong>). *<\/p>\n<\/li>\n<li><p>***Effets de la déclaration** : La déclaration d'absence engendre une présomption de décès et le « jugement déclaratif d'absence, une fois qu'il a été transcrit sur les registres de décès, produit tous les effets du décès, il ouvre la succession et dissout le mariage. De tels effets sont subordonnés au respect de mesures de publicité du jugement déclaratif d'absence lui-même » (<strong>Astrid Marais)<\/strong>. *<\/p>\n<\/li>\n<li><p>***Retour de l'absent** : Il peut encore arriver que l’absent revienne. Si cela arrive, le Procureur de la république ou toute partie intéressée peut demander l'annulation du jugement déclaratif d'absence, avec publication du jugement. Selon** l’article 130 du Code civil,** l'absent qui revient recouvre ses biens dans l'état où ils se trouvent. L'annulation du jugement déclaratif d'absence ne remet pas en cause la dissolution du mariage.*<\/p>\n<\/li>\n<\/ul>\n<h3>§2 : Le cas de la disparition<\/h3>\n<p>***Conditions** : <strong>Articles 88 à 92 du Code civil.<\/strong> *<\/p>\n<ul>\n<li>*Si une personne disparaît « dans des circonstances de nature à mettre sa vie en danger » (ex : naufrage, guerre, etc) et que « son corps n'a pu être retrouvé » (<strong>art. 88 al. 1er<\/strong>), son décès peut être judiciairement déclaré. La procédure s'applique également lorsque le décès est certain mais que le corps n'a pu être retrouvé (<strong>art. 88 al. 3<\/strong>), *<\/li>\n<\/ul>\n<p>***Exemple** : l’explosion en plein vol d'un avion. *<\/p>\n<ul>\n<li>***Prononcé** : Le jugement déclaratif de décès =&gt; prononcé par le tribunal judiciaire sur saisine soit du procureur, soit des personnes intéressées. « Si le tribunal considère que le décès n'est pas suffisamment établi, il peut ordonner des mesures d'information supplémentaires sur les circonstances de la disparition » (<strong>Astrid Marais<\/strong>). *<\/li>\n<\/ul>\n<ul>\n<li>***Effets** : Le jugement déclaratif de décès sera un acte de décès à l’égard de tous. Ce sera au juge de fixer la date de la mort du défunt en se fondant sur des présomptions tirées des circonstances, et à défaut, la mort sera fixée au jour de la disparition. *<\/li>\n<li>***Annulation** : Il peut encore arriver que la personne introuvable revienne. Si c’est le cas, l'annulation du jugement déclaratif de décès peut être demandée par le procureur ou tout intéressé. L’annulation du jugement déclaratif de décès produira les mêmes effets que celle du jugement déclaratif d'absence.*<\/li>\n<\/ul>\n", "nested": true, "civilLesson": true, "partStart": true}, {"title": "Titre 2 : L’existence des personnes morales", "text": "**TITRE 2 : L’existence des personnes morales&#xA0;**\n\n*(SÉANCE de TD numéro 3)&#xA0;*\n\n**CHAPITRE 1 : Le concept de personne morale&#xA0;**\n\n- *Les personnes morales sont des entités abstraites. La doctrine explique que la personne morale est un groupement de personnes ou de biens qui est organisé en vue d'accomplir la tâche qui s'était assignée.&#xA0;*\n- ***Le Code civil de 1804** a été très silencieux quant à l'existence des personnes morales,les rédacteurs du Code civil étaient très méfiants car on était dans un contexte très individualiste. Les pouvoirs publics étaient assez hostiles aux groupements professionnels.&#xA0;*\n\n\n\n- ***La loi “le Chapelier\" de 1791** avait interdit tout groupement professionnel. Ce n’est qu’avec une loi du 21 mars 1884 qu’il y a eu une proclamation de la liberté syndicale.*\n\n\n\n- *C’est au tournant du 19e siècle, à l’aube de l'âge industriel, que les personnes morales se sont développées économiquement. Le droit a dû s'adapter et prendre en compte l’existence de ces personnes morales.&#xA0;*\n- *Les personnes morales ont également la personnalité juridique, ce qui mène à des conséquences juridiques :&#xA0;*\n- *Elles ont un patrimoine propre qui se distingue du patrimoine des membres qui composent la personne morale, Les personnes morales ayant la Personnalité Juridique, peuvent agir en justice pour défendre leurs intérêts.&#xA0;*\n\n\n\n- *En droit, il existe une théorie importante rattachée au patrimoine :&#xA0;*\n\n*la “théorie du patrimoine” qui est forgée par deux personnes au 19e siècle appelées **Aubry&#x20;**&#x65;t **Rau**. Il s’agit d’une théorie qui va lier le patrimoine à la personne titulaire de ce patrimoine, on appelle ça aussi “la théorie de l’unité du patrimoine” (une personne = un patrimoine).&#xA0;*\n\n\n\n- *Les créanciers ont un droit de gage générale sur les biens de leurs débiteurs (celui qui détient une dette à l'égard d’une autre personne).&#xA0;*\n- *On a pu constater que les personnes physiques ont souhaité que leurs créanciers professionnels ne saisissent pas leurs biens personnels. Pour cela, une personne physique devrait créer une personne morale car la personne morale est titulaire d’un patrimoine propre et sera séparée du patrimoine de la personne physique (2 personnes = 2 patrimoines).&#xA0;*\n\n\n\n- Il y a une autre théorie qui se nomme l&#x61;**&#x20;théorie d'affectation**, développée par des penseurs allemands et qui permet à une personne de scinder son patrimoine en 2 masses distinctes. La première masse sera affectée à son patrimoine professionnel et l’autre à son patrimoine personnel, c'est-à-dire qu’une personne peut détenir 2 patrimoines. \n- Quelques exceptions en France ont été faites progressivement sur la théorie **d’Aubry et Rau :&#xA0;**\n\n*→ La loi a permis à une seule personne d'être associé d’une société.&#xA0;*\n\n- *La loi du 11 janvier 1985 = première exception qui a créé l’EURL = Entreprise Unipersonnelle à Responsabilité Limitée → il y a une seule personne au sein de l’entreprise.&#xA0;*\n- *Il y a aussi la SASU = Société par Action Simplifiée Unipersonnelle → une personne peut être associée à la société.&#xA0;*\n- *Une loi du 15 juin 2010 a créé l’Entrepreneur Individuel à Responsabilité Limitée (EIRL).&#xA0;*\n\n\n\n- *Ainsi le législateur, au fur et à mesure du temps, a assoupli les exigences de la théorie du patrimoine : tout entrepreneur individuel peut affecter à son activité professionnelle un patrimoine séparé de son patrimoine personnel, et cela sans créer de personne morale. On a des mélanges des 2 théories aujourd'hui en France.&#xA0;*\n\n\n\n**Section 1. L’existence de la personne morale liée à la loi ?&#xA0;**\n\n**§1 : Les théories de la fiction/de la réalité&#xA0;**\n\n- *Selon la **théorie de la fiction**, la personne morale est créée par la loi et est reconnue juridiquement.&#xA0;*\n- *L’auteur de cette théorie est un juriste allemand appelé **Savigny,&#x20;**&#x69;l expliqu&#x65;**&#x20;**&#x71;u’il est possible d’opposer de manière naturelle les personnes physiques et les personnes morales. Il explique aussi que les personnes morales semblent fictives et créées par la loi. Par conséquent, elles s’opposent aux personnes physiques.&#xA0;*\n\n\n\n- *Une formule célèbre qu’un ancien prof de droit a prononcé (**Gaston Jèze**) : “Je n’ai jamais déjeuné avec une personne morale”. Un autre prof de droit (**Jean-Claude Soyer**) lui a répondu : “Moi non plus, mais je l’ai souvent vu payer l’addition” → Cela montre que la personne morale est **abstraite mais qu’elle a un patrimoine propre**.&#xA0;*\n- *Seule la loi confère la personnalité juridique à un groupement de personnes ou de biens et lui accorde des droits.&#xA0;*\n\n\n\n*→ Plusieurs autres penseurs ont critiqué l’utilité de cette théorie :&#xA0;*\n\n\n\n- *Critique du patrimoine d’affectation = **Marcel Planiol** a défendu une autre thèse qui est “la propriété collective” : lorsque plusieurs personnes s’associent, il n’y a pas besoin de créer de personnes morales car ils seraient propriétaires collectivement de biens.&#xA0;*\n\n*→ Cette théorie ne marche que pour les groupements de personnes.&#xA0;*\n\n\n\n- *Il y a une limite de la théorie du patrimoine d'affectation allemande car elle est aussi imparfaite et peut être remise en cause. Elle ne s'adapte qu’aux groupements de personnes.&#xA0;*\n\n\n\n- *Selon la théorie de la réalité, la personne morale n’a pas été expressément attribuée par la loi.&#xA0;*\n- *Il a existé plusieurs théories de la réalité :* \n\n→&#x20;*&#xA0;“la théorie de la réalité technique” théorisée par **Michoud**. Selon cette théorie, il est requis 2 conditions pour qu’un groupement voit s'attribuer la PJ :&#xA0;*\n\n- *1ère condition : il faut qu’il existe un intérêt distinct des intérêts individuels.&#xA0;*\n- *2ème condition : il faut qu'il existe une organisation capable de dégager une volonté collective qui puisse représenter et défendre cet intérêt.&#xA0;*\n\n* *Tout groupement qui a une organisation de base, lui permettant de défendre ses intérêts, peut se voir attribuer la PJ.&#xA0;*\n\n\n\n- *En droit positif, la jurisprudence (la Cour de cassation) privilégie la théorie de la réalité.*\n- *Un arrêt de **la Chambre des requêtes du 23 février 1991** a reconnu la PJ aux sociétés civiles.&#xA0;*\n- *Dans un arrêt de **la deuxième Chambre civile du 28 janvier 1954**, la Cour de Cassation a privilégié la thèse de la réalité.&#xA0;*\n- *Ces organismes avaient été créés par une ordonnance en 1945 qui portait sur les comités d’entreprises. Les comités d’entreprises étaient constitués au sein d’entreprises qui avaient des établissements distincts. Les législateurs ne reconnaissent pas expressément la personnalité juridique au comité d’établissement.&#xA0;*\n\n\n\n- *La Cour de Cassation affirme que **«** **la personnalité civile (juridique) n’est pas une création de la loi, elle appartient en principe à tout groupement pourvu d’une possibilité d’expressions collectives pour la défense d’ intérêt licites dignes par suite d’être juridiquement reconnu et protégé**.**&#x20;Si le législateur a le pouvoir dans un but de haute police, de priver de la personnalité civile telle catégorie déterminée de groupement, il en reconnaît au contraire implicitement mais nécessairement, l’existence en faveur d’organismes créée par la loi elle même avec mission de gérer certains intérêts collectifs présentant ainsi le caractère de droits susceptible d’être déduit en justice** **»**.&#xA0;*\n\n\n\n- *Le 23 janvier 1990, la Chambre sociale de Cassation s’est prononcé sur les comités de groupes. “**Les comités de groupe institués par les articles L. 439-1 et suivants du Code du travail sont dotés d'une possibilité d'expression collective pour la défense des intérêts dont ils ont la charge et possèdent donc la personnalité civile qui leur permet d'ester en justice**”.&#xA0;*\n\n\n\n- *Le 17 avril 1991, dans cet arrêt, la Chambre sociale de Cassation s’est prononcée sur l’entité des comités d’hygiène et de sécurité. Elle a estimé que ces comités avaient la personnalité morale. La Cour de Cassation va poser deux conditions nécessaires pour que le groupement puisse exister :&#xA0;*\n\n* *&#xA0;les comités de groupe sont dotés d’une possibilité d’expression collective,*\n* *&#xA0;la défense des intérêts dont ils ont la charge.*\n\n- *On retrouve la même règle de droit posée en 1954 → que dit la décision ? La solution est reprise par la Chambre sociale et on retrouve les 2 conditions de la théorie de la réalité. Ils ont donc la personnalité juridique.&#xA0;*\n\n* *On constate un déclin de la théorie de la réalité, mais il y a des limites qui sont soulevés :&#xA0;*\n\n- *La famille répond aux 2 conditions de la théorie de la réalité, mais n’est pourtant pas une personne morale.&#xA0;*\n- *Des personnes morales n’ont pas d'intérêts collectifs (**EURL, SASU**) et n'ont qu'un seul associé, donc il n'y a pas d'intérêts collectifs alors qu’elles ont la personnalité juridique bien qu’il manque une condition.&#xA0;*\n- *Une personne peut avoir 2 patrimoines sans créer une personne morale.* \n\n\n\n- *Il y a un déclin car le législateur intervient, de plus en plus ces dernières années, pour octroyer la personnalité juridique à certains groupements. Il a pu refuser d’octroyer la PJ a d’autres groupements, c’est lui qui décide s’il attribue ou refuse la PJ a un groupement. Cette théorie fonctionnait lorsque le législateur ne disait rien, or s’il intervient, elle devient inutile ce qui mène au retour à la théorie de la fiction.&#xA0;*\n\n\n\n**§2 : La diversité des personnes morales&#xA0;**\n\n***Première distinction :&#xA0;***\n\n- *les personnes morales de droit public&#xA0;*\n- *les personnes morales de droit privé.&#xA0;*\n\n\n\n***Exemple de personnes morales de droit public** = État, collectivités territoriales (les régions, les départements, les communes), les établissements publics qui ont une mission d'intérêt public.&#xA0;*\n\n***Exemple de personnes morales de droit privés** = groupement de biens et de personnes de droits privés.&#xA0;*\n\n***Autre distinction :&#xA0;***\n\n- *groupement de biens&#xA0;*\n- *groupement de personnes&#xA0;*\n\n\n\n- Pour les groupements de biens on retrouve : \n\n* ***les fondations*** → plusieurs personnes affectent de manière irrévocable des biens pour réaliser une œuvre d'intérêt général. C’est à but non lucratif (*ex : mécénat*). \n\n\n\n- Les groupements de personnes sont ceux qui poursuivent un but lucratif et d’autres un but non lucratif : \n\n*ex → Les sociétés sont un groupement de personnes à but lucratif = “affectio societatis” ; ce sont des personnes morales constituées entre plusieurs personnes ayant l’intention d'être associées. Elles vont mettre en commun leur travail ou leurs biens, ce sont des organisations qui ont pour but de réaliser des bénéfices entre associés (**dividendes**) . Elles peuvent distribuer ces bénéfices entre les associés ou les réinvestir pour se développer.&#xA0;*\n\n\n\n- ***Article 1832 du Code civil*** : “*La société est instituée par deux ou plusieurs personnes qui conviennent par un contrat d'affecter à une entreprise commune des biens ou leur industrie en vue de partager le bénéfice ou de profiter de l'économie qui pourra en résulter. Elle peut être instituée, dans les cas prévus par la loi, par l'acte de volonté d'une seule personne. Les associés s'engagent à contribuer aux pertes.”*\n\n*ex → Les associations sont un groupement de personnes à but non lucratif. C’est une personne morale qui est régi par une loi du 1er juillet 1901 qui va donner une définition des associations avec **l’article 1er du Code civil** : “L'association est la convention par laquelle deux ou plusieurs personnes mettent en commun, d'une façon permanente, leurs connaissances ou leur activité dans un but autre que de partager des bénéfices. Elle est régie, quant à sa validité, par les principes généraux du droit applicables aux contrats et obligations”.&#xA0;*\n\n\n\n*→ Parmi les associations, il y a les **syndicats professionnels**, c’est une catégorie spéciale dans les associations = personnes qui exercent la même profession et qui se regroupent pour défendre les intérêts de la profession.&#xA0;*\n\n\n\n- *Il existe une dernière catégorie appelée les Groupements d’Intérêt Économique (GIE). La doctrine estime que c’est une catégorie qui se situe entre les groupements à but lucratif et à but non lucratif.&#xA0;*\n- *Ils ont été créés le 23 septembre 1967 par une ordonnance et ce sont des groupements qui permettent une collaboration entre les entreprises pour valoriser l’activité économique de chacun de ses membres.*\n\n\n\n**Section 2. Le début et la fin de l’existence de la personne morale&#xA0;**\n\n**§1 : La création de la personne morale&#xA0;**\n\n- *La personne morale est créée par une constitution (dans le sens de constituer). Pour la création d’une personne morale de droit privé, elle est en principe conditionnée à la volonté d'une ou plusieurs personnes.&#xA0;*\n- *La volonté se manifeste par un contrat entre 2 ou plusieurs personnes, même s’il y a des cas où la volonté peut être individuelle (SASU).&#xA0;*\n\n\n\n- *La volonté est nécessaire mais pas suffisante car, en plus, il faut que l'État intervienne pour que cette personne morale puisse avoir la personnalité morale.&#xA0;*\n- *Il va exiger que soit accomplies des formalités de publicités pour informer les tiers.&#xA0;*\n\n***Exemple&#x20;**→ pour les sociétés, il faut qu’elles soient immatriculées sur un registre spécial appelé “le Registre des Commerces et des Sociétés”. Le Code civil l’explique par **l’article 1842&#x20;**: “les sociétés jouissent de la personnalité morale à compter de leur immatriculation.”*\n\n***Exemple&#x20;**→ pour les syndicats, la Personnalité Juridique commence au dépôt des statuts des syndicats auprès de la mairie.&#xA0;*\n\n***Exemple&#x20;**→ pour les associations, la loi du 1er juillet 1901 dans son article 5 explique les formalités : “Toute association qui voudra obtenir la capacité juridique prévue par l'article 6 devra être rendue publique par les soins de ses fondateurs.”&#xA0;*\n\n*Il faut faire une déclaration à la préfecture en joignant les statuts de la préfecture. Dans un délai de 5 jours, il y a un recipissé (un reçu) qui est distribué et l’association deviendra public avec sa publication au JO.&#xA0;*\n\n- *Ces associations déclarées n’ont qu’une capacité juridique limitée, elle n’est pas pleine et entière car si elles veulent accéder cette capacité juridique il y a une dernière formalité complémentaire : elles doivent être reconnu d’utilité publique par un décret après avis du Conseil d’État.&#xA0;*\n\n\n\n**§2 : La dissolution de la personne morale &#xA0;**\n\n- *Il peut y avoir des **causes volontaires** de la dissolution de la personne morale :&#xA0;*\n\n* *la décision des représentants de dissoudre la personne morale.&#xA0;*\n\n- *il arrive qu’une personne morale soit constituée avec un terme (50 ans).&#xA0;*\n\n\n\n- *Il y aussi des **causes involontaires** :&#xA0;*\n\n* *la loi peut imposer la dissolution de la personne morale,&#xA0;*\n* *et à titre de sanction, le juge peut dissoudre la personne morale, ou lorsque le fonctionnement de la personne morale devient impossible*\n\n\n\n- *Une fois que la dissolution est faite, la PJ ne s'éteint pas tout de suite. Cela veut qu’il y a une petite période dans laquelle cette PJ reste pour avoir le temps de liquider le patrimoine de la personne morale. **C’est une fois que la liquidation est faite que la PJ s'éteint**.* \n\n\n\n\n\n**CHAPITRE 2 : Les effets liés à la personne morale&#xA0;**\n\n**Section 1 : L’autonomie de son patrimoine&#xA0;**\n\n- *La personne morale a acquit la PJ et si elle l'acquiert, elle est apte à être soumis à des obligations et est assujettie de droit.&#xA0;*\n\n\n\n\n\n**§1 : Des patrimoines séparés&#xA0;**\n\n- *Le patrimoine social sont les actifs sociaux du patrimoine de la personne qui ne peuvent servir qu'à payer les créanciers de la personne morale.&#xA0;*\n- *A contrario, un associé ne peut pas payer pour la personne morale puisqu’il a son patrimoine d’un côté, et inversement.&#xA0;*\n\n\n\n- *Il y a des groupements de personnes dans lesquels c’est plus compliqué. Pour les **groupements à but non lucratif**, le principe de séparation stricte des patrimoines entre les personnes morales et les membres est appliqué (les créanciers de la société ne peuvent pas se servir dans le patrimoine des membres) .&#xA0;*\n- *En revanche, pour **les groupements à but lucratif**, il faut distinguer en fonction de la nature de la société. Il y a 2 types :&#xA0;*\n\n* ***Dans les sociétés de personne** : la considération des personnes des associés est essentielle et les associés sont personnellement responsables des dettes de la société. La société ne peut pas payer les **créances (les dettes**). Les créanciers ne peuvent pas s’adresser directement à la société, ils vont s’adresser aux associés de la société et vont pouvoir saisir des biens sur le patrimoine personnel de la société. **Ce type de société repose sur un lien de confiance**.*\n* ***Dans les sociétés de capitaux** : ici, il y a une vraie séparation du patrimoine. La personnalité des actionnaires n’est pas importante, ainsi les actionnaires ou associés ne sont pas tenus personnellement des dettes de la société.&#xA0;*\n\n\n\n- ***Il y a une 3ème catégorie de sociétés qui se retrouvent entre les 2 autres catégories :&#xA0;***\n\n* *Les sociétés familiales appelées **SARL** (**S**ociété **à** **R**esponsabilité **L**imitée). Dans ces sociétés, l'engagement des associés ne se limite qu'à leurs apports pour la société. Elles empruntent à la société de capitaux le fait que la considération des associés est importante.&#xA0;*\n\n\n\n**§2 : Patrimoine social et associés&#xA0;**\n\n- ***Quelle est la nature du droit des associés sur le patrimoine social ?***\n\n*→ Pour les associations : les patrimoines sont séparés et les associés n’ont pas de droit sur les patrimoines du groupement.&#xA0;*\n\n*→ Pour les sociétés, les associés ont un droit sur le patrimoine de la société.&#xA0;*\n\n\n\n- *Ce droit est personnel, c’est-à-dire que **chaque actionnaire a un droit comme par exemple de recevoir régulièrement une partie des bénéfices de la société**. Chaque associé est créancier de la société : si jamais la société est dissoute et qu’il reste de l’argent, la société a le choix de réinvestir les bénéfices ou de les partager entre les actionnaires (**sous forme de dividende**).*\n\n**Section 2. La capacité d’action&#xA0;**\n\n- *La personne morale va agir au travers des personnes physiques au moyen d’organes qui vont la représenter auprès des tiers, ce sont des **organes exécutoires**.*\n\n**§1 : Capacité de contracter&#xA0;**\n\n- *Pour les personnes morales, il exerce un principe appelé le “**principe de spécialité des personnes morales**”. Ce qui veut dire que, pour les personnes morales, sa capacité juridique est limitée par ce principe. Autrement dit, la personne ne peut agir que dans un but déterminé, la raison pour laquelle elle a été créée.&#xA0;*\n- *Elle ne peut accomplir que les actes qui entrent dans son objet social , et cet objet est défini soit par la loi, soit par les statuts de la personne morale.&#xA0;*\n\n\n\n***L’article 1145 du Code civil*** : “*Toute personne physique peut contracter sauf en cas d'incapacité prévue par la loi. La capacité des personnes morales est limitée aux actes utiles à la réalisation de leur objet tel que défini par leurs statuts et aux actes qui leur sont accessoires, dans le respect des règles applicables à chacune d'entre elles.”*\n\n\n\n- *Il y a une intervention de loi qui vient préciser des **incapacités spéciales d’actions pour certaines personnes morales.&#xA0;***\n\n***Exemple&#x20;**→ pour les associations déclarées, la loi leur interdit de recueillir des libéralités, d'acquérir des immeubles non strictement nécessaires à l'accomplissement de son objectif / objet social.&#xA0;*\n\n\n\n**§2 : Capacité d’agir en justice&#xA0;**\n\n- *Les personnes morales ayant la PJ ont la **capacité d'agir en justice pour défendre leurs intérêts personnels.** Cela peut être une action en justice pour défendre un **intérêt patrimonial** de la personne morale mais aussi un **intérêt extrapatrimonial**.&#xA0;*\n\n\n\n- *Une question s’est posée : **Est-ce qu’une personne morale peut défendre un intérêt collectif / une grande cause nationale** ?&#xA0;*\n- *En principe : “Nul ne plaide par procureur” → une personne ne peut pas intenter une action en justice pour faire valoir les intérêts d’autrui en son propre nom.&#xA0;*\n\n* ***exception →&#x20;**&#x6C;a jurisprudence et la loi ont reconnu aux syndicats professionnels une qualité pour faire défendre en justice l’intérêt collectif de la profession qu’ils représentent.&#xA0;*\n\n\n\n- *En revanche, pour les associations déclarées à la préfecture → en principe, les associations simplement habilitées ne peuvent pas défendre les intérêts collectifs de leurs membres sauf s’il y a une habilitation de la loi. La loi peut dire que les intérêts collectifs entrent dans le champ d’activité et donc à ce moment-là, il y a la possibilité d'agir.&#xA0;*\n- *La question de la « class action » (mécanisme introduit récemment en droit français) : l’action de groupe à été introduite dans la loi du 17 mars 2014*\n\n*L’action de groupe est une action en justice exercée par une association, pour le compte d’un ensemble de personnes victimes de dommages de même nature causé par un même auteur en raison d’un manquement de ce dernier à ses obligations légales ou contractuelles.&#xA0;*\n\n\n\n- *Cette action se retrouve aussi dans plusieurs domaines (ex : la santé, la consommation, l'environnement, etc).&#xA0;*\n- *Les associations régulièrement déclarées depuis au moins 5 ans, dont leur objet social comporte la défense de l'intérêt qui a été violé, peuvent agir en justice au nom de plusieurs victimes. Elles vont agir en leur nom, et s'il y a des dommages et intérêts, elles vont **reverser les dommages et intérêts à chacune des victimes. &#xA0;***\n", "html": "<h2>TITRE 2 : L’existence des personnes morales<\/h2>\n<p>*(SÉANCE de TD numéro 3) *<\/p>\n<h2>CHAPITRE 1 : Le concept de personne morale<\/h2>\n<ul>\n<li><p>*Les personnes morales sont des entités abstraites. La doctrine explique que la personne morale est un groupement de personnes ou de biens qui est organisé en vue d'accomplir la tâche qui s'était assignée. *<\/p>\n<\/li>\n<li><p>***Le Code civil de 1804** a été très silencieux quant à l'existence des personnes morales,les rédacteurs du Code civil étaient très méfiants car on était dans un contexte très individualiste. Les pouvoirs publics étaient assez hostiles aux groupements professionnels. *<\/p>\n<\/li>\n<li><p>***La loi “le Chapelier&quot; de 1791** avait interdit tout groupement professionnel. Ce n’est qu’avec une loi du 21 mars 1884 qu’il y a eu une proclamation de la liberté syndicale.*<\/p>\n<\/li>\n<li><p>*C’est au tournant du 19e siècle, à l’aube de l'âge industriel, que les personnes morales se sont développées économiquement. Le droit a dû s'adapter et prendre en compte l’existence de ces personnes morales. *<\/p>\n<\/li>\n<li><p>*Les personnes morales ont également la personnalité juridique, ce qui mène à des conséquences juridiques : *<\/p>\n<\/li>\n<li><p>*Elles ont un patrimoine propre qui se distingue du patrimoine des membres qui composent la personne morale, Les personnes morales ayant la Personnalité Juridique, peuvent agir en justice pour défendre leurs intérêts. *<\/p>\n<\/li>\n<li><p>*En droit, il existe une théorie importante rattachée au patrimoine : *<\/p>\n<\/li>\n<\/ul>\n<p>*la “théorie du patrimoine” qui est forgée par deux personnes au 19e siècle appelées <strong>Aubry **et **Rau<\/strong>. Il s’agit d’une théorie qui va lier le patrimoine à la personne titulaire de ce patrimoine, on appelle ça aussi “la théorie de l’unité du patrimoine” (une personne = un patrimoine). *<\/p>\n<ul>\n<li><p>*Les créanciers ont un droit de gage générale sur les biens de leurs débiteurs (celui qui détient une dette à l'égard d’une autre personne). *<\/p>\n<\/li>\n<li><p>*On a pu constater que les personnes physiques ont souhaité que leurs créanciers professionnels ne saisissent pas leurs biens personnels. Pour cela, une personne physique devrait créer une personne morale car la personne morale est titulaire d’un patrimoine propre et sera séparée du patrimoine de la personne physique (2 personnes = 2 patrimoines). *<\/p>\n<\/li>\n<li><p>Il y a une autre théorie qui se nomme la** théorie d'affectation**, développée par des penseurs allemands et qui permet à une personne de scinder son patrimoine en 2 masses distinctes. La première masse sera affectée à son patrimoine professionnel et l’autre à son patrimoine personnel, c'est-à-dire qu’une personne peut détenir 2 patrimoines.<\/p>\n<\/li>\n<li><p>Quelques exceptions en France ont été faites progressivement sur la théorie **d’Aubry et Rau : **<\/p>\n<\/li>\n<\/ul>\n<p>*→ La loi a permis à une seule personne d'être associé d’une société. *<\/p>\n<ul>\n<li><p>*La loi du 11 janvier 1985 = première exception qui a créé l’EURL = Entreprise Unipersonnelle à Responsabilité Limitée → il y a une seule personne au sein de l’entreprise. *<\/p>\n<\/li>\n<li><p>*Il y a aussi la SASU = Société par Action Simplifiée Unipersonnelle → une personne peut être associée à la société. *<\/p>\n<\/li>\n<li><p>*Une loi du 15 juin 2010 a créé l’Entrepreneur Individuel à Responsabilité Limitée (EIRL). *<\/p>\n<\/li>\n<li><p>*Ainsi le législateur, au fur et à mesure du temps, a assoupli les exigences de la théorie du patrimoine : tout entrepreneur individuel peut affecter à son activité professionnelle un patrimoine séparé de son patrimoine personnel, et cela sans créer de personne morale. On a des mélanges des 2 théories aujourd'hui en France. *<\/p>\n<\/li>\n<\/ul>\n<h3>Section 1. L’existence de la personne morale liée à la loi ?<\/h3>\n<h3>§1 : Les théories de la fiction/de la réalité<\/h3>\n<ul>\n<li><p>*Selon la <strong>théorie de la fiction<\/strong>, la personne morale est créée par la loi et est reconnue juridiquement. *<\/p>\n<\/li>\n<li><p>*L’auteur de cette théorie est un juriste allemand appelé <strong>Savigny, **il explique<\/strong> **qu’il est possible d’opposer de manière naturelle les personnes physiques et les personnes morales. Il explique aussi que les personnes morales semblent fictives et créées par la loi. Par conséquent, elles s’opposent aux personnes physiques. *<\/p>\n<\/li>\n<li><p>*Une formule célèbre qu’un ancien prof de droit a prononcé (<strong>Gaston Jèze<\/strong>) : “Je n’ai jamais déjeuné avec une personne morale”. Un autre prof de droit (<strong>Jean-Claude Soyer<\/strong>) lui a répondu : “Moi non plus, mais je l’ai souvent vu payer l’addition” → Cela montre que la personne morale est <strong>abstraite mais qu’elle a un patrimoine propre<\/strong>. *<\/p>\n<\/li>\n<li><p>*Seule la loi confère la personnalité juridique à un groupement de personnes ou de biens et lui accorde des droits. *<\/p>\n<\/li>\n<\/ul>\n<p>*→ Plusieurs autres penseurs ont critiqué l’utilité de cette théorie : *<\/p>\n<ul>\n<li>*Critique du patrimoine d’affectation = <strong>Marcel Planiol<\/strong> a défendu une autre thèse qui est “la propriété collective” : lorsque plusieurs personnes s’associent, il n’y a pas besoin de créer de personnes morales car ils seraient propriétaires collectivement de biens. *<\/li>\n<\/ul>\n<p>*→ Cette théorie ne marche que pour les groupements de personnes. *<\/p>\n<ul>\n<li><p>*Il y a une limite de la théorie du patrimoine d'affectation allemande car elle est aussi imparfaite et peut être remise en cause. Elle ne s'adapte qu’aux groupements de personnes. *<\/p>\n<\/li>\n<li><p>*Selon la théorie de la réalité, la personne morale n’a pas été expressément attribuée par la loi. *<\/p>\n<\/li>\n<li><p><em>Il a existé plusieurs théories de la réalité :<\/em><\/p>\n<\/li>\n<\/ul>\n<p>→ * “la théorie de la réalité technique” théorisée par <strong>Michoud<\/strong>. Selon cette théorie, il est requis 2 conditions pour qu’un groupement voit s'attribuer la PJ : *<\/p>\n<ul>\n<li>*1ère condition : il faut qu’il existe un intérêt distinct des intérêts individuels. *<\/li>\n<li>*2ème condition : il faut qu'il existe une organisation capable de dégager une volonté collective qui puisse représenter et défendre cet intérêt. *<\/li>\n<\/ul>\n<ul>\n<li>*Tout groupement qui a une organisation de base, lui permettant de défendre ses intérêts, peut se voir attribuer la PJ. *<\/li>\n<\/ul>\n<ul>\n<li><p><em>En droit positif, la jurisprudence (la Cour de cassation) privilégie la théorie de la réalité.<\/em><\/p>\n<\/li>\n<li><p>*Un arrêt de <strong>la Chambre des requêtes du 23 février 1991<\/strong> a reconnu la PJ aux sociétés civiles. *<\/p>\n<\/li>\n<li>
